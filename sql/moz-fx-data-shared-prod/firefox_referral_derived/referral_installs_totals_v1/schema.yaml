fields:
- name: invite_code
  type: STRING
  mode: NULLABLE
  description: >-
    Referral (invite) code, with the `fxrefer` prefix stripped: always exactly 17
    chars of Crockford base32 (digits and upper-case letters), enforced upstream
    in referral_installs_daily_v1. Delivered as the first CSV column consumed by
    firefox.com.
- name: total_installs
  type: INTEGER
  mode: NULLABLE
  description: >-
    Cumulative all-time distinct Firefox first_run installs attributed to this
    invite code. Always > 0 (zero-install codes are omitted).
