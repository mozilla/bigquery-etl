fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: submission_date
- mode: NULLABLE
  name: country
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: country
- mode: NULLABLE
  name: form_factor
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: form_factor
- mode: NULLABLE
  name: advertiser
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: advertiser
- mode: NULLABLE
  name: partial
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: partial
    append: Lowercased and trimmed. Sourced from Merino logs; rows without a Merino match are excluded.
- mode: NULLABLE
  name: impression_count
  type: INTEGER
  description: >-
    Number of (session_id, advertiser) pairs that produced an impression
    for this (country, form_factor, advertiser, partial) combination on this
    date—each session contributes at most one impression per advertiser,
    attributed to the deepest typed partial.
- mode: NULLABLE
  name: click_count
  type: INTEGER
  description: >-
    Number of clicks for this (country, form_factor, advertiser, partial)
    combination on this date. Counted from the deepest typed partial per
    (session_id, advertiser); clicks on earlier partials in the same session
    are not counted.
