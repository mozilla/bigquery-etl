    type: FLOAT64
    mode: NULLABLE
    description: Fraction of total search_with_ads volume attributed to clients in the top 20% of SAP counts
      over the trailing 28-day window. Computed as the sum of search_with_ads for those high-SAP clients divided
      by the overall search_with_ads aggregate.
