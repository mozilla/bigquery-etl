friendly_name: New Profile Churn Aggregates
description: |-
  New-profile churn and early churn-risk counts for Firefox Desktop, one row per cohort
  (cohort_date, the profiles' first_seen_date) and combination of audience columns, excluding
  bot-flagged profiles.
  Reads glean_telemetry_derived.new_profile_churn_aggregates_v1, which is rebuilt in full daily.
  Each churn and churn-risk count is NULL until its cohort has the days of data the count needs.

  Jira: https://mozilla-hub.atlassian.net/browse/DENG-11664
owners:
- data-product-kpis-wg@mozilla.com
labels:
  owner1: data-product-kpis-wg
