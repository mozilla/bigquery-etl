      timestamp: 2000-02-01 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s4
        status: 3
        last_transaction:
          expires_date: 2000-03-01 00:00:00Z
        renewal_info:
          auto_renew_status: 1

    # Subscription 5: synthetic record for past billing retry period expiration
    - id: s5-2000-05-31T00:00:00.000000-UPDATE
      timestamp: 2000-05-31 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s5
        status: 3
        last_transaction:
          expires_date: 2000-04-01 00:00:00Z
        renewal_info:
          auto_renew_status: 1

