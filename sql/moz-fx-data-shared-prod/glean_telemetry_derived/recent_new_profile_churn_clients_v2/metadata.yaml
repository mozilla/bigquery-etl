friendly_name: Recent New Profile Churn Clients - Desktop Glean
description: |-
  Recent client-level churn metrics for new Firefox Desktop profiles, covering cohorts
  not yet present in new_profile_churn_clients_v2 (i.e. cohorts within the last 30 days
  whose data is still filling in). Structure is identical to new_profile_churn_clients_v2;
  day columns and churn flags are NULL until the cohort has the days of data they need. The entire
  table is overwritten on each daily run. Intended to be unioned with
  new_profile_churn_clients_v2 for a complete view of all cohorts.

  Jira: https://mozilla-hub.atlassian.net/browse/DENG-10676
owners:
- data-product-kpis-wg@mozilla.com
labels:
  owner1: data-product-kpis-wg
  dag: bqetl_new_profile_churn
scheduling:
  dag_name: bqetl_new_profile_churn
  date_partition_parameter: null
  parameters:
  - submission_date:DATE:{{ds}}
bigquery:
  time_partitioning:
    type: day
    field: cohort_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - sample_id
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.firefox_desktop.baseline_clients_last_seen
  - moz-fx-data-shared-prod.firefox_desktop_derived.baseline_clients_daily_v1
  - moz-fx-data-shared-prod.firefox_desktop_derived.baseline_clients_first_seen_v1
  - moz-fx-data-shared-prod.firefox_desktop_derived.desktop_dau_distribution_id_history_v1
  - moz-fx-data-shared-prod.glean_telemetry_derived.new_profile_churn_clients_v2
require_column_descriptions: true
