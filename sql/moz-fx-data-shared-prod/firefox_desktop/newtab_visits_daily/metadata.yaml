friendly_name: Newtab Visits Daily
description: |-
  Daily aggregation of visit metrics for Newtab.
  The granularity is one row per Firefox Desktop newtab_visit_id per submission_date.

  Updated in [PR 9717](https://github.com/mozilla/bigquery-etl/pull/9717/changes) to
  use determine_tiles_per_row_v2 to determine number of rows in the layout.
