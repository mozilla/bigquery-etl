friendly_name: {{friendly_name}}
description: |-
  Views on data from {{ dataset }}
dataset_base_acl: {{ dataset_base_acl }}
user_facing: true
labels: {}
{%- if workgroup_access %}
workgroup_access:
{%- for access in workgroup_access %}
- role: {{ access.role }}
  members:
  {%- for member in access.members %}
  - {{ member }}
  {%- endfor %}
{%- endfor %}
{%- else %}
workgroup_access: []
{%- endif %}
