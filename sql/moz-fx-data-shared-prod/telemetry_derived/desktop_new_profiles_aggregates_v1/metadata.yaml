friendly_name: Desktop New Profiles Aggregates
description: |-
  This table aggregates the number of new profiles on a given day as well as recording if new profiles are DAU
  for desktop client_ids

  From first_seen_date 2026-08-27 onward, profiles created by the automated segment tracked in
  DENG-11590 are excluded (see udf.is_desktop_argument_profile_automation). At its peak this
  segment was ~83% of all desktop new profiles, so counts here are not comparable to unfiltered
  sources such as telemetry.clients_first_seen, where the same profiles are flagged via
  is_desktop_argument_profile_automation rather than removed.

owners:
- mhirose@mozilla.com
labels:
  application: firefox
  incremental: true
  shredder_mitigation: true
  schedule: daily
  depends_on_past: false
  owner1: mhirose
  table_type: aggregate
scheduling:
  dag_name: bqetl_analytics_tables
  task_name: desktop_new_profiles_aggregates
  date_partition_parameter: first_seen_date
  parameters:
  - submission_date:DATE:{{ds}}
bigquery:
  time_partitioning:
    type: day
    field: first_seen_date
    require_partition_filter: false
    expiration_days: null
