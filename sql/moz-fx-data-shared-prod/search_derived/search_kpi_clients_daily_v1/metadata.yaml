friendly_name: Search KPI Clients Daily
description: |-
  The search KPI per client per day: SAP searches plus eligible Suggest clicks, one column
  per component, with search_queries as their sum. One row per platform, client_id and
  submission_date. platform is desktop, android (Firefox for Android) or ios (Firefox for
  iOS).

  On desktop, sap comes from search.search_clients_daily_glean and leaves out rows with a
  sap_exclusion_reason (10,000 or more searches); sap_excluded holds those. The Suggest
  components come from search_derived.urlbar_clients_daily_v1, split into suggest_sponsored,
  suggest_nonsponsored and ai_chat by search_derived.kpi_component_map_v1 as of that day.
  Dimensions are copied from search_derived.desktop_client_day_dims_v1 so experiments and
  daily totals don't need to join it again.

  On mobile, sap and the dimensions come from search_derived.mobile_search_clients_daily_v2,
  Glean rows only (Firefox iOS before 28 is legacy core-ping data and is left out, as in
  mobile_search_aggregates_v1). Suggest clicks come from fenix.events_stream and
  firefox_ios.events_stream, split by the map's android and ios rows. ai_chat and
  sap_excluded are 0, and the KPI has no version floor there. profile_group_id,
  is_default_browser and is_bot are NULL. Clients who have ever sent a Fenix or Firefox iOS
  deletion request are left out: Shredder doesn't remove them from
  mobile_search_clients_daily_v2 (DENG-4255), so a backfill would otherwise bring them
  back. normalized_default_search_engine matches desktop_client_day_dims_v1 (case-insensitive),
  not mobile_search_aggregates_v1.

  Desktop rows: every client in urlbar_clients_daily_v1 that day, even with nothing counted
  (in_urlbar), plus clients seen only in search_clients_daily_glean who started at least
  one search, counted or excluded. Mobile rows: clients with sap > 0 or a counted Suggest
  click. A client missing from the table counted 0 that day. Bots and the version floor are
  flagged (is_bot, meets_population_rules), not filtered out.

  The run fails if a clicked desktop result type has no row in kpi_component_map_v1, so a
  new Suggest type can't silently fall out of the KPI. Two exceptions are excluded without a
  row, and a #warn check lists them so they still get one: types starting with action_,
  autofill_, intervention_, tip_ or restrict_keyword_ (families that are never search or
  Suggest), and clicks from clients on nightly, aurora or beta (new types appear there first).
  A map row overrides both. Mobile has no exceptions. It also fails if that day's
  urlbar_clients_daily_v1 partition is empty, if an app has no searches or no awesomebar
  events in that day's mobile sources, or if the map has overlapping rows.

  urlbar_clients_daily_v1, mobile_search_clients_daily_v2 and events_stream have no
  date_partition_offset, so their tasks for the same logical date (in bqetl_search,
  bqetl_mobile_search and bqetl_glean_usage) write the next day. If one of them
  is rerun for day D, rerun this table for day D too.
owners:
- data-search-wg@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: client_level
  dag: bqetl_search
  owner1: data-search-wg
scheduling:
  dag_name: bqetl_search
  date_partition_offset: -1
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: 775.0
  clustering:
    fields:
    - platform
    - sample_id
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  checks.sql:
  - ..
  - moz-fx-data-shared-prod.fenix.deletion_request
  - moz-fx-data-shared-prod.fenix.events_stream
  - moz-fx-data-shared-prod.firefox_ios.deletion_request
  - moz-fx-data-shared-prod.firefox_ios.events_stream
  - moz-fx-data-shared-prod.search.mobile_search_aggregates
  - moz-fx-data-shared-prod.search.search_clients_daily_glean
  - moz-fx-data-shared-prod.search_derived.kpi_component_map_v1
  - moz-fx-data-shared-prod.search_derived.mobile_search_clients_daily_v2
  - moz-fx-data-shared-prod.search_derived.urlbar_clients_daily_v1
  query.sql:
  - moz-fx-data-shared-prod.fenix.deletion_request
  - moz-fx-data-shared-prod.fenix.events_stream
  - moz-fx-data-shared-prod.firefox_ios.deletion_request
  - moz-fx-data-shared-prod.firefox_ios.events_stream
  - moz-fx-data-shared-prod.search.search_clients_daily_glean
  - moz-fx-data-shared-prod.search_derived.desktop_client_day_dims_v1
  - moz-fx-data-shared-prod.search_derived.kpi_component_map_v1
  - moz-fx-data-shared-prod.search_derived.mobile_search_clients_daily_v2
  - moz-fx-data-shared-prod.search_derived.urlbar_clients_daily_v1
require_column_descriptions: true
