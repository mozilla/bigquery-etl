        '
    - name: tls_auth_ecdsa_curve
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: ECDSA signature curve for TLS_*_ECDSA_* in full TLS handshake
    - name: tls_kea_ecdhe_curve
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: ECDHE KEA (TLS_ECDHE_*) curve in full TLS handshake
    - name: tls_npn_type
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: NPN (next protocol negotiation) results
    - name: tls_reasons_for_not_false_starting
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Collection of reasons we did not false start when libssl would
        have let us.

        '
    - name: pkcs11_builtin_roots_module_source
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Which source the built-in roots (CKBI) module was loaded from.

        `xul` is the usual case, and means the roots linked in to libxul were used.
        `gre_directory` means a `libnssckbi.so` sitting next to the Firefox binary
        was loaded instead, which some distributions arrange in order to substitute
        the system trust store. `os_library_path` and `nss3_directory` are only reachable
        in builds configured with `--with-system-nss`, and likewise indicate that
        the trust anchors came from the system trust store rather than from Firefox.
        `none` means no built-in roots module could be loaded at all.

        '
    - name: jxl_animated
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Whether a successfully decoded JPEG XL image is animated.

        '
    - name: jxl_decode_result
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Decode result of a JPEG XL image. Failures are recorded on whichever
        decode pass first fails (so failures during the metadata or frame-count pass
        are still captured); successes are recorded only on the pixel-producing decode.
        success means a complete frame was produced (for an animation, at least one
        complete frame, even if a later frame was truncated; a hard decode error on
        any frame is recorded as a failure instead); partial_frame means the decode
        ended with only a partial (progressive) frame rendered; no_frame means it
        ended without producing any frame; no_basic_info means there was not enough
        data to even parse the basic info (image dimensions).

        '
    - name: jxl_hdr
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Whether a successfully decoded JPEG XL image used the HDR (f16)
        output path.

        '
    - name: security_ui_neterror_search_cta_action
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'The action taken by the online dnsNotFound Search CTA decision,
        recorded once per eligible page load (gated by browser.netError.searchCTA.enabled).
        "keywords" and "host" mean a CTA was shown searching path keywords or the
        registrable domain respectively; "none" means no CTA was shown. Records only
        the action label, never the URL, keywords, or host.

        '
    - name: security_ui_neterror_search_cta_click_aborted
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Count of times the user clicked the online dnsNotFound Search
        CTA button but no search was run. connectivity_lost means the page was online
        when the CTA was shown, connectivity dropped before the click, and the click
        was aborted with an offline message shown in the button''s place. These clicks
        are also counted by search_cta_clicked, so searches actually launched = search_cta_clicked
        minus search_cta_click_aborted. Kept separate from search_cta_reason because
        that metric describes the page-load decision, one per eligible page load.
        Content-free.

        '
    - name: security_ui_neterror_search_cta_reason
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Why the online dnsNotFound Search CTA reached its action, recorded
        once per eligible page load, paired with search_cta_action. keywords_found
        is a keyword query; no_path and no_meaningful_keywords fall back to the host;
        host_unusable and search_unavailable show no CTA. engine_not_general means
        a default search engine exists but is special-purpose (e.g. Wikipedia), so
        the CTA is not shown. connectivity_unconfirmed means we could not confirm
        we were online at page load: the captive-portal reading was stale and the
        authoritative re-check came back offline/captive or timed out, so no CTA was
        shown. Connectivity dropping *after* the CTA was shown is a different thing
        and is counted by search_cta_click_aborted, not here. decision_timed_out means
        the decision did not finish inside browser.netError.searchCTA.decisionTimeoutMs,
        the deadline the page waits out before rendering without a CTA, so it was
        abandoned and no CTA was shown. It absorbs most of what used to be counted
        under connectivity_unconfirmed. The stale-re'
    - name: cache_schema_init_error
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts errors encountered when initializing or migrating a Cache
        API caches.sqlite schema during quota initialization. Labeled by error category:
        "future_version" when the on-disk schema version exceeds the code''s latest
        version (e.g. profile downgrade), "other" for all remaining schema errors.

        '
    - name: firefox_ai_runtime_onnx_native_availability
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Whether the native ONNX runtime could be loaded in the inference
        process, as reported by InferenceSession.isAvailable(). It is recorded at
        most once per profile, guarded by the browser.ml.onnxNativeAvailabilityReported
        pref.

        '
    - name: network_ssl_token_cache_db_errors
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Failures touching the persisted TLS token database: ''open'' (unopenable,
        so removed), ''schema'' (no usable table), ''read'' (unreadable row), ''write''
        (snapshot not written). Routine removal when persistence is disabled is not
        counted.

        '
    - name: quotamanager_storage_sqlite_corruption_unrecovered
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Increments when a corruption error (NS_ERROR_FILE_CORRUPTED or
        NS_ERROR_STORAGE_IOERR) propagates from a storage.sqlite operation during
        QuotaManager initialization with no recovery path, leaving all storage APIs
        (localStorage, IndexedDB, Cache API) broken for the session. This covers corruption
        that passes the initial open check but breaks subsequent operations such as
        schema upgrades, cache setup, or quota loading. Labeled by the initialization
        context that failed. See bug 2065480. Note in some cases we recover from corruption:
        this metric is here to record missing cases where we didn''t recover.

        '
    - name: browser_thumbnails_capture_attempted
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Increments on every BrowserThumbnails.requestScreenshot() call,

        labeled by the trigger that fired it. Total gives the per-session

        capture rate; the label breakdown shows where the pressure originates

        so regressions can be attributed to a specific trigger source.

        '
    - name: browser_thumbnails_capture_result
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Outcome of each capture attempt that reached the request path.

        `succeeded` = engine returned a bitmap and the ContentAction.UpdateThumbnailAction

        was dispatched. `null_bitmap` = engine returned no bitmap (typically the

        compositor detach race). `low_memory` = the isLowOnMemory() gate skipped

        the request before it reached the engine.

        '
    - name: network_ssl_token_resumption_outcome
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'The session resumption outcome of a connection that had at least
        one cached token to try. Recorded once per connection. ''rejected'' means
        the TLS stack refused every token. ''not_resumed'' means a token was accepted
        by the stack and sent, but the server declined it. ''resumed'' means the server
        accepted it.

        '
    - name: geolocation_network_provider
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Which network geolocation service each request from the NetworkGeolocationProvider
        was sent to, determined from the host of the configured geo.provider.network.url.  "other"
        means the URL had a host that is not one of the services listed here, and
        "unknown" means it had no host that could be parsed.

        '
    - name: media_speech_recognition_availability
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'The number of times SpeechRecognition.available() resolved, keyed
        by the AvailabilityStatus it resolved with. Shows how often pages find the
        model missing rather than ready.

        '
    - name: media_speech_recognition_error
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'The number of `error` events fired at a SpeechRecognition object,
        keyed by error code. Only a subset of the codes defined by the spec is currently
        reachable, so a count on any of the others is itself noteworthy.

        This does not reconcile with the `error` outcomes of `session_ended`, by construction:
        an error can be fired before the session reaches [[started]], and such a session
        records neither `session_started` nor `session_ended`. This metric therefore
        normally exceeds those outcomes, and `init_failure` accounts for the difference.

        The codes the spec makes us fire are also coarser than the causes behind them
        - four distinct causes all surface as `service-not-allowed` - so `init_failure`
        is what tells those apart.

        '
    - name: media_speech_recognition_init_failure
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Why a recognition session failed to start, recorded wherever the
        cause is still known: the content process for the first three labels, the
        inference process for the rest. The spec-mandated DOM error code is coarser
        than this, so this is what tells apart the causes that share one: `concurrent_session`,
        `language_not_supported`, `model_install_unavailable` and `backend_creation_failed`
        all reach content as `service-not-allowed`, and every inference-process failure
        below reaches it as `network`.

        `language_not_supported` is recorded before the session reaches [[started]],
        so it has no `session_started` and no `session_ended`; it is exactly the count
        that makes `error` and `session_ended` disagree.

        The labels name the step that failed rather than a category, so that a spike
        says where init broke and not merely that it did.

        '
    - name: webrtc_get_user_media_source_granted
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts the media source actually granted for a getUserMedia()
        call, keyed by MediaSourceEnum value. Recorded once the request is granted,
        using the concrete device that was allocated, so it reflects the true display
        surface chosen for display-capture requests (screen, a specific window, or
        a browser tab) rather than the pre-selection request hint that get_user_media_type
        records.

        '
