---
friendly_name: Search Revenue Levers Daily Glean
description: |-
  Daily search measures per partner, device, operating system, search access point and country:
  SAP, tagged and follow-on searches, searches with ads, ad clicks and their organic equivalents,
  and the SAP eligible to earn revenue.

  The access-point version of the Glean levers table. It has no DAU columns: a client counts once
  in DAU but can use several access points in a day, so DAU cannot be split by access point and
  would repeat and overcount when summed. The DAU measures are in
  `search_revenue_levers_dau_glean_v1`: join the two tables on submission_date, partner,
  device and country, and on normalized_os for desktop only, since mobile DAU has no operating
  system. Desktop search comes from `search_aggregates_glean` and mobile from
  `mobile_search_aggregates`.

  Things to know when reading it:
  * Desktop `sap` is `sap_kpi`, which leaves out runaway-SAP rows, the cap the legacy table applies.
  * The desktop search columns cover Firefox 138 and later. Clients on earlier versions send little
    of the data, so filter the legacy table to 138 and later when comparing.
  * Desktop `tagged_sap`, `tagged_follow_on`, `search_with_ads`, `ad_click` and the organic columns
    are the Glean counter series that reconcile to the legacy table. `search_with_ads_serp` and
    `ad_click_serp` are the SERP-derived equivalents and are lower. `ad_click_serp` steps up at
    Firefox 157.
  * Desktop `monetizable_sap` is rewritten on the row's `partner_code`, because the legacy
    definition reads raw engine strings that Glean carries as `sap_provider_id` plus `partner_code`.
    It is awaiting sign-off from the revenue reviewers. Bing counts on MOZI and MOZR and
    DuckDuckGo on ffab and ftsa. Their other codes (`no_code`, which matches the legacy `-addon`
    engines, and `lm`) are not monetized, so the Bing and DuckDuckGo shares are below 100%. Any code
    the rule does not list counts as not monetized until its rule is settled, including new Google
    codes and the Canonical codes `ubuntu` and `ubuntu-sn`. Data checks warn when unlisted Google,
    Bing or DuckDuckGo codes carry more than 1% of that partner's desktop SAP, when `no_code` carries
    more than 2% of Google desktop SAP in the eligible countries, and when the monetizable share of
    Google desktop SAP falls below 90%. A failing check requires desktop SAP for all three partners.
    Mobile is always 0.
  * Bing and DuckDuckGo desktop include custom engines installed by extensions, such as
    `Bing (New Tab Search)`, which the legacy table left as `other`. Their overall SAP therefore runs
    above the legacy table's, while the SAP that carries a partner code, and so `monetizable_sap`, is at
    parity. Per-SAP ratios for these two partners change accordingly.
  * Bing desktop leaves out Acer distributions using the `distribution_id` only. The legacy
    `search.acer_cohort` list is keyed on the legacy `client_id` and is not carried.
  * `source` is the access point as reported upstream. It is not one clean list: desktop SAP uses access
    points such as `urlbar` and `searchbar`, other measures use labels such as `unknown`, and mobile has
    its own labels. Mapping it to the access points of the new Google codes is not done here.
  * Because of that, the measures on one `source` row don't all belong to the same search. SAP is on the
    access point the search started from, while tagged searches, searches with ads and ad clicks can sit
    under other labels such as `unknown` and `tabhistory`. Totals across `source` are correct, but ratios
    within one access point, such as ad clicks per SAP, are not meaningful. On mobile, SAP and those
    measures sit under different labels altogether.
owners:
- mozilla/revenue_forecasting_data_reviewers
- lmcfall@mozilla.com
labels:
  incremental: true
  schedule: daily
  change_controlled: true
  dag: bqetl_search_dashboard
scheduling:
  dag_name: bqetl_search_dashboard
  # search_aggregates_glean_v1 fills the previous day's partition on each run, so this table does too.
  partition_offset: -1d
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  range_partitioning: null
  clustering: null
