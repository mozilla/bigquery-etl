sources:
  moz-fx-data-shared-prod.telemetry_stable.main_v5:
    - &us_winnt
      metadata:
        geo:
          country: US
      environment:
        system:
          os:
            name: Windows_NT
      application:
        name: Firefox
      normalized_channel: release
      sample_id: 42
      submission_timestamp: '2019-08-01T00:00:00Z'
    - *us_winnt
    - *us_winnt
    - <<: *us_winnt
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{}}'
    - <<: *us_winnt
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{"0":5,"1":5}}'
    - <<: *us_winnt
      metadata:
        geo:
          country: MX
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{"0":10,"1":20}}'
    - <<: *us_winnt
      metadata:
        geo:
          country: DE
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{"0":4,"1":2}}'
    - <<: *us_winnt
      environment:
        system:
          os:
            name: Darwin
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{"0":20,"1":30}}'
    - &de_linux
      <<: *us_winnt
      metadata:
        geo:
          country: DE
      environment:
        system:
          os:
            name: Linux
    - *de_linux
    - <<: *de_linux
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{"0":20,"1":30}}'
    - <<: *de_linux
      payload:
        histograms:
          http_pageload_is_ssl: '{"values":{"0":80,"1":20}}'

parameters:
  - name: submission_date
    type: DATE
    value: 2019-08-01

expect:
  - country: DE
    non_ssl_loads: 100
    os: Linux
    reporting_ratio: 0.5
    ssl_loads: 50
    submission_date: '2019-08-01'
  - country: DE
    non_ssl_loads: 4
    os: Windows_NT
    reporting_ratio: 1.0
    ssl_loads: 2
    submission_date: '2019-08-01'
  - country: MX
    non_ssl_loads: 10
    os: Windows_NT
    reporting_ratio: 1.0
    ssl_loads: 20
    submission_date: '2019-08-01'
  - country: US
    non_ssl_loads: 20
    os: Darwin
    reporting_ratio: 1.0
    ssl_loads: 30
    submission_date: '2019-08-01'
  - country: US
    non_ssl_loads: 5
    os: Windows_NT
    reporting_ratio: 0.4
    ssl_loads: 5
    submission_date: '2019-08-01'
