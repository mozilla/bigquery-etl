      meets_population_rules: true
      is_bot: false
      definition_version: 1
      component: sap
      value: 10
      client_count_by_kpi_component: 2
    - <<: *base
      component: suggest_sponsored
      value: 3
      client_count_by_kpi_component: 1
    - <<: *base
      platform: android
      os: Android
      is_bot: null
