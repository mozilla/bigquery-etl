friendly_name: Zendesk Retrieval Index
description: "AI-enriched retrieval table derived from Zendesk customer support tickets,\
  \ containing embeddings\nand semantic features to support grounded question answering\
  \ over Mozilla support data.\n\nGrain: one row per Zendesk ticket.\n\nLLM generated\
  \ fields:\n- ticket_summary_llm\n- ticket_category_llm\n- ticket_language_llm\n\
  - ticket_entities_llm\n- ticket_topics_llm\n- embedding based on [title, content]\n\
  - ticket_sentiment_score based on [title, content]\n\nMetadata\n- Additional data\
  \ to support technical processes, such as backfills or investigations.\n- The prompt\
  \ version is a self-managed version for changes in the prompt given to the LLM.\n\
  \nUsage\n- Filter on `creation_date` to limit the scan. The underlying table does\
  \ not require a partition filter; without one, queries scan the full table.\n- Rows\
  \ with failed embeddings are included. Filter `WHERE metadata.embedding_succeeded`\
  \ for vector search,\n  or `WHERE NOT IFNULL(metadata.embedding_succeeded, FALSE)`\
  \ to list the failures.\n\nRead-time fields (computed by this view, not stored in\
  \ the underlying table):\n- product = `mozfun.customer_experience.cx_normalize_product(product,\
  \ 'Zendesk')` \u2014 canonical\n  product name; returns 'unclassified' for raw slugs\
  \ the UDF cannot map (monitored, see below).\n- recency_score = `EXP(-DATE_DIFF(CURRENT_DATE(),\
  \ creation_date, DAY) / 30)` \u2014 30-day exponential decay,\n  1.0 today, ~0.37\
  \ after 30 days. Always reflects freshness at query time.\n\nMonitoring\n- A Bigeye\
  \ metric `has_no_unclassified_value` alerts when the `product` contains\n  'unclassified'\
  \ values over a rolling 7-day `creation_date` window, surfacing raw\n  values that\
  \ need a mapping added to the UDF."
owners:
- lvargas@mozilla.com
- mozilla/customer_experience
labels:
  owner1: lvargas
workgroup_access:
