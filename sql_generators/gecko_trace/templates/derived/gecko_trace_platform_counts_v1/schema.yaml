---
fields:
  - name: submission_date
    type: DATE
    mode: NULLABLE
    description: Date of the data in this row.
  - name: stable_trace_id
    type: STRING
    mode: NULLABLE
    description: Stable UUID for the trace pattern. Foreign key to gecko_trace_traces_v1.
  - name: trace_signature
    type: STRING
    mode: NULLABLE
    description: Trace pattern signature. May change across Firefox releases.
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: Firefox build ID from client_info.app_build.
  - name: normalized_os
    type: STRING
    mode: NULLABLE
    description: OS name (Windows, Linux, Darwin).
  - name: normalized_os_version
    type: STRING
    mode: NULLABLE
    description: OS version string.
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: CPU architecture (x86_64, aarch64).
  - name: hit_count
    type: INT64
    mode: NULLABLE
    description: Number of trace instances for this platform combination on this day.
