friendly_name: {{ funnel_name }}
{% if owners %}
owners: {{ owners }}
{% endif %}
labels:
  sql_generator: funnels
  incremental: true
  table_type: aggregate

scheduling:
  dag_name: bqetl_generated_funnels

bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
