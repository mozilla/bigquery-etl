---
friendly_name: Gecko Trace Traces
description: |-
  Trace patterns from Gecko traces, one row per trace signature.

  The trace signature is a hash of the event signatures in root-to-leaf order.
  It is stable within a Firefox release and changes when any event moves.
  The trace_key is a hash of the stable_event_ids in the same order.
  A new signature with a known trace_key gets the existing stable_trace_id.
  Otherwise it gets a new UUID.

  This table has no counts. Daily counts are in gecko_trace_traces_daily_v1.

owners:
  - jjalkanen@mozilla.com

labels:
  incremental: true
  schedule: daily

scheduling:
  dag_name: bqetl_gecko_trace
  task_group: {{ app_id }}
  date_partition_parameter: null
  parameters: ["submission_date:DATE:{% raw %}{{ds}}{% endraw %}"]

bigquery:
  clustering:
    fields:
      - trace_signature
