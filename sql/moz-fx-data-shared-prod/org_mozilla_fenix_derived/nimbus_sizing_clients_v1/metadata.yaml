friendly_name: Nimbus Population Sizing Client Pool (Fenix)
description: "Pre-materialized 7-day rolling window of deduplicated, 10%-sampled Fenix\n\
  clients for Nimbus pre-launch population sizing.\n\nSourced from the dedicated nimbus-targeting-context\
  \ ping, which covers the whole\npopulation and carries a real sample_id. Each daily\
  \ partition is an independently\ndeduplicated 7-day window, so consumers must read\
  \ a single partition \u2014 summing\npartitions counts the same client repeatedly.\n\
  \nMobile pools keep the Nimbus context verbatim as a JSON column rather than\nflattening\
  \ it into typed columns. Experimenter owns the JEXL-to-SQL mapping and\nemits JSON_VALUE(context,\
  \ ...) lookups, so adding a targeting attribute needs no\nchange here.\n\nConsumed\
  \ by experiment_population_estimates_v1 to run per-experiment\nCOUNTIF queries without\
  \ inline deduplication or date arithmetic."
owners:
- ykhurana@mozilla.com
labels:
  owner1: ykhurana
  dag: bqetl_experiments_daily
scheduling:
  dag_name: bqetl_experiments_daily
  referenced_tables:
  - - moz-fx-data-shared-prod
    - fenix
    - nimbus_targeting_context
bigquery:
  time_partitioning:
    type: day
    field: null
    require_partition_filter: false
    expiration_days: 14.0
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.fenix.nimbus_targeting_context
