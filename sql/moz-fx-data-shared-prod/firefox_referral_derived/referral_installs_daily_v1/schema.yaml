fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: >-
    Partition date; the day the Glean `referrals` ping carrying this invite code
    was received. The ping is sent once on first run, so this is the install day
    for all but late-arriving uploads.
- name: invite_code
  type: STRING
  mode: NULLABLE
  description: >-
    Referral (invite) code, as carried by the `referrals` ping. Always exactly 17
    chars of Crockford base32 (digits and upper-case letters); the ETL enforces
    this, so malformed codes are dropped rather than counted. The client already
    strips the `fxrefer` prefix before submitting, and the ETL strips it again
    defensively. Derived from a referral id generated within Firefox; not
    associated with FxA or any real-world identity.
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: >-
    Release channel of the client that reported the referral (release, beta,
    nightly, esr). Kept so consumers can exclude pre-release test traffic; this
    table intentionally does not filter it.
- name: install_count
  type: INTEGER
  mode: NULLABLE
  description: >-
    Distinct clients that reported this invite code on submission_date in this
    channel. The ping fires once per profile, so this is a distinct install
    count.
