friendly_name: Google Ads App Campaign Asset Status Daily
description: |-
  Daily status history of each asset in Google Ads App campaigns (UAC), from
  the daily status snapshots of the Google Ads BigQuery Data Transfer
  (`moz-fx-data-marketing-prod.google_ads_dts_mmc`: `p_ads_asset_status_*`,
  `p_ads_campaign_status_*` and `p_ads_ad_group_status_*`). The three
  snapshots are joined on the snapshot date.

  Grain: one row per date, campaign, ad group, ad, asset and field type.
  All assets in App campaigns are included, also assets with no delivery.
  `date` is the snapshot date. Each snapshot shows the status at the end of
  that day.

  Only App campaigns (`advertising_channel_type = 'MULTI_CHANNEL'`) are
  included. Standalone YouTube app-install campaigns (DEMAND_GEN) are not
  included.

  `is_live` is true when the asset is enabled, the ad group is ENABLED and
  the campaign is ENABLED.

  History starts on 2026-10-22. Older snapshot partitions are not used,
  because a transfer backfill writes the current state into them (the
  2026-10-21 partition holds the state from 2026-10-22). For dates before
  2026-10-22, use impressions > 0 in
  `google_ads_derived.ad_asset_daily_performance_v1` to find live assets.

  `market` is the country code from the campaign name (UK is mapped to GB,
  UNKNOWN when the name has no country code). `region` and `language` are
  also from the campaign name. Join to `google_ads_derived.ad_assets_v1` on
  `asset_id` for the asset content (name, image URL, YouTube ID, text).
owners:
- phlee@mozilla.com
- data-marketing-wg@mozilla.com
labels:
  incremental: true
  dag: bqetl_fivetran_google_ads
  owner1: phlee
  owner2: data-marketing-wg
scheduling:
  dag_name: bqetl_fivetran_google_ads
  depends_on_past: false
bigquery:
  time_partitioning:
    type: day
    field: date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - market
    - is_live
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references: {}
