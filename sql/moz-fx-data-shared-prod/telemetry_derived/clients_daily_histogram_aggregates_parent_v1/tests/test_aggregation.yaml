    client_id: test
    submission_date: '2019-07-17'
    os: first
    app_version: first
    app_build_id: first
    channel: nightly
    histogram_aggregates:
      - metric: gradient_duration
        metric_type: histogram-exponential
        key: ''
        process: parent
        agg_type: summed_histogram
        bucket_range:
          first_bucket: 1
          last_bucket: 50000000
          num_buckets: 20
        value:
          - key: '1'
            value: 0
          - key: '3'
            value: 26
          - key: '8'
            value: 7
          - key: '21'
            value: 235
          - key: '56'
            value: 9
          - key: '149'
            value: 1
          - key: '397'
            value: 1
          - key: '1056'
            value: 0
