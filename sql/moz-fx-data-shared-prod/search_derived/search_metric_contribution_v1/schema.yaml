  description: ''
- name: search_with_ads_from_sap
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: top_10
    type: FLOAT64
    mode: NULLABLE
    description: Fraction of total search_with_ads volume attributed to clients in the top 10% of SAP (search
      access point) counts over the trailing 28-day window. Computed as the sum of search_with_ads for those
      high-SAP clients divided by the overall search_with_ads aggregate.
