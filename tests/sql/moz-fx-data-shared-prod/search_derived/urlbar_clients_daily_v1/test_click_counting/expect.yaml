# NULL columns are omitted: the harness drops null keys from the result row.
# Elements are sorted by window_mode, sap, interaction, result_type, as in the query.

# clicks sum to sessions_engaged (1). search_engine is shown in both completed sessions
# (e1, e3) but not counted for e2, which is non-terminal.
- submission_date: "2026-10-14"
  client_id: client-a
  sample_id: 1
  sessions_total: 2
  sessions_engaged: 1
  sessions_abandoned: 1
  results:
  - window_mode: classic
    sap: urlbar
    interaction: typed
    result_type: rust_adm_sponsored
    product_result_type: admarketplace_sponsored
    result_group: suggest
    clicks: 1
    sessions_shown: 1
    sessions_shown_abandoned: 0
    annoyances: 0
  - window_mode: classic
    sap: urlbar
    interaction: typed
    result_type: search_engine
    product_result_type: search_engine
    result_group: heuristic
    clicks: 0
    sessions_shown: 2
    sessions_shown_abandoned: 1
    annoyances: 0
  - window_mode: classic
    sap: urlbar
    interaction: typed
    result_type: weather
    product_result_type: weather
    result_group: suggest
    clicks: 0
    sessions_shown: 1
    sessions_shown_abandoned: 1
    annoyances: 1
