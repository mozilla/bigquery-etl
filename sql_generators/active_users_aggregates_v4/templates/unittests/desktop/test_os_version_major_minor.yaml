sources:
  {{ project }}.telemetry.desktop_active_users:
    # os_version_major & os_version_minor remain stable.
    - submission_date: 2020-01-04
      app_name: {{ app_name }}
      client_id: client-7
      sample_id: 7
      os: os-7
      normalized_os_version: 10.3.10
      is_daily_user: False
      is_weekly_user: True
      is_monthly_user: True
    # os_version without major nor minor
    - submission_date: 2020-01-04
      app_name: {{ app_name }}
      client_id: client-8
      sample_id: 8
      os: os-8
      normalized_os_version: 11
      is_daily_user: False
      is_weekly_user: False
      is_monthly_user: True

parameters:
  - name: submission_date
    type: DATE
    value: 2020-01-04

expect:
  - submission_date: 2020-01-04
    app_name: {{ app_name }}
    city: ??
    country: ??
    os: os-7
    os_version_major: 10
    os_version_minor: 3
    os_version_build: 10.3.10
    daily_users: 0
    weekly_users: 1
    monthly_users: 1
    dau: 0
    wau: 0
    mau: 0
  - submission_date: 2020-01-04
    app_name: {{ app_name }}
    city: ??
    country: ??
    os: os-8
    os_version_build: '11'
    os_version_minor: 0
    os_version_major: 11
    daily_users: 0
    weekly_users: 0
    monthly_users: 1
    dau: 0
    wau: 0
    mau: 0
