fields:
- name: event_id
  type: STRING
  mode: NULLABLE
  description: Unique event ID (typically a concatenation of `document_id` and `document_event_number`).
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: A JSON string containing any payload properties not present in the
    schema
- name: client_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: The build identifier generated by the CI system (e.g. "1234/A").
      For language bindings that provide automatic detection for this value, (e.g.
      Android/Kotlin), in the unlikely event that the build identifier can not be
      retrieved from the OS, it is set to "inaccessible". For other language bindings,
      if the value was not provided through configuration, this metric gets set to
      `Unknown`.
  - name: app_channel
    type: STRING
    mode: NULLABLE
    description: The channel the application is being distributed on.
  - name: app_display_version
    type: STRING
    mode: NULLABLE
    description: The user visible version string (e.g. "1.0.3").  In the unlikely
      event that the display version can not be retrieved, it is set to "inaccessible".
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: The architecture of the device, (e.g. "arm", "x86").
  - name: attribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: campaign
      type: STRING
      mode: NULLABLE
      description: The attribution campaign (e.g. 'mozilla-org').
    - name: content
      type: STRING
      mode: NULLABLE
      description: The attribution content (e.g. 'firefoxview').
    - name: medium
      type: STRING
      mode: NULLABLE
      description: The attribution medium (e.g. 'organic' for a search engine).
    - name: source
      type: STRING
      mode: NULLABLE
      description: The attribution source (e.g. 'google-play').
    - name: term
      type: STRING
      mode: NULLABLE
      description: The attribution term (e.g. 'browser with developer tools for android').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: device_manufacturer
    type: STRING
    mode: NULLABLE
    description: The manufacturer of the device the application is running on. Not
      set if the device manufacturer can't be determined (e.g. on Desktop).
  - name: device_model
    type: STRING
    mode: NULLABLE
    description: The model of the device the application is running on. On Android,
      this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL". Not
      set if the device model can't be determined (e.g. on Desktop).
  - name: distribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
      description: The distribution name (e.g. 'MozillaOnline').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: first_run_date
    type: STRING
    mode: NULLABLE
    description: The date of the first run of the application.
  - name: locale
    type: STRING
    mode: NULLABLE
    description: The locale of the application during initialization (e.g. "es-ES").
      If the locale can't be determined on the system, the value is ["und"](https://unicode.org/reports/tr35/#Unknown_or_Invalid_Identifiers),
      to indicate "undetermined".
  - name: os
    type: STRING
    mode: NULLABLE
    description: 'The name of the operating system. Possible values: Android, iOS,
      Linux, Darwin, Windows, FreeBSD, NetBSD, OpenBSD, Solaris, unknown'
  - name: os_version
    type: STRING
    mode: NULLABLE
    description: The user-visible version of the operating system (e.g. "1.2.3").
      If the version detection fails, this metric gets set to `Unknown`.
  - name: telemetry_sdk_build
    type: STRING
    mode: NULLABLE
    description: The version of the Glean SDK
  - name: build_date
    type: STRING
    mode: NULLABLE
    description: The date & time the application was built
  - name: session_id
    type: STRING
    mode: NULLABLE
    description: An optional UUID uniquely identifying the client's current session.
  - name: session_count
    type: INTEGER
    mode: NULLABLE
    description: An optional running counter of the number of sessions for a client.
  - name: windows_build_number
    type: INTEGER
    mode: NULLABLE
    description: The optional Windows build number, reported by Windows (e.g. 22000)
      and not set for other platforms
- name: document_id
  type: STRING
  mode: NULLABLE
  description: The document ID specified in the URI when the client sent this message
- name: metadata
  type: RECORD
  mode: NULLABLE
  fields:
  - name: geo
    type: RECORD
    mode: NULLABLE
    fields:
    - name: city
      type: STRING
      mode: NULLABLE
    - name: country
      type: STRING
      mode: NULLABLE
      description: An ISO 3166-1 alpha-2 country code
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo database version used for this lookup
    - name: subdivision1
      type: STRING
      mode: NULLABLE
      description: First major country subdivision, typically a state, province, or
        county
    - name: subdivision2
      type: STRING
      mode: NULLABLE
      description: Second major country subdivision; not applicable for most countries
    description: Results of a geographic lookup based on the client's IP address
  - name: header
    type: RECORD
    mode: NULLABLE
    fields:
    - name: date
      type: STRING
      mode: NULLABLE
      description: Date HTTP header
    - name: dnt
      type: STRING
      mode: NULLABLE
      description: DNT (Do Not Track) HTTP header
    - name: x_debug_id
      type: STRING
      mode: NULLABLE
      description: X-Debug-Id HTTP header
    - name: x_pingsender_version
      type: STRING
      mode: NULLABLE
      description: X-PingSender-Version HTTP header
    - name: x_source_tags
      type: STRING
      mode: NULLABLE
      description: X-Source-Tags HTTP header
    - name: x_telemetry_agent
      type: STRING
      mode: NULLABLE
      description: X-Telemetry-Agent HTTP header
    - name: x_foxsec_ip_reputation
      type: STRING
      mode: NULLABLE
      description: X-Foxsec-IP-Reputation header (deprecated, https://mozilla-hub.atlassian.net/browse/DENG-10434)
    - name: x_lb_tags
      type: STRING
      mode: NULLABLE
      description: X-LB-Tags HTTP header
    - name: parsed_date
      type: TIMESTAMP
      mode: NULLABLE
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
    - name: parsed_x_lb_tags
      type: RECORD
      mode: NULLABLE
      fields:
      - name: tls_version
        type: STRING
        mode: NULLABLE
      - name: tls_cipher_hex
        type: STRING
        mode: NULLABLE
    description: Headers included in the client's HTTP request
  - name: isp
    type: RECORD
    mode: NULLABLE
    fields:
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo ISP database version used for this lookup
    - name: name
      type: STRING
      mode: NULLABLE
      description: The name of the ISP associated with the client's IP address
    - name: organization
      type: STRING
      mode: NULLABLE
      description: The name of a specific business entity associated with the client's
        IP address when available; otherwise the ISP name
    description: Results of ISP lookup based on the client's IP address
  - name: user_agent
    type: RECORD
    mode: NULLABLE
    fields:
    - name: browser
      type: STRING
      mode: NULLABLE
    - name: os
      type: STRING
      mode: NULLABLE
    - name: version
      type: STRING
      mode: NULLABLE
    description: Parsed components of the client's user agent string
- name: metrics
  type: JSON
  mode: NULLABLE
  description: Metrics recorded along with the event, grouped by type and stored as
    a JSON object.
- name: normalized_app_name
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized app name
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized channel name
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized OS name
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
- name: ping_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: seq
    type: INTEGER
    mode: NULLABLE
  - name: start_time
    type: STRING
    mode: NULLABLE
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: end_time
    type: STRING
    mode: NULLABLE
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: ping_type
    type: STRING
    mode: NULLABLE
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: Hashed version of client_id (if present) useful for partitioning; ranges
    from 0 to 99
- name: submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Time when the ingestion edge server accepted this message
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
- name: app_version_patch
  type: NUMERIC
  mode: NULLABLE
- name: is_bot_generated
  type: BOOLEAN
  mode: NULLABLE
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the client.
- name: reason
  type: STRING
  mode: NULLABLE
- name: experiments
  type: JSON
  mode: NULLABLE
  description: Any active experiments, stored as a JSON object.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: 'The profile_group_id according to Telemetry.

    Might not always have a value due to being too early for it to have

    loaded.

    Does not need to be sent in the Glean "deletion-request" ping.

    '
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: 'The client_id according to Telemetry.

    Might not always have a value due to being too early for it to have

    loaded.

    Value may be the canary client id `c0ffeec0-ffee-c0ff-eec0-ffeec0ffeec0`

    in pings near when the data upload pref is disabled (if Telemetry gets

    to go first), or between when a client_id has been removed and when it

    has been regenerated.

    Does not need to be sent in the Glean "deletion-request" ping.

    '
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: When the event ostensibly occurred based on data reported by the client
    (so be wary that unrealistic values are possible).
- name: event_category
  type: STRING
  mode: NULLABLE
- name: event_name
  type: STRING
  mode: NULLABLE
- name: event
  type: STRING
  mode: NULLABLE
  description: Fully qualified event name prefixed with the event category separated
    by a dot.
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: Event extras, stored as a JSON object.
- name: document_event_number
  type: INTEGER
  mode: NULLABLE
  description: Which event number this was in the original document, in chronological
    order.
- name: extras
  type: RECORD
  mode: NULLABLE
  description: Event extras, grouped by type.
  fields:
  - name: boolean
    type: RECORD
    mode: NULLABLE
    description: Boolean event extras.
    fields:
    - name: after_reset
      type: BOOLEAN
      mode: NULLABLE
      description: Set to true if the storage.local IndexedDB was still corrupted
        right after being completely reset.
    - name: all_tabs_unloaded
      type: BOOLEAN
      mode: NULLABLE
      description: whether all tabs in the window were unloaded
    - name: alt_text_modal
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Indicates if the alt text modal was displayed and the user clicked save,
        or if it was skipped and the image was added directly after selection.

        * present, empty, skipped.'
    - name: always_ask
      type: BOOLEAN
      mode: NULLABLE
      description: The state of the "Always ask me when I click an email link" checkbox
        when the button was clicked.
    - name: auto_show
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the panel was opened automatically or manually by the user.
    - name: auto_translate
      type: BOOLEAN
      mode: NULLABLE
      description: True if this translation was triggered automatically due to configured
        always-translate-language settings. False if this translation was triggered
        manually.
    - name: baseline
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The violation was triggered by the kBaselineChromeCSP.

        * The violation was triggered by the kBaselineSystemCSP.'
    - name: blocked
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The state of the "Block AI Enhancements" toggle.

        * Whether the load was blocked using our temporary pref'
    - name: breached
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login is marked as breached or not. If a login is both
        breached and vulnerable, it will only be reported as breached.
    - name: cache
      type: BOOLEAN
      mode: NULLABLE
      description: true if cache is selected to be cleared
    - name: cached
      type: BOOLEAN
      mode: NULLABLE
      description: Reusing existing panel
    - name: callout
      type: BOOLEAN
      mode: NULLABLE
      description: Boolean. True if PiP is being shown for the first time within 48
        hours of a feature callout message highlighting the urlbar toggle.
    - name: can_stage
      type: BOOLEAN
      mode: NULLABLE
      description: Is this process allowed to using staging updates?
    - name: cancelled
      type: BOOLEAN
      mode: NULLABLE
      description: Whether this load has been cancelled.
    - name: ccEnabled
      type: BOOLEAN
      mode: NULLABLE
      description: Are subtitles enabled for PiP
    - name: checked
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the box was checked.

        * Whether the Passwords box was checked.

        * Whether the checkbox was toggled on or off.

        * The checked state of the fingerprinting protection checkbox'
    - name: confident
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the language detection was confident in the result.
    - name: cookies_and_storage
      type: BOOLEAN
      mode: NULLABLE
      description: true if cookies and storage is selected to be cleared
    - name: cta_shown
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the Search button was actually shown (a default engine
        existed and the query derivation produced a query). False when the CTA page
        rendered but the Search button was suppressed (no engine, connectivity lost,
        or an unusable host), leaving Reload only.
    - name: description
      type: BOOLEAN
      mode: NULLABLE
      description: Description detected
    - name: description_changed
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the default description was changed.
    - name: did_confirm
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the user confirmed the reset action via the confirmation
        dialog.
    - name: did_edit_pw
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated password was modified by the user
        typing into the password field.
    - name: did_edit_un
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated username was modified by the user
        typing into the username field.
    - name: did_select_pw
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated password was selected by the user
        choosing a suggested value from the autocomplete popup.
    - name: did_select_un
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated username was selected by the user
        choosing a suggested value from the autocomplete popup.
    - name: disableDialog
      type: BOOLEAN
      mode: NULLABLE
      description: True when urlbar button opens the disable PiP dialog
    - name: during_shutdown
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the error occured during shutdown.
    - name: enabled
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the monitor is enabled.

        * Whether the monitor is enabled (the spec''s status).

        * New/current state is enabled.

        * Chatbot was already enabled.

        * True if IP Protection was turned on.

        * New/current state is enabled

        * Boolean indicating if that type of memory was enabled or disabled

        * True if the feature is enabled.

        * Whether launch on login was turned on (true) or off (false).

        * whether the preference was enabled or disabled in any way'
    - name: encrypted
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether or not encryption is enabled for the backup.

        * Whether or not encryption is enabled.'
    - name: ended_in_error
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the playback session ended because of a decode error
    - name: enrolled
      type: BOOLEAN
      mode: NULLABLE
      description: True if the enrollment finished successfully.
    - name: enter
      type: BOOLEAN
      mode: NULLABLE
      description: true if entering fullscreen, false if exiting fullscreen
    - name: error
      type: BOOLEAN
      mode: NULLABLE
      description: True if an error happened.
    - name: excluded
      type: BOOLEAN
      mode: NULLABLE
      description: True if the site was excluded (VPN disabled for site). False if
        the exclusion was removed (VPN re-enabled for site).
    - name: expand
      type: BOOLEAN
      mode: NULLABLE
      description: Link preview card is expanded
    - name: experiments_empty
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the experiments collection was empty.
    - name: experiments_success
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not loading the experiments collection succeeded.
    - name: filled
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the browser filled the login details for the user vs. typing saved
        values.

        * Boolean, whether the field was filled'
    - name: first_site_load_in_tab
      type: BOOLEAN
      mode: NULLABLE
      description: Whether this is the first page of a site that the user's visiting
        (triggering the full longform animation), vs. a subsequent navigation showing
        only the shortform count animation.
    - name: first_visit
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether this is the user''s first visit to the site, triggering the full
        longform animation, vs. a return visit showing only the shortform count animation.

        * Whether this is the user''s first visit to the site vs. a return visit.
        This used to be the trigger for the full longform animation, and is preserved
        to be able to compare historically.'
    - name: firstTime
      type: BOOLEAN
      mode: NULLABLE
      description: If the user has used Picture-in-Picture before
    - name: firstTimeToggle
      type: BOOLEAN
      mode: NULLABLE
      description: If the user has used Picture-in-Picture before
    - name: force_sync
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether or not the sync was forced.

        * Whether or not a sync was forced when fetching recipes.'
    - name: form_action_origin_fixable
      type: BOOLEAN
      mode: NULLABLE
      description: Whether our logic would be able to fix the form action origin
    - name: form_data
      type: BOOLEAN
      mode: NULLABLE
      description: true if form data is selected to be cleared
    - name: fxa
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the user is signed in to their Firefox Account

        * Whether the user is signed in to their Firefox Account when the launch is
        requested. False means the launch sends the user through the sign-in flow
        first'
    - name: had_errors
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the migration had errors.
    - name: hadPreviousJwt
      type: BOOLEAN
      mode: NULLABLE
      description: Whether a previous auth JWT was present, i.e. this was a renewal
        rather than a first enrollment.
    - name: has_ai_summary
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the page has an AI summary. Has a value of unknown
        if we weren't able to record the value before the impression was recorded.
    - name: has_been_saved
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the signature was saved.
    - name: has_click_rule
      type: BOOLEAN
      mode: NULLABLE
      description: There is a matching click rule for the reloading domain.
    - name: has_cookie_rule
      type: BOOLEAN
      mode: NULLABLE
      description: There is a matching cookie rule for the reloading domain.
    - name: has_description
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the signature has a description.
    - name: has_devices
      type: BOOLEAN
      mode: NULLABLE
      description: True if user has other devices signed into sync
    - name: has_empty_password
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has an empty password
    - name: has_form_action_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login includes a form action origin
    - name: has_ftp_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login origin string contains indications of an FTP
        scheme
    - name: has_http_realm
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login includes a http realm
    - name: has_non_http_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has an origin or form_action_origin
        which does not start with http:// or https://
    - name: has_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login includes an origin
    - name: has_punycode_form_action_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has a punycode form_action_origin
    - name: has_punycode_origin
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the login to add/modify/remove has a punycode origin

        * Whether the login to add/modify/remove has a punycode origin or form_action_origin'
    - name: has_rtcp_mux
      type: BOOLEAN
      mode: NULLABLE
      description: Whether muxing RTCP with RTP data was negotiated for the m-section.
    - name: has_single_dot_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has an origin or form_action_origin
        consisting of a single dot only
    - name: has_sts
      type: BOOLEAN
      mode: NULLABLE
      description: If the error page is for a site with HSTS headers or with a pinned
        key.
    - name: has_username_line_break
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has a username containing
        a line break
    - name: has_username_nul
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has a username containing
        a Nul char
    - name: hidden
      type: BOOLEAN
      mode: NULLABLE
      description: The document is hidden.
    - name: history_and_downloads
      type: BOOLEAN
      mode: NULLABLE
      description: true if browsing history and downloads is selected to be cleared
    - name: history_form_data_downloads
      type: BOOLEAN
      mode: NULLABLE
      description: true if history, form data and downloads is selected to be cleared
    - name: hit
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the completion matched an entry in the table.
    - name: hls_decoder
      type: BOOLEAN
      mode: NULLABLE
      description: This value will only be set on Android. It tells that whether playback
        is performed by the HLS decoder, which utilizes the external player to play
        video.
    - name: hyphen_compat
      type: BOOLEAN
      mode: NULLABLE
      description: If the error is due to wildcard trying to match reference ID label
        with hyphen at begin/end
    - name: image
      type: BOOLEAN
      mode: NULLABLE
      description: Image detected
    - name: in_shutdown
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the application is currently shutting down.
    - name: inPrivateBrowsing
      type: BOOLEAN
      mode: NULLABLE
      description: True if IP Protection was started in a private browsing window.
    - name: is_addon_active
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the WebExtensionPolicy associated to the add-on was active
        at the time we are collecting this event.
    - name: is_background
      type: BOOLEAN
      mode: NULLABLE
      description: Was this a background update?
    - name: is_customizing
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the change was made in Customize Mode.
    - name: is_deleted
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove is a deletion stub
    - name: is_destroying
      type: BOOLEAN
      mode: NULLABLE
      description: True if toolbox destroy already started when the error occurred.
    - name: is_extensions_button_visible
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the Extensions Button is visible. Although the appmenu
        item is only shown when the user prefers the button to be hidden, it is possible
        for the button to be shown despite the user's preference if there was a reason
        to show the button temporarily. If true, this could be a sign that the user
        is confused about the function of the appmenu item, because the Extensions
        Button offers exactly the same functionality, except in a more visible location
        (on the toolbar).
    - name: is_extensions_panel_empty
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the Extensions Panel is unable to show any extensions. When false,
