friendly_name: App-specific view for Glean ping "page-extractor"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox for Android"
  (org_mozilla_firefox.page_extractor, org_mozilla_firefox_beta.page_extractor, org_mozilla_fenix.page_extractor, org_mozilla_fenix_nightly.page_extractor, org_mozilla_fennec_aurora.page_extractor).

  It is used by Looker.
owners: []
labels:
  sql_generator: glean_usage
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
