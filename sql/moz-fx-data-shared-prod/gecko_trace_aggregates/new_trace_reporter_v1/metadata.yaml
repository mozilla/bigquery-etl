---
friendly_name: Gecko Trace Bugzilla Reporter
description: |-
  Weekly job that files and updates Bugzilla bugs for gecko trace patterns.

  For each application the reporter files one bug for each stable_trace_id
  first seen in the last 7 days that has no bug yet, and records the bug in
  gecko_trace_bug_reports_v1. It then posts one comment with fresh counts,
  platforms and source locations to the bug of each known trace pattern that
  was seen in the last 7 days. It never changes the bug status.

  The BUGZILLA_API_KEY environment variable comes from the Airflow secret
  declared below. The secret must exist before the first production run.

owners:
  - jjalkanen@mozilla.com

labels:
  schedule: weekly

scheduling:
  dag_name: bqetl_gecko_trace_weekly
  task_group: reporter
  # The 7-day window ends on the Sunday that closes the weekly interval.
  arguments:
    - --date={{macros.ds_add(ds, 6)}}
  secrets:
    - deploy_target: BUGZILLA_API_KEY
      key: bqetl_gecko_trace__bugzilla_api_key
