friendly_name: Clients First Seen 28 Days Later v3
description: |-
    Client cohorts 28 days after their first seen date with relevant retention indicators.
owners:
- mhirose@mozilla.com
- shong@mozilla.com
labels:
  incremental: true
  owner1: example
  legacy: true
scheduling:
  dag_name: bqetl_analytics_tables
  partition_offset: -27d
  partition_parameter: first_seen_date
  depends_on_past: true
  parameters:
  - submission_date:DATE:{{ds}}
bigquery:
  time_partitioning:
    type: day
    field: first_seen_date
    require_partition_filter: true
    expiration_days: null
  clustering:
    fields:
    - sample_id
