friendly_name: Cohort Daily Statistics V2
description: |-
  Cohort Daily Statistics tracks retention for a cohort with
  the same first seen date and same set of attributes over the next 768 days

  Note that the values for client attributes are based on the
  attributes at the time the cohort started (rather than the
  values at activity time)
  - Jira ticket to extend time range: https://mozilla-hub.atlassian.net/browse/DENG-10515

  is_automated flags confirmed automated (bot) desktop clients from
  telemetry_derived.desktop_automated_clients_v1 (DENG-11925, every fleet), from
  cohort_date 2026-08-27 (DENG-12035). Bots are flagged, not removed, so totals that ignore
  this column still include them.

  In this table, is_automated is NULL in partitions written before DENG-12035 that were not
  backfilled (activity dates before 2026-08-28). To exclude bots here, filter on
  `is_automated IS NOT TRUE`: `NOT is_automated` would also drop those older rows. The view
  telemetry.cohort_daily_statistics returns FALSE instead of NULL, so `NOT is_automated` is safe
  there.
owners:
- mhirose@mozilla.com
labels:
  incremental: true
  owner1: mhirose
  table_type: aggregate
  dag: bqetl_cohort_retention
scheduling:
  dag_name: bqetl_cohort_retention
bigquery:
  time_partitioning:
    type: day
    field: activity_date
    require_partition_filter: true
    expiration_days: null
  clustering:
    fields:
    - normalized_app_name
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  backfill_deng12035.sql:
  - moz-fx-data-shared-prod.telemetry.active_users
  - moz-fx-data-shared-prod.telemetry_derived.cohort_daily_statistics_v2
  - moz-fx-data-shared-prod.telemetry_derived.rolling_cohorts_v2
  query.sql:
  - moz-fx-data-shared-prod.telemetry.active_users
  - moz-fx-data-shared-prod.telemetry_derived.rolling_cohorts_v2
