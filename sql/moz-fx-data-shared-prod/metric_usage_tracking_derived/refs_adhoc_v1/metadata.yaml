friendly_name: Metric Refs Ad Hoc
description: |-
  Metrics named by ad hoc BigQuery queries over 365 days, per account, from
  job history, with days per window. Replaced on each run by the docker-etl
  metric-usage job, metric_usage/adhoc.py. The job creates the table, and this
  schema has to match the one the job writes.
owners:
- bewu@mozilla.com
bigquery:
  clustering:
    fields:
    - app
    - metric
require_column_descriptions: true
