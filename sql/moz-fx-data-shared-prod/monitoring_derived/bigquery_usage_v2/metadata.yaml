friendly_name: BigQuery Query Usage
description: |-
  BigQuery usage, partitioned by day. There is one row per job and referenced table,
  so deduplicate by job_id before summing cost or bytes.

  Multi-statement queries produce a parent job with statement_type SCRIPT and one
  child job per statement. The parent's slot and byte totals include all of its
  children, so exclude SCRIPT jobs when summing usage to avoid counting scripts twice.
  Child jobs inherit query_id and username from their parent.
owners:
- bewu@mozilla.com
labels:
  incremental: true
  schedule: daily
  dag: bqetl_monitoring
  owner1: bewu
scheduling:
  dag_name: bqetl_monitoring
  depends_on:
  - dag_name: bqetl_monitoring_hourly
    task_id: monitoring_derived__jobs_by_organization__v1
    execution_delta: -4h
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-marketing-prod.region-us.INFORMATION_SCHEMA.JOBS_BY_PROJECT
  - moz-fx-data-shared-prod.monitoring_derived.jobs_by_organization_v1
  - moz-fx-data-shared-prod.region-us.INFORMATION_SCHEMA.JOBS_BY_PROJECT
  - mozdata.region-us.INFORMATION_SCHEMA.JOBS_BY_PROJECT
