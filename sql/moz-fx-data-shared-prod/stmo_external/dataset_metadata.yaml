friendly_name: STMO External
description: |-
  Tables copied from the Redash (sql.telemetry.mozilla.org) metadata database in Cloud SQL,
  excluding columns that contain credentials or query result data.

  Access is restricted because Redash hides queries on data sources a user can't access,
  but these tables include queries on every data source.
dataset_base_acl: restricted
user_facing: false
labels: {}
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
