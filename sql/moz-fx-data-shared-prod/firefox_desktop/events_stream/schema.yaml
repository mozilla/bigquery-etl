  - name: quantity
    type: RECORD
    mode: NULLABLE
    description: Quantity event extras.
    fields:
    - name: action_position
      type: INTEGER
      mode: NULLABLE
      description: The index of card receiving interactions.
    - name: active_age
      type: INTEGER
      mode: NULLABLE
      description: 'Milliseconds since the monitor''s current active period began:
        its creation, or the last time it was resumed or edited.'
    - name: ads_hidden
      type: INTEGER
      mode: NULLABLE
      description: Number of ads hidden for this component. These are ads that are
        loaded in the DOM but hidden via CSS and/or Javascript.
    - name: ads_loaded
      type: INTEGER
      mode: NULLABLE
      description: Number of ads loaded for this component. They may or may not be
        visible on the page.
    - name: ads_visible
      type: INTEGER
      mode: NULLABLE
      description: Number of ads visible for this component. An ad can be considered
        visible if was within the browser window by the time the impression was recorded.
    - name: age
      type: INTEGER
      mode: NULLABLE
      description: Age of the monitor in milliseconds since it was created.
    - name: attempt
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of prior restore attempts across sessions (0 on the first attempt).
        Restores stop being attempted once this reaches its budget.

        * How many launches had already tried and failed before this one, 0 on the
        first. A retry emits an otherwise identical event, so this is what separates
        a profile that failed once from one failing every time. The migrator gives
        up after 3.

        * Number of prior migration attempts across sessions (0 on the first attempt).'
    - name: attemptCount
      type: INTEGER
      mode: NULLABLE
      description: The number of NS requests that were issued for this confirmation.
    - name: attempts
      type: INTEGER
      mode: NULLABLE
      description: The number of recovery attempts made in this recovery sequence
    - name: auto_adjustments_prior
      type: INTEGER
      mode: NULLABLE
      description: How many times `effective` changed by itself, without the user
        changing the setting, earlier in this session. Reset to 0 each time the user
        changes the setting, so on a setting-change event this is the number of automatic
        adjustments the user saw before making that change. Counts adjustments strictly
        before this event, so the first automatic adjustment of a session reports
        0.
    - name: average_chunk_time
      type: INTEGER
      mode: NULLABLE
      description: The mean milliseconds elapsed between consecutive generated (non-prompt)
        chunks for a streamed text generation run. Null when fewer than two generated
        chunks were produced.
    - name: average_words_per_request
      type: INTEGER
      mode: NULLABLE
      description: The average count of words that this engine translated per request.
    - name: average_words_per_second
      type: INTEGER
      mode: NULLABLE
      description: The average words per second that this engine translated per request.
    - name: batches_failed
      type: INTEGER
      mode: NULLABLE
      description: Number of those requests that failed. A value above 0 with no error
        means the form was only partly filled. Absent when the whole generation failed,
        since the count does not survive the error.
    - name: batches_total
      type: INTEGER
      mode: NULLABLE
      description: Number of model requests the fields were split across. Absent when
        the whole generation failed, since the count does not survive the error.
    - name: buffering_time
      type: INTEGER
      mode: NULLABLE
      description: How long (in milliseconds) does the our media pipeline has been
