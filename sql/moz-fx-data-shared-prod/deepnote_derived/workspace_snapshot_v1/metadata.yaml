friendly_name: Deepnote Workspace Snapshot
description: |-
  Daily snapshot of the projects, notebooks, Streamlit apps and machines in
  Mozilla's Deepnote workspaces (one DEEPNOTE_*API_KEY secret per workspace), from the Deepnote API (GET /v2/projects,
  /v2/projects/{id}, /v2/projects/{id}/machine, /v2/streamlit-apps,
  /v2/notebooks/{id}/schedule).

  Only includes projects visible to the API key. `last_run_at` and `is_scheduled`
  reflect scheduled and API runs, not interactive execution in the editor.
owners:
- ascholtz@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: aggregate
scheduling:
  dag_name: bqetl_deepnote
  arguments: ["--date", "{{ ds }}"]
  date_partition_parameter: null
  secrets:
  - deploy_target: DEEPNOTE_API_KEY
    key: bqetl_deepnote_api_key
  - deploy_target: DEEPNOTE_ADS_API_KEY
    key: bqetl_deepnote_ads_api_key
  - deploy_target: DEEPNOTE_REVENUECAT_1_API_KEY
    key: bqetl_deepnote_revenuecat_1_api_key
  - deploy_target: DEEPNOTE_REVENUECAT_2_API_KEY
    key: bqetl_deepnote_revenuecat_2_api_key
  - deploy_target: DEEPNOTE_MARKETING_API_KEY
    key: bqetl_deepnote_marketing_api_key
  - deploy_target: DEEPNOTE_MONITOR_API_KEY
    key: bqetl_deepnote_monitor_api_key
bigquery:
  time_partitioning:
    type: day
    field: snapshot_date
    require_partition_filter: false
    expiration_days: null
