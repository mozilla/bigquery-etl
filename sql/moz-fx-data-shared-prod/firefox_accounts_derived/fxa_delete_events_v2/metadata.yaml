---
friendly_name: FxA Delete Events
description: Deletion events extracted from FxA auth server logs
 used as signal for Mozilla to delete analysis data associated with
 the user
owners:
  - kik@mozilla.com
labels:
  application: fxa
  incremental: true
  schedule: daily
  table_type: client_level
# descheduled: deletions from 2026-11-17 on come from
# accounts_backend_derived.delete_events_accounts_db_v1.
# scheduling:
#   dag_name: bqetl_fxa_events
bigquery:
  time_partitioning:
    type: day
    field: submission_timestamp
    require_partition_filter: false
