sources:
  moz-fx-data-shared-prod.firefox_desktop_derived.urlbar_events_v2:
    # e1's results extra was empty, so its only result has an empty type. The session counts
    # in the client totals but gets no element. e2 is an ordinary session.
    - submission_date: "2026-10-14"
      glean_client_id: client-g
      sample_id: 7
      event_name: abandonment
      event_timestamp: 100
      event_id: e1
      interaction: typed
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 0, result_type: "", product_result_type: "", result_group: ""}
    - submission_date: "2026-10-14"
      glean_client_id: client-g
      sample_id: 7
      event_name: abandonment
      event_timestamp: 200
      event_id: e2
      interaction: typed
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}

parameters:
  - name: submission_date
    type: DATE
    value: "2026-10-14"

expect:
  # NULL columns are omitted: the harness drops null keys from the result row.

  # Both sessions are counted, but only e2's result type has an element.
  - submission_date: "2026-10-14"
    client_id: client-g
    sample_id: 7
    sessions_total: 2
    sessions_engaged: 0
    sessions_abandoned: 2
    results:
      - window_mode: classic
        sap: urlbar
        interaction: typed
        result_type: search_engine
        product_result_type: search_engine
        result_group: heuristic
        clicks: 0
        sessions_shown: 1
        sessions_shown_abandoned: 1
        annoyances: 0
