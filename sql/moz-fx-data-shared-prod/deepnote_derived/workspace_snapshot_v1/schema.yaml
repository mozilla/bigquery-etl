fields:
- name: snapshot_date
  type: DATE
  mode: NULLABLE
  description: Date of the snapshot.
- name: workspace_id
  type: STRING
  mode: NULLABLE
  description: Deepnote workspace ID.
- name: workspace_name
  type: STRING
  mode: NULLABLE
  description: Deepnote workspace name.
- name: project_id
  type: STRING
  mode: NULLABLE
  description: Deepnote project ID.
- name: project_name
  type: STRING
  mode: NULLABLE
  description: Project name.
- name: project_type
  type: STRING
  mode: NULLABLE
  description: "`standard`, `notebook` or `agent`."
- name: created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Time the project was created.
- name: updated_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Time the project was last updated, as reported by the API.
- name: folder_id
  type: STRING
  mode: NULLABLE
  description: ID of the folder containing the project.
- name: folder_path
  type: STRING
  mode: NULLABLE
  description: Folder path of the project, e.g. "User Folders/jdoe" or "Team Folders/Ads".
- name: notebooks
  type: RECORD
  mode: REPEATED
  description: Notebooks in the project.
  fields:
  - name: notebook_id
    type: STRING
    mode: NULLABLE
    description: Deepnote notebook ID.
  - name: name
    type: STRING
    mode: NULLABLE
    description: Notebook name.
  - name: created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Time the notebook was created.
  - name: is_init
    type: BOOLEAN
    mode: NULLABLE
    description: Whether this is the project's init notebook.
  - name: is_scheduled
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the notebook has a schedule (one per project at most).
  - name: last_run_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Time of the last scheduled or API run.
  - name: schedule
    type: RECORD
    mode: NULLABLE
    description: The notebook's schedule (GET /v2/notebooks/{id}/schedule), null if not scheduled.
    fields:
    - name: cron
      type: STRING
      mode: NULLABLE
      description: Five-field cron expression, evaluated in `timezone`.
    - name: timezone
      type: STRING
      mode: NULLABLE
      description: IANA timezone of the schedule.
    - name: next_run_at
      type: TIMESTAMP
      mode: NULLABLE
      description: Next scheduled run.
    - name: is_paused
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the schedule is paused (e.g. auto-paused after repeated failures).
    - name: pause_reason
      type: STRING
      mode: NULLABLE
      description: Why the schedule is paused.
- name: streamlit_apps
  type: RECORD
  mode: REPEATED
  description: Streamlit apps served by the project.
  fields:
  - name: streamlit_app_id
    type: STRING
    mode: NULLABLE
    description: Streamlit app ID.
  - name: entrypoint
    type: STRING
    mode: NULLABLE
    description: Project file the app runs.
  - name: url
    type: STRING
    mode: NULLABLE
    description: URL the app is served on.
  - name: created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Time the app was created.
  - name: unscoped_cache_count
    type: INTEGER
    mode: NULLABLE
    description: st.cache_data/st.cache_resource decorators in the app's entrypoint without scope="session" (shared between viewers);
      null if the entrypoint couldn't be read.
  - name: uses_service_account
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the app's entrypoint uses a service account (e.g. MOZDATA_SERVICE_ACCOUNT) rather than the viewer's own OAuth.
- name: machine
  type: RECORD
  mode: NULLABLE
  description: Machine used by the project's editor, live runs and Streamlit apps at snapshot time (detached runs use their own machines).
  fields:
  - name: status
    type: STRING
    mode: NULLABLE
    description: Machine status, e.g. stopped, starting, running.
  - name: type_id
    type: STRING
    mode: NULLABLE
    description: Machine type ID, e.g. lake.
  - name: type_name
    type: STRING
    mode: NULLABLE
    description: Machine type name, e.g. "CPU (Basic)".
  - name: vcpus
    type: FLOAT
    mode: NULLABLE
    description: vCPUs of the machine type.
  - name: memory_gib
    type: FLOAT
    mode: NULLABLE
    description: Memory of the machine type in GiB.
  - name: gpu_count
    type: INTEGER
    mode: NULLABLE
    description: GPUs of the machine type.
  - name: idle_shutdown_seconds
    type: INTEGER
    mode: NULLABLE
    description: Seconds of inactivity after which the machine shuts down.
- name: files
  type: STRING
  mode: REPEATED
  description: Paths of the project's files (from GET /v2/projects/{id}), e.g. app.py, _deepnote_static/report.html.
- name: integrations
  type: RECORD
  mode: REPEATED
  description: Integrations attached to the project (from GET /v2/projects/{id}).
  fields:
  - name: integration_id
    type: STRING
    mode: NULLABLE
    description: Deepnote integration ID.
  - name: name
    type: STRING
    mode: NULLABLE
    description: Integration name, e.g. mozdata.
  - name: type
    type: STRING
    mode: NULLABLE
    description: Integration type, e.g. big-query, snowflake, env, custom-mcp.
- name: streamlit_requirement
  type: RECORD
  mode: NULLABLE
  description: The streamlit line of the project's requirements.txt, if any.
  fields:
  - name: file
    type: STRING
    mode: NULLABLE
    description: Path of the requirements file.
  - name: specifier
    type: STRING
    mode: NULLABLE
    description: Version specifier, e.g. ==1.40.0; null if unpinned.
  - name: excludes_session_cache
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the specifier only allows Streamlit versions before 1.54, which don't support session-scoped caches.
