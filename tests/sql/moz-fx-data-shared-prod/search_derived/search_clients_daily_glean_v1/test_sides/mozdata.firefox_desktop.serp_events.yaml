# event_timestamp is INTEGER here, matching serp_events_v2's schema.yaml -- not the
# TIMESTAMP the SAP side carries. The values only have to order the rows within a key.
# ad_components carries the eight fields the view builds; the query reads .component and
# nothing else, but the rest are filled consistently with each row's num_ads_* totals so
# a reader is not misled about where those come from.

# KEPT, and published as its own output row. The only impression for client-matched, on
# a key the SAP event and the legacy counters also carry, so it is the three-sided case.
# partner_code is the empty string here and absent on the SAP side; both resolve to
# 'no_code', which is what lets the two sides join at all.
# channel and locale are null so the coalesce has to fall through to SAP and to legacy.
# experiments is empty rather than absent: the join's IF must read an empty array as "no
# enrollments recorded" and take the SAP array instead of this one.
# Deliberately not sharing the anchor below -- it is a different client with different
# dimensions, and spreading them would hide that.
- submission_date: "2026-08-13"
  glean_client_id: client-matched
  legacy_telemetry_client_id: legacy-matched
  profile_group_id: pg-matched
  sample_id: 7
  document_id: doc-serp-matched
  impression_id: imp-matched-1
  event_timestamp: 1000
  search_engine: engine1
  partner_code: ""
  sap_source: urlbar
  is_tagged: true
  normalized_country_code: US
  browser_version_info:
    version: "141.0"
    major_version: 141
    minor_version: 0
    patch_revision: 0
    is_major_release: true
  channel: null
  normalized_channel: release
  locale: null
  os: Darwin
  normalized_os: Mac
  os_version: 24.5.0
  normalized_os_version: 24.5.0
  first_run_date: "2026-08-01+03:00"
  region_home_region: US
  usage_is_default_browser: true
  search_engine_default_display_name: Engine One
  subsession_start_time: "2026-08-13T09:00:00+03:00"
  subsession_end_time: "2026-08-13T10:00:00+03:00"
  subsession_counter: 3
  policies_is_enterprise: false
