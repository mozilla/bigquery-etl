fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: cohort_date
  type: DATE
  mode: NULLABLE
  description: The date this client was first seen (cohort entry date), used to group
    clients by when they were first seen.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
    Computed by the ingestion pipeline as `CRC32(client_id) % 100`, where the source
    `client_id` is `client_info.client_id` for Glean pings and the top-level `clientId`
    for legacy telemetry pings.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation.
- name: adjust_adgroup
  type: STRING
  mode: NULLABLE
  description: 'Structure parameter for the ad group of a campaign.

    Adjust campaign structure parameters (`campaign`, `adgroup`, `creative`) are set
    on the Adjust link URL by marketing, analogous to UTM parameters on a web URL,
    so values are not telemetry-derived and their format is campaign-specific. Only
    populated for clients whose `adjust_network` is known.'
- name: adjust_campaign
  type: STRING
  mode: NULLABLE
  description: 'Structure parameter for the campaign name.

    Adjust campaign structure parameters (`campaign`, `adgroup`, `creative`) are set
    on the Adjust link URL by marketing, analogous to UTM parameters on a web URL,
    so values are not telemetry-derived and their format is campaign-specific. Only
    populated for clients whose `adjust_network` is known.'
- name: adjust_creative
  type: STRING
  mode: NULLABLE
  description: 'Structure parameter for the creative content of a campaign.

    Adjust campaign structure parameters (`campaign`, `adgroup`, `creative`) are set
    on the Adjust link URL by marketing, analogous to UTM parameters on a web URL,
    so values are not telemetry-derived and their format is campaign-specific. Only
    populated for clients whose `adjust_network` is known.'
- name: is_new_install
  type: BOOLEAN
  mode: NULLABLE
  description: True if the client was first seen on the submission date and reported
    a `first_session` ping (`metadata.reported_first_session_ping` from `fenix.firefox_android_clients`),
    distinguishing a genuine new install from a new profile.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: True if this is the first time a profile has been seen for this client,
    false if the profile was seen before.
- name: searches
  type: INTEGER
  mode: NULLABLE
  description: Total number of searches performed by this client on the submission
    date. 0 when neither `fenix.baseline` metrics nor `search.mobile_search_clients_daily`
    reported search data for this client on that day.
- name: searches_with_ads
  type: INTEGER
  mode: NULLABLE
  description: Number of search result pages (SERPs) that contained advertisements,
    recorded for this client on the submission date. 0 when neither `fenix.baseline`
    metrics nor `search.mobile_search_clients_daily` reported search data for this
    client on that day.
- name: ad_clicks
  type: INTEGER
  mode: NULLABLE
  description: Number of ad clicks on search result pages by this client on the submission
    date. 0 when neither `fenix.baseline` metrics nor `search.mobile_search_clients_daily`
    reported search data for this client on that day.
- name: activated
  type: BOOLEAN
  mode: NULLABLE
  description: True if `fenix.new_profile_activation` reported this client as activated
    on the submission date; false when there is no activation record.
