friendly_name: Table Workgroup Access
description: |-
  Per-table inventory of table-specific BigQuery Data Viewer
  (roles/bigquery.dataViewer) group grants for every table and view in
  moz-fx-data-shared-prod. One row per table, listing the Google groups (and
  parsed workgroup names) granted read access directly on the table beyond what
  its dataset already grants. Tables with nothing table-specific still get a
  row, with empty google_groups/workgroups.

  Dataset-level grants are inventoried separately by dataset_workgroup_access_v1,
  so effective read access for a table is the union of its row here and its
  dataset's row there.

  Produced weekly by a self-contained Python job that reads each table's IAM
  policy. Each run overwrites its own collected_at date partition.
labels:
  incremental: true
owners:
- cmorales@mozilla.com
scheduling:
  dag_name: bqetl_data_governance_metadata
  arguments: [
    "--date", "{{ ds }}",
  ]
bigquery:
  time_partitioning:
    type: day
    field: collected_at
    require_partition_filter: false
  clustering:
    fields:
    - source_dataset
    - source_table
