friendly_name: Merino Queries Daily
description: |-
  Daily count of all queries collected by Merino - grouped by submission_date, query, country, and form_factor.

  Data in this table is restricted to users who have access to the search-terms/sanitized workgroup. Any downstream
  assets to be shared with search-terms/aggregated access must use only the terminal (latest) query and the query
  must appear at least twice over a seven day window. See search_terms_daily_v1:
  https://github.com/mozilla/bigquery-etl/blob/main/sql/moz-fx-data-shared-prod/search_terms_derived/search_terms_daily_v1/query.sql
owners:
- ads-data-team@mozilla.com
- cklein@mozilla.com
- nkypreos@mozilla.com
labels:
  incremental: true
  dag: bqetl_search_terms_daily
  owner1: ads-data-team
  owner2: cklein
  owner3: nkypreos
scheduling:
  dag_name: bqetl_search_terms_daily
  arguments:
  - --schema_update_option=ALLOW_FIELD_ADDITION
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: 14.0
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:search-terms/sanitized
- role: roles/bigquery.metadataViewer
  members:
  - workgroup:search-terms/external-outerbounds-task-search-terms-sanitized
  - workgroup:search-terms/sanitized-writer
references:
  query.sql:
  - moz-fx-data-shared-prod.search_terms_derived.merino_log_sanitized_v4
