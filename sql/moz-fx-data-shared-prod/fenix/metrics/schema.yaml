            type: STRING
          - name: value
            type: INTEGER
      description: 'HTTP3: Records the maximum non-exiting value that the scaled,
        normalized difference between sent and acked bytes ever reached for a connection.
        Can be used to tune the exit threshold (THRESH). Is capped out at 25, since
        the current THRESH is 26, so any diff > 25 will exit.

        The bucket with the ''exited_ce'' label is of special interest, since those
        are connections that then ended up exiting slow start with loss.

        '
    - name: networking_http_3_search_reset_count
