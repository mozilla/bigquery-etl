---
friendly_name: Gecko Trace Bug Reports
description: |-
  Bugzilla bugs filed for trace patterns, one row per stable_trace_id.

  The weekly reporter writes this table. It files one bug for each new
  stable_trace_id and records the bug here so that it does not file it again.
  It also records when it last posted a comment to the bug.

  The script only creates the table. The reporter inserts and updates the rows.

owners:
  - jjalkanen@mozilla.com

labels:
  incremental: false
  schedule: weekly

scheduling:
  dag_name: bqetl_gecko_trace_weekly
  task_group: {{ app_id }}
  date_partition_parameter: null
  parameters: ["submission_date:DATE:{% raw %}{{ds}}{% endraw %}"]

bigquery:
  clustering:
    fields:
      - stable_trace_id
