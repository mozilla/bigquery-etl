---
friendly_name: Gecko Trace Events Bridge
description: |-
  Ordered events of each trace pattern.

  Each row has one (trace_signature, event_position, event_signature).
  Rows are written once, when a trace signature is first seen.
  Join gecko_trace_traces_v1 and gecko_trace_events_v1 to get stable ids
  and source locations.

owners:
  - jjalkanen@mozilla.com

labels:
  incremental: true
  schedule: daily

scheduling:
  dag_name: bqetl_gecko_trace
  task_group: {{ app_id }}
  date_partition_parameter: null
  parameters: ["submission_date:DATE:{% raw %}{{ds}}{% endraw %}"]

bigquery:
  clustering:
    fields:
      - trace_signature
