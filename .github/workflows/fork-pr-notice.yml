name: Fork PR Notice

# Fork pull requests are not supported here. This comments on them to explain
# why no checks will run.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]

permissions: {}

# Two pushes in quick succession would otherwise both find no comment and both
# post one.
concurrency:
  group: fork-pr-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notice:
    name: Explain that fork PRs are unsupported
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post redirect comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          marker='<!-- fork-pr-notice -->'

          # Already told this author? Don't repeat it on every push. Paginated:
          # on a long PR the notice falls off the first page, and missing it
          # would post a duplicate.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
            2>/dev/null | head -n1) || true
          if [ -n "$existing" ]; then
            echo "Notice already posted on #$PR; nothing to do."
            exit 0
          fi

          body="$(mktemp)"
          {
            echo "$marker"
            echo "Hi @${AUTHOR}, thanks for the contribution — a heads-up before you wait on CI:"
            echo "**this repository can't run checks on pull requests from forks**, so none will"
            echo "appear here."
            echo
            echo "It isn't about the change itself. Almost every CI job needs repository secrets to"
            echo "reach BigQuery, and GitHub withholds secrets from fork pull requests, so there is"
            echo "no way for this PR to get a real review signal."
            echo
            echo "**If you can push to \`mozilla/bigquery-etl\`** — Mozilla staff and designated"
            echo "contributors can — please re-open this from a branch in this repository instead:"
            echo
            echo '```bash'
            echo "git clone git@github.com:mozilla/bigquery-etl.git"
            echo "cd bigquery-etl"
            echo "git checkout -b my-branch"
            echo "# re-apply your changes, then:"
            echo "git push origin my-branch"
            echo '```'
            echo
            echo "**If you can't push a branch here**, ask in"
            echo "[#data-help](https://mozilla.slack.com/archives/C4D5ZA91B) — getting you access is"
            echo "the fix, and a maintainer can advise on how to land this in the meantime."
            echo
            echo "See [CONTRIBUTING.md](https://github.com/${REPO}/blob/main/CONTRIBUTING.md) for the full workflow."
          } > "$body"
          gh pr comment "$PR" -R "$REPO" --body-file "$body"
