friendly_name: Metric Usage Artifacts Ad Hoc
description: |-
  People, service accounts and Jetstream experiments whose ad hoc queries name
  a metric; views_<n>d is their jobs naming one. Replaced on each run by the
  docker-etl metric-usage job, metric_usage/adhoc.py. The job creates the
  table, and this schema has to match the one the job writes.
owners:
- bewu@mozilla.com
bigquery:
  clustering:
    fields:
    - artifact_id
require_column_descriptions: true
