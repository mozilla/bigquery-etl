fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: days_seen_bytes
  type: BYTES
  mode: NULLABLE
  description: A byte array representing the days within the past year that this client
    was seen, with each bit encoding presence on a specific day.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: 'The sum of the duration of the last foreground session in seconds
    across each unique baseline ping

    received on this submission date.

    Clients that did not send a ping on the submission date have their previous row
    carried forward, so for those rows this value comes from the client''s most recent
    active day.'
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-day bit pattern anchored on the submission date. Bit n is set
    when a Glean baseline app session started n days before the submission date, for
    n in 0..27. Note this window is 28 days, unlike the 365-day `days_seen_bytes`
    above.
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-day bit pattern anchored on the submission date. Bit n is set
    when a Glean baseline app session ended n days before the submission date, for
    n in 0..27. Note this window is 28 days, unlike the 365-day `days_seen_bytes`
    above.
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: The normalized name of the operating system running at the client.
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
  description: The normalized version string of the Android operating system (e.g.,
    '13', '14', '16').
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on
    this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: 'The build identifier generated by the CI system (e.g. "1234/A").

    If the value was not provided through configuration, this metric gets set to Unknown.'
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The channel the application is being distributed on.
- name: app_display_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on. On Android,
    this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL".
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g.
    25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: 'Indicates if the submission date is the same as the client''s first
    seen date.

    Clients that did not send a ping on the submission date have their previous row
    carried forward, so for those rows this value comes from the client''s most recent
    active day rather than the submission date.'
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's
    IP address.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: First major country subdivision, typically a state, province, or county
    based on IP address.
