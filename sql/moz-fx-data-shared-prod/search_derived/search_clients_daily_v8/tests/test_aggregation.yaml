      profile_group_id: prfl_b
    - client_id: c
      submission_date: '2017-01-01'
      profile_group_id: prfl_c
  moz-fx-data-shared-prod.telemetry_stable.main_v5:
    - client_id: a
      normalized_app_name: Firefox
      document_id: '123'
      submission_timestamp: '2017-01-01 01:00:00'
