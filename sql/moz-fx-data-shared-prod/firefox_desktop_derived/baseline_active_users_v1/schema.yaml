fields:
- name: days_since_desktop_active
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last active on Firefox Desktop, derived from days_desktop_active_bits.
    Null if the client has not been active on Desktop within the 28-day window.
- name: days_since_seen
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last sent any ping, derived from days_seen_bits. A value
    of 0 means the client was seen on the submission date.
- name: days_since_active
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last active (sent a baseline ping with duration > 0),
    derived from days_active_bits. Null if the client has not been active within the 28-day window.
- name: days_since_created_profile
  type: INTEGER
  mode: NULLABLE
  description: The number of days since this client's Firefox profile first ran (first_run_date), derived
    from days_created_profile_bits. Null if first_run_date was not within the reliable 7-day window before
    the submission date.
- name: days_since_seen_session_start
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last sent a ping with a session start event, derived
    from days_seen_session_start_bits. Null if no session start was observed within the 28-day window.
- name: days_since_seen_session_end
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last sent a ping with a session end event, derived from
    days_seen_session_end_bits. Null if no session end was observed within the 28-day window.
- name: days_since_visited_1_uri
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last visited at least one URI, derived from days_visited_1_uri_bits.
    Null if the client has not visited any URI within the 28-day window.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client sent at least one ping on that day.
- name: days_created_profile_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client's first_run_date fell on that day. Derived via udf.days_since_created_profile_as_28_bits,
    which only sets a bit when first_run_date is 0-6 days before the submission date, since client-reported
    dates outside that window are unreliable.
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: The total duration of active Firefox sessions in seconds for the submission date, summed
    across all pings received.
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client sent a ping with a session start on that day.
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client sent a ping with a session end on that day.
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: The build identifier generated by the CI system (e.g. "20210318103112"). If the value was
    not provided through configuration, this metric gets set to "Unknown".
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The channel the application is being distributed on.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
    Not set if the device manufacturer can't be determined (e.g. on Desktop).
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on.
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: True if submission_date equals the client's first_seen_date, i.e. this is the first day the
    client was observed.
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's IP address.
- name: days_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client was active (baseline ping duration > 0) on that day.
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: First major country subdivision, typically a state, province, or county based on IP address.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source from which Firefox was installed (e.g. store, web download). Always null for this
    table.
- name: days_desktop_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client was active on Firefox Desktop on that day. Used to compute DAU, WAU, and MAU.
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: windows_build_number
- name: browser_engagement_uri_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of non-unique http(s) URIs visited during the session, including page reloads,
    after session restore. URIs from minimized/background tabs and private browsing are included.
- name: browser_engagement_active_ticks
  type: INTEGER
  mode: NULLABLE
  description: The number of five-second intervals ('ticks') during which the user was considered active
    via keyboard or mouse interaction. Does not account for window focus state.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: legacy_telemetry_client_id
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: attribution_dltoken
  type: STRING
  mode: NULLABLE
  description: A unique token (UUID) associated with a Firefox download, used to attribute the install to
    a specific download event. Null when attribution data was not collected.
- name: attribution_dlsource
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_dlsource
- name: attribution_experiment
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_experiment
- name: attribution_variation
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_variation
- name: attribution_ua
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_ua
- name: experiments
  type: RECORD
  mode: REPEATED
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: experiments
  fields:
  - name: key
    type: STRING
    mode: NULLABLE
    description: The slug identifier of the Nimbus experiment or rollout the client is enrolled in (e.g. 'firefox-suggest-enhanced-exposure-phase-1').
  - name: value
    type: RECORD
    mode: NULLABLE
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
      description: The branch of the experiment the client is assigned to (e.g. 'control', 'treatment-a', 'rollout-branch').
    - name: extra
      type: RECORD
      mode: NULLABLE
      fields:
      - name: type
        type: STRING
        mode: NULLABLE
        description: The type of the Nimbus experiment enrollment (e.g. 'nimbus-rollout', 'nimbus-nimbus', 'nimbus-undefined'),
          indicating whether the enrollment is a rollout or a standard experiment.
      - name: enrollment_id
        type: STRING
        mode: NULLABLE
        description: A UUID identifying this client's specific enrollment instance in the experiment. Null for
          most enrollments; populated only when an explicit enrollment ID is recorded.
- name: days_visited_1_uri_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client visited at least one URI on that day.
- name: active_hours_sum
  type: FLOAT
  mode: NULLABLE
  description: The total number of hours the user was considered active (keyboard or mouse interaction)
    during the submission date, derived from active ticks (each tick is 5 seconds).
- name: days_interacted_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents one day in the past 28 days; a set bit indicates
    the client had at least one active interaction tick on that day.
- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: The reason the Firefox profile was selected during startup on the first observed ping. Values
    include 'default', 'firstrun-created-default', 'restart', 'argument-profile', 'profile-selector', and
    others as defined in the startup.profile_selection_reason probe.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the application.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: The patch revision component of the browser version string (e.g. 6 from "152.0.6"), extracted
    using the browser_version_info UDF. Null for major releases with no patch component.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: True if the app version string corresponds to a major release (i.e. has no patch revision
    component such as '153.0'), false for point releases.
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: distribution_id_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the distribution_id was sourced from the Glean ping ('glean') or from a
    legacy telemetry distribution mapping ('legacy'). Null when no distribution ID is available.
- name: os
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: A grouped operating system label equivalent to the os field (e.g. 'Windows', 'Linux', 'Mac').
    Included for backwards compatibility with legacy data sources.
- name: os_version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os_version
- name: os_version_build
  type: STRING
  mode: NULLABLE
  description: A human-readable OS version build string combining the OS name and version (e.g. 'Windows
    11', 'Windows 10', 'Windows 7'). For non-Windows platforms, falls back to the raw os_version string.
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: The major version component of the operating system version string (e.g. 10 for Windows 10,
    6 for Windows Vista/7/8).
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: The minor version component of the operating system version string (e.g. 0 for Windows 10.0,
    1 for macOS minor updates).
- name: activity_segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: Year of the client's first seen date.
- name: is_daily_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a daily user on the submission date.
- name: is_weekly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a weekly user on the submission date.
- name: is_monthly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a monthly user on the submission date.
- name: is_dau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a daily active user on this submission date.
- name: is_wau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: is_mau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign associated with the Firefox install at the most recent ping, similar
    to the UTM campaign parameter. Null when attribution data was not collected.
- name: attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content parameter associated with the Firefox install at the most recent
    ping, similar to the UTM content parameter. Null when attribution data was not collected.
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_medium
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_source
- name: attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term (search keyword) associated with the Firefox install at the most recent
    ping, similar to the UTM term parameter.
- name: distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name associated with the Firefox install at the most recent ping (e.g. 'canonical-002',
    'mozilla-MSIX', 'MozillaOnline'). Can be a partner name or a distribution configuration preset.
- name: first_seen_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign associated with the Firefox install at the time of the client's
    first seen ping, similar to the UTM campaign parameter. Null when attribution data was not recorded
    at first seen.
- name: first_seen_attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content parameter associated with the Firefox install at the time of the
    client's first seen ping, similar to the UTM content parameter. Null when attribution data was not recorded
    at first seen.
- name: first_seen_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium associated with the Firefox install at the time of the client's first
    seen ping, similar to the UTM medium parameter (e.g. 'referral', 'paidsearch'). Null when attribution
    data was not recorded at first seen.
- name: first_seen_attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source associated with the Firefox install at the time of the client's first
    seen ping, similar to the UTM source parameter (e.g. 'www.google.com'). Null when attribution data was
    not recorded at first seen.
- name: first_seen_attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term associated with the Firefox install at the time of the client's first
    seen ping, similar to the UTM term parameter.
- name: first_seen_distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name associated with the Firefox install at the time of the client's first
    seen ping (e.g. 'canonical-002', 'mozilla-MSIX'). Null when no distribution name was recorded at first
    seen.
- name: is_desktop
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates if the client is included in the desktop KPI.
- name: attribution_msclkid
  type: STRING
  mode: NULLABLE
  description: Unique token created at Firefox download time using the Microsoft Store.
- mode: NULLABLE
  name: policies_is_enterprise
  type: BOOLEAN
  description: |-
    Attempt to determine if the user is an enterprise user based on various signals.
    This metric was generated to correspond to the Legacy Telemetry scalar policies.is_enterprise.
