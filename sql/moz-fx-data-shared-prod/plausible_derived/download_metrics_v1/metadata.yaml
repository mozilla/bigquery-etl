friendly_name: Plausible Download Metrics V1
description: |-
  Daily aggregate of Plausible product_download events on firefox.com, by
  page path, session entry page, country, product, platform, release
  channel, and download language. Sourced from the raw Plausible events
  export, filtered to name = 'product_download'.

owners:
- sherrera@mozilla.com
labels:
  incremental: true
  owner1: sherrera
  table_type: aggregate
scheduling:
  dag_name: bqetl_plausible_derived
  depends_on_table_partitions_existing:
  - task_id: wait_for_plausible_events_partition_for_download_metrics_v1
    table_id: moz-fx-data-shared-prod.plausible_external.events_v1
    partition_id: '{{ ds_nodash }}'
    poke_interval: 30m
    timeout: 10h
    retries: 1
    retry_delay: 30m
  - task_id: wait_for_plausible_sessions_partition_for_download_metrics_v1
    table_id: moz-fx-data-shared-prod.plausible_external.sessions_v1
    partition_id: '{{ ds_nodash }}'
    poke_interval: 30m
    timeout: 10h
    retries: 1
    retry_delay: 30m
bigquery:
  time_partitioning:
    type: day
    field: date
    require_partition_filter: true
  clustering:
    fields:
    - country_code
    - platform
require_column_descriptions: true
