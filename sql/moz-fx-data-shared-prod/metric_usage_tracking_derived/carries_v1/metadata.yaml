friendly_name: Metric Carries
description: |-
  Which columns of which warehouse tables carry each metric, with hops from
  the stable table. Replaced on each run by the docker-etl metric-usage job,
  metric_usage/lineage.py, from the generated-sql branch. The job creates the
  table, and this schema has to match the one the job writes.
owners:
- bewu@mozilla.com
bigquery:
  clustering:
    fields:
    - app
    - metric
require_column_descriptions: true
