friendly_name: Deepnote Notebook Schedules
description: |-
  Schedules of notebooks in Mozilla's default Deepnote workspace as of the latest
  workspace snapshot, with each cron expression expanded into its weekly fire times
  (`fire_times`, local to the schedule's timezone) and the number of scheduled runs
  per weekday (`runs_per_weekday`). Crons that restrict day of month or month
  (`is_weekly = false`) are expanded as if they ran every week. Rebuilt in full daily.
owners:
- ascholtz@mozilla.com
labels:
  incremental: false
  schedule: daily
  table_type: aggregate
scheduling:
  dag_name: bqetl_deepnote
  date_partition_parameter: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
