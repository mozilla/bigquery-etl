friendly_name: STMO Users
description: |
  A copy of the `users` table from the Redash (sql.telemetry.mozilla.org) metadata database, excluding `api_key` and `password_hash`, updated daily to match the current state of the table.
owners:
- bewu@mozilla.com
labels:
  schedule: daily
  dag: bqetl_stmo
  owner1: bewu
scheduling:
  dag_name: bqetl_stmo
  date_partition_parameter: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - EXTERNAL_QUERY('moz-fx-data-stmo-prod-33f2.us.stmo-cloudsql-prod', 'SELECT\n         id,\n         updated_at,\n         created_at,\n         org_id,\n         name,\n         email,\n         groups,\n         profile_image_url,\n         disabled_at,\n         details\n       FROM\n         users\n    ')
