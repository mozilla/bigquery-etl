friendly_name: Jetstream Analysis Errors
description: |-
  Classifies each row of `monitoring.logs` into an `error_category` describing
  what kind of problem it represents: an expected skip, a benign fallback, a
  configuration error, a data-quality issue, a failure due to resource limits
  (BQ or k8s), or another jetstream failure. Covers all `source` values in
  `monitoring.logs` (jetstream, jetstream-preview, sizing); the classification
  rules are jetstream-specific but the view does not filter by source.
owners:
  - mwilliams@mozilla.com
labels:
  incremental: false
