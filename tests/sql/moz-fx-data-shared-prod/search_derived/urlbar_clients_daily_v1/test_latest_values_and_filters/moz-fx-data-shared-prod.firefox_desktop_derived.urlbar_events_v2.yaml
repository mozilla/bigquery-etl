# Prefs come from the client's latest event that day; the profile group id is the
# latest non-null one. The last two rows must be filtered out.

# Earlier event: sponsored on, profile group id present.
- submission_date: "2026-10-14"
  glean_client_id: client-a
  profile_group_id: group-a
  sample_id: 1
  event_name: abandonment
  event_timestamp: 100
  event_id: e1
  pref_fx_suggestions: true
  pref_sponsored_suggestions: true
  pref_ohttp_available: true
  pref_ohttp_enabled: false
  pref_data_collection: false
  interaction: typed
  event_action: abandoned
  is_terminal: true
  window_mode: classic
  sap: urlbar
  results:
  - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}
