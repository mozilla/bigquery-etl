name: Build, Test, and Deploy
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  merge_group:
  workflow_dispatch:
    inputs:
      skip-stage-deploys:
        description: 'Skip stage deployments'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      trigger-sql-generation:
        description: 'Force SQL generation to run'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'


# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

env:
  # Only the build job uses this directly. Other jobs ask for the exact patch version build
  # resolved to, because the venv cache key includes the patch version and jobs in one run can
  # resolve to different patches while a release rolls out
  PYTHON_VERSION: '3.11'
  PRIVATE_REPO: mozilla/private-bigquery-etl

jobs:
  decide-runs:
    name: Decide what checks to run based on changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Contributors push branches to this repo rather than opening PRs from a
    # fork (see CONTRIBUTING.md), so CI only ever runs on trusted code. A fork
    # PR gets no secrets and can't run these jobs meaningfully; fork-pr-notice.yml
    # comments on it to explain why no checks appear.
    if: &is-not-fork >-
      ${{ github.event.pull_request.head.repo.fork != true }}
    outputs:
      validate-routines: ${{ steps.set-flags.outputs.validate-routines }}
      deploy: ${{ steps.set-flags.outputs.deploy }}
      validate-sql: ${{ steps.set-flags.outputs.validate-sql }}
      validate-bqetl: ${{ steps.set-flags.outputs.validate-bqetl }}
    steps:
      - &checkout-with-history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed-files-routines
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            requirements.txt
            bigquery_etl/routine/**
            .github/workflows/**
            sql/mozfun/**
            sql/moz-fx-data-shared-prod/udf/**
            sql/moz-fx-data-shared-prod/udf_js/**
            bqetl_project.yaml
          base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - id: changed-files-sql
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            requirements.txt
            sql/**
            sql_generators/**
            dags.yaml
            .github/workflows/**
            bigquery_etl/query_scheduling/**
            tests/sql/**
            bqetl_project.yaml
          base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - id: changed-files-bqetl
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            bqetl_project.yaml
            bigquery_etl/**
            sql_generators/**
            tests/**
            script/bqetl
            script/entrypoint
            requirements.txt
            requirements.in
            .github/workflows/**
          base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: Decide which jobs to run
        id: set-flags
        env:
          VALIDATE_ROUTINES: ${{ steps.changed-files-routines.outputs.any_changed }}
          VALIDATE_SQL: ${{ steps.changed-files-sql.outputs.any_changed }}
          VALIDATE_BQETL: ${{ steps.changed-files-bqetl.outputs.any_changed }}
        run: |
          echo "validate-routines=$VALIDATE_ROUTINES" >> $GITHUB_OUTPUT
          echo "validate-sql=$VALIDATE_SQL" >> $GITHUB_OUTPUT
          echo "validate-bqetl=$VALIDATE_BQETL" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: &build-env
      name: dev
      deployment: false
    if: *is-not-fork
    # Exported so downstream jobs request this exact patch version rather
    # than re-resolving PYTHON_VERSION
    outputs:
      python-version: ${{ steps.setup_python.outputs.python-version }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Not the shared *setup-python anchor because the other ones reference needs.build.outputs.python-version
      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - &restore-venv
        name: Restore cached virtualenv
        id: restore-venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: venv-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          path: .venv
      - name: Build
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --no-deps -r requirements.txt
          pip-sync --pip-args=--no-deps
      - name: Save cached virtualenv
        # Only branches pushed to this repo reach here, so every writer to the
        # shared cache is already trusted. The key still namespaces by
        # hashFiles('requirements.txt') so a branch that changes deps lands in
        # its own entry rather than overwriting main's.
        if: steps.restore-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: venv-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          path: .venv

  verify-requirements:
    name: Verify Requirements
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: *build-env
    needs: [build]
    steps:
      - *checkout
      # Request the patch version build resolved to, so the venv cache key matches
      - &setup-python
        name: Set up Python
        id: setup_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.build.outputs.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - *restore-venv
      - name: Verify that requirements.txt contains the right dependencies for this python version
        run: |
          PATH=".venv/bin:$PATH" pip-compile --allow-unsafe --generate-hashes --quiet
          git diff --exit-code -G '^ *[^# ]' -- requirements.txt

  verify-format-yaml:
    name: Verify YAML Format
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-verify-format-yaml.yml
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  verify-format-sql:
    name: Verify SQL Format
    needs: [build, decide-runs]
    if: needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-verify-format-sql.yml
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  flag-sensitive-flows:
    name: Flag sensitive data flows
    needs: [build, decide-runs]
    if: needs.decide-runs.outputs.validate-sql == 'true' || github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # to request @mozilla/dataplatform-wg review
    uses: ./.github/workflows/reusable-flag-sensitive-flows.yml
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  test-bqetl:
    name: Test bqetl
    runs-on: ubuntu-latest
    needs: [build, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-bqetl == 'true' ||
       needs.decide-runs.outputs.validate-sql == 'true' ||
       needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    environment: &job-env
      name: dev
      deployment: false
    steps:
      - *checkout
      - *setup-python
      - *restore-venv
      - &auth-gcp-dryrun
        name: Authenticate to GCP (OIDC)
        id: auth-dryrun
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          id_token_audience: 'https://us-central1-moz-fx-data-shared-prod.cloudfunctions.net/dryrun'
          id_token_include_email: true
      - name: PyTest with linters
        env:
          GOOGLE_GHA_ID_TOKEN: ${{ steps.auth-dryrun.outputs.id_token }}
        run: |
          PATH=".venv/bin:$PATH" pytest --black --flake8 \
            --isort --mypy-ignore-missing-imports --pydocstyle \
            -m "not (routine or sql or integration)" \
            -p no:bigquery_etl.pytest_plugin.routine \
            -p no:bigquery_etl.pytest_plugin.sql \
            -n 8

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-bqetl == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    environment: *job-env
    steps:
      - *checkout
      - *setup-python
      - *restore-venv
      - &auth-gcp-stage
        name: Authenticate to GCP and Generate ID Token
        id: auth-stage
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGE_SERVICE_ACCOUNT_EMAIL }}
      - name: PyTest Integration Test
        env:
          GOOGLE_PROJECT_ID: ${{ steps.auth-stage.outputs.project_id }}
        run: |
          PATH=".venv/bin:$PATH" script/entrypoint -m 'integration' -n 8 \
          -p no:bigquery_etl.pytest_plugin.routine \
          -p no:bigquery_etl.pytest_plugin.sql

  generate-sql:
    name: Generate SQL
    runs-on: ubuntu-latest
    needs: [build, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    environment: *job-env
    outputs:
      generated-sql-commit: ${{ steps.generate.outputs.generated-sql-commit }}
      main-merge-base: ${{ steps.generate.outputs.main-merge-base }}
      generated-sql-changed: ${{ steps.generate.outputs.generated-sql-changed }}
    steps:
      - &checkout-with-creds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - *setup-python
      - *restore-venv
      - *auth-gcp-dryrun
      - name: Generate SQL content
        id: generate
        env:
          TRIGGER_SQL_GENERATION: ${{ github.event.inputs.trigger-sql-generation }}
          GOOGLE_GHA_ID_TOKEN: ${{ steps.auth-dryrun.outputs.id_token }}
          GOOGLE_PROJECT_ID: ${{ steps.auth-dryrun.outputs.project_id }}
        run: |
          # Fetch main branch for merge-base
          git fetch origin main --no-tags
          MAIN_MERGE_BASE=$(git merge-base origin/main HEAD || true)
          echo "merge base with main: $MAIN_MERGE_BASE"
          echo "main-merge-base=$MAIN_MERGE_BASE" >> "$GITHUB_OUTPUT"

          git clone -b generated-sql https://github.com/mozilla/bigquery-etl ~/remote-generated-sql
          cd ~/remote-generated-sql

          # Find the newest tagged main commit at or before the merge base
          GENERATED_SQL_COMMIT=""
          LOOKUP_START=$MAIN_MERGE_BASE
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # On main the merge base is this commit. Start from its parent so a
            # re-run doesn't pick up the tag this run's push-generated-sql
            # already created.
            LOOKUP_START="$GITHUB_SHA^"
          fi
          if [[ -n $MAIN_MERGE_BASE ]]; then
            # get the hash of the most recent commit that matches a c-{hash} tag
            GENERATED_SQL_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-list --first-parent "$LOOKUP_START" \
              | grep -m1 -Fx -f <(git tag -l 'c-*' | sed 's/^c-//') || true)
          fi

          if [[ -n $GENERATED_SQL_COMMIT ]]; then
            echo "Using generated sql from tag c-$GENERATED_SQL_COMMIT"
            git checkout "tags/c-$GENERATED_SQL_COMMIT"
          else
            GENERATED_SQL_COMMIT=$(git describe --tags --abbrev=0)
            GENERATED_SQL_COMMIT=${GENERATED_SQL_COMMIT#c-}
            echo "No tagged ancestor of the merge base; using latest tag c-$GENERATED_SQL_COMMIT"
          fi
          # deploy-changes-to-stage diffs against the same generated sql
          echo "generated-sql-commit=$GENERATED_SQL_COMMIT" >> "$GITHUB_OUTPUT"

          # Check out main at the commit the generated sql was created from instead of the merge
          # base. If a commit between them never had its output pushed (CI failure or still
          # running), the generated sql would be missing its changes.
          cd ~
          git clone -b main https://github.com/mozilla/bigquery-etl ~/remote-bigquery-etl-main
          cd ~/remote-bigquery-etl-main
          git checkout "$GENERATED_SQL_COMMIT"

          cd $GITHUB_WORKSPACE
          export GENERATED_SQL_CHANGED=false

          if [ "$TRIGGER_SQL_GENERATION" = "true" ]; then
            echo "trigger-sql-generation was set to true; run SQL generation"
            GENERATED_SQL_CHANGED=true
          fi

          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "On main branch; generate SQL"
            GENERATED_SQL_CHANGED=true
          fi

          if [[ $(git diff --no-index --name-only --diff-filter=DR ~/remote-bigquery-etl-main/sql sql) ]]; then
            echo "SQL file was removed; re-generate SQL"
            GENERATED_SQL_CHANGED=true
          fi

          if [[ $(diff -qr --no-dereference sql_generators ~/remote-bigquery-etl-main/sql_generators) ]]; then
            echo "SQL generators changed; re-generate SQL"
            GENERATED_SQL_CHANGED=true
          fi

          # Records whether the generators ran (generated-sql-changed=true/false) so later jobs can read it
          echo "generated-sql-changed=$GENERATED_SQL_CHANGED" >> "$GITHUB_OUTPUT"

          mkdir -p /tmp/workspace/generated-sql
          cp bqetl_project.yaml /tmp/workspace/generated-sql/

          if [ "$GENERATED_SQL_CHANGED" = "true" ]; then
            echo "Changes made will affect generated SQL. Run SQL generators."

            cp -r sql/ /tmp/workspace/generated-sql/sql
            PATH=".venv/bin:$PATH" script/bqetl generate all \
              --ignore derived_view_schemas \
              --output-dir /tmp/workspace/generated-sql/sql/ \
              --target-project moz-fx-data-shared-prod
            PATH=".venv/bin:$PATH" script/bqetl format /tmp/workspace/generated-sql/sql/
          else
            echo "Changes made don't affect generated SQL. Use content from generated-sql"

            cp -r ~/remote-generated-sql/sql/ /tmp/workspace/generated-sql/sql
            cp -a sql/. /tmp/workspace/generated-sql/sql

            # Incomplete metadata.yaml can be checked in to override values from generated sql,
            # e.g. workgroup_access. The copy above overwrites the generated-sql metadata.yaml with
            # the partial one which creates unrelated sql diff changes, so use the generated-sql one
            # if the checked-in file hasn't changed since the generated-sql commit.
            # The dataset's dataset_metadata.yaml must also be unchanged, since the generated file
            # already has the old default_table_workgroup_access merged in and metadata update only
            # adds members.
            same_as_base() {
              # true if the file is missing in both or unchanged since the generated-sql commit
              if [ -e "sql/$1" ] || [ -e ~/remote-bigquery-etl-main/sql/"$1" ]; then
                cmp -s "sql/$1" ~/remote-bigquery-etl-main/sql/"$1"
              fi
            }
            # Fail loudly if yq isn't available.
            if ! command -v yq > /dev/null; then
              echo "yq is required to restore generated metadata.yaml files"
              exit 1
            fi
            while IFS= read -r -d '' metadata_file; do
              relative_path=${metadata_file#sql/}
              generated_file=~/remote-generated-sql/sql/$relative_path
              dataset_metadata_file=$(dirname "$(dirname "$relative_path")")/dataset_metadata.yaml
              # grep is only a fast pre-filter to avoid running yq on every file
              if [ -f "$generated_file" ] \
                && grep -q sql_generator "$generated_file" \
                && yq -e '.labels.sql_generator' "$generated_file" > /dev/null 2>&1 \
                && same_as_base "$relative_path" \
                && same_as_base "$dataset_metadata_file"; then
                echo "Restoring generated $relative_path"
                cp "$generated_file" "/tmp/workspace/generated-sql/sql/$relative_path"
              fi
            done < <(find sql -name metadata.yaml -print0)

            # Run only the generators with a templates/unittests/ folder, into a temporary folder, when SQL generation is skipped (no sql_generators/ change,
            # no deleted or renamed SQL file, not a push to main, no manual trigger).
            # Keep only their tests/ output for metadata validation.
            for unittests_dir in sql_generators/*/templates/unittests; do
              PATH=".venv/bin:$PATH" script/bqetl generate "$(basename "$(dirname "$(dirname "$unittests_dir")")")" \
                --output-dir /tmp/generated-tests-temporary/sql/ \
                --target-project moz-fx-data-shared-prod
            done
            cp -r /tmp/generated-tests-temporary/tests /tmp/workspace/generated-sql/tests
          fi

          PATH=".venv/bin:$PATH" script/bqetl query schema render \
            /tmp/workspace/generated-sql/sql/ \
            --sql-dir=/tmp/workspace/generated-sql/sql/ \
            --output-dir=/tmp/workspace/generated-sql/sql/
          PATH=".venv/bin:$PATH" script/bqetl dependency record \
            --skip-existing \
            "/tmp/workspace/generated-sql/sql/"
          PATH=".venv/bin:$PATH" script/bqetl metadata update \
            --sql-dir /tmp/workspace/generated-sql/sql/ \
            /tmp/workspace/generated-sql/sql/
          PATH=".venv/bin:$PATH" script/bqetl monitoring update /tmp/workspace/generated-sql/sql/

          # Moves the generated tests out of generated-sql into their own artifact, generated-unittests,
          # which the validate-metadata and deploy-changes-to-stage jobs download;
          # private CI downloads only generated-sql, so it never receives them
          mkdir -p /tmp/workspace/generated-unittests
          mv /tmp/workspace/generated-sql/tests /tmp/workspace/generated-unittests/tests
      - name: Copy schema cache for reuse in other jobs
        run: |
          mkdir -p /tmp/workspace/schema-cache
          if [ -d /tmp/bigquery_etl_schemas ]; then
            cp -r /tmp/bigquery_etl_schemas /tmp/workspace/schema-cache/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: generated-sql
          path: /tmp/workspace/generated-sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: generated-unittests
          path: /tmp/workspace/generated-unittests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: schema-cache
          path: /tmp/workspace/schema-cache

  trigger-private-ci:
    name: Trigger Private CI
    runs-on: ubuntu-latest
    needs: [generate-sql, decide-runs]
    if: |
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      contents: read
      statuses: write
    outputs:
      pr-number: ${{ steps.context.outputs.pr_number }}
      commit-sha: ${{ steps.context.outputs.commit_sha }}
    environment: *job-env
    steps:
      - name: Determine context
        id: context
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "commit_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "is_main_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main_push=false" >> "$GITHUB_OUTPUT"
          fi

          # Empty for push / merge_group, which have no PR
          echo "pr_number=${EVENT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Trigger private-bigquery-etl CI
        id: dispatch
        env:
          TRIGGER_TOKEN: ${{ secrets.PRIVATE_BQETL_TRIGGER_TOKEN }}
          COMMIT_SHA: ${{ steps.context.outputs.commit_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          IS_MAIN: ${{ steps.context.outputs.is_main_push }}
          IS_MERGE_GROUP: ${{ github.event_name == 'merge_group' }}
          # Private CI builds its diff baseline from the generated sql at this commit and
          # bigquery-etl code at the merge base, so main changes merged after the PR's
          # base don't show up in the diff
          GENERATED_SQL_COMMIT: ${{ needs.generate-sql.outputs.generated-sql-commit }}
          MAIN_MERGE_BASE: ${{ needs.generate-sql.outputs.main-merge-base }}
        run: |
          if [[ -z "$TRIGGER_TOKEN" ]]; then
            # Private CI is a required check on PRs and merge groups, so without
            # a dispatch they'd wait on it forever
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
              echo "::error::No private repo token available, can't dispatch private CI"
              exit 1
            fi
            echo "::warning::No private repo token available, skipping dispatch"
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/dispatches" \
            -d "$(jq -n \
              --arg sha "$COMMIT_SHA" \
              --arg pr "$PR_NUMBER" \
              --arg run_id "$RUN_ID" \
              --arg generated_sql_commit "$GENERATED_SQL_COMMIT" \
              --arg merge_base "$MAIN_MERGE_BASE" \
              --argjson is_main "${IS_MAIN:-false}" \
              --argjson is_merge_group "${IS_MERGE_GROUP:-false}" \
              '{event_type: "bqetl-ci", client_payload: {
                bqetl_commit_sha: $sha, bqetl_pr_number: $pr, bqetl_run_id: $run_id,
                generated_sql_commit: $generated_sql_commit, bqetl_merge_base: $merge_base,
                is_main_push: $is_main, is_merge_group: $is_merge_group}}')")

          if [[ "$HTTP_STATUS" != "204" ]]; then
            echo "::error::Failed to dispatch private CI (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Dispatched bqetl-ci event to private-bigquery-etl"
      - name: Report private CI dispatch failure
        # Without a dispatch nothing reports the required status, so fail it
        # here instead of leaving PRs and merge groups waiting on it
        if: failure() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=error \
            -f context="private-bigquery-etl / Private CI" \
            -f target_url="$RUN_URL" \
            -f description="Failed to dispatch private CI, see Trigger Private CI job"

  skip-private-ci:
    name: Report Private CI Skipped
    runs-on: ubuntu-latest
    needs: [decide-runs, trigger-private-ci]
    # When private CI isn't dispatched nothing else reports its required
    # status, so PRs and merge groups would wait on it forever. That happens
    # when it isn't needed, but also when an upstream job (e.g. Generate SQL)
    # fails or is cancelled and trigger-private-ci gets skipped
    if: |
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.trigger-private-ci.result == 'skipped'
    permissions:
      statuses: write
    steps:
      - name: Report status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DECIDE_RUNS_RESULT: ${{ needs.decide-runs.result }}
          VALIDATE_SQL: ${{ needs.decide-runs.outputs.validate-sql }}
          DEPLOY: ${{ needs.decide-runs.outputs.deploy }}
        run: |
          if [[ "$DECIDE_RUNS_RESULT" != "success" ]]; then
            state=error
            description="Couldn't determine whether private CI is needed"
          elif [[ "$VALIDATE_SQL" == "true" || "$DEPLOY" == "true" ]]; then
            state=error
            description="Private CI not dispatched because an upstream job failed"
          else
            state=success
            description="Not needed: no SQL, DAG or workflow changes"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="private-bigquery-etl / Private CI" \
            -f target_url="$RUN_URL" \
            -f description="$description"

  docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    needs: [build, generate-sql]
    if: &is-main-deploy
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    environment: &deploy-env
      name: dev
      deployment: true
    steps:
      - *checkout
      - *setup-python
      - *restore-venv
      - &download-generated-sql
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: generated-sql
          path: /tmp/workspace/generated-sql
      - &copy-generated-sql
        name: Move generated SQL into place
        run: |
          rm -rf sql/
          cp -r /tmp/workspace/generated-sql/sql sql/
      - name: Generate documentation
        run: |
          PATH=".venv/bin:$PATH" script/bqetl docs generate --output_dir=generated_docs/
      - name: Deploy documentation to GitHub Pages
        run: |
          cd generated_docs/
          git config --global user.name "GitHub Actions docs job"
          git config --global user.email "dataops@mozilla.com"
          PATH="../.venv/bin:$PATH" mkdocs gh-deploy \
            --remote-name https://x-access-token:${{ github.token }}@github.com/mozilla/bigquery-etl \
            --force \
            -m "[ci skip] Deployed {sha} with MkDocs version: {version}"

  deploy-changes-to-stage:
    name: Deploy Changes to Stage
    runs-on: ubuntu-latest
    needs: [build, generate-sql, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    environment: *job-env
    steps:
      - *checkout
      - *setup-python
      - *restore-venv
      - *download-generated-sql
      - &download-schema-cache
        name: Download schema cache if available
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: schema-cache
          path: /tmp/workspace/schema-cache
      - name: Restore schema cache from generate-sql job
        run: |
          if [ -d /tmp/workspace/schema-cache/bigquery_etl_schemas ]; then
            cp -r /tmp/workspace/schema-cache/bigquery_etl_schemas /tmp/
            echo "Restored schema cache from generate-sql job"
          fi
      - name: Move generated-sql into place
        run: |
          rm -rf sql/
          cp -r /tmp/workspace/generated-sql/sql sql
      # Copies the generated tests into tests/sql/ only when the changed flag is true, so test-sql runs them
      - if: needs.generate-sql.outputs.generated-sql-changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: generated-unittests
          path: /tmp/workspace/generated-unittests
      - name: Move generated unit tests into place
        if: needs.generate-sql.outputs.generated-sql-changed == 'true'
        run: cp -r /tmp/workspace/generated-unittests/tests/sql/. tests/sql/
      - name: Pull in generated-sql branch from remote
        env:
          GENERATED_SQL_COMMIT: ${{ needs.generate-sql.outputs.generated-sql-commit }}
        run: |
          git clone --single-branch --branch generated-sql \
            https://github.com/mozilla/bigquery-etl \
            generated-sql
          # Diff against the generated sql that generate-sql started from, not the
          # branch head. On main, push-generated-sql runs alongside this job and
          # can push this commit's output before the clone above, which leaves
          # nothing to deploy. On PRs the head can include main changes the PR
          # doesn't have, which would deploy the PR's older copies of them.
          if [[ -n "$GENERATED_SQL_COMMIT" ]]; then
            echo "Diffing against generated-sql at c-$GENERATED_SQL_COMMIT"
            git -C generated-sql checkout -q "tags/c-$GENERATED_SQL_COMMIT"
          else
            echo "::warning::generate-sql didn't report a baseline, diffing against the generated-sql head"
          fi
          # Normalize file permissions to avoid false positives in diffs
          find generated-sql/sql -type f -exec chmod 644 {} \; 2>/dev/null || true
          find sql -type f -exec chmod 644 {} \; 2>/dev/null || true
      - *auth-gcp-dryrun
      - *auth-gcp-stage
      - name: Write bqetl_targets.yaml
        run: |
          cat > bqetl_targets.yaml <<'EOF'
          stage:
            project_id: moz-fx-data-integration-tests
            dataset: "{{ git.branch }}_{{ git.commit }}{% if run_id %}_{{ run_id }}{% endif %}"
            artifact_prefix: "{{ artifact.project_id }}__{{ artifact.dataset_id }}__"
            grant_dryrun_access: true
            expire_after_hours: 12
            rewrite_tests: true
          EOF
      - name: Deploy changes to stage
        timeout-minutes: 120
        env:
          SKIP_STAGE_DEPLOYS: ${{ github.event.inputs.skip-stage-deploys }}
          GOOGLE_GHA_ID_TOKEN: ${{ steps.auth-dryrun.outputs.id_token }}
        run: |
          if [ "$SKIP_STAGE_DEPLOYS" = "true" ]; then
            echo "SKIP_STAGE_DEPLOYS=true, skipping stage deploy"
            exit 0
          fi
          PATHS="$(git diff --no-index --name-only --diff-filter=d generated-sql/sql sql)" || true
          if [ -z "$PATHS" ]; then
            echo "No changed SQL paths, skipping stage deploy"
            exit 0
          fi
          echo $PATHS
          git diff --no-index --diff-filter=d generated-sql/sql sql | head -1000 || true
          PATH=".venv/bin:$PATH" script/bqetl \
            --target stage \
            --run-id "${GITHUB_RUN_ID}" \
            deploy --tables --views --isolated \
            $PATHS
      - name: Copy generated SQL to temporary stage directory
        run: |
          mkdir -p /tmp/workspace/staged-generated-sql
          cp -r sql/ /tmp/workspace/staged-generated-sql/sql
          cp -r tests/ /tmp/workspace/staged-generated-sql/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: staged-generated-sql
          path: /tmp/workspace/staged-generated-sql

  dry-run-sql:
    name: Dry Run SQL
    needs: [build, deploy-changes-to-stage, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-dry-run-sql.yml
    secrets:
      GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL }}
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  test-sql:
    name: Test SQL
    needs: [build, deploy-changes-to-stage, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-test-sql.yml
    secrets:
      GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL }}
      GCP_STAGE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_STAGE_SERVICE_ACCOUNT_EMAIL }}
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  test-routines:
    name: Test Routines
    runs-on: ubuntu-latest
    needs: [build, deploy-changes-to-stage, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    environment: *job-env
    steps:
      - *checkout
      - *setup-python
      - *restore-venv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: staged-generated-sql
          path: /tmp/workspace/staged-generated-sql
      - name: Move sql deployed on stage into place
        run: |
          rm -rf sql/
          cp -r /tmp/workspace/staged-generated-sql/sql sql
          rm -rf tests/
          cp -r /tmp/workspace/staged-generated-sql/tests tests
      - *auth-gcp-stage
      - name: Run routine tests
        env:
          # unique id to use as dataset suffix
          CI_RUN_ID: ${{ github.run_id }}_${{ github.run_number }}
          GOOGLE_PROJECT_ID: ${{ steps.auth-stage.outputs.project_id }}
        run: |
          PATH=".venv/bin:$PATH" script/entrypoint -m routine -n 8
      - name: Validate doc examples
        env:
          GOOGLE_PROJECT_ID: ${{ steps.auth-stage.outputs.project_id }}
        run: |
          PATH=".venv/bin:$PATH" script/bqetl routine validate --docs-only

  validate-views:
    name: Validate Views
    needs: [build, deploy-changes-to-stage, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-validate-views.yml
    secrets:
      GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL }}
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  validate-metadata:
    name: Validate Metadata
    needs: [build, generate-sql]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate-metadata.yml
    with:
      python-version: ${{ needs.build.outputs.python-version }}
      generated-unittests-artifact: generated-unittests

  validate-monitoring:
    name: Validate Monitoring
    needs: [build, generate-sql]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate-monitoring.yml
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  validate-backfills:
    name: Validate Backfills
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: *build-env
    needs: [build, generate-sql, decide-runs]
    if: needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.deploy == 'true'
    steps:
      - *checkout
      - *setup-python
      - *restore-venv
      - *download-generated-sql
      - *copy-generated-sql
      - *auth-gcp-dryrun
      - name: Verify that backfill.yaml files are valid
        env:
          GOOGLE_GHA_ID_TOKEN: ${{ steps.auth-dryrun.outputs.id_token }}
        run: |
          PATH=".venv/bin:$PATH" script/bqetl backfill validate --dry-run-custom-query

  push-generated-sql:
    name: Push Generated SQL
    runs-on: ubuntu-latest
    needs: [generate-sql]
    if: *is-main-deploy
    environment: *deploy-env
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: generated-sql
          path: /tmp/workspace/generated-sql
      - name: Setup SSH key for generated-sql
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY_GENERATED_SQL }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Push to generated-sql branch
        run: |
          git config --global user.name "GitHub Actions generate-sql job"
          git config --global user.email "dataops+generated-sql@mozilla.com"
          git clone --single-branch --branch generated-sql \
            git@github.com:mozilla/bigquery-etl.git \
            generated-sql
          cd generated-sql/
          rm -rf sql/
          cp -r /tmp/workspace/generated-sql/sql sql
          git add .
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Auto-push due to change on main branch [ci skip]" \
              -m "Created from $GITHUB_SHA"
            if git rev-parse "c-$GITHUB_SHA" >/dev/null 2>&1; then
              echo "Tag c-$GITHUB_SHA already exists, skipping"
            else
              git tag "c-$GITHUB_SHA"
              git push origin "c-$GITHUB_SHA"
            fi
            git push
          fi

  reset-stage-env:
    name: Reset Stage Environment
    needs: [build, test-sql, validate-views, validate-metadata, dry-run-sql, test-routines, decide-runs]
    if: |
      (needs.decide-runs.outputs.validate-sql == 'true' || needs.decide-runs.outputs.validate-routines == 'true' || needs.decide-runs.outputs.deploy == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-reset-stage-env.yml
    secrets:
      GCP_STAGE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_STAGE_SERVICE_ACCOUNT_EMAIL }}
    with:
      python-version: ${{ needs.build.outputs.python-version }}

  deploy-to-pypi:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mozilla-bigquery-etl
      deployment: true
    steps:
      - *checkout-with-history
      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor $GITHUB_SHA origin/main; then
            echo "Error: Tag is not on main branch. Only tags on main can be deployed to PyPI."
            exit 1
          fi
          echo "Verified: Tag is on main branch"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deployment tools
        run: pip install --upgrade build setuptools wheel twine
      - name: Build distribution files
        run: python -m build --sdist --wheel
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
