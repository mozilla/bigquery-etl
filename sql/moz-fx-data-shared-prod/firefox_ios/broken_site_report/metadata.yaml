friendly_name: App-specific view for Glean ping "broken-site-report"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox for iOS"
  (org_mozilla_ios_firefox.broken_site_report, org_mozilla_ios_firefoxbeta.broken_site_report, org_mozilla_ios_fennec.broken_site_report).

  It is used by Looker.
owners: []
labels:
  sql_generator: glean_usage
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  view.sql:
  - moz-fx-data-shared-prod.org_mozilla_ios_fennec.broken_site_report
  - moz-fx-data-shared-prod.org_mozilla_ios_firefox.broken_site_report
  - moz-fx-data-shared-prod.org_mozilla_ios_firefoxbeta.broken_site_report
