friendly_name: New Profile Churn Clients
description: |-
  Union view combining new_profile_churn_clients_v2 (complete cohorts, each written
  30 days after its cohort date) and recent_new_profile_churn_clients_v2 (recent cohorts,
  whose day and churn flags are NULL until the cohort has the days of data they need).
  The recent table supplies the most recent 30 cohorts, and the complete table every
  older cohort. Queries must filter on cohort_date.

  Jira: https://mozilla-hub.atlassian.net/browse/DENG-10676
owners:
- data-product-kpis-wg@mozilla.com
