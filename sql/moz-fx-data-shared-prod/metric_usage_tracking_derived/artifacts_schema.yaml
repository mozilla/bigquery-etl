fields:
- name: artifact_id
  type: STRING
  mode: NULLABLE
  description: project.dataset.table for bigquery-etl tables and views; otherwise
    prefixed by source, as in redash:query:<id>, looker:dashboard:<id>, looker:explore:<model>.<explore>,
    glam:<product>:<probe>, metric-hub:<platform>.<metric>, opmon:<slug>, jetstream:<slug>
    or adhoc:<account>
- name: kind
  type: STRING
  mode: NULLABLE
  description: bqetl_table, bqetl_view, glean_ping_view, redash_query, redash_dashboard,
    looker_dashboard, looker_look, looker_explore, glam_metric, metric_hub_metric,
    opmon_project, jetstream_experiment, person or service_account
- name: name
  type: STRING
  mode: NULLABLE
  description: Title, dataset.table, slug or account, by kind
- name: url
  type: STRING
  mode: NULLABLE
  description: 'Where to see it: the code, the dashboard or the experiment'
- name: owners
  type: STRING
  mode: REPEATED
  description: Owner emails, or the account itself for ad hoc
- name: friendly_name
  type: STRING
  mode: NULLABLE
  description: bigquery-etl's friendly_name, metric-hub's, or an experiment's app
    and dates
- name: generated_by
  type: STRING
  mode: NULLABLE
  description: For a bigquery-etl artifact, the bqetl generator that wrote it
- name: note
  type: STRING
  mode: NULLABLE
  description: 'How its SQL was read (ok, partial: N scopes unread, resolve failed,
    or the fallback used), or a short note on the artifact'
- name: n_metrics_named
  type: INTEGER
  mode: NULLABLE
  description: Metrics it names
- name: n_metrics_total
  type: INTEGER
  mode: NULLABLE
  description: Metrics it names or carries in bulk
- name: is_draft
  type: BOOLEAN
  mode: NULLABLE
  description: For Redash, the query or dashboard is a draft
- name: is_scheduled
  type: BOOLEAN
  mode: NULLABLE
  description: 'Runs on a schedule: a Redash refresh, a Looker schedule, or an Airflow
    write to a bigquery-etl table'
- name: last_run
  type: DATE
  mode: NULLABLE
  description: Last day it ran or was written
- name: updated_at
  type: DATE
  mode: NULLABLE
  description: For a Redash query, the last day it was edited
- name: last_used
  type: DATE
  mode: NULLABLE
  description: 'Last day in the longest window somebody viewed or ran it: a Redash
    view, a Looker run'
- name: views_30d
  type: INTEGER
  mode: NULLABLE
  description: Views, runs or jobs in the 30 days ending on the window end
- name: users_30d
  type: INTEGER
  mode: NULLABLE
  description: Distinct people or accounts behind views_30d
- name: views_90d
  type: INTEGER
  mode: NULLABLE
  description: Views, runs or jobs in the 90 days ending on the window end
- name: users_90d
  type: INTEGER
  mode: NULLABLE
  description: Distinct people or accounts behind views_90d
- name: views_180d
  type: INTEGER
  mode: NULLABLE
  description: Views, runs or jobs in the 180 days ending on the window end
- name: users_180d
  type: INTEGER
  mode: NULLABLE
  description: Distinct people or accounts behind views_180d
- name: views_365d
  type: INTEGER
  mode: NULLABLE
  description: Views, runs or jobs in the 365 days ending on the window end
- name: users_365d
  type: INTEGER
  mode: NULLABLE
  description: Distinct people or accounts behind views_365d
- name: parent_ids
  type: STRING
  mode: REPEATED
  description: For a Redash query, the dashboards showing it
- name: child_ids
  type: STRING
  mode: REPEATED
  description: For a Redash dashboard, its queries on BigQuery
- name: star_tables
  type: STRING
  mode: REPEATED
  description: Tables it reads with SELECT *
