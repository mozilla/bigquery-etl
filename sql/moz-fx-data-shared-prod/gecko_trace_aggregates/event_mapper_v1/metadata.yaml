---
friendly_name: Gecko Trace Event Mapper
description: |-
  Daily job that points new gecko trace signatures at existing stable ids.

  For each application it finds the events whose source lines have no cached
  blame yet, resolves their builds to a Searchfox tree and git revision through
  buildhub2, fetches the Searchfox blame of those lines, and caches both in
  gecko_trace_source_revisions_v1 and gecko_trace_blame_lines_v1. It then gives
  events that share the blame triple (introducing revision, path, line) and the
  result the stable_event_id of the oldest such event, recomputes trace keys
  and gives traces with the same key the stable_trace_id of the oldest trace.

  It runs after all dimension and fact tables of the day and before the weekly
  Bugzilla reporter.

owners:
  - jjalkanen@mozilla.com

labels:
  schedule: daily

scheduling:
  dag_name: bqetl_gecko_trace
  task_group: mapper
  arguments:
    - --date={{ds}}
  referenced_tables:
    - ['moz-fx-data-shared-prod', 'firefox_desktop_derived', 'gecko_trace_events_v1']
    - ['moz-fx-data-shared-prod', 'firefox_desktop_derived', 'gecko_trace_traces_v1']
    - ['moz-fx-data-shared-prod', 'firefox_desktop_derived', 'gecko_trace_trace_events_v1']
    - ['moz-fx-data-shared-prod', 'firefox_desktop_derived', 'gecko_trace_platform_counts_v1']
    - ['moz-fx-data-shared-prod', 'firefox_desktop_derived', 'gecko_trace_source_revisions_v1']
    - ['moz-fx-data-shared-prod', 'firefox_desktop_derived', 'gecko_trace_blame_lines_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_fenix_nightly_derived', 'gecko_trace_events_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_fenix_nightly_derived', 'gecko_trace_traces_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_fenix_nightly_derived', 'gecko_trace_trace_events_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_fenix_nightly_derived', 'gecko_trace_platform_counts_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_fenix_nightly_derived', 'gecko_trace_source_revisions_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_fenix_nightly_derived', 'gecko_trace_blame_lines_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_firefox_beta_derived', 'gecko_trace_events_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_firefox_beta_derived', 'gecko_trace_traces_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_firefox_beta_derived', 'gecko_trace_trace_events_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_firefox_beta_derived', 'gecko_trace_platform_counts_v1']
    - ['moz-fx-data-shared-prod', 'org_mozilla_firefox_beta_derived', 'gecko_trace_source_revisions_v1']
