friendly_name: "KB Quality Metrics \u2014 Article (Daily)"
description: "Daily article-level knowledge base quality metrics for SUMO, combining\
  \ content\nfreshness and helpfulness vote signals.\n\nGrain: Day x Article (document_id)\n\
  \nCovers 2024-01-01 through yesterday. An article's first row is the later of\n\
  2024-01-01 and the date of its first approved revision.\n\nFor each in-scope en-US\
  \ article and each day in that range:\n- days_since_last_revision / fresh_ind: freshness\
  \ vs. a 365-day window\n- helpful_votes / total_votes: votes cast that day\n- running_helpful_votes\
  \ / running_total_votes: all-time cumulative votes\n  (in-window votes on top of\
  \ a pre-2024 seed)\n\nArticle scope (matching the KB quality dashboard query):\n\
  - parent_id IS NULL (original, non-translated), is_archived = FALSE\n- category\
  \ < 30, html NOT LIKE '%REDIRECT%'\n- products NOT LIKE '%thunderbird%', locale\
  \ = 'en-US'\n- product (via mozfun.customer_experience.normalize_product) != 'Other'\n\
  \nRecomputed in full each run (no date partition parameter).\n\nThe 2024-01-01 start\
  \ is a deliberate floor, not a data limit. Freshness could\nextend back to 2009\
  \ and votes (metrics_kb_votes_details) to 2023-01-01, but\nthe window is capped\
  \ to keep the table small enough that it needs no\npartitioning. Pre-2024 votes\
  \ are not lost \u2014 they are folded into the running\ntotals via the seed.\n\n\
  Caveat \u2014 survivorship bias: the article population is a *current* snapshot\n\
  (is_archived = FALSE, today's category/products/product mapping). Earlier\nevent_dates\
  \ therefore only include articles that still exist and are\nunarchived today, so\
  \ article counts trend upward over time partly for this\nreason. fresh_ind itself\
  \ is a valid point-in-time measure (computed against\neach event_date, not today);\
  \ only the population is biased.\n\nUsed by:\n- kb_quality_metrics_daily_v1 (day-level\
  \ aggregation + moving averages)\n"
owners:
