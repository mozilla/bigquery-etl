fields:
- name: customer_id
  type: STRING
  mode: NULLABLE
  description: The hashed unique identifier for the customer in the billing system.
    Used to associate subscriptions and transactions with a specific customer account.
- name: subscription_id
  type: STRING
  mode: NULLABLE
  description: Identifier for this subscription plan period. This is the Stripe subscription
    ID, with a `-N` suffix added for the Nth plan-change record of the same Stripe
    subscription. The unsuffixed ID is in original_subscription_id for suffixed records.
- name: original_subscription_id
  type: STRING
  mode: NULLABLE
  description: The original Stripe subscription ID before any plan changes created
    a new sequence record. Populated only when the current row represents a continuation
    (plan change) of a prior subscription; null for the initial subscription record.
- name: plan_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the subscription plan as defined in the provider's
    billing system, such as a Stripe price ID or an Apple/Google in-app product identifier.
- name: status
  type: STRING
  mode: NULLABLE
  description: The current lifecycle status of the subscription, such as 'active',
    'expired', 'revoked', or 'in billing retry period'.
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
- name: subscription_start_date
  type: TIMESTAMP
  mode: NULLABLE
  description: When the current subscription plan period started. This is the plan
    start time for plan-change records, otherwise the Stripe subscription start date.
    Null while a trial is ongoing or if the subscription ended during its trial.
- name: original_subscription_start_date
  type: TIMESTAMP
  mode: NULLABLE
  description: Start date of the underlying Stripe subscription (the same for all
    plan-change records). Null while a trial is ongoing or if the subscription ended
    during its trial.
- name: subscription_start_reason
  type: STRING
  mode: NULLABLE
  description: The reason this subscription period started. Values include 'New' (first-time
    subscriber), 'Resurrected' (returning subscriber), 'Plan Change' (started due
    to a plan switch), and 'Converted Trial' (converted from a free trial). Null when
    the subscription start date is null.
- name: trial_start
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp at which the subscription's free trial period began.
    Null for subscriptions that do not have a trial period.
- name: trial_end
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp at which the subscription's free trial period ended or
    is scheduled to end. Null for subscriptions that do not have a trial period.
- name: canceled_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp at which the subscription was actually cancelled. Null if
    the subscription has not been cancelled.
- name: canceled_for_customer_at
  type: STRING
  mode: NULLABLE
  description: Timestamp at which the subscription was cancelled from the customer's
    perspective, which may differ from the system-level cancellation time. Null if
    the subscription has not been cancelled for the customer.
- name: cancel_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp at which the subscription is scheduled to be cancelled in
    the future. Null if no future cancellation has been scheduled.
- name: cancel_at_period_end
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the subscription is set to cancel at the end of the
    current billing period. True means cancellation is pending at period end; false
    means no such cancellation is scheduled.
- name: ended_at
  type: TIMESTAMP
  mode: NULLABLE
  description: When the current subscription plan period ended. This is the plan end
    time for plan-change records, otherwise the Stripe subscription end time if it
    is before the current date. Null for active subscriptions, including those with
    a scheduled future end.
- name: ended_reason
  type: STRING
  mode: NULLABLE
  description: The reason the subscription ended. Values include 'Plan Change' (when
    a plan change caused the record to close), 'Cancelled by Customer' (when the customer
    explicitly cancelled or cancel-at-period-end was set), and 'Payment Failed' (for
    involuntary churn). Null for active subscriptions.
- name: fxa_uid
  type: STRING
  mode: NULLABLE
  description: The hashed Firefox Accounts user identifier (UID) uniquely identifying
    a Mozilla account holder. Used to link subscription and event records to a specific
    FxA user.
- name: country
  type: STRING
  mode: NULLABLE
  description: Two-letter ISO country code associated with the subscription or customer
    record, typically derived from billing or geolocation data. Null if the country
    could not be determined.
- name: country_name
  type: STRING
  mode: NULLABLE
  description: The standardized full country name corresponding to the subscriber's
    billing country code, derived from the static third-party country name lookup
    table.
- name: provider
  type: STRING
  mode: NULLABLE
  description: The subscription or payment provider managing the subscription, such
    as 'Stripe', 'Paypal', 'Google Play', or 'Apple Store'.
- name: plan_amount
  type: INTEGER
  mode: NULLABLE
  description: The price of the subscription plan in the smallest currency unit (e.g.,
    cents for USD), as defined in the provider's billing system. Use plan_currency
    to interpret the unit.
- name: plan_currency
  type: STRING
  mode: NULLABLE
  description: The ISO 4217 lowercase currency code for the subscription plan's pricing
    (e.g., 'usd', 'eur', 'gbp').
- name: plan_interval
  type: STRING
  mode: NULLABLE
  description: The billing interval unit for the subscription plan, either 'month'
    for monthly billing or 'year' for annual billing.
- name: plan_interval_count
  type: INTEGER
  mode: NULLABLE
  description: The number of interval units that make up one billing cycle for the
    subscription plan. For example, a value of 1 with a monthly interval means a standard
    monthly plan, while 6 with a monthly interval means a semi-annual plan.
- name: plan_interval_timezone
  type: STRING
  mode: NULLABLE
  description: The timezone used to determine billing interval boundaries for the
    subscription plan, expressed as a timezone name (e.g., 'America/Los_Angeles').
- name: product_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the Mozilla subscription product in the provider's
    billing system, such as a Stripe product ID or an Apple/Google app bundle identifier.
- name: product_name
  type: STRING
  mode: NULLABLE
  description: The display name of the Mozilla subscription product, such as 'Mozilla
    VPN', 'Relay Premium', or 'Mozilla VPN & Firefox Relay'.
- name: pricing_plan
  type: STRING
  mode: NULLABLE
  description: A human-readable string identifying the pricing plan, formed by concatenating
    the billing interval count, interval unit, currency, and price amount (e.g., '1-year-usd-11.88').
- name: billing_grace_period
  type: INTERVAL
  mode: NULLABLE
  description: The grace period interval applied after a failed payment before the
    subscription is considered lapsed. Set to 7 days for both Stripe and PayPal (as
    PayPal is billed through Stripe).
- name: has_refunds
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the subscription has had any refunds processed, regardless
    of reason. True when at least one refund has been issued; false otherwise. Null
    when refund data is unavailable.
- name: has_fraudulent_charges
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the subscription has been associated with any fraudulent
    charges. True when at least one fraudulent charge has been detected; false otherwise.
    Null when fraud assessment data is unavailable.
- name: has_fraudulent_charge_refunds
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the subscription has had any refunds issued specifically
    due to fraudulent charges. True when at least one fraudulent charge refund has
    been processed; false otherwise.
- name: promotion_codes
  type: STRING
  mode: REPEATED
  description: An array of promotion codes that have been applied to the subscription,
    capturing all codes used across the subscription's lifetime.
- name: promotion_discounts_amount
  type: INTEGER
  mode: NULLABLE
  description: The total monetary discount amount applied to the subscription through
    promotions, expressed in the smallest currency unit (e.g., cents). Null when no
    promotional discount is present.
- name: customer_start_date
  type: TIMESTAMP
  mode: NULLABLE
  description: The earliest subscription start date across all subscriptions for this
    customer, representing when the customer first became a paying subscriber.
- name: end_date
  type: TIMESTAMP
  mode: NULLABLE
  description: The effective end date of the subscription; the `ended_at` timestamp
    if the subscription has ended, otherwise the current date for active subscriptions.
- name: months_retained
  type: INTEGER
  mode: NULLABLE
  description: The number of complete billing months the subscriber was retained for
    this subscription, calculated from `subscription_start_date` to `end_date` using
    the billing grace period.
- name: original_subscription_months_retained
  type: INTEGER
  mode: NULLABLE
  description: The number of complete billing months retained since the original subscription
    start date (or the current subscription start if no original exists), calculated
    to `end_date` using the billing grace period. Spans across plan changes.
- name: current_months_since_subscription_start
  type: INTEGER
  mode: NULLABLE
  description: The number of complete billing months elapsed from this subscription's
    start date to the current date, accounting for the billing grace period.
- name: current_months_since_original_subscription_start
  type: INTEGER
  mode: NULLABLE
  description: The number of complete billing months elapsed from the original subscription
    start date (or current subscription start if no original exists) to the current
    date, accounting for the billing grace period.
