      - name: value
        type: INTEGER
      description: 'Breakdown by variation rule of the cache hits won via No-Vary-Search
        (the ''matched'' outcome of no_vary_search_match). The sum across labels equals
        no_vary_search_match[''matched''].

        '
    - name: network_no_vary_search_match
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Outcome of a No-Vary-Search secondary cache lookup, recorded only
        when the secondary index had at least one candidate for the request''s base
        path. ''matched'' means an equivalent cached entry was found and used as a
        cache hit that exact-URL matching would have missed; ''not_matched'' means
        candidates existed but none were equivalent.

        '
    - name: network_no_vary_search_rule_type
