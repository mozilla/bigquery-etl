friendly_name: Profile / Client Attribution - {{ friendly_name }}
description: |-
  Profile attribution ({{ friendly_name }})

  Table grain: client_id, normalized_channel
  Table population: all clients

  Each client has one row, on its first seen date (submission_date = first_seen_date).
  When joining to other client-level tables, join on client_id, normalized_channel
  and attribution_clients.submission_date = <other table>.first_seen_date.
  Joining on the other table's submission_date drops every returning client.

  Notes:
  - 2025-05-14: `normalized_channel` field added (backfilled up until 2023-04-08, prior to this the value will always be `null`)
  {%- if app_name == 'fenix' %}
  - 2026-08-18: adjust_attribution ping added as the source of adjust attribution info.
  - 2026-04-07: first-session ping no longer contains play store attribution, this now comes from play-store-attribution ping.{%- endif %}

owners:
  - mozilla/kpi_table_reviewers
  - kik@mozilla.com
labels:
  sql_generator: mobile_kpi_support_metrics
  schedule: daily
  incremental: true
  table_type: client_level
scheduling:
  dag_name: bqetl_mobile_kpi_metrics
  depends_on_past: false
  task_group: {{ app_name }}
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
monitoring:
  enabled: {% if enable_monitoring %}true{% else %}false{% endif %}
  collection: {{ bigeye_collection }}
