fields:
- name: submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the ping is received on the server side.
- name: sample_id
  type: INTEGER
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: implementation
  type: STRING
  mode: NULLABLE
  description: Which Remote Settings client emitted the event; "gecko" for the JavaScript
    implementation in Gecko, "rust" for the Application-Services implementation.
- name: platform
  type: STRING
  mode: NULLABLE
  description: Platform the event was reported from; one of "desktop", "android",
    or "ios".
- name: normalized_app_id
  type: STRING
  mode: NULLABLE
  description: The BigQuery dataset family of the app that sent the ping (e.g. "firefox_desktop",
    "org_mozilla_firefox_beta", "org_mozilla_ios_fennec"). Distinguishes the individual
    apps behind a single platform and channel, since several Fenix datasets share
    the "nightly" channel.
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: The normalized name of the operating system running at the client.
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
  description: The operating system version normalized to a consistent format at ingestion
    (e.g. "10.0" for Windows, "16" for Android, "26.3.1" for iOS, "25.3.0" for macOS,
    "6.8" for Linux). Windows 10 and Windows 11 both show "10.0". Use `windows_build_number
    >= 22000` to identify Windows 11.
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation. Unknown or NULL values are normally stored as '??'.
- name: extra_status
  type: STRING
  mode: NULLABLE
  description: Outcome of the synchronization attempt (e.g. "success", "up_to_date",
    "sign_error", "network_error"). Reported in the event's "value" extra key rather
    than "status".
- name: extra_trigger
  type: STRING
  mode: NULLABLE
  description: What initiated the synchronization (e.g. "timer", "manual", "broadcast",
    "startup").
- name: extra_source
  type: STRING
  mode: NULLABLE
  description: Remote Settings source the event relates to, usually "settings-sync"
    or a "<bucket>/<collection>" pair.
- name: extra_errorname
  type: STRING
  mode: NULLABLE
  description: Name of the error class when the synchronization failed, NULL otherwise.
- name: extra_timestamp
  type: STRING
  mode: NULLABLE
  description: Collection timestamp reported by the client, as a string. This is the
    Remote Settings collection version, not a wall-clock time.
- name: extra_age
  type: FLOAT64
  mode: NULLABLE
  description: Age in seconds of the local data at the time of the event, i.e. how
    stale the client's copy of the collection was.
- name: extra_duration
  type: INTEGER
  mode: NULLABLE
  description: Duration of the synchronization in milliseconds.
