friendly_name: Deepnote Project Integrations Daily
description: |-
  Integrations attached to Deepnote projects, one row per snapshot date, project
  and integration.
owners:
- ascholtz@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: aggregate
  dag: bqetl_deepnote
  owner1: ascholtz
scheduling:
  dag_name: bqetl_deepnote
  partition_parameter: snapshot_date
bigquery:
  time_partitioning:
    type: day
    field: snapshot_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - integration_type
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
- role: roles/bigquery.dataEditor
  members:
  - workgroup:dataplatform/developers
references:
  query.sql:
  - moz-fx-data-shared-prod.deepnote_derived.workspace_snapshot_v1
