fields:
- name: event_id
  type: STRING
  mode: NULLABLE
  description: Unique event ID (typically a concatenation of `document_id` and `document_event_number`).
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: A JSON string containing any payload properties not present in the
    schema
- name: client_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: The build identifier generated by the CI system (e.g. "1234/A").
      For language bindings that provide automatic detection for this value, (e.g.
      Android/Kotlin), in the unlikely event that the build identifier can not be
      retrieved from the OS, it is set to "inaccessible". For other language bindings,
      if the value was not provided through configuration, this metric gets set to
      `Unknown`.
  - name: app_channel
    type: STRING
    mode: NULLABLE
    description: The channel the application is being distributed on.
  - name: app_display_version
    type: STRING
    mode: NULLABLE
    description: The user visible version string (e.g. "1.0.3").  In the unlikely
      event that the display version can not be retrieved, it is set to "inaccessible".
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: The architecture of the device, (e.g. "arm", "x86").
  - name: attribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: campaign
      type: STRING
      mode: NULLABLE
      description: The attribution campaign (e.g. 'mozilla-org').
    - name: content
      type: STRING
      mode: NULLABLE
      description: The attribution content (e.g. 'firefoxview').
    - name: medium
      type: STRING
      mode: NULLABLE
      description: The attribution medium (e.g. 'organic' for a search engine).
    - name: source
      type: STRING
      mode: NULLABLE
      description: The attribution source (e.g. 'google-play').
    - name: term
      type: STRING
      mode: NULLABLE
      description: The attribution term (e.g. 'browser with developer tools for android').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: device_manufacturer
    type: STRING
    mode: NULLABLE
    description: The manufacturer of the device the application is running on. Not
      set if the device manufacturer can't be determined (e.g. on Desktop).
  - name: device_model
    type: STRING
    mode: NULLABLE
    description: The model of the device the application is running on. On Android,
      this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL". Not
      set if the device model can't be determined (e.g. on Desktop).
  - name: distribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
      description: The distribution name (e.g. 'MozillaOnline').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: first_run_date
    type: STRING
    mode: NULLABLE
    description: The date of the first run of the application.
  - name: locale
    type: STRING
    mode: NULLABLE
    description: The locale of the application during initialization (e.g. "es-ES").
      If the locale can't be determined on the system, the value is ["und"](https://unicode.org/reports/tr35/#Unknown_or_Invalid_Identifiers),
      to indicate "undetermined".
  - name: os
    type: STRING
    mode: NULLABLE
    description: 'The name of the operating system. Possible values: Android, iOS,
      Linux, Darwin, Windows, FreeBSD, NetBSD, OpenBSD, Solaris, unknown'
  - name: os_version
    type: STRING
    mode: NULLABLE
    description: The user-visible version of the operating system (e.g. "1.2.3").
      If the version detection fails, this metric gets set to `Unknown`.
  - name: telemetry_sdk_build
    type: STRING
    mode: NULLABLE
    description: The version of the Glean SDK
  - name: build_date
    type: STRING
    mode: NULLABLE
    description: The date & time the application was built
  - name: session_id
    type: STRING
    mode: NULLABLE
    description: An optional UUID uniquely identifying the client's current session.
  - name: session_count
    type: INTEGER
    mode: NULLABLE
    description: An optional running counter of the number of sessions for a client.
  - name: windows_build_number
    type: INTEGER
    mode: NULLABLE
    description: The optional Windows build number, reported by Windows (e.g. 22000)
      and not set for other platforms
- name: document_id
  type: STRING
  mode: NULLABLE
  description: The document ID specified in the URI when the client sent this message
- name: metadata
  type: RECORD
  mode: NULLABLE
  fields:
  - name: geo
    type: RECORD
    mode: NULLABLE
    fields:
    - name: city
      type: STRING
      mode: NULLABLE
    - name: country
      type: STRING
      mode: NULLABLE
      description: An ISO 3166-1 alpha-2 country code
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo database version used for this lookup
    - name: subdivision1
      type: STRING
      mode: NULLABLE
      description: First major country subdivision, typically a state, province, or
        county
    - name: subdivision2
      type: STRING
      mode: NULLABLE
      description: Second major country subdivision; not applicable for most countries
    description: Results of a geographic lookup based on the client's IP address
  - name: header
    type: RECORD
    mode: NULLABLE
    fields:
    - name: date
      type: STRING
      mode: NULLABLE
      description: Date HTTP header
    - name: dnt
      type: STRING
      mode: NULLABLE
      description: DNT (Do Not Track) HTTP header
    - name: x_debug_id
      type: STRING
      mode: NULLABLE
      description: X-Debug-Id HTTP header
    - name: x_foxsec_ip_reputation
      type: STRING
      mode: NULLABLE
      description: X-Foxsec-IP-Reputation header (deprecated, https://mozilla-hub.atlassian.net/browse/DENG-10434)
    - name: x_lb_tags
      type: STRING
      mode: NULLABLE
      description: X-LB-Tags HTTP header
    - name: x_pingsender_version
      type: STRING
      mode: NULLABLE
      description: X-PingSender-Version HTTP header
    - name: x_source_tags
      type: STRING
      mode: NULLABLE
      description: X-Source-Tags HTTP header
    - name: x_telemetry_agent
      type: STRING
      mode: NULLABLE
      description: X-Telemetry-Agent HTTP header
    - name: parsed_date
      type: TIMESTAMP
      mode: NULLABLE
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
    - name: parsed_x_lb_tags
      type: RECORD
      mode: NULLABLE
      fields:
      - name: tls_version
        type: STRING
        mode: NULLABLE
      - name: tls_cipher_hex
        type: STRING
        mode: NULLABLE
    description: Headers included in the client's HTTP request
  - name: isp
    type: RECORD
    mode: NULLABLE
    fields:
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo ISP database version used for this lookup
    - name: name
      type: STRING
      mode: NULLABLE
      description: The name of the ISP associated with the client's IP address
    - name: organization
      type: STRING
      mode: NULLABLE
      description: The name of a specific business entity associated with the client's
        IP address when available; otherwise the ISP name
    description: Results of ISP lookup based on the client's IP address
  - name: user_agent
    type: RECORD
    mode: NULLABLE
    fields:
    - name: browser
      type: STRING
      mode: NULLABLE
    - name: os
      type: STRING
      mode: NULLABLE
    - name: version
      type: STRING
      mode: NULLABLE
    description: Parsed components of the client's user agent string
- name: metrics
  type: RECORD
  mode: NULLABLE
  fields:
  - name: labeled_counter
    type: RECORD
    mode: NULLABLE
    fields:
    - name: glean_error_invalid_label
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: INTEGER
        mode: NULLABLE
      description: 'Counts the number of times a metric was set with an invalid label.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_overflow
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: INTEGER
        mode: NULLABLE
      description: 'Counts the number of times a metric was set a value that overflowed.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_state
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: INTEGER
        mode: NULLABLE
      description: 'Counts the number of times a timing metric was used incorrectly.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_value
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: INTEGER
        mode: NULLABLE
      description: 'Counts the number of times a metric was set to an invalid value.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_type
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: INTEGER
        mode: NULLABLE
      description: 'Counts the number of times a metric set a value which was not
        of the

        expected type.

        The labels are the `category.name` identifier of the metric.


        This error type is only recorded by the Glean JavaScript SDK.

        This error may only happen in dynamically typed languages.

        '
  - name: string
    type: RECORD
    mode: NULLABLE
    fields:
    - name: glean_client_annotation_experimentation_id
      type: STRING
      mode: NULLABLE
      description: 'An experimentation identifier derived and provided by the application

        for the purpose of experimentation enrollment.

        '
    - name: account_user_id_sha256
      type: STRING
      mode: NULLABLE
      description: 'A hex string of a sha256 hash of the account''s uid

        '
    - name: relying_party_oauth_client_id
      type: STRING
      mode: NULLABLE
      description: 'The client id of the relying party

        '
    - name: relying_party_service
      type: STRING
      mode: NULLABLE
      description: 'The service name of the relying party

        '
    - name: session_device_type
      type: STRING
      mode: NULLABLE
      description: one of 'mobile', 'tablet', or 'desktop'
    - name: session_entrypoint
      type: STRING
      mode: NULLABLE
      description: entrypoint to the service
    - name: session_flow_id
      type: STRING
      mode: NULLABLE
      description: an ID generated by FxA for its flow metrics
    - name: utm_campaign
      type: STRING
      mode: NULLABLE
      description: 'A marketing campaign.  For example, if a user signs into FxA from
        selecting a

        Mozilla VPN plan on Mozilla VPN''s product site, then value of this metric
        could

        be ''vpn-product-page''.  The value has a max length of 128 characters with
        the

        alphanumeric characters, _ (underscore), forward slash (/), . (period), %

        (percentage sign), and - (hyphen) in the allowed set of characters.  The

        special value of ''page+referral+-+not+part+of+a+campaign'' is also allowed.

        '
    - name: utm_content
      type: STRING
      mode: NULLABLE
      description: 'The content on which the user acted.  For example, if the user
        clicked on the

        (previously available) "Get started here" link in "Looking for Firefox Sync?
        Get

        started here", then the value for this metric would be ''fx-sync-get-started''.

        The value has a max length of 128 characters with the alphanumeric characters,

        _ (underscore), forward slash (/), . (period), % (percentage sign), and -
        (hyphen)

        in the allowed set of characters.

        '
    - name: utm_medium
      type: STRING
      mode: NULLABLE
      description: 'The "medium" on which the user acted.  For example, if the user
        clicked on a

        link in an email, then the value of this metric would be ''email''.  The value

        has a max length of 128 characters with the alphanumeric characters, _

        (underscore), forward slash (/), . (period), % (percentage sign), and -

        (hyphen) in the allowed set of characters.

        '
    - name: utm_source
      type: STRING
      mode: NULLABLE
      description: 'The source from where the user started.  For example, if the user
        clicked on a

        link on the Firefox accounts web site, this value could be ''fx-website''.  The

        value has a max length of 128 characters with the alphanumeric characters,
        _

        (underscore), forward slash (/), . (period), % (percentage sign), and -

        (hyphen) in the allowed set of characters.

        '
    - name: utm_term
      type: STRING
      mode: NULLABLE
      description: 'This metric is similar to the `utm.source`; it is used in the
        Firefox

        browser.  For example, if the user started from about:welcome, then the value

        could be ''aboutwelcome-default-screen''.  The value has a max length of 128

        characters with the alphanumeric characters, _ (underscore), forward slash
        (/),

        . (period), % (percentage sign), and - (hyphen) in the allowed set of

        characters.

        '
    - name: entrypoint_experiment
      type: STRING
      mode: NULLABLE
      description: 'The entrypoint experiment the user was assigned to. This value
        is specified

        by query parameter `entrypoint_experiment` in the URL.

        '
    - name: entrypoint_variation
      type: STRING
      mode: NULLABLE
      description: 'The entrypoint variation the user was assigned to. This value
        is specified

        by query parameter `entrypoint_variation` in the URL.

        '
    - name: account_user_id
      type: STRING
      mode: NULLABLE
      description: 'The firefox/mozilla account id

        '
    - name: session_pairing_channel_hash
      type: STRING
      mode: NULLABLE
      description: 'A SHA-256 hash of the device pairing channel id, hex encoded.
        The two

        devices in a pairing are separate sessions with separate flow ids, so this

        is what joins the desktop and mobile halves of one pairing into a single

        funnel. Empty outside a pairing flow. Hashed because the raw channel id

        addresses a live channel; the hash is one-way and the id is a random

        32-character value, so it cannot be reversed by search.

        '
  - name: uuid
    type: RECORD
    mode: NULLABLE
    fields:
    - name: glean_page_id
      type: STRING
      mode: NULLABLE
      description: 'Uniquely identifies a page_load, not the page itself, for the
        purpose of associating other events with the specific page load event. This
        gets

        rotated with each page load and is sent along with each event ping.

        '
  - name: labeled_boolean
    type: RECORD
    mode: NULLABLE
    fields:
    - name: sync_cwts
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: BOOLEAN
        mode: NULLABLE
      description: 'The set of Sync engine options at the time of an account sign
        up via

        Sync.  For example, if the user only opted into syncing their Firefox

        bookmarks and history, then "bookmarks" and "history" will have true for

        their values, while the rest of the labels will have false.

        '
    - name: standard_marketing
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
      - name: value
        type: BOOLEAN
        mode: NULLABLE
      description: 'The set of marketing options at the time of an account sign up
        (standard flow).

        For example, if the user only opted into getting ''news'' then only news would
        be

        marked as true

        '
- name: normalized_app_name
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized app name
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized channel name
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized OS name
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
- name: ping_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: seq
    type: INTEGER
    mode: NULLABLE
  - name: start_time
    type: STRING
    mode: NULLABLE
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: end_time
    type: STRING
    mode: NULLABLE
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: ping_type
    type: STRING
    mode: NULLABLE
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: Hashed version of client_id (if present) useful for partitioning; ranges
    from 0 to 99
- name: submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Time when the ingestion edge server accepted this message
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
- name: app_version_patch
  type: NUMERIC
  mode: NULLABLE
- name: is_bot_generated
  type: BOOLEAN
  mode: NULLABLE
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the client.
- name: reason
  type: STRING
  mode: NULLABLE
- name: experiments
  type: JSON
  mode: NULLABLE
  description: Any active experiments, stored as a JSON object.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_profile_group_id` UUID metric,
    so this column will always be null.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_client_id` UUID metric, so
    this column will always be null.
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: When the event ostensibly occurred based on data reported by the client
    (so be wary that unrealistic values are possible).
- name: event_category
  type: STRING
  mode: NULLABLE
- name: event_name
  type: STRING
  mode: NULLABLE
- name: event
  type: STRING
  mode: NULLABLE
  description: Fully qualified event name prefixed with the event category separated
    by a dot.
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: Event extras, stored as a JSON object.
- name: document_event_number
  type: INTEGER
  mode: NULLABLE
  description: Which event number this was in the original document, in chronological
    order.
- name: extras
  type: RECORD
  mode: NULLABLE
  description: Event extras, grouped by type.
  fields:
  - name: boolean
    type: RECORD
    mode: NULLABLE
    description: Boolean event extras.
    fields:
    - name: cg
      type: BOOLEAN
      mode: NULLABLE
      description: conditionalGet support
    - name: cpu_arm
      type: BOOLEAN
      mode: NULLABLE
      description: CPU architecture boolean bucket (true if ARM/ARM64, else false)
    - name: hyb
      type: BOOLEAN
      mode: NULLABLE
      description: hybridTransport support
    - name: ppa
      type: BOOLEAN
      mode: NULLABLE
      description: passkeyPlatformAuthenticator support
    - name: prf
      type: BOOLEAN
      mode: NULLABLE
      description: WebAuthn PRF extension support
    - name: rel
      type: BOOLEAN
      mode: NULLABLE
      description: relatedOrigins support
    - name: supported
      type: BOOLEAN
      mode: NULLABLE
      description: Whether capability API was available and query succeeded
    - name: third_party_links
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Indicates if the third party auth options were shown on the cached login
        page.

        * Indicates if the third party auth options were shown on the login page.'
    - name: uvpa
      type: BOOLEAN
      mode: NULLABLE
      description: userVerifyingPlatformAuthenticator support
  - name: string
    type: RECORD
    mode: NULLABLE
    description: String event extras.
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
      description: The value proposition experiment branch shown to the user
    - name: browser_family
      type: STRING
      mode: NULLABLE
      description: Browser family bucket {firefox, chrome, safari, edge, other}
    - name: browser_major
      type: STRING
      mode: NULLABLE
      description: Browser major version (e.g., '130', '127', '17', or 'other')
    - name: cg
      type: STRING
      mode: NULLABLE
      description: conditionalGet support
    - name: choice
      type: STRING
      mode: NULLABLE
      description: User's choice of backup method, either 'phone' or 'code'
    - name: error_reason
      type: STRING
      mode: NULLABLE
      description: Error or fallback reason when supported=false (e.g., no_getClientCapabilities,
        error)
    - name: has_passkey_option
      type: STRING
      mode: NULLABLE
      description: '"true" when the passkey-aware wording ("Have a passkey or remember
        your password?") was shown instead of the standard "Remember your password?".'
    - name: hyb
      type: STRING
      mode: NULLABLE
      description: hybridTransport support
    - name: id
      type: STRING
      mode: NULLABLE
      description: An identifier of the element clicked. For automatic collection,
        its value is the element's `data-glean-id` data attribute value.
    - name: label
      type: STRING
      mode: NULLABLE
      description: The label of the element clicked. For automatic collection, its
        value is the element's `data-glean-label` data attribute value.
    - name: mobile_device_count
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of mobile devices attached to the account when the banner was dismissed.

        * Number of mobile devices attached to the account when the banner CTA was
        clicked.

        * Number of mobile devices attached to the account when the banner was shown.'
    - name: nimbus_user_id
      type: STRING
      mode: NULLABLE
      description: Nimbus user ID
    - name: os_family
      type: STRING
      mode: NULLABLE
      description: OS family bucket {windows, macos, ios, android, linux, chromeos,
        other}
    - name: os_major
      type: STRING
      mode: NULLABLE
      description: OS major version bucket (e.g., '16', '14', '13', or 'other')
    - name: outcome
      type: STRING
      mode: NULLABLE
      description: 'Whether the retry without PRF succeeded: "success" or "failure".'
    - name: ppa
      type: STRING
      mode: NULLABLE
      description: passkeyPlatformAuthenticator support
    - name: prf
      type: STRING
      mode: NULLABLE
      description: WebAuthn PRF extension support
    - name: reason
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * additional context-dependent info, e.g. the cause of an error

        * Page is viewed to "setup", "inline setup" or "replace" backup authentication
        codes

        * Differentiates OTP/passwordless flows (''otp'') from third-party auth flows
        (''third_party_auth'').

        * If reason is "create_password", the user must set a password before they
        can confirm the account unlinking.

        * Page is viewed to ''setup'' (from settings), ''inline setup'' or ''change''
        a recovery phone

        * Categorized WebAuthn or sign-in error: ''not_allowed'', ''not_supported'',
        ''security'', ''timeout'', ''no_passkey_found'', or ''unexpected''. See first_passkey_submit_frontend_error
        for full definitions.

        * Sign-in surface the user came from: ''emailfirst'' or ''login''.

        * Sign-in surface the user came from: ''emailfirst'' (email-first page) or
        ''signin'' (login page). Only these two surfaces reach the existing-password
        page (no-password surfaces never do).

        * Which sign-in flow brought the user to the set-password page: ''third_party_auth'',
        ''otp'', or ''pass...'
    - name: referrer
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The referrer of the page where the element was clicked.

        * The page referrer.'
    - name: rel
      type: STRING
      mode: NULLABLE
      description: relatedOrigins support
    - name: supported
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the PRF output was present: "present" or "absent". The sign-in device''s
        OS is available separately via Glean''s built-in `client_info.os`, so it is
        not duplicated here.

        * Whether capability API was available and query succeeded'
    - name: title
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The title of the page where the element was clicked.

        * The page title.'
    - name: type
      type: STRING
      mode: NULLABLE
      description: The type of the element clicked. For automatic collection, its
        value is the element's `data-glean-type` data attribute value.
    - name: url
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The URL of the page where the element was clicked.

        * The page URL.'
    - name: uvpa
      type: STRING
      mode: NULLABLE
      description: userVerifyingPlatformAuthenticator support
