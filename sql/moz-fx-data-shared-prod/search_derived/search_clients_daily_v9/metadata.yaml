friendly_name: Search Clients Daily
description: |
  A daily aggregate of desktop searches, one row per (client_id, submission_date, normalized_engine, partner_code, source).

  Combines the SAP and SERP pipelines with a full outer join, so a row is emitted when either
  side has activity. Columns present on both sides prefer the SERP value.

  The Glean-based replacement for `search_clients_daily_v8`.

  Exposed to users as view `search.search_clients_engines_sources_daily`.
owners:
- akommasani@mozilla.com
- kbammarito@mozilla.com
labels:
  schedule: daily
  table_type: client_level
scheduling:
  dag_name: bqetl_search
  external_downstream_tasks:
  - task_id: wait_for_search_clients_daily
    dag_name: jetstream
    execution_delta: 1h
  - task_id: wait_for_search_clients_daily
    dag_name: operational_monitoring
    execution_delta: 1h
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: 775
  clustering:
    fields:
    - sample_id
