        - name: key
          type: STRING
        - name: value
          type: INTEGER
      description: 'Why a DNS lookup missed the in-memory cache and had to hit the
        network, keyed by record family. Categories: absent (no entry), expired (entry
        existed but its TTL had lapsed), refresh (entry still valid but bypassed,
        e.g. a cache-bypass/refresh flag).

        '
    - name: dns_negative_eviction
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: RECORD
        mode: REPEATED
        fields:
        - name: key
          type: STRING
        - name: value
          type: INTEGER
      description: 'Negative (empty/NODATA or failed) DNS records evicted from the
        cache on reaching network.dnsCacheEntries, keyed by record family. The category
        is whether the record was still within its lifetime (premature) or had already
        expired when evicted.

        '
