friendly_name: Rolling Cohorts
description: |-
  Rolling Cohorts consists of one row per client & row_source per date (each date
  representing a new cohort) i.e. all the clients that had their first
  ping sent that day. This can be left joined with various activity
  tables to calculate activity metrics for particular cohorts.

  Note that client-attributes such as os versions, is default browser,
  etc. are based on the values at the time the cohort is created.
  This might not be the same as when activity happens. For example
  if a client changes whether Firefox is the default browser.

  is_automated flags confirmed automated (bot) desktop clients from
  telemetry_derived.desktop_automated_clients_v1 (DENG-11925, every fleet), from
  cohort_date 2026-08-27 (DENG-12035). Bots are flagged, not removed, so totals that ignore
  this column still include them.

  In this table, is_automated is NULL in cohorts written before DENG-12035 that were not
  backfilled (cohort dates before 2026-08-27). To exclude bots here, filter on
  `is_automated IS NOT TRUE`: `NOT is_automated` would also drop those older rows. The view
  telemetry.rolling_cohorts returns FALSE instead of NULL, so `NOT is_automated` is safe there.
owners:
- kik@mozilla.com
labels:
  level: bronze
  incremental: true
  owner1: kik
  table_type: client_level
  dag: bqetl_cohort_retention
scheduling:
  dag_name: bqetl_cohort_retention
bigquery:
  time_partitioning:
    type: day
    field: cohort_date
    require_partition_filter: true
    expiration_days: 775.0
  clustering:
    fields:
    - normalized_channel
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  checks.sql:
  - ..
  query.sql:
  - moz-fx-data-shared-prod.telemetry.clients_last_seen
  - moz-fx-data-shared-prod.telemetry.core_clients_last_seen
  - moz-fx-data-shared-prod.telemetry.desktop_active_users
  - moz-fx-data-shared-prod.telemetry.mobile_active_users
  - moz-fx-data-shared-prod.telemetry.mobile_new_profile_clients
  - moz-fx-data-shared-prod.telemetry_derived.desktop_automated_clients_v1
require_column_descriptions: false
