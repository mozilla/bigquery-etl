# Expected output of search_dau_aggregates_glean_v1 for 2026-09-21 (35 rows: 12 groups in the Google arm,
# 11 in the Bing arm, 12 in the DuckDuckGo arm). A NULL column is omitted rather than written as null.
# The default engine and distribution come from the nearest metrics ping from 7 days before to 1 day after,
# nearest day first and the latest ping within a day, then engine_id, then the client table.
# c1  two pings on the day (latest wins), a next-day ping (farther) and a client-table engine that disagrees
# c2  non-searcher with an engine; c3 engine_id only; c4 user-installed engine (other-Bing Search)
# c5  no ping in the window, engine from the client table; c6 only a ping 9 days back (outside the window)
# c9  Acer distribution (left out of the Bing arm only); c10 country not eligible for Google
# c12 ping 3 days back; c13 pings 2 days back and 1 day ahead (the nearer wins); c14 ping 2 days ahead
# (outside the window); c15 ping exactly 7 days back (the edge, used)
# c7 not DAU, c8 MozillaOnline, c11 another day: each has a distinct country, so a row would appear if included
# c12 has a runaway-SAP row (10,000 SAP, sap_exclusion_reason set): it still shows the engine and a tagged
# ad click, but sap_category and dau_engaged_w_sap are 0 because that row's SAP is left out
# c13 is on Mac; every other DAU client is on Windows
# c16 has no ping on the date, one a day before (bing) and one a day after (google): the earlier day wins, so Bing
