sources:
  moz-fx-data-shared-prod.firefox_desktop.baseline_clients_daily:
    # b: Mac is written as Darwin, and distribution_id comes from distribution.name, not
    # baseline's own distribution_id column.
    - submission_date: "2026-10-20"
      client_id: b
      sample_id: 2
      profile_group_id: group-b
      country: CA
      locale: fr-CA
      app_display_version: "158.0.1"
      normalized_os: Mac
      normalized_os_version: "24.1.0"
      app_channel: release
      normalized_channel: release
      distribution_id: default
      distribution:
        name: acer-g
      is_default_browser: true
      policies_is_enterprise: false
    # n: no metrics ping that day, so no default engine or home region.
    - submission_date: "2026-10-20"
      client_id: n
      sample_id: 3
      country: BR
      locale: pt-BR
      app_display_version: "157.0"
      normalized_os: Windows
      normalized_os_version: "10.0"
      app_channel: esr
      normalized_channel: esr
      is_default_browser: false
  moz-fx-data-shared-prod.firefox_desktop.metrics:
    # b sent two metrics pings: each column takes the latest non-null value.
    - submission_timestamp: "2026-10-20T08:00:00Z"
      sample_id: 2
      client_info:
        client_id: b
      metrics:
        string:
          search_engine_default_provider_id: bing
          search_engine_default_display_name: Bing
          search_engine_private_display_name: DuckDuckGo
          region_home_region: CA
    - submission_timestamp: "2026-10-20T20:00:00Z"
      sample_id: 2
      client_info:
        client_id: b
      metrics:
        string:
          search_engine_default_provider_id: google
          search_engine_default_display_name: Google
    # n's ping arrives the next day: ignored.
    - submission_timestamp: "2026-10-21T01:00:00Z"
      sample_id: 3
      client_info:
        client_id: n
      metrics:
        string:
          search_engine_default_provider_id: google
          region_home_region: BR
    # m has a metrics ping but no baseline or search row: no row.
    - submission_timestamp: "2026-10-20T09:00:00Z"
      sample_id: 4
      client_info:
        client_id: m
      metrics:
        string:
          search_engine_default_provider_id: google
  moz-fx-data-shared-prod.search_derived.search_clients_daily_glean_v1:
    # Client b searched the day before but not on 2026-10-20, so baseline applies.
    - submission_date: "2026-10-19"
      client_id: b
      sample_id: 2
      profile_group_id: group-b-old
      country: US
      ping_end_time: "2026-10-19T10:00:00.000+00:00"
      sap_counts_total: 1
      serp_counts_total: 0
      default_search_engine_provider_id: bing

parameters:
  - name: submission_date
    type: DATE
    value: "2026-10-20"

expect:
  # NULL columns are omitted: the harness drops null keys from the result row.
  - submission_date: "2026-10-20"
    client_id: b
    sample_id: 2
    profile_group_id: group-b
    dims_source: baseline_and_metrics
    country: CA
    locale: fr-CA
    app_version: "158.0.1"
    app_version_major: "158"
    os: Darwin
    os_version: "24.1.0"
    channel: release
    normalized_channel: release
    distribution_id: acer-g
    is_acer_distribution: true
    is_default_browser: true
    policies_is_enterprise: false
    default_search_engine_provider_id: google
    default_search_engine_display_name: Google
    default_private_search_engine_display_name: DuckDuckGo
    home_region: CA
    normalized_default_search_engine: Google
  - submission_date: "2026-10-20"
    client_id: n
    sample_id: 3
    dims_source: baseline
    country: BR
    locale: pt-BR
    app_version: "157.0"
    app_version_major: "157"
    os: Windows
    os_version: "10.0"
    channel: esr
    normalized_channel: esr
    is_acer_distribution: false
    is_default_browser: false
