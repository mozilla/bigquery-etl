friendly_name: Onboarding Completed Clients
description: |-
  User-facing view over onboarding_completed_clients_v1, which it exposes
  unchanged. One row per Fenix client per day on which an `onboarding.completed`
  event from them arrived, dated by submission date rather than by when the event
  fired, so `client_id` is not unique here — a client with completions arriving
  on more than one day appears once per day.

  Collapse on `client_id` before joining, or the join fans out.
  `fenix.retention_clients` takes `MIN(completed_date)` per client.

  Coverage will begin 2025-01-01 when the table is backfilled; completions
  before that date will be absent entirely. The earliest date present for a
  client is therefore not necessarily their first completion — one who
  completed before it and again after appears with only the later one.
