fields:
- name: normalized_app_id
  mode: NULLABLE
  type: STRING
  description: App ID of the channel data was received from
- name: normalized_channel
  mode: NULLABLE
  type: STRING
  description: Normalized channel name
- mode: NULLABLE
  name: additional_properties
  type: STRING
  description: A JSON string containing any payload properties not present in the
    schema
- mode: NULLABLE
  name: client_info
  type: RECORD
  fields:
  - name: android_sdk_version
    type: STRING
  - name: app_build
    type: STRING
  - name: app_channel
    type: STRING
  - name: app_display_version
    type: STRING
  - name: architecture
    type: STRING
  - name: attribution
    type: RECORD
    fields:
    - name: campaign
      type: STRING
    - name: content
      type: STRING
    - name: medium
      type: STRING
    - name: source
      type: STRING
    - name: term
      type: STRING
    - name: ext
      type: JSON
  - name: build_date
    type: STRING
  - name: client_id
    type: STRING
  - name: device_manufacturer
    type: STRING
  - name: device_model
    type: STRING
  - name: distribution
    type: RECORD
    fields:
    - name: name
      type: STRING
    - name: ext
      type: JSON
  - name: first_run_date
    type: STRING
  - name: locale
    type: STRING
  - name: os
    type: STRING
  - name: os_version
    type: STRING
  - name: session_count
    type: INTEGER
  - name: session_id
    type: STRING
  - name: telemetry_sdk_build
    type: STRING
  - name: windows_build_number
    type: INTEGER
- mode: NULLABLE
  name: document_id
  type: STRING
  description: The document ID specified in the URI when the client sent this message
- name: events
  type: RECORD
  mode: REPEATED
  fields:
  - name: category
    type: STRING
  - name: extra
    type: RECORD
    mode: REPEATED
    fields:
    - name: key
      type: STRING
    - name: value
      type: STRING
  - name: name
    type: STRING
  - name: timestamp
    type: INTEGER
  - name: session
    type: RECORD
    fields:
    - name: event_seq
      type: INTEGER
    - name: session_id
      type: STRING
    - name: session_sample_rate
      type: FLOAT
    - name: session_seq
      type: INTEGER
    - name: session_start_time
      type: STRING
- mode: NULLABLE
  name: metadata
  type: RECORD
  fields:
  - name: geo
    type: RECORD
    fields:
    - name: city
      type: STRING
    - name: country
      type: STRING
    - name: db_version
      type: STRING
    - name: subdivision1
      type: STRING
    - name: subdivision2
      type: STRING
  - name: header
    type: RECORD
    fields:
    - name: date
      type: STRING
    - name: dnt
      type: STRING
    - name: x_debug_id
      type: STRING
    - name: x_foxsec_ip_reputation
      type: STRING
    - name: x_lb_tags
      type: STRING
    - name: x_pingsender_version
      type: STRING
    - name: x_source_tags
      type: STRING
    - name: x_telemetry_agent
      type: STRING
    - name: parsed_date
      type: TIMESTAMP
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
    - name: parsed_x_lb_tags
      type: RECORD
      fields:
      - name: tls_version
        type: STRING
      - name: tls_cipher_hex
        type: STRING
  - name: isp
    type: RECORD
    fields:
    - name: db_version
      type: STRING
    - name: name
      type: STRING
    - name: organization
      type: STRING
  - name: user_agent
    type: RECORD
    fields:
    - name: browser
      type: STRING
    - name: os
      type: STRING
    - name: version
      type: STRING
- mode: NULLABLE
  name: metrics
  type: RECORD
  fields:
  - name: labeled_counter
    type: RECORD
    fields:
    - name: glean_error_invalid_label
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts the number of times a metric was set with an invalid label.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_overflow
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts the number of times a metric was set a value that overflowed.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_state
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts the number of times a timing metric was used incorrectly.

        The labels are the `category.name` identifier of the metric.

        '
    - name: glean_error_invalid_value
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts the number of times a metric was set to an invalid value.

        The labels are the `category.name` identifier of the metric.

        '
  - name: string
    type: RECORD
    fields:
    - name: glean_client_annotation_experimentation_id
      type: STRING
  - name: string_list
    type: RECORD
    fields:
    - name: glean_ping_uploader_capabilities
      type: STRING
      mode: REPEATED
      description: 'The list of requested uploader capabilities for the ping this
        is sent in.

        Should be the same as the ones defined for that particular ping.


        This metric is only attached to a ping if it already contains other data.

        '
  - name: object
    type: RECORD
    fields:
    - name: nimbus_system_recorded_nimbus_context
      type: JSON
- mode: NULLABLE
  name: normalized_app_name
  type: STRING
  description: Set to "Other" if this message contained an unrecognized app name
- mode: NULLABLE
  name: normalized_country_code
  type: STRING
  description: An ISO 3166-1 alpha-2 country code
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: Set to "Other" if this message contained an unrecognized OS name
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
- mode: NULLABLE
  name: ping_info
  type: RECORD
  fields:
  - name: end_time
    type: STRING
  - name: experiments
    type: RECORD
    mode: REPEATED
    fields:
    - name: key
      type: STRING
    - name: value
      type: RECORD
      fields:
      - name: branch
        type: STRING
      - name: extra
        type: RECORD
        fields:
        - name: enrollment_id
          type: STRING
        - name: type
          type: STRING
  - name: ping_type
    type: STRING
  - name: reason
    type: STRING
  - name: seq
    type: INTEGER
  - name: server_knobs_config
    type: RECORD
    fields:
    - name: event_threshold
      type: INTEGER
    - name: metrics_enabled
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: BOOLEAN
      description: Map of metric identifiers (category.name) to boolean values indicating
        whether the metric is enabled
    - name: pings_enabled
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: BOOLEAN
      description: Map of ping names to boolean values indicating whether the ping
        is enabled
    - name: session_sample_rate
      type: FLOAT
  - name: start_time
    type: STRING
  - name: parsed_start_time
    type: TIMESTAMP
  - name: parsed_end_time
    type: TIMESTAMP
- mode: NULLABLE
  name: sample_id
  type: INTEGER
  description: Hashed version of client_id (if present) useful for partitioning; ranges
    from 0 to 99
- mode: NULLABLE
  name: submission_timestamp
  type: TIMESTAMP
  description: Time when the ingestion edge server accepted this message
- mode: NULLABLE
  name: app_version_major
  type: NUMERIC
- mode: NULLABLE
  name: app_version_minor
  type: NUMERIC
- mode: NULLABLE
  name: app_version_patch
  type: NUMERIC
- mode: NULLABLE
  name: is_bot_generated
  type: BOOLEAN
