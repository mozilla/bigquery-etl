fields:
- name: scraped_date
  type: DATE
  mode: NULLABLE
  description: Partition column. Date of the scrape on which this release was first
    observed and indexed, passed through from `external.market_research_releases`.
    Because the anti-join only enriches identities never seen before, this is a
    first-observed date, not a last-seen date — a release stays on the partition of
    its first scrape and is not rewritten by later scrapes.
- name: browser
  type: STRING
  mode: NULLABLE
  description: Browser or product name the release belongs to, e.g. Chrome, Firefox.
    Raw upstream value from `external.market_research_releases`; no normalization is
    applied.
- name: version
  type: STRING
  mode: NULLABLE
  description: Release version string, e.g. 128.0. Raw upstream value; formats vary
    by vendor and are not parsed.
- name: release_date
  type: DATE
  mode: NULLABLE
  description: Date the release was published by the vendor. Distinct from
    `scraped_date`, which is when Mozilla observed it.
- name: source_type
  type: STRING
  mode: NULLABLE
  description: Kind of release record — `developer_release_notes` or
    `user_release_notes`. Part of the table's grain, so the same browser/version can
    appear twice with different values.
- name: source_url
  type: STRING
  mode: NULLABLE
  description: URL of the release notes page that was scraped.
- name: raw_text
  type: STRING
  mode: NULLABLE
  description: Plain text scraped from the release notes page. This is the document
    body that is summarized and embedded.
- name: blob_name
  type: STRING
  mode: NULLABLE
  description: Full GCS object path the underlying raw row was loaded from, for
    traceability back to the source file.
- name: release_summary_llm
  type: STRING
  mode: NULLABLE
  description: AI-generated summary of what changed in this release, limited to a
    maximum of 25 words. Produced by the Gemini model.
- name: release_category_llm
  type: STRING
  mode: NULLABLE
  description: AI-generated classification label for the dominant theme of the
    release (e.g. security, performance), consisting of one to two words. Produced by
    the Gemini model.
- name: release_topics_llm
  type: STRING
  mode: REPEATED
  description: Array of up to five AI-generated normalized topic labels for the
    release. Produced by the Gemini model.
- name: release_entities_llm
  type: STRING
  mode: REPEATED
  description: Array of up to five AI-extracted normalized entities from the release
    notes (e.g. feature names, web platform APIs, CVE identifiers). Produced by the
    Gemini model.
- name: embedding
  type: FLOAT
  mode: REPEATED
  description: Vector embedding of the concatenated browser, version and raw_text.
    Generated by the Gemini embedding model (gemini-embedding-001). Always embed your
    own query text with the same model, or distances are meaningless.
- name: metadata
  type: RECORD
  mode: NULLABLE
  description: Technical metadata about the AI analysis pipeline, including model
    versions, quality flags, and processing status.
  fields:
  - name: input_fields
    type: STRING
    mode: REPEATED
    description: List of source field names used as input for the AI analysis
      (browser, version, raw_text).
  - name: input_char_count
    type: INTEGER
    mode: NULLABLE
    description: Total character count of the input text provided to the AI model.
  - name: model_version
    type: STRING
    mode: NULLABLE
    description: Version identifier of the generative AI model used for analysis
      (e.g. gemini-2.5-pro).
  - name: embedding_version
    type: STRING
    mode: NULLABLE
    description: Version identifier of the embedding model used to generate the
      vector embedding (e.g. gemini-embedding-001).
  - name: prompt_version
    type: STRING
    mode: NULLABLE
    description: Version identifier of the prompt used for the AI analysis (e.g. v1).
  - name: analysis_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Ingestion timestamp — captures the actual wall-clock time when this
      row's AI analysis was produced (`CURRENT_TIMESTAMP()` at query run). Distinct
      from the partition date (`scraped_date`), which reflects when the release was
      scraped. Backfills and re-runs will record their own run time here.
  - name: embedding_succeeded
    type: BOOLEAN
    mode: NULLABLE
    description: TRUE when `embedding IS NOT NULL`. **This is the sole driver for
      reprocessing** — partitions are re-run for rows where `embedding_succeeded =
      FALSE`. LLM-field issues are tracked in `failure_reasons` for visibility but do
      **not** trigger reruns.
  - name: failure_reasons
    type: STRING
    mode: REPEATED
    description: Diagnostic tags for any quality check that failed on this row. Empty
      array when every check passes. Possible tags - `embedding_missing`,
      `release_summary_llm_missing`, `release_category_llm_missing`,
      `release_topics_llm_missing`, `release_topics_llm_has_empty_elements`,
      `release_entities_llm_missing`, `release_entities_llm_has_empty_elements`.
      Use for triage (`SELECT reason, COUNT(*) FROM ...,
      UNNEST(metadata.failure_reasons) reason GROUP BY 1`).
