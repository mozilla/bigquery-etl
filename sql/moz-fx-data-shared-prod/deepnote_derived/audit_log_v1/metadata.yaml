friendly_name: Deepnote Audit Log
description: |-
  Events from the audit logs of Mozilla's Deepnote workspaces (see
  https://deepnote.com/docs/audit-log).

  Imported daily from the Deepnote API (GET /v2/audit-logs) with one workspace
  admin API key per workspace, configured as secrets and passed with --api-key-env-vars. Each run
  fetches the events of the last 3 days and merges new ones on event_id.

  The `ip` field of the audit log is not imported. Contains user emails, so access
  is restricted to data platform.

  `resource_id` refers to different entities depending on `event_type`: the project
  for project_*/file_*/notebook_executed/notebook_viewed events, the notebook for
  notebook_edited/blocks_reordered, a block for block_* events, a run for run_viewed,
  the workspace for workspace_* events. Block and run events carry projectId and
  notebookId in `metadata`.
owners:
- ascholtz@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: client_level
scheduling:
  dag_name: bqetl_deepnote
  arguments:
  - --api-key-env-vars
  - DEEPNOTE_API_KEY
  - DEEPNOTE_ADS_API_KEY
  - DEEPNOTE_REVENUECAT_1_API_KEY
  - DEEPNOTE_REVENUECAT_2_API_KEY
  - DEEPNOTE_MARKETING_API_KEY
  - DEEPNOTE_MONITOR_API_KEY
  date_partition_parameter: null
  secrets:
  - deploy_target: DEEPNOTE_API_KEY
    key: bqetl_deepnote_api_key
  - deploy_target: DEEPNOTE_ADS_API_KEY
    key: bqetl_deepnote_ads_api_key
  - deploy_target: DEEPNOTE_REVENUECAT_1_API_KEY
    key: bqetl_deepnote_revenuecat_1_api_key
  - deploy_target: DEEPNOTE_REVENUECAT_2_API_KEY
    key: bqetl_deepnote_revenuecat_2_api_key
  - deploy_target: DEEPNOTE_MARKETING_API_KEY
    key: bqetl_deepnote_marketing_api_key
  - deploy_target: DEEPNOTE_MONITOR_API_KEY
    key: bqetl_deepnote_monitor_api_key
bigquery:
  time_partitioning:
    type: day
    field: created_at
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - event_type
