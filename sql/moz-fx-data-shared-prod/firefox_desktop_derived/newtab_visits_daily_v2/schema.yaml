fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: Day the event was received in the newtab ping
- name: client_id
  type: STRING
  mode: NULLABLE
  description: Unique ID for the client installation.
- name: newtab_visit_id
  type: STRING
  mode: NULLABLE
  description: Unique identifier for the newtab visit
- name: first_submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Earliest submission_timestamp of the newtab pings carrying this visit's
    events on this submission_date. Equal to last_submission_timestamp when the visit
    arrived in a single ping on the day. A visit's pings can land on more than one
    submission_date; take the MIN across its rows for when events about the visit
    were first received.
- name: last_submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Latest submission_timestamp of the newtab pings carrying this visit's
    events on this submission_date. A visit's pings can land on more than one submission_date;
    take the MAX across its rows for when events about the visit were last received.
- name: app_version
  type: INTEGER
  mode: NULLABLE
  description: Firefox Desktop major version
- name: os
  type: STRING
  mode: NULLABLE
  description: Operating system of the host system
- name: os_version
  type: STRING
  mode: NULLABLE
  description: The operating system version running at the client prior to normalization
    (e.g. "4.18.0-553.97.1.el8_10.aarch64" or "6.11+parrot-amd64" for Linux; "10.0"
    for Windows, "25.3.0" for macOS, "26.3.1" for iOS, "16" for Android). Windows
    10 and Windows 11 both show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: The Windows build number reported by the operating system (e.g., 19045
    for Windows 10, 22000+ for Windows 11); only populated on Windows clients and
    null on all other platforms.
- name: windows_version
  type: STRING
  mode: NULLABLE
  description: Windows version name derived from os, os_version and windows_build_number
    with mozfun.norm.glean_windows_version_info (e.g. 'Windows 10', 'Windows 11').
    Builds 22000 and above on os_version 10.0 are Windows 11. 'build unknown - likely
    Windows 10 or 11' when the build number is missing. NULL for non-Windows clients.
- name: channel
  type: STRING
  mode: NULLABLE
  description: Firefox Desktop deployment channel (e.g. release, beta)
- name: newtab_addon_version
  type: STRING
  mode: NULLABLE
  description: 'Version of the newtab@mozilla.org addon reported by the client (`$.version`
    in metrics.object.addons_active_addons).

    Selects the version on the client''s last addons ping for the day and makes it
    the same for all of the client''s visits that day. NULL when the client sent no
    addons ping reporting the newtab addon that day, and for dates before newtab_addon_versions_daily_v1
    has data.'
- name: locale
  type: STRING
  mode: NULLABLE
  description: language or country based preferences of the host system
- name: country
  type: STRING
  mode: NULLABLE
  description: Country where the newtab event is reported
- name: homepage_category
  type: STRING
  mode: NULLABLE
  description: "User\u2019s chosen homepage/new window appearance"
- name: newtab_category
  type: STRING
  mode: NULLABLE
  description: "User\u2019s chosen newtab appearance"
- name: organic_content_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user has enabled organic stories in the browser.
- name: sponsored_content_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user has enabled sponsored stories in the browser.
- name: sponsored_topsites_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user has enabled sponsored topsites in the browser.
- name: organic_topsites_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user has enabled organic topsites in the browser.
- name: newtab_search_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user has enabled search in the browser.
- name: is_default_ui
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the newtab open was a default ui
- name: is_newtab_opened
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user opened a newtab
- name: is_search_issued
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user issued search with newtab opened in default ui
- name: is_search_ad_click
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user clicked a search Ad with newtab opened in default
    ui
- name: is_content_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user interacted upon any content with newtab opened in
    default ui
- name: is_content_click
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user clicked on any content with newtab opened in default
    ui
- name: is_content_impression
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if any content was impressed on a newtab with newtab opened in
    default ui
- name: is_sponsored_content_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if sponsored content was interacted upon with newtab opened in
    default ui
- name: is_sponsored_content_click
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if sponsored content was clicked with newtab opened in default
    ui
- name: is_sponsored_content_impression
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if sponsored content was impressed with newtab opened in default
    ui
- name: any_content_click_count
  type: INTEGER
  description: Count of clicks on any newtab content with newtab opened in default
    ui
- name: any_content_impression_count
  type: INTEGER
  description: Count of impression on any newtab content with newtab opened in default
    ui
- name: organic_content_click_count
  type: INTEGER
  description: Count of clicks on Organic content with newtab opened in default ui
- name: organic_content_impression_count
  type: INTEGER
  description: Count of Organic content impressions with newtab opened in default
    ui
- name: sponsored_content_click_count
  type: INTEGER
  description: Count of clicks on sponsored content with newtab opened in default
    ui
- name: sponsored_content_impression_count
  type: INTEGER
  description: Count of sponsored content impressions with newtab opened in default
    ui
- name: sponsored_content_inventory_count
  type: INTEGER
  mode: NULLABLE
  description: How many times a story slot that can hold a sponsored story was shown.
    It counts the slot whether it showed a sponsored story or an organic one, so it
    measures sponsored story inventory; compare with sponsored_content_impression_count
    for how much of it was filled. 0 when newtab wasn't opened in the default UI,
    or when the user has sponsored stories turned off. NULL for Firefox versions before
    157, which don't report ad-eligible slots.
- name: is_topsite_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user interacted on any topsite with newtab opened in default
    ui
- name: is_topsite_click
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user clicked on any topsite with newtab opened in default
    ui
- name: is_topsite_impression
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if any topsite was impressed upon with newtab opened in default
    ui
- name: is_sponsored_topsite_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user interacted on a sponsored topsite with newtab opened
    in default ui
- name: is_sponsored_topsite_click
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user clicked a sponsored topsite with newtab opened in
    default ui
- name: is_sponsored_topsite_impression
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if a sponsored topsite was impressed upon with newtab opened in
    default ui
- name: any_topsite_click_count
  type: INTEGER
  description: Count of clicks on topsite with newtab opened in default ui
- name: any_topsite_impression_count
  type: INTEGER
  description: Count of topsite impressions with newtab opened in default ui
- name: organic_topsite_click_count
  type: INTEGER
  description: Count of clicks on organic topsite with newtab opened in default ui
- name: organic_pinned_topsite_click_count
  type: INTEGER
  mode: NULLABLE
  description: Count of clicks on pinned organic topsites with newtab opened in default
    ui. NULL for clients on Firefox versions before 144, which don't report whether
    a tile is pinned.
- name: organic_unpinned_topsite_click_count
  type: INTEGER
  mode: NULLABLE
  description: Count of clicks on unpinned organic topsites with newtab opened in
    default ui. NULL for clients on Firefox versions before 144, which don't report
    whether a tile is pinned.
- name: organic_topsite_impression_count
  type: INTEGER
  description: Count of organic topsite impressions with newtab opened in default
    ui
- name: organic_pinned_topsite_impression_count
  type: INTEGER
  mode: NULLABLE
  description: Count of pinned organic topsite impressions with newtab opened in default
    ui. NULL for clients on Firefox versions before 144, which don't report whether
    a tile is pinned.
- name: organic_unpinned_topsite_impression_count
  type: INTEGER
  mode: NULLABLE
  description: Count of unpinned organic topsite impressions with newtab opened in
    default ui. NULL for clients on Firefox versions before 144, which don't report
    whether a tile is pinned.
- name: sponsored_topsite_click_count
  type: INTEGER
  description: Count of clicks on sponsored topsite with newtab opened in default
    ui
- name: sponsored_topsite_impression_count
  type: INTEGER
  description: Count of sponsored topsite impressions with newtab opened in default
    ui
- name: sponsored_topsite_inventory_count
  type: INTEGER
  mode: NULLABLE
  description: How many times a shortcut slot that can hold a sponsored shortcut was
    shown. It counts the slot whether it showed a sponsored shortcut or an organic
    one, so it measures sponsored shortcut inventory; compare with sponsored_topsite_impression_count
    for how much of it was filled. 0 when newtab wasn't opened in the default UI,
    or when the user has sponsored shortcuts turned off. NULL for Firefox versions
    before 157, which don't report ad-eligible slots.
- name: is_widget_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user interacted on any widget with newtab opened in default
    ui
- name: is_wallpaper_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user interacted with wallpaper with newtab opened in default
    ui
- name: is_other_interaction
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE if the user interacted with wallpaper, topic_selection or sections
    with newtab opened in default ui
- name: sample_id
  type: INTEGER
  description: Hashed version of client_id (0-99). Useful for distribution analysis
- name: profile_group_id
  type: STRING
  description: Legacy telemetry. Enables the calculation of metrics by profile_id
- name: geo_subdivision
  type: STRING
  description: First major country subdivision, typically a state, province, or county
- name: is_section
  type: BOOLEAN
  description: Whether a visit had an impression that belonged to a section with default
    UI
- name: experiments
  type: RECORD
  mode: REPEATED
  description: Array of experiments to associate with each visit
  fields:
  - name: key
    type: STRING
    mode: NULLABLE
  - name: value
    type: RECORD
    mode: NULLABLE
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
    - name: extra
      type: RECORD
      mode: NULLABLE
      fields:
      - name: type
        type: STRING
        mode: NULLABLE
      - name: enrollment_id
        type: STRING
        mode: NULLABLE
- name: newtab_weather_enabled
  type: BOOLEAN
  description: Whether the weather widget is enabled
- name: newtab_scroll
  type: BOOLEAN
  description: Whether the user scrolled more than the scroll telemetry threshold
    during this newtab visit. NULL if no qualifying scroll occurred (the Glean metric
    is only set when the threshold is crossed). Sourced from the `newtab.scroll` Glean
    metric.
- name: default_search_engine
  type: STRING
  description: Engine_id of the default search engine
- name: default_private_search_engine
  type: STRING
  description: Engine_id of the default private search engine
- name: topsite_rows
  type: INTEGER
  description: The number of topsite tile rows configured to be shown on the newtab
    page
- name: topsite_sponsored_tiles_configured
  type: INTEGER
  description: The number of topsite tiles configured to be shown on newtab
- name: newtab_blocked_sponsors
  type: STRING
  mode: REPEATED
  description: Array of advertiser names that have been dismissed by the user
- name: newtab_content_surface_id
  type: STRING
  mode: NULLABLE
  description: Scheduled surface identifier based on locale and region, with fallback
    to computed value from country and locale
- name: organic_content_dismissal_count
  type: INTEGER
  description: Count of organic content dismissals
- name: sponsored_content_dismissal_count
  type: INTEGER
  description: Count of sponsored content dismissals
- name: organic_topsite_dismissal_count
  type: INTEGER
  description: Count of organic topsite dismissals
- name: sponsored_topsite_dismissal_count
  type: INTEGER
  description: Count of sponsored topsite dismissals
- name: any_interaction_count
  type: INTEGER
  description: Count of any client interactions
- name: search_interaction_count
  type: INTEGER
  description: Count of search interactions
- name: nonsearch_interaction_count
  type: INTEGER
  description: Count of non-search interactions
- name: any_content_interaction_count
  type: INTEGER
  description: Count of any content interactions
- name: organic_content_interaction_count
  type: INTEGER
  description: Count of organic content interactions
- name: sponsored_content_interaction_count
  type: INTEGER
  description: Count of sponsored content interactions
- name: any_topsite_interaction_count
  type: INTEGER
  description: Count of any topsite interactions
- name: organic_topsite_interaction_count
  type: INTEGER
  description: Count of organic topsite interactions
- name: sponsored_topsite_interaction_count
  type: INTEGER
  description: Count of sponsored topsite interactions
- name: content_thumbs_up_count
  type: INTEGER
  description: Count of organic content thumbs up
- name: content_thumbs_down_count
  type: INTEGER
  description: Count of organic content thumbs down
- name: search_ad_click_count
  type: INTEGER
  description: Count of search ad clicks
- name: search_ad_impression_count
  type: INTEGER
  description: Count of search ad impressions
- name: widget_interaction_count
  type: INTEGER
  description: Count of widget interactions
- name: widget_impression_count
  type: INTEGER
  description: Count of widget impressions
- name: other_interaction_count
  type: INTEGER
  description: Count of other misc interactions
- name: other_impression_count
  type: INTEGER
  description: Count of other misc impressions
- name: newtab_visit_duration
  type: INTEGER
  description: Visit duration in milliseconds (timestamp diff between close and open
    event)
- name: newtab_window_inner_height
  type: INTEGER
  description: The height of the browser window in pixels
- name: newtab_window_inner_width
  type: INTEGER
  description: The width of the browser window in pixels
- name: topsite_tile_components
  type: RECORD
  mode: REPEATED
  description: Detailed metrics for individual topsite tiles during this visit
  fields:
  - name: position
    type: INTEGER
    mode: NULLABLE
    description: Position of the tile on the new tab page
  - name: is_sponsored
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the tile is a sponsored topsite
  - name: is_ad_eligible_position
    type: BOOLEAN
    mode: NULLABLE
    description: 'Whether the tile was in a position that can hold a sponsored tile:
      TRUE if any of the tile''s impressions in the visit reported it. FALSE otherwise
      on Firefox 157 and later, where Firefox only sends it on impressions and only
      when true. NULL when the entry has no impression in this row (e.g. a click whose
      impression arrived on another day), and for clients on Firefox versions before
      157, which don''t report ad-eligible positions.'
  - name: is_pinned
    type: BOOLEAN
    mode: NULLABLE
    description: 'Whether the organic tile is pinned: TRUE if any of the tile''s events
      in the visit reported it as pinned. NULL for sponsored tiles, which can''t be
      pinned, and for clients on Firefox versions before 144, which don''t report
      it, and when the entry has no impression or click in this row (e.g. a dismissal
      whose impression arrived on another day).'
  - name: impression_count
    type: INTEGER
    mode: NULLABLE
    description: Number of impressions for this tile
  - name: click_count
    type: INTEGER
    mode: NULLABLE
    description: Number of clicks on this tile
  - name: dismissal_count
    type: INTEGER
    mode: NULLABLE
    description: Number of dismissals for this tile
  - name: pin_count
    type: INTEGER
    mode: NULLABLE
    description: Number of times this tile was pinned
  - name: unpin_count
    type: INTEGER
    mode: NULLABLE
    description: Number of times this tile was unpinned
- name: content_position_components
  type: RECORD
  mode: REPEATED
  description: Detailed metrics for Pocket content at specific positions during this
    visit
  fields:
  - name: position
    type: INTEGER
    mode: NULLABLE
    description: Position of the content item on the new tab page
  - name: is_sponsored
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the content is sponsored
  - name: is_ad_eligible_position
    type: BOOLEAN
    mode: NULLABLE
    description: 'Whether the card was in a position that can hold a sponsored story:
      TRUE if any of the card''s impressions in the visit reported it. FALSE otherwise
      on Firefox 157 and later, where Firefox only sends it on impressions and only
      when true. NULL when the entry has no impression in this row (e.g. a click whose
      impression arrived on another day), and for clients on Firefox versions before
      157, which don''t report ad-eligible positions.'
  - name: section_position
    type: INTEGER
    mode: NULLABLE
    description: Position of the section containing this content
  - name: layout_name
    type: STRING
    mode: NULLABLE
    description: Layout of the section containing this content (e.g. '7-double-row-2-ad').
      NULL for clients on Firefox versions before 144, for cards not shown in a section,
      and when the entry has no impression or click in this row (e.g. a dismissal
      whose impression arrived on another day). If the card reported two layouts in
      the visit, one of them is kept.
  - name: card_column
    type: INTEGER
    mode: NULLABLE
    description: The 1-based grid column (1-4) the card occupied; a card spanning
      several columns reports its leftmost one. Several cards in a section can share
      a column. NULL for clients on Firefox versions before 157, for cards not shown
      in a section, and when the entry has no impression or click in this row (e.g.
      a dismissal whose impression arrived on another day). If the card reported two
      columns in the visit (for example after a window resize), the lower one is kept.
  - name: format
    type: STRING
    mode: NULLABLE
    description: Format of the content item
  - name: is_section_followed
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the section is followed by the user
  - name: impression_count
    type: INTEGER
    mode: NULLABLE
    description: Number of impressions for this content item
  - name: click_count
    type: INTEGER
    mode: NULLABLE
    description: Number of clicks on this content item
  - name: dismissal_count
    type: INTEGER
    mode: NULLABLE
    description: Number of dismissals for this content item
  - name: thumbs_up_count
    type: INTEGER
    mode: NULLABLE
    description: Number of thumbs up votes for this content
  - name: thumbs_down_count
    type: INTEGER
    mode: NULLABLE
    description: Number of thumbs down votes for this content
