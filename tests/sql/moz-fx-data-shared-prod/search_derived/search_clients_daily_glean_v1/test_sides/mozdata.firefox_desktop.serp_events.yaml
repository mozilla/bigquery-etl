  num_other_engagements: 0
  num_ads_loaded: 3
  num_ads_visible: 1
  num_ads_blocked: 0
  num_ads_notshowing: 1

# The next five rows are client-serp, all on one grain tuple, so they collapse into a
# single output row. Everything they share is in the anchor: only the QUALIFY winner's
# dimensions are published, so a difference between them would be discarded without the
# test noticing, and holding them in one place is what makes that visible.
# What each row overrides is its whole contribution to the aggregate.
# This client has no SAP event and no metrics ping, which is what makes sap_provider_id,
# sap_provider_name and sap_overridden_by_third_party NULL on its output row while
# sap_counts_total and the seven legacy_* counters zero-fill.

