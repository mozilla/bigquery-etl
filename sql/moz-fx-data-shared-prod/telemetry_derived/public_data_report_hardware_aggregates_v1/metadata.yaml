friendly_name: Firefox Public Data Report Hardware Aggregates
description: |-
  Intermediate aggregated data that is used to generate data for the
  hardware report at https://data.firefox.com/.  This table contains weekly
  client counts for various hardware configurations.

  CPU speed comes from each client's latest legacy main ping of the week
  (telemetry_stable.main_v5), and from its latest Glean metrics ping of the week
  that has one (firefox_desktop_stable.metrics_v1) when the legacy ping has none.
  Clients with no speed in either are counted as "Other".

  The code that uses this table is in
  [firefox-public-data-report-etl repository](https://github.com/mozilla/firefox-public-data-report-etl).
owners:
- bewu@mozilla.com
labels:
  incremental: true
  owner1: bewu
  legacy: true
bigquery:
  time_partitioning:
    type: day
    field: 'date_from'
    require_partition_filter: false
    expiration_days: null
