# Reusable workflow, called from build.yml here and from mozilla/private-bigquery-etl.
#
# Jobs run in the caller's context: the checkout is the caller's repo, and secrets,
# vars and the dev environment come from it too. A caller other than bigquery-etl sets
# clone-bigquery-etl so the bqetl tooling is cloned into bigquery-etl/.
#
# Expects the caller's generate-sql job to have uploaded the generated SQL artifact
# earlier in the same run.
name: Validate Metadata

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version the caller's build job resolved (the venv cache key includes it)
        type: string
        default: '3.11'
      clone-bigquery-etl:
        description: Clone mozilla/bigquery-etl for the bqetl tooling (set by callers other than bigquery-etl)
        type: boolean
        default: false
      bigquery-etl-ref:
        description: Branch or tag of mozilla/bigquery-etl to clone when clone-bigquery-etl is set
        type: string
        default: main
      generated-sql-artifact:
        description: Name of the artifact holding the generated sql/ directory
        type: string
        default: generated-sql
      generated-unittests-artifact:
        description: >-
          Name of an artifact holding generated tests/sql/ to copy into place before validating.
          Empty skips it.
        type: string
        default: ''

permissions: {}

jobs:
  validate-metadata:
    name: Validate Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: dev
      deployment: false
    env:
      # Where the setup-bqetl action put the bigquery-etl checkout and its venv
      BQETL_ROOT: ${{ inputs.clone-bigquery-etl && 'bigquery-etl' || '.' }}
      BQETL_VENV: ${{ inputs.clone-bigquery-etl && 'bigquery-etl/venv' || '.venv' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clone bigquery-etl
        if: inputs.clone-bigquery-etl
        env:
          BQETL_REF: ${{ inputs.bigquery-etl-ref }}
        run: |
          git clone --filter=blob:none --depth 1 --branch "$BQETL_REF" \
            https://github.com/mozilla/bigquery-etl.git
      - name: Set up bqetl
        if: inputs.clone-bigquery-etl
        uses: ./bigquery-etl/.github/actions/setup-bqetl
        with:
          path: bigquery-etl
          python-version: ${{ inputs.python-version }}
      - name: Set up bqetl
        if: ${{ !inputs.clone-bigquery-etl }}
        uses: ./.github/actions/setup-bqetl
        with:
          python-version: ${{ inputs.python-version }}
      # Must run on the source sql/, before the generated tree (with
      # default_table_workgroup_access merged in) replaces it
      - name: Validate workgroup access configuration
        run: |
          PATH="$BQETL_VENV/bin:$PATH" "$BQETL_ROOT/script/bqetl" metadata validate-workgroups sql/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.generated-sql-artifact }}
          path: /tmp/workspace/${{ inputs.generated-sql-artifact }}
      - name: Move generated SQL into place
        env:
          GENERATED_SQL_ARTIFACT: ${{ inputs.generated-sql-artifact }}
        run: |
          rm -rf sql/
          cp -r "/tmp/workspace/$GENERATED_SQL_ARTIFACT/sql" sql
      # Copies the generated tests into tests/sql/, where metadata validate looks
      - if: inputs.generated-unittests-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.generated-unittests-artifact }}
          path: /tmp/workspace/${{ inputs.generated-unittests-artifact }}
      - name: Move generated unit tests into place
        if: inputs.generated-unittests-artifact != ''
        env:
          GENERATED_UNITTESTS_ARTIFACT: ${{ inputs.generated-unittests-artifact }}
        run: cp -r "/tmp/workspace/$GENERATED_UNITTESTS_ARTIFACT/tests/sql/." tests/sql/
      - name: Verify that metadata files are valid
        run: |
          PATH="$BQETL_VENV/bin:$PATH" "$BQETL_ROOT/script/bqetl" metadata validate
      - name: Copy generated SQL for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: validate-metadata-debug-sql
          path: sql
