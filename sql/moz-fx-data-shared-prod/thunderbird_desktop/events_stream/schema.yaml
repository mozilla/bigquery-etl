fields:
- name: event_id
  type: STRING
  mode: NULLABLE
  description: Unique event ID (typically a concatenation of `document_id` and `document_event_number`).
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: A JSON string containing any payload properties not present in the
    schema
- name: client_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: The build identifier generated by the CI system (e.g. "1234/A").
      For language bindings that provide automatic detection for this value, (e.g.
      Android/Kotlin), in the unlikely event that the build identifier can not be
      retrieved from the OS, it is set to "inaccessible". For other language bindings,
      if the value was not provided through configuration, this metric gets set to
      `Unknown`.
  - name: app_channel
    type: STRING
    mode: NULLABLE
    description: The channel the application is being distributed on.
  - name: app_display_version
    type: STRING
    mode: NULLABLE
    description: The user visible version string (e.g. "1.0.3").  In the unlikely
      event that the display version can not be retrieved, it is set to "inaccessible".
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: The architecture of the device, (e.g. "arm", "x86").
  - name: attribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: campaign
      type: STRING
      mode: NULLABLE
      description: The attribution campaign (e.g. 'mozilla-org').
    - name: content
      type: STRING
      mode: NULLABLE
      description: The attribution content (e.g. 'firefoxview').
    - name: medium
      type: STRING
      mode: NULLABLE
      description: The attribution medium (e.g. 'organic' for a search engine).
    - name: source
      type: STRING
      mode: NULLABLE
      description: The attribution source (e.g. 'google-play').
    - name: term
      type: STRING
      mode: NULLABLE
      description: The attribution term (e.g. 'browser with developer tools for android').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: device_manufacturer
    type: STRING
    mode: NULLABLE
    description: The manufacturer of the device the application is running on. Not
      set if the device manufacturer can't be determined (e.g. on Desktop).
  - name: device_model
    type: STRING
    mode: NULLABLE
    description: The model of the device the application is running on. On Android,
      this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL". Not
      set if the device model can't be determined (e.g. on Desktop).
  - name: distribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
      description: The distribution name (e.g. 'MozillaOnline').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: first_run_date
    type: STRING
    mode: NULLABLE
    description: The date of the first run of the application.
  - name: locale
    type: STRING
    mode: NULLABLE
    description: The locale of the application during initialization (e.g. "es-ES").
      If the locale can't be determined on the system, the value is ["und"](https://unicode.org/reports/tr35/#Unknown_or_Invalid_Identifiers),
      to indicate "undetermined".
  - name: os
    type: STRING
    mode: NULLABLE
    description: 'The name of the operating system. Possible values: Android, iOS,
      Linux, Darwin, Windows, FreeBSD, NetBSD, OpenBSD, Solaris, unknown'
  - name: os_version
    type: STRING
    mode: NULLABLE
    description: The user-visible version of the operating system (e.g. "1.2.3").
      If the version detection fails, this metric gets set to `Unknown`.
  - name: telemetry_sdk_build
    type: STRING
    mode: NULLABLE
    description: The version of the Glean SDK
  - name: build_date
    type: STRING
    mode: NULLABLE
    description: The date & time the application was built
  - name: session_id
    type: STRING
    mode: NULLABLE
    description: An optional UUID uniquely identifying the client's current session.
  - name: session_count
    type: INTEGER
    mode: NULLABLE
    description: An optional running counter of the number of sessions for a client.
  - name: windows_build_number
    type: INTEGER
    mode: NULLABLE
    description: The optional Windows build number, reported by Windows (e.g. 22000)
      and not set for other platforms
- name: document_id
  type: STRING
  mode: NULLABLE
  description: The document ID specified in the URI when the client sent this message
- name: metadata
  type: RECORD
  mode: NULLABLE
  fields:
  - name: geo
    type: RECORD
    mode: NULLABLE
    fields:
    - name: city
      type: STRING
      mode: NULLABLE
    - name: country
      type: STRING
      mode: NULLABLE
      description: An ISO 3166-1 alpha-2 country code
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo database version used for this lookup
    - name: subdivision1
      type: STRING
      mode: NULLABLE
      description: First major country subdivision, typically a state, province, or
        county
    - name: subdivision2
      type: STRING
      mode: NULLABLE
      description: Second major country subdivision; not applicable for most countries
    description: Results of a geographic lookup based on the client's IP address
  - name: header
    type: RECORD
    mode: NULLABLE
    fields:
    - name: date
      type: STRING
      mode: NULLABLE
      description: Date HTTP header
    - name: dnt
      type: STRING
      mode: NULLABLE
      description: DNT (Do Not Track) HTTP header
    - name: x_debug_id
      type: STRING
      mode: NULLABLE
      description: X-Debug-Id HTTP header
    - name: x_foxsec_ip_reputation
      type: STRING
      mode: NULLABLE
      description: X-Foxsec-IP-Reputation header (deprecated, https://mozilla-hub.atlassian.net/browse/DENG-10434)
    - name: x_lb_tags
      type: STRING
      mode: NULLABLE
      description: X-LB-Tags HTTP header
    - name: x_pingsender_version
      type: STRING
      mode: NULLABLE
      description: X-PingSender-Version HTTP header
    - name: x_source_tags
      type: STRING
      mode: NULLABLE
      description: X-Source-Tags HTTP header
    - name: x_telemetry_agent
      type: STRING
      mode: NULLABLE
      description: X-Telemetry-Agent HTTP header
    - name: parsed_date
      type: TIMESTAMP
      mode: NULLABLE
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
    - name: parsed_x_lb_tags
      type: RECORD
      mode: NULLABLE
      fields:
      - name: tls_version
        type: STRING
        mode: NULLABLE
      - name: tls_cipher_hex
        type: STRING
        mode: NULLABLE
    description: Headers included in the client's HTTP request
  - name: isp
    type: RECORD
    mode: NULLABLE
    fields:
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo ISP database version used for this lookup
    - name: name
      type: STRING
      mode: NULLABLE
      description: The name of the ISP associated with the client's IP address
    - name: organization
      type: STRING
      mode: NULLABLE
      description: The name of a specific business entity associated with the client's
        IP address when available; otherwise the ISP name
    description: Results of ISP lookup based on the client's IP address
  - name: user_agent
    type: RECORD
    mode: NULLABLE
    fields:
    - name: browser
      type: STRING
      mode: NULLABLE
    - name: os
      type: STRING
      mode: NULLABLE
    - name: version
      type: STRING
      mode: NULLABLE
    description: Parsed components of the client's user agent string
- name: metrics
  type: JSON
  mode: NULLABLE
  description: Metrics recorded along with the event, grouped by type and stored as
    a JSON object.
- name: normalized_app_name
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized app name
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized channel name
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized OS name
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
- name: ping_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: seq
    type: INTEGER
    mode: NULLABLE
  - name: start_time
    type: STRING
    mode: NULLABLE
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: end_time
    type: STRING
    mode: NULLABLE
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: ping_type
    type: STRING
    mode: NULLABLE
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: Hashed version of client_id (if present) useful for partitioning; ranges
    from 0 to 99
- name: submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Time when the ingestion edge server accepted this message
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
- name: app_version_patch
  type: NUMERIC
  mode: NULLABLE
- name: is_bot_generated
  type: BOOLEAN
  mode: NULLABLE
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the client.
- name: reason
  type: STRING
  mode: NULLABLE
- name: experiments
  type: JSON
  mode: NULLABLE
  description: Any active experiments, stored as a JSON object.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_profile_group_id` UUID metric,
    so this column will always be null.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_client_id` UUID metric, so
    this column will always be null.
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: When the event ostensibly occurred based on data reported by the client
    (so be wary that unrealistic values are possible).
- name: event_category
  type: STRING
  mode: NULLABLE
- name: event_name
  type: STRING
  mode: NULLABLE
- name: event
  type: STRING
  mode: NULLABLE
  description: Fully qualified event name prefixed with the event category separated
    by a dot.
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: Event extras, stored as a JSON object.
- name: document_event_number
  type: INTEGER
  mode: NULLABLE
  description: Which event number this was in the original document, in chronological
    order.
- name: extras
  type: RECORD
  mode: NULLABLE
  description: Event extras, grouped by type.
  fields:
  - name: boolean
    type: RECORD
    mode: NULLABLE
    description: Boolean event extras.
    fields:
    - name: after_reset
      type: BOOLEAN
      mode: NULLABLE
      description: Set to true if the storage.local IndexedDB was still corrupted
        right after being completely reset.
    - name: alt_text_modal
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the alt text modal was displayed and the user clicked
        save, or if it was skipped and the image was added directly after selection.
    - name: always_ask
      type: BOOLEAN
      mode: NULLABLE
      description: The state of the "Always ask me when I click an email link" checkbox
        when the button was clicked.
    - name: auto_show
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the panel was opened automatically or manually by the user.
    - name: auto_translate
      type: BOOLEAN
      mode: NULLABLE
      description: True if this translation was triggered automatically due to configured
        always-translate-language settings. False if this translation was triggered
        manually.
    - name: baseline
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The violation was triggered by the kBaselineChromeCSP.

        * The violation was triggered by the kBaselineSystemCSP.'
    - name: blocked
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the load was blocked using our temporary pref
    - name: breached
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login is marked as breached or not. If a login is both
        breached and vulnerable, it will only be reported as breached.
    - name: can_stage
      type: BOOLEAN
      mode: NULLABLE
      description: Is this process allowed to using staging updates?
    - name: cancelled
      type: BOOLEAN
      mode: NULLABLE
      description: Whether this load has been cancelled.
    - name: confident
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the language detection was confident in the result.
    - name: cta_shown
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the Search button was actually shown (a default engine
        existed and the query derivation produced a query). False when the CTA page
        rendered but the Search button was suppressed (no engine, connectivity lost,
        or an unusable host), leaving Reload only.
    - name: description_changed
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the default description was changed.
    - name: did_edit_pw
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated password was modified by the user
        typing into the password field.
    - name: did_edit_un
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated username was modified by the user
        typing into the username field.
    - name: did_select_pw
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated password was selected by the user
        choosing a suggested value from the autocomplete popup.
    - name: did_select_un
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the saved/updated username was selected by the user
        choosing a suggested value from the autocomplete popup.
    - name: filled
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the browser filled the login details for the user vs. typing
        saved values.
    - name: form_action_origin_fixable
      type: BOOLEAN
      mode: NULLABLE
      description: Whether our logic would be able to fix the form action origin
    - name: had_errors
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the migration had errors.
    - name: hadPreviousJwt
      type: BOOLEAN
      mode: NULLABLE
      description: Whether a previous auth JWT was present, i.e. this was a renewal
        rather than a first enrollment.
    - name: has_been_saved
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the signature was saved.
    - name: has_description
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the signature has a description.
    - name: has_empty_password
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has an empty password
    - name: has_form_action_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login includes a form action origin
    - name: has_ftp_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login origin string contains indications of an FTP
        scheme
    - name: has_http_realm
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login includes a http realm
    - name: has_non_http_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has an origin or form_action_origin
        which does not start with http:// or https://
    - name: has_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login includes an origin
    - name: has_punycode_form_action_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has a punycode form_action_origin
    - name: has_punycode_origin
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the login to add/modify/remove has a punycode origin

        * Whether the login to add/modify/remove has a punycode origin or form_action_origin'
    - name: has_rtcp_mux
      type: BOOLEAN
      mode: NULLABLE
      description: Whether muxing RTCP with RTP data was negotiated for the m-section.
    - name: has_single_dot_origin
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has an origin or form_action_origin
        consisting of a single dot only
    - name: has_sts
      type: BOOLEAN
      mode: NULLABLE
      description: If the error page is for a site with HSTS headers or with a pinned
        key.
    - name: has_username_line_break
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has a username containing
        a line break
    - name: has_username_nul
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove has a username containing
        a Nul char
    - name: hidden
      type: BOOLEAN
      mode: NULLABLE
      description: The document is hidden.
    - name: hit
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the completion matched an entry in the table.
    - name: hls_decoder
      type: BOOLEAN
      mode: NULLABLE
      description: This value will only be set on Android. It tells that whether playback
        is performed by the HLS decoder, which utilizes the external player to play
        video.
    - name: hyphen_compat
      type: BOOLEAN
      mode: NULLABLE
      description: If the error is due to wildcard trying to match reference ID label
        with hyphen at begin/end
    - name: inPrivateBrowsing
      type: BOOLEAN
      mode: NULLABLE
      description: True if IP Protection was started in a private browsing window.
    - name: is_addon_active
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the WebExtensionPolicy associated to the add-on was active
        at the time we are collecting this event.
    - name: is_background
      type: BOOLEAN
      mode: NULLABLE
      description: Was this a background update?
    - name: is_deleted
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login to add/modify/remove is a deletion stub
    - name: is_destroying
      type: BOOLEAN
      mode: NULLABLE
      description: True if toolbox destroy already started when the error occurred.
    - name: is_encrypted
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the email was encrypted.
    - name: is_frame
      type: BOOLEAN
      mode: NULLABLE
      description: If the error page is loaded in an iframe.
    - name: is_hardware_accelerated
      type: BOOLEAN
      mode: NULLABLE
      description: True if the decoder used when the error occurred is a hardware
        decoder.
    - name: is_hardware_decoding
      type: BOOLEAN
      mode: NULLABLE
      description: True if the first frame is decoded by a hardware decoder.
    - name: is_hdr
      type: BOOLEAN
      mode: NULLABLE
      description: True if the playback is from a HDR video content.
    - name: is_lang_attribute_valid
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the language tag of the page is a valid language tag.
    - name: is_local_tab
      type: BOOLEAN
      mode: NULLABLE
      description: True if the toolbox is debugging a local tab.
    - name: is_patch
      type: BOOLEAN
      mode: NULLABLE
      description: Is this a partial (patch) MAR? true if so. false if it was a full
        MAR.
    - name: is_remote_ice_lite
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the remote peer is using ICE-Lite.
    - name: is_signed
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the email was digitally signed.
    - name: is_success
      type: BOOLEAN
      mode: NULLABLE
      description: Did the update complete successfully?
    - name: is_top_level_frame
      type: BOOLEAN
      mode: NULLABLE
      description: Set to true if the extension page was a top-level frame.
    - name: is_window_closed
      type: BOOLEAN
      mode: NULLABLE
      description: True if the window owning the toolbox is closed.
    - name: isBlock
      type: BOOLEAN
      mode: NULLABLE
      description: boolean representing if this was a block or an unblock
    - name: isDecryptSuccess
      type: BOOLEAN
      mode: NULLABLE
      description: Records if the decryption was a success or failure.
    - name: issued_by_cca
      type: BOOLEAN
      mode: NULLABLE
      description: If trusting the CCA India roots would fix this error.
    - name: lang_tags_match
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the identified language matches the HTML lang attribute.
    - name: no_connectivity
      type: BOOLEAN
      mode: NULLABLE
      description: Whether Firefox considers the device offline (OS link bit is down).
        Only true for dnsNotFound when RPMHasConnectivity() returns false.
    - name: origin_fixable
      type: BOOLEAN
      mode: NULLABLE
      description: Whether our logic would be able to fix the origin
    - name: poisoned
      type: BOOLEAN
      mode: NULLABLE
      description: Whether there was a previous error, meaning that this event must
        be viewed with caution.
    - name: primary_password_set
      type: BOOLEAN
      mode: NULLABLE
      description: Whether a Primary Password was set at the time of the run.
    - name: psi_available
      type: BOOLEAN
      mode: NULLABLE
      description: PSI values are available.
    - name: reset_disabled
      type: BOOLEAN
      mode: NULLABLE
      description: Whether automatically reset corrupted databases is disabled.
    - name: restricted
      type: BOOLEAN
      mode: NULLABLE
      description: Set to true if the matching was restricted.
    - name: sampled_in
      type: BOOLEAN
      mode: NULLABLE
      description: Whether this session is sampled in (true) or sampled out (false).
        Events from sampled-out sessions are suppressed; this field lets analysts
        validate that the observed sampling rate matches the configured rate.
    - name: saved
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates if the signature was saved.
    - name: smartblockEmbedTogglesShown
      type: BOOLEAN
      mode: NULLABLE
      description: boolean representing if smartblock toggles were shown to the user
    - name: smartblockToggleClicked
      type: BOOLEAN
      mode: NULLABLE
      description: boolean representing if the user interacted with the toggle anytime
        before it was closed
    - name: status
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * true (resp. false) if the user enables (resp. disables) the AI generation.

        * true if the user edits the generated text.'
    - name: suggestion_shown
      type: BOOLEAN
      mode: NULLABLE
      description: 'Whether the "did you mean" alternate-host suggestion was present
        on the page. Provides the denominator for the "clicked-suggestion" reason,
        which is otherwise uninterpretable: a low rate cannot be distinguished from
        the suggestion rarely being offered. Content-free (whether a suggestion existed,
        never what it was).'
    - name: sync
      type: BOOLEAN
      mode: NULLABLE
      description: Was the load synchronous
    - name: toggle_state
      type: BOOLEAN
      mode: NULLABLE
      description: The toggle state after the event.
    - name: toggled_on
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * - Whether the setting was toggled on or off for this language.

        * - Whether the setting was toggled on or off.

        * - Whether the setting was toggled on or off for this site.'
    - name: triggered_externally
      type: BOOLEAN
      mode: NULLABLE
      description: If Firefox was invoked to handle the link this value is true and
        if the callee comes from within Firefox, this value is false
    - name: trr_only
      type: BOOLEAN
      mode: NULLABLE
      description: Whether this is a TRR-only (DoH strict mode) DNS failure.
    - name: userAction
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * If the VPN was connected by a user action.

        * If the VPN was disconnected by a user action.'
    - name: vulnerable
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the login is marked as vulnerable or not. If a login is
        both breached and vulnerable, it will only be reported as breached.
    - name: wasActive
      type: BOOLEAN
      mode: NULLABLE
      description: True if the previous state was the active state, otherwise false.
  - name: quantity
    type: RECORD
    mode: NULLABLE
    description: Quantity event extras.
    fields:
    - name: active_this_session
      type: INTEGER
      mode: NULLABLE
      description: Amount of seconds this notification was active in this session.
    - name: address_books
      type: INTEGER
      mode: NULLABLE
      description: Number of address books to sync found.
    - name: attempt
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of prior restore attempts across sessions (0 on the first attempt).
        Restores stop being attempted once this reaches its budget.

        * How many launches had already tried and failed before this one, 0 on the
        first. A retry emits an otherwise identical event, so this is what separates
        a profile that failed once from one failing every time. The migrator gives
        up after 3.

        * Number of prior migration attempts across sessions (0 on the first attempt).'
    - name: attemptCount
      type: INTEGER
      mode: NULLABLE
      description: The number of NS requests that were issued for this confirmation.
    - name: average_chunk_time
      type: INTEGER
      mode: NULLABLE
      description: The mean milliseconds elapsed between consecutive generated (non-prompt)
        chunks for a streamed text generation run. Null when fewer than two generated
        chunks were produced.
    - name: average_words_per_request
      type: INTEGER
      mode: NULLABLE
      description: The average count of words that this engine translated per request.
    - name: average_words_per_second
      type: INTEGER
      mode: NULLABLE
      description: The average words per second that this engine translated per request.
    - name: buffering_time
      type: INTEGER
      mode: NULLABLE
