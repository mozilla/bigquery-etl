sources:
  {{ project }}.telemetry.desktop_active_users:
    # os_version integrates Windows build number.
    - submission_date: 2020-01-03
      app_name: {{ app_name }}
      client_id: client-5
      sample_id: 5
      os: Windows_NT
      normalized_os_version: 10.0
      windows_build_number: 26100
      is_daily_user: False
      is_weekly_user: False
      is_monthly_user: False
    # os_version unaffected by indows build number for Linux.
    - submission_date: 2020-01-03
      app_name: {{ app_name }}
      client_id: client-6
      sample_id: 6
      os: Linux
      is_daily_user: True
      is_weekly_user: True
      is_monthly_user: True

parameters:
  - name: submission_date
    type: DATE
    value: 2020-01-03

expect:
  - submission_date: 2020-01-03
    app_name: {{ app_name }}
    city: ??
    country: ??
    os_version_major: 10
    os_version_minor: 0
    os: Windows_NT
    os_version_build: Windows 11
    daily_users: 0
    weekly_users: 0
    monthly_users: 0
    dau: 0
    wau: 0
    mau: 0
  - submission_date: 2020-01-03
    app_name: {{ app_name }}
    city: ??
    country: ??
    os: Linux
    os_version_major: 0
    os_version_minor: 0
    daily_users: 1
    weekly_users: 1
    monthly_users: 1
    dau: 0
    wau: 0
    mau: 0
