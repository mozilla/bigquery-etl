friendly_name: Deepnote Audit Log
description: |-
  Audit log events of Mozilla's Deepnote workspaces, from the Deepnote API. IP
  addresses are not imported. The entity `resource_id` refers to depends on
  `event_type`.
owners:
- ascholtz@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: client_level
scheduling:
  dag_name: bqetl_deepnote
  arguments:
  - --api-key-env-vars
  - DEEPNOTE_API_KEY
  - DEEPNOTE_ADS_API_KEY
  - DEEPNOTE_REVENUECAT_1_API_KEY
  - DEEPNOTE_REVENUECAT_2_API_KEY
  - DEEPNOTE_MARKETING_API_KEY
  - DEEPNOTE_MONITOR_API_KEY
  partition_parameter: null
  secrets:
  - deploy_target: DEEPNOTE_API_KEY
    key: bqetl_deepnote_api_key
  - deploy_target: DEEPNOTE_ADS_API_KEY
    key: bqetl_deepnote_ads_api_key
  - deploy_target: DEEPNOTE_REVENUECAT_1_API_KEY
    key: bqetl_deepnote_revenuecat_1_api_key
  - deploy_target: DEEPNOTE_REVENUECAT_2_API_KEY
    key: bqetl_deepnote_revenuecat_2_api_key
  - deploy_target: DEEPNOTE_MARKETING_API_KEY
    key: bqetl_deepnote_marketing_api_key
  - deploy_target: DEEPNOTE_MONITOR_API_KEY
    key: bqetl_deepnote_monitor_api_key
bigquery:
  time_partitioning:
    type: day
    field: created_at
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - event_type
