sources:
  moz-fx-data-shared-prod.search_derived.search_kpi_daily_v1:
    # Kept: counted rows, including is_bot NULL (mobile) and a component with no label.
    - &base
      submission_date: "2026-10-28"
      platform: desktop
      country: US
      normalized_channel: release
      os: Windows
      app_version_major: 150
