sources:
  moz-fx-data-shared-prod.subscription_platform_derived.apple_subscriptions_changelog_v1:
    # Subscription 3: no synthetic record because latest change too recent
    - timestamp: 2999-03-03 00:00:00Z
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s3
        status: 3
        last_transaction:
          expires_date: 2000-03-01 00:00:00Z
        renewal_info:
          auto_renew_status: 1
  moz-fx-data-shared-prod.subscription_platform_derived.apple_subscriptions_revised_changelog_v1:
    # Subscription 1: no synthetic record because subscription not in billing retry period
    - id: s1-2000-01-01T00:00:00.000000-UPDATE
      timestamp: 2000-01-01 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s1
        status: 2
        last_transaction:
          expires_date: 2000-01-01 00:00:00Z
        renewal_info:
          auto_renew_status: 1

    # Subscription 2: no synthetic record because expires date too recent
    - id: s2-2000-02-01T00:00:00.000000-UPDATE
      timestamp: 2000-02-01 00:00:00Z
