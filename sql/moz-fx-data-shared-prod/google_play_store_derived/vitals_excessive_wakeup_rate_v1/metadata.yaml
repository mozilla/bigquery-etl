friendly_name: Vitals - Excessive Wakeup Rate
description: |-
  Contains daily report of excessive wakeup rate (more than 10 wakeups per hour) metrics for the following apps:
  - org.mozilla.firefox
  - org.mozilla.firefox_beta
  - org.mozilla.fenix
  - org.mozilla.focus

  Docs: https://developers.google.com/play/developer/reporting/reference/rest/v1beta1/vitals.excessivewakeuprate
owners:
- ecassell@mozilla.com
labels:
  level: bronze
  incremental: true
  owner1: ecassell
  dag: bqetl_google_play_store
scheduling:
  dag_name: bqetl_google_play_store
  arguments:
  - --date={{macros.ds_add(ds, -7)}}
  date_partition_offset: -7
  secrets:
  - deploy_target: GOOGLE_PLAY_STORE_SRVC_ACCT_INFO
    key: bqetl_google_play_store_developer_reporting_api_data_boxwood
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
require_column_descriptions: true
