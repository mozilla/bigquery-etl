# Reusable workflow, called from build.yml here and from mozilla/private-bigquery-etl.
#
# Jobs run in the caller's context: the checkout is the caller's repo, and secrets,
# vars and the dev environment come from it too. A caller other than bigquery-etl sets
# clone-bigquery-etl so the bqetl tooling is cloned into bigquery-etl/.
#
# Expects the caller's deploy-changes-to-stage job to have uploaded the
# staged-generated-sql artifact earlier in the same run.
name: Dry Run SQL

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version the caller's build job resolved (the venv cache key includes it)
        type: string
        default: '3.11'
      clone-bigquery-etl:
        description: Clone mozilla/bigquery-etl for the bqetl tooling (set by callers other than bigquery-etl)
        type: boolean
        default: false
      bigquery-etl-ref:
        description: Branch or tag of mozilla/bigquery-etl to clone when clone-bigquery-etl is set
        type: string
        default: main
    secrets:
      GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL:
        description: Service account for the dry run function. Not needed if it's a dev environment secret in the caller's repo.
        required: false

permissions: {}

jobs:
  dry-run-sql:
    name: Dry Run SQL
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: dev
      deployment: false
    env:
      # Where the setup-bqetl action put the bigquery-etl checkout and its venv
      BQETL_ROOT: ${{ inputs.clone-bigquery-etl && 'bigquery-etl' || '.' }}
      BQETL_VENV: ${{ inputs.clone-bigquery-etl && 'bigquery-etl/venv' || '.venv' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clone bigquery-etl
        if: inputs.clone-bigquery-etl
        env:
          BQETL_REF: ${{ inputs.bigquery-etl-ref }}
        run: |
          git clone --filter=blob:none --depth 1 --branch "$BQETL_REF" \
            https://github.com/mozilla/bigquery-etl.git
      - name: Set up bqetl
        if: inputs.clone-bigquery-etl
        uses: ./bigquery-etl/.github/actions/setup-bqetl
        with:
          path: bigquery-etl
          python-version: ${{ inputs.python-version }}
      - name: Set up bqetl
        if: ${{ !inputs.clone-bigquery-etl }}
        uses: ./.github/actions/setup-bqetl
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: staged-generated-sql
          path: /tmp/workspace/staged-generated-sql
      - name: Move sql deployed on stage into place
        run: |
          rm -rf sql/
          cp -r /tmp/workspace/staged-generated-sql/sql sql
          rm -rf tests/
          cp -r /tmp/workspace/staged-generated-sql/tests tests
      - name: Authenticate to GCP (OIDC)
        id: auth-dryrun
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DRYRUN_SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          id_token_audience: 'https://us-central1-moz-fx-data-shared-prod.cloudfunctions.net/dryrun'
          id_token_include_email: true
      - name: Dry run queries
        env:
          SKIP_STAGE_DEPLOYS: ${{ github.event.inputs.skip-stage-deploys }}
          GOOGLE_GHA_ID_TOKEN: ${{ steps.auth-dryrun.outputs.id_token }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "Skip dryruns on main. Dryruns will run in Airflow"
            exit 0
          elif git log --format=%B --no-merges -n 1 | grep -qF '[run-tests]'; then
            echo "Check dry run for all queries because [run-tests] in commit message"
            PATHS=sql
          elif [ "$SKIP_STAGE_DEPLOYS" = "true" ]; then
            PATHS=sql
          elif [ -d "sql/moz-fx-data-integration-tests" ]; then
            PATHS="sql/moz-fx-data-integration-tests"
          else
            echo "Integration tests directory not found, skipping dryrun"
            exit 0
          fi
          echo "$PATHS"
          PATH="$BQETL_VENV/bin:$PATH" "$BQETL_ROOT/script/bqetl" dryrun --validate-schemas $PATHS
      - name: Copy generated SQL to save for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dry-run-sql-debug-sql
          path: sql
