---
friendly_name: Nimbus Population Sizing Client Pool (Desktop)
description: |-
  Pre-materialized 7-day rolling window of deduplicated, 10%-sampled Firefox
  Desktop clients for Nimbus pre-launch population sizing.

  Deduplicates on client_info.client_id, keeping the latest ping per client.
  Preserves the full metrics.* structure so population sizing COUNTIF queries
  can reference any targeting context column without modification.

  Consumed by experiment_population_estimates_v1 to run per-experiment
  COUNTIF queries without inline deduplication or date arithmetic.
owners:
  - ykhurana@mozilla.com
labels:
  owner1: nimbus
scheduling:
  dag_name: bqetl_experiments_daily
  arguments: ["--date", "{{ ds }}"]
  referenced_tables:
    - ['moz-fx-data-shared-prod', 'firefox_desktop', 'nimbus_targeting_context']
bigquery:
  time_partitioning:
    type: day
    field: null
    require_partition_filter: false
    expiration_days: 14
