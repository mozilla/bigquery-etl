2026-07-31:
  start_date: 2026-04-06
  end_date: 2026-07-30
  reason: |-
    https://mozilla-hub.atlassian.net/browse/DENG-11356
    Populate the play_store_attribution_* fields for clients first seen from the 2026-04-06
    ping cutover onwards, from the dedicated play_store_attribution ping. Follow-up to the
    query fix in #9740. Custom per-partition sidefill, because this table is depends_on_past
    with a null date_partition_parameter, so the day-by-day path via query.sql is rejected and
    a full reinitialize would rewrite every partition back to 2020.

    BEFORE INITIATING: bump entry_date and end_date so that end_date is the day before the
    first scheduled run of the fixed query. #9740 only writes attribution for a client on its
    own first-seen day; on later runs the final SELECT keeps the already-written NULL via
    COALESCE(_previous.play_store_attribution_*, _current.play_store_attribution_*). Any
    first_seen_date falling between this end_date and the fix's first run would therefore stay
    NULL permanently. Refreshing entry_date also matters because an Initiate entry is no longer
    picked up once it is more than 28 days old (MAX_BACKFILL_ENTRY_AGE_DAYS).

    WHEN RUNNING `backfill complete`: pause the bqetl_analytics_tables.firefox_android_clients
    Airflow task first and unpause it afterwards. Completion copies the staging partitions into
    production one at a time, while the scheduled task overwrites the whole table on every run,
    so a run overlapping the copy loop would silently revert partitions already copied.
  watchers:
  - phlee@mozilla.com
  status: Complete
  custom_query_path: sql/moz-fx-data-shared-prod/fenix_derived/firefox_android_clients_v1/backfill_deng_11356.sql
  override_depends_on_past_null_partition: true
  override_depends_on_past_end_date: true
  shredder_mitigation: false
  override_retention_limit: false
  ignore_date_partition_offset: false
