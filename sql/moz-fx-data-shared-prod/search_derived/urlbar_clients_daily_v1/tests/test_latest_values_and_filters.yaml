sources:
  moz-fx-data-shared-prod.firefox_desktop_derived.urlbar_events_v2:
    # Prefs come from the client's latest event that day; the profile group id is the
    # latest non-null one. The last two rows must be filtered out.

    # Earlier event: sponsored on, profile group id present.
    - submission_date: "2026-10-14"
      glean_client_id: client-a
      profile_group_id: group-a
      sample_id: 1
      event_name: abandonment
      event_timestamp: 100
      event_id: e1
      pref_fx_suggestions: true
      pref_sponsored_suggestions: true
      pref_ohttp_available: true
      pref_ohttp_enabled: false
      pref_data_collection: false
      interaction: typed
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}
    # Latest event: sponsored off, profile group id null.
    - submission_date: "2026-10-14"
      glean_client_id: client-a
      sample_id: 1
      event_name: abandonment
      event_timestamp: 200
      event_id: e2
      pref_fx_suggestions: true
      pref_sponsored_suggestions: false
      pref_ohttp_available: true
      pref_ohttp_enabled: true
      pref_data_collection: true
      interaction: typed
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}
    # No Glean client id: dropped.
    - submission_date: "2026-10-14"
      sample_id: 3
      event_name: abandonment
      event_timestamp: 100
      event_id: e3
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      interaction: typed
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}
    # Another day: dropped.
    - submission_date: "2026-10-13"
      glean_client_id: client-a
      sample_id: 1
      event_name: abandonment
      event_timestamp: 100
      event_id: e4
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      interaction: typed
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}

parameters:
  - name: submission_date
    type: DATE
    value: "2026-10-14"

expect:
  # NULL columns are omitted: the harness drops null keys from the result row.

  # Prefs from e2 (the latest), profile group id from e1 (the latest non-null). Only the two
  # 2026-10-14 sessions are counted.
  - submission_date: "2026-10-14"
    client_id: client-a
    profile_group_id: group-a
    sample_id: 1
    pref_suggest_enabled: true
    pref_sponsored_enabled: false
    pref_online_suggest_available: true
    pref_online_suggest_enabled: true
    pref_data_collection: true
    sessions_total: 2
    sessions_engaged: 0
    sessions_abandoned: 2
    results:
      - window_mode: classic
        sap: urlbar
        interaction: typed
        result_type: search_engine
        product_result_type: search_engine
        result_group: heuristic
        clicks: 0
        sessions_shown: 2
        sessions_shown_abandoned: 2
        annoyances: 0
