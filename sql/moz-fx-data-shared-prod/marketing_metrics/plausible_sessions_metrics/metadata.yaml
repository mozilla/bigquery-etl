friendly_name: Plausible Sessions Metrics
description: |-
  Daily count of Plausible sessions (visits) to firefox.com. Plausible is only initialized in certain GEOs.

  Total visits is SUM(entrances). Bounce rate is SUM(bounces) /
  SUM(entrances); it exists only by entry page, not for pages in general.
  Always filter on date.

  Entrances to a page count only sessions that started on it. For all views
  of a page, including views reached from other pages, use pageviews in
  plausible_events_metrics.
