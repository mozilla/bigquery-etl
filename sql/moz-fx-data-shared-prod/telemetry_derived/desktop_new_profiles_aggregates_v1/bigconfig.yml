type: BIGCONFIG_FILE
tag_deployments:
- collection:
    name: Operational Checks
    notification_channels:
    - slack: '#de-bigeye-triage'
  deployments:
  - column_selectors:
    - name: moz-fx-data-shared-prod.moz-fx-data-shared-prod.telemetry_derived.desktop_new_profiles_aggregates_v1.new_profiles
    metrics:
    - metric_type:
        predefined_metric: SUM
      metric_name: new_profiles_linux
      conditions:
      - normalized_os = 'Linux'
      threshold:
        type: AUTO
        sensitivity: MEDIUM
      rct_overrides:
      - first_seen_date
  - column_selectors:
    - name: moz-fx-data-shared-prod.moz-fx-data-shared-prod.telemetry_derived.desktop_new_profiles_aggregates_v1.*
    metrics:
    - saved_metric_id: volume
    - saved_metric_id: freshness
