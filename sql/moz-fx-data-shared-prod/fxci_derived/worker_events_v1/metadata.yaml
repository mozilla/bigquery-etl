friendly_name: Firefox-CI Worker Events
description: |-
  Derived Firefox-CI worker-manager events exported from Taskcluster pulse.
owners:
- ahalberstadt@mozilla.com
labels:
  incremental: true
  owner1: ahalberstadt
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  range_partitioning: null
  clustering:
    fields:
    - worker_pool_id
    - worker_id
