friendly_name: Classification Probe Definitions
description: |-
  Interim copy of probe_definitions_v1, written by the column classification
  pipeline for the pings its tables map back to. Identical in schema to the
  upstream table: the fields are pulled from its schema.yaml, so the two cannot
  drift.

  It exists because the classification pipeline profiles into its own copy of
  column_profiles_v1 (the upstream profiler overwrites its whole profiled_at
  partition on every run, so sharing that table would erase the profiles
  written for the datasets it covers), and the probe fetcher runs off the
  lineage resolved from that copy. Since the fetcher likewise rebuilds its
  whole fetched_at partition, it writes here rather than into the shared table.
  Both copies are deleted once upstream supports additive writes, at which
  point the classification pipeline reads probe_definitions_v1 directly.
owners:
- akomarzewski@mozilla.com
- cmorales@mozilla.com
labels:
  incremental: true
  owner1: akomarzewski
  owner2: cmorales
bigquery:
  time_partitioning:
    type: day
    field: fetched_at
    require_partition_filter: false
    expiration_days: 90.0
  clustering:
    fields:
    - ping_platform
    - source_ping
workgroup_access:
- role: roles/bigquery.dataEditor
  members:
  - workgroup:dataplatform/data-governance-developers
