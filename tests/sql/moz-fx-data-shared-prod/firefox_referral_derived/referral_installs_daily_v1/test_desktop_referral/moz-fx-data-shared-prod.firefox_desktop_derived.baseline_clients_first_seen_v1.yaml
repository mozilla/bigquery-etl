# c1, c2 first-seen today via tok1/tok2 (current format) -> TESTCODE01, count 2.
# c5 first-seen today via tok4 (legacy `fxrefer:` format, underscored code) ->
# test_code_here, count 1.
# c3 first-seen today but its dltoken has no referral -> excluded.
# c4 carries a referral dltoken but was first seen on a prior day -> excluded by
# the first_seen_date = @submission_date filter.
# c6 resolves to the near-miss `fxreferral-2026` session -> excluded by the
# invite-code shape check, so no `ral-2026` row appears.
# attribution_ext is a JSON column — represent it as an inline object so it
# loads as JSON (a quoted string would load as a JSON string scalar and
# attribution_ext.dltoken would be NULL).
- client_id: "c1"
  submission_date: "2026-07-24"
  first_seen_date: "2026-07-24"
  attribution_ext: {dltoken: "tok1"}
