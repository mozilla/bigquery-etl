friendly_name: STMO Dashboards
description: |
  A copy of the `dashboards` table from the Redash (sql.telemetry.mozilla.org) metadata database, updated daily to match the current state of the table.
owners:
- bewu@mozilla.com
labels:
  schedule: daily
  dag: bqetl_stmo
  owner1: bewu
scheduling:
  dag_name: bqetl_stmo
  date_partition_parameter: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - EXTERNAL_QUERY('moz-fx-data-stmo-prod-33f2.us.stmo-cloudsql-prod', 'SELECT\n         id,\n         updated_at,\n         created_at,\n         org_id,\n         slug,\n         name,\n         user_email,\n         user_id,\n         layout,\n         dashboard_filters_enabled,\n         is_archived,\n         version,\n         is_draft,\n         tags\n       FROM\n         dashboards\n    ')
