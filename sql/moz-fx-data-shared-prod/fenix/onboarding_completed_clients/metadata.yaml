friendly_name: Onboarding Completed Clients
description: "User-facing view over onboarding_completed_clients_v1, which it exposes\n\
  unchanged. One row per Fenix client per day on which an `onboarding.completed`\n\
  event from them arrived, dated by submission date rather than by when the event\n\
  fired, so `client_id` is not unique here \u2014 a client with completions arriving\n\
  on more than one day appears once per day.\n\nCollapse on `client_id` before joining,\
  \ or the join fans out.\n`fenix.retention_clients` takes `MIN(completed_date)` per\
  \ client.\n\nCoverage begins 2025-01-01; completions before that date are absent\
  \ entirely.\nThe earliest date present for a\nclient is therefore not necessarily\
  \ their first completion \u2014 one who\ncompleted before it and again after appears\
  \ with only the later one."
