fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the Firefox Desktop telemetry ping is received on the
    server side, used as the primary partitioning dimension across aggregates and
    client-level tables in this dataset.
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: 'The release channel on which the Firefox Desktop build is distributed,
    normalized to one of: release, beta, nightly, aurora, esr, or Other.'
- name: app_version_major
  type: INTEGER
  mode: NULLABLE
  description: Firefox major version. Use it for the beta and release model eras.
- name: app_build_date
  type: DATE
  mode: NULLABLE
  description: Build date. Use it for the nightly model eras.
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: The ISO 3166-1 alpha-2 country code for the country in which Firefox
    Desktop activity took place, derived from IP geolocation at ingestion time (e.g.,
    "US", "DE").
- name: form_type
  type: STRING
  mode: NULLABLE
  description: Form type, `address` or `credit_card`.
- name: ml_version
  type: STRING
  mode: NULLABLE
  description: Revision of the ML field classifier. Address forms only.
- name: is_high_volume_client
  type: BOOLEAN
  mode: NULLABLE
  description: True if the client sent more than 400 autofill events on this day.
    Filter it out to remove the few clients that send most of the detection events.
- name: has_inferred_field
  type: BOOLEAN
  mode: NULLABLE
  description: True if at least one field type in the flow was inferred (regex, fathom
    or ml).
- name: has_autocomplete_field
  type: BOOLEAN
  mode: NULLABLE
  description: True if at least one field type in the flow came from the autocomplete
    attribute.
- name: flows
  type: INTEGER
  mode: NULLABLE
  description: Number of flows (form interactions).
- name: popup_flows
  type: INTEGER
  mode: NULLABLE
  description: Number of flows where the autofill popup was shown on at least one
    field.
- name: popup_autofilled_flows
  type: INTEGER
  mode: NULLABLE
  description: Of popup_flows, the number where autofill filled at least one field.
    Acceptance rate = popup_autofilled_flows / popup_flows.
- name: autofilled_flows
  type: INTEGER
  mode: NULLABLE
  description: Number of flows where autofill filled at least one field.
- name: submitted_flows
  type: INTEGER
  mode: NULLABLE
  description: Number of flows that were submitted.
- name: detected_fields
  type: INTEGER
  mode: NULLABLE
  description: Number of fields with an inferred type (regex, fathom or ml). Same
    as metric- hub `form_autofill_forms`.
- name: autofilled_fields
  type: INTEGER
  mode: NULLABLE
  description: Number of inferred fields that autofill filled. Equals modified_fields
    + net_kept_fields.
- name: modified_fields
  type: INTEGER
  mode: NULLABLE
  description: Number of inferred, autofilled fields that the user then edited.
- name: net_kept_fields
  type: INTEGER
  mode: NULLABLE
  description: Number of inferred, autofilled fields that the user did not edit.
