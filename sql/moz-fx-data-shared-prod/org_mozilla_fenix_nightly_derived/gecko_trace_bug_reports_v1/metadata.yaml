---
friendly_name: Gecko Trace Bug Reports
description: |-
  Records which trace patterns already have a Bugzilla bug.

  The weekly reporter uses this table to avoid duplicate bug filings.
  Each row links one stable_trace_id to one Bugzilla bug number.

owners:
  - jjalkanen@mozilla.com

labels:
  incremental: true
  schedule: weekly

scheduling:
  dag_name: bqetl_gecko_trace_weekly
  task_group: org_mozilla_fenix_nightly

bigquery:
  clustering:
    fields:
      - stable_trace_id
      - app_id
