# rust_yelp counted until 2026-10-01 and is excluded after (definition_version 2).
# The merino_wikipedia row starts after the test date, so definition_version stays 2.
# The android row shares a desktop result type's name and must be ignored.
- result_type: rust_adm_sponsored
  platform: desktop
  product_result_type: admarketplace_sponsored
  component: suggest_sponsored
  effective_from: "1970-01-01"
  reason: paid
  definition_version: 1
- result_type: rust_adm_sponsored
  platform: android
  product_result_type: admarketplace_sponsored
  component: excluded
  effective_from: "1970-01-01"
  reason: other platform
  definition_version: 1
- result_type: rust_wikipedia
