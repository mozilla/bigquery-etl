friendly_name: App-specific view for Glean ping "rust-component-errors"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox for iOS"
  (org_mozilla_ios_firefox.rust_component_errors, org_mozilla_ios_firefoxbeta.rust_component_errors, org_mozilla_ios_fennec.rust_component_errors).

  It is used by Looker.
owners: []
labels:
  sql_generator: glean_usage
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  view.sql:
  - moz-fx-data-shared-prod.org_mozilla_ios_fennec.rust_component_errors
  - moz-fx-data-shared-prod.org_mozilla_ios_firefox.rust_component_errors
  - moz-fx-data-shared-prod.org_mozilla_ios_firefoxbeta.rust_component_errors
