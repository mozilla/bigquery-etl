---
# dau divides each app's 28-day DAU sum by that app's days with rows in any country, then adds the apps and rounds.
# Desktop has rows on 2 days, Fenix on 3. AA: (30 + 281) / 2 + 250 / 3 = 238.8, rounded to 239.
# Klar and the days outside the window are left out.
- submission_date: 2026-11-02
  country_name: Country A
  mau: 70
  avg_hours_usage_daily: 2.0
  intensity: 1.0
  new_profile_rate: 0.0
  latest_version_ratio: 1.0
  top_addons:
  - addon_name: Addon A
    ratio: 1.0
  has_addon_ratio: 1.0
  top_locales:
  - locale: en-US
    ratio: 1.0
  mau_desktop: 70
  mau_mobile: 0
  dau: 239
# BB: no Desktop rows, plus (2 + 12) / 3 = 4.7, rounded to 5; Fenix's day with rows only in AA counts as 0 for BB.
# Averaging only BB's own 2 days would give 7.
- submission_date: 2026-11-02
  country_name: Country B
  mau: 6
  avg_hours_usage_daily: 2.0
  intensity: 1.0
  new_profile_rate: 0.0
  latest_version_ratio: 1.0
  top_addons:
  - addon_name: Addon A
    ratio: 1.0
  has_addon_ratio: 1.0
  top_locales:
  - locale: en-US
    ratio: 1.0
  mau_desktop: 0
  mau_mobile: 6
  dau: 5
# Worldwide: (30 + 281) / 2 + (2 + 250 + 12) / 3 = 243.5, rounded half up to 244.
- submission_date: 2026-11-02
  country_name: Worldwide
  mau: 76
  avg_hours_usage_daily: 2.0
  intensity: 1.0
  new_profile_rate: 0.0
  latest_version_ratio: 1.0
  top_addons:
  - addon_name: Addon A
    ratio: 1.0
  has_addon_ratio: 1.0
  top_locales:
  - locale: en-US
    ratio: 1.0
  mau_desktop: 70
  mau_mobile: 6
  dau: 244
