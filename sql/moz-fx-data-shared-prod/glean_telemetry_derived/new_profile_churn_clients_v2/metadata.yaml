friendly_name: New Profile Churn Clients - Desktop Glean
description: |-
  Client-level churn metrics for new Firefox Desktop profiles within their first 30 days.
  Each row represents a client in a complete cohort (first_seen_date), with a boolean activity
  flag for each of days 0-30 indicating whether the client was active on that day (TRUE) or
  inactive (FALSE). Derived churn signals include churn risk after 5 and 7 days, churned after
  1 or 2 days of activity, and immediately churned (never active in the 28 days from the cohort
  date). Each cohort is written 30 days after its cohort date, with 31 days of data, so its day
  flags and churn flags have values; recent_new_profile_churn_clients_v2 holds the younger
  cohorts, whose day flags and churn flags are NULL until the cohort has the days of data a flag
  needs. Client attributes such as country, channel, OS, attribution, and distribution are
  captured from the client's baseline_clients_first_seen_v1 row.

  Jira: https://mozilla-hub.atlassian.net/browse/DENG-10676
owners:
- data-product-kpis-wg@mozilla.com
labels:
  incremental: true
  owner1: data-product-kpis-wg
scheduling:
  dag_name: bqetl_new_profile_churn
  date_partition_offset: -30
bigquery:
  time_partitioning:
    type: day
    field: cohort_date
    require_partition_filter: true
    expiration_days: 775
  clustering:
    fields: [sample_id]
require_column_descriptions: true
