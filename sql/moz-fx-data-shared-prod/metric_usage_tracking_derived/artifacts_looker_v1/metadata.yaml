friendly_name: Metric Usage Artifacts Looker
description: |-
  Looker dashboards, Looks and explores, with owners and use per window from
  System Activity. Replaced on each run by the docker-etl metric-usage job,
  metric_usage/looker.py. The job creates the table, and this schema has to
  match the one the job writes.
owners:
- bewu@mozilla.com
bigquery:
  clustering:
    fields:
    - artifact_id
require_column_descriptions: true
