    - name: networking_http_3_slow_start_exit_direction_loss
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'HTTP3: Records if a congestion-event-based slow start exit undershot,
        overshot or exactly matches the congestion window size when closing the connection.
        This mostly exists to confirm the expected assumption that loss- or ecn-based
        exit almost always overshoots. Only records for connections that saw congestion
        window growth (new as of Bug 2024352).

        '
    - name: permissions_unused_permissions_expired_by_type
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Count of permissions expired due to inactivity, broken down by
        permission type (e.g. "desktop-notification", "geo"). Helps identify which
        permission types are expired most often.

        '
    - name: networking_http_3_congestion_window_growth
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: "Records if a connection ended with a congestion window higher\
        \ than the initial window size and if it saw slow start exit (in this case\
        \ because of a congestion event) before ever growing the congestion window.\n\
        Label explanation:\n  - had_growth: Connection saw congestion window growth\n\
        \  - no_growth: Connection never surpassed the initial window size\n  - no_growth_but_exit:\
        \ Connection never surpassed the initial window size but slow start was exited\n\
        \  - no_growth_then_exit_then_growth: Connection exited slow start before\
        \ then later growing the congestion window past the initial window size\n\n\
        This metric can be used to judge how HTTP3 connections behave in regard to\
        \ their congestion window and keep an eye on the phenomeon that prompted the\
        \ filtering on most other congestion control metrics, where we only record\
        \ connections that had congestion window growth past the initial window.\n"
    - name: networking_http_3_slow_start_exit_direction_heuristic
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'HTTP3: Records if a heuristic-based slow start exit undershot,
        overshot or exactly matches the congestion window size when closing the connection.
        Is used to look for systematic tendencies in slow start exit algorithm accuracy
        direction. Only records for connections that saw congestion window growth.

        '
    - name: networking_http_3_slow_start_exit_reason
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Records if slow start was exited heuristically or because of a
        congestion event. Can be used to measure how good an algorithm is at detecting
        slow start exit before loss occurs. Only records for connections that ever
        saw congestion window growth.

        '
    - name: networking_http_3_slow_start_exited_filtered
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: INTEGER
      description: 'Counts whether an HTTP3 connections exited slow start. Is filtered
        against connections that never grew past the initial congestion window, i.e.
        only records those that did see growth. Co-exists with http_3_slow_start_exited
        which is not filtered and also records for connections that never grew the
        congestion window or never sent data.

        '
