---
fields:
  - name: submission_date
    type: DATE
    mode: NULLABLE
    description: Date when the pings were received on the server side.
  - name: trace_signature
    type: STRING
    mode: NULLABLE
    description: FK to gecko_trace_traces_v1. Signature of the trace pattern.
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: Build identifier of the application that sent the trace.
  - name: normalized_os
    type: STRING
    mode: NULLABLE
    description: Normalized operating system name.
  - name: normalized_os_version
    type: STRING
    mode: NULLABLE
    description: Normalized operating system version.
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: CPU architecture of the client.
  - name: hit_count
    type: INT64
    mode: NULLABLE
    description: Number of times this trace pattern occurred on this platform on submission_date.
