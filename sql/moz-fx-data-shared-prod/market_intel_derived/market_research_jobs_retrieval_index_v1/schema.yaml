fields:
- name: scraped_date
  type: DATE
  mode: NULLABLE
  description: Partition column and part of the table's grain. Date this snapshot of
    the job posting was scraped. A posting that stays open reappears in every weekly
    snapshot and is indexed once per snapshot, so pick a single `scraped_date` when
    counting postings or you will count the same job repeatedly.
- name: company
  type: STRING
  mode: NULLABLE
  description: Company the job posting belongs to. Part of the table's grain.
- name: source
  type: STRING
  mode: NULLABLE
  description: 'Scraper source: "greenhouse" or "teamtailor".'
- name: job_id
  type: STRING
  mode: NULLABLE
  description: Source-specific identifier for the job posting. Unique within a
    company and scrape, and part of the table's grain; not globally unique across
    sources.
- name: title
  type: STRING
  mode: NULLABLE
  description: Job title. Part of the embedded text.
- name: department
  type: STRING
  mode: NULLABLE
  description: Department the job posting belongs to, as reported by the source.
- name: location
  type: STRING
  mode: NULLABLE
  description: Primary location listed on the job posting.
- name: offices
  type: STRING
  mode: REPEATED
  description: Office names associated with the job posting. Empty when the source
    record has no offices listed.
- name: url
  type: STRING
  mode: NULLABLE
  description: URL of the job posting.
- name: first_published
  type: STRING
  mode: NULLABLE
  description: Date/time the job posting was first published, as returned by the
    source. Format varies by source, so this is kept as a string rather than parsed.
- name: updated_at
  type: STRING
  mode: NULLABLE
  description: Date/time the job posting was last updated, as returned by the source.
    Format varies by source, so this is kept as a string rather than parsed.
- name: description_html
  type: STRING
  mode: NULLABLE
  description: Job posting description as raw HTML. Not embedded — see
    `description_text`.
- name: description_text
  type: STRING
  mode: NULLABLE
  description: Job posting description as plain text. This is the document body that
    is summarized and embedded.
- name: blob_name
  type: STRING
  mode: NULLABLE
  description: Full GCS object path the underlying raw row was loaded from, for
    traceability back to the source file.
- name: job_summary_llm
  type: STRING
  mode: NULLABLE
  description: AI-generated summary of the role and what the hire would work on,
    limited to a maximum of 25 words. Produced by the Gemini model.
- name: job_category_llm
  type: STRING
  mode: NULLABLE
  description: AI-generated classification label for the job function (e.g.
    engineering, design, marketing), consisting of one to two words. Produced by the
    Gemini model.
- name: job_topics_llm
  type: STRING
  mode: REPEATED
  description: Array of up to five AI-generated normalized topic labels for the job
    posting. Produced by the Gemini model.
- name: job_entities_llm
  type: STRING
  mode: REPEATED
  description: Array of up to five AI-extracted normalized entities from the job
    posting (e.g. technologies, product areas, programming languages). Produced by the
    Gemini model.
- name: embedding
  type: FLOAT
  mode: REPEATED
  description: Vector embedding of the concatenated title and description_text.
    Generated by the Gemini embedding model (gemini-embedding-001). Always embed your
    own query text with the same model, or distances are meaningless.
- name: metadata
  type: RECORD
  mode: NULLABLE
  description: Technical metadata about the AI analysis pipeline, including model
    versions, quality flags, and processing status.
  fields:
  - name: input_fields
    type: STRING
    mode: REPEATED
    description: List of source field names used as input for the AI analysis (title,
      description_text).
  - name: input_char_count
    type: INTEGER
    mode: NULLABLE
    description: Total character count of the input text provided to the AI model.
  - name: model_version
    type: STRING
    mode: NULLABLE
    description: Version identifier of the generative AI model used for analysis
      (e.g. gemini-2.5-pro).
  - name: embedding_version
    type: STRING
    mode: NULLABLE
    description: Version identifier of the embedding model used to generate the
      vector embedding (e.g. gemini-embedding-001).
  - name: prompt_version
    type: STRING
    mode: NULLABLE
    description: Version identifier of the prompt used for the AI analysis (e.g. v1).
  - name: analysis_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Ingestion timestamp — captures the actual wall-clock time when this
      row's AI analysis was produced (`CURRENT_TIMESTAMP()` at query run). Distinct
      from the partition date (`scraped_date`), which reflects when the posting was
      scraped. Backfills and re-runs will record their own run time here.
  - name: embedding_succeeded
    type: BOOLEAN
    mode: NULLABLE
    description: TRUE when `embedding IS NOT NULL`. **This is the sole driver for
      reprocessing** — partitions are re-run for rows where `embedding_succeeded =
      FALSE`. LLM-field issues are tracked in `failure_reasons` for visibility but do
      **not** trigger reruns.
  - name: failure_reasons
    type: STRING
    mode: REPEATED
    description: Diagnostic tags for any quality check that failed on this row. Empty
      array when every check passes. Possible tags - `embedding_missing`,
      `job_summary_llm_missing`, `job_category_llm_missing`, `job_topics_llm_missing`,
      `job_topics_llm_has_empty_elements`, `job_entities_llm_missing`,
      `job_entities_llm_has_empty_elements`.
      Use for triage (`SELECT reason, COUNT(*) FROM ...,
      UNNEST(metadata.failure_reasons) reason GROUP BY 1`).
