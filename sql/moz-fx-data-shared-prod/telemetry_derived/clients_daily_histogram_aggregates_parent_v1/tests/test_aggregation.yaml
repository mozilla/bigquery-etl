          id: second
    - submission_timestamp: "2010-02-04 11:11:11.111111 UTC"
      build:
        build:
          id: first
  moz-fx-data-shared-prod.telemetry_stable.main_v5:
    - &base
      client_id: test
      sample_id: 0
      submission_timestamp: "2019-07-17 17:19:39.844336 UTC"
      normalized_os: first
      normalized_channel: nightly
      document_id: avg_1
    - <<: *base
      payload: {"histograms": {"gradient_duration": '{
                "range": [1,500],
                "bucket_count": 20,
                "histogram_type": 1,
                "values": {"1":0, "56": 9, "397": 1, "3": 26,
                "149": 1, "1056": 0, "8": 7, "21": 235}
