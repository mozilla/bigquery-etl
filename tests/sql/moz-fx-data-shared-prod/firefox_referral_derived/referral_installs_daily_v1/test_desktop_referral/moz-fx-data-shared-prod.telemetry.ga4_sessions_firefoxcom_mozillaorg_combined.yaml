# Codes are 17-char Crockford base32 (digits + upper case), per the format the
# Websites team guarantees. ga1/ga2 carry the same code in each of the two
# content fields; ga4 carries a second code. ga3/ga5/ga6/ga7 must all be
# rejected, so a regression to a bare `fxrefer%` prefix match fails the test.
- ga_client_id: "ga1"
  session_date: "2026-07-20"
  manual_content: "fxrefer177HGE4JW5KB6FVW2"
  first_content_from_event_params: null
  all_reported_stub_session_ids:
  - "s1"
- ga_client_id: "ga2"
  session_date: "2026-07-21"
  manual_content: null
  first_content_from_event_params: "fxrefer177HGE4JW5KB6FVW2"
  all_reported_stub_session_ids:
  - "s2"
# organic session, no referral code
- ga_client_id: "ga3"
