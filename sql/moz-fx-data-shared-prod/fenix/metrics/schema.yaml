            type: STRING
          - name: value
            type: INTEGER
      description: 'HTTP3: Records how many resets due to stale data happened for
        each SEARCH connection. Is labeled by slow start outcome to help with evaluation
        (i.e. no resets + not_exited makes sense, since the connection might''ve been
        very short).

