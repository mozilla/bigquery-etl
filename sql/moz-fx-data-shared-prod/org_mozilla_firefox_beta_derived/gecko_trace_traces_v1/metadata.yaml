---
friendly_name: Gecko Trace Traces
description: |-
  Daily counts of trace patterns from Gecko traces.

  Each row has one trace signature and the count for one day.
  The stable_trace_id is a UUID. It does not change after the first insert.
  A re-run of the same day overwrites the counts. It does not add to them.

owners:
  - jjalkanen@mozilla.com

labels:
  incremental: true
  schedule: daily

scheduling:
  dag_name: bqetl_gecko_trace
  task_group: org_mozilla_firefox_beta
  date_partition_parameter: null
  parameters: ["submission_date:DATE:"]

bigquery:
  clustering:
    fields:
      - trace_signature
