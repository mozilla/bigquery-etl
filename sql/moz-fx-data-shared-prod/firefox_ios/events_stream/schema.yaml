fields:
- name: event_id
  type: STRING
  mode: NULLABLE
  description: Unique event ID (typically a concatenation of `document_id` and `document_event_number`).
- name: normalized_app_id
  type: STRING
  mode: NULLABLE
  description: The app ID with any dashes or dots replaced with underscores.
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: A JSON string containing any payload properties not present in the
    schema
- name: client_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: The build identifier generated by the CI system (e.g. "1234/A").
      For language bindings that provide automatic detection for this value, (e.g.
      Android/Kotlin), in the unlikely event that the build identifier can not be
      retrieved from the OS, it is set to "inaccessible". For other language bindings,
      if the value was not provided through configuration, this metric gets set to
      `Unknown`.
  - name: app_channel
    type: STRING
    mode: NULLABLE
    description: The channel the application is being distributed on.
  - name: app_display_version
    type: STRING
    mode: NULLABLE
    description: The user visible version string (e.g. "1.0.3").  In the unlikely
      event that the display version can not be retrieved, it is set to "inaccessible".
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: The architecture of the device, (e.g. "arm", "x86").
  - name: attribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: campaign
      type: STRING
      mode: NULLABLE
      description: The attribution campaign (e.g. 'mozilla-org').
    - name: content
      type: STRING
      mode: NULLABLE
      description: The attribution content (e.g. 'firefoxview').
    - name: medium
      type: STRING
      mode: NULLABLE
      description: The attribution medium (e.g. 'organic' for a search engine).
    - name: source
      type: STRING
      mode: NULLABLE
      description: The attribution source (e.g. 'google-play').
    - name: term
      type: STRING
      mode: NULLABLE
      description: The attribution term (e.g. 'browser with developer tools for android').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: device_manufacturer
    type: STRING
    mode: NULLABLE
    description: The manufacturer of the device the application is running on. Not
      set if the device manufacturer can't be determined (e.g. on Desktop).
  - name: device_model
    type: STRING
    mode: NULLABLE
    description: The model of the device the application is running on. On Android,
      this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL". Not
      set if the device model can't be determined (e.g. on Desktop).
  - name: distribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
      description: The distribution name (e.g. 'MozillaOnline').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: first_run_date
    type: STRING
    mode: NULLABLE
    description: The date of the first run of the application.
  - name: locale
    type: STRING
    mode: NULLABLE
    description: The locale of the application during initialization (e.g. "es-ES").
      If the locale can't be determined on the system, the value is ["und"](https://unicode.org/reports/tr35/#Unknown_or_Invalid_Identifiers),
      to indicate "undetermined".
  - name: os
    type: STRING
    mode: NULLABLE
    description: 'The name of the operating system. Possible values: Android, iOS,
      Linux, Darwin, Windows, FreeBSD, NetBSD, OpenBSD, Solaris, unknown'
  - name: os_version
    type: STRING
    mode: NULLABLE
    description: The user-visible version of the operating system (e.g. "1.2.3").
      If the version detection fails, this metric gets set to `Unknown`.
  - name: telemetry_sdk_build
    type: STRING
    mode: NULLABLE
    description: The version of the Glean SDK
  - name: build_date
    type: STRING
    mode: NULLABLE
    description: The date & time the application was built
  - name: session_id
    type: STRING
    mode: NULLABLE
    description: An optional UUID uniquely identifying the client's current session.
  - name: session_count
    type: INTEGER
    mode: NULLABLE
    description: An optional running counter of the number of sessions for a client.
  - name: windows_build_number
    type: INTEGER
    mode: NULLABLE
    description: The optional Windows build number, reported by Windows (e.g. 22000)
      and not set for other platforms
- name: document_id
  type: STRING
  mode: NULLABLE
  description: The document ID specified in the URI when the client sent this message
- name: metadata
  type: RECORD
  mode: NULLABLE
  fields:
  - name: geo
    type: RECORD
    mode: NULLABLE
    fields:
    - name: city
      type: STRING
      mode: NULLABLE
    - name: country
      type: STRING
      mode: NULLABLE
      description: An ISO 3166-1 alpha-2 country code
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo database version used for this lookup
    - name: subdivision1
      type: STRING
      mode: NULLABLE
      description: First major country subdivision, typically a state, province, or
        county
    - name: subdivision2
      type: STRING
      mode: NULLABLE
      description: Second major country subdivision; not applicable for most countries
    description: Results of a geographic lookup based on the client's IP address
  - name: header
    type: RECORD
    mode: NULLABLE
    fields:
    - name: date
      type: STRING
      mode: NULLABLE
      description: Date HTTP header
    - name: dnt
      type: STRING
      mode: NULLABLE
      description: DNT (Do Not Track) HTTP header
    - name: x_debug_id
      type: STRING
      mode: NULLABLE
      description: X-Debug-Id HTTP header
    - name: x_pingsender_version
      type: STRING
      mode: NULLABLE
      description: X-PingSender-Version HTTP header
    - name: x_source_tags
      type: STRING
      mode: NULLABLE
      description: X-Source-Tags HTTP header
    - name: x_telemetry_agent
      type: STRING
      mode: NULLABLE
      description: X-Telemetry-Agent HTTP header
    - name: x_foxsec_ip_reputation
      type: STRING
      mode: NULLABLE
      description: X-Foxsec-IP-Reputation header (deprecated, https://mozilla-hub.atlassian.net/browse/DENG-10434)
    - name: x_lb_tags
      type: STRING
      mode: NULLABLE
      description: X-LB-Tags HTTP header
    - name: parsed_date
      type: TIMESTAMP
      mode: NULLABLE
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
    - name: parsed_x_lb_tags
      type: RECORD
      mode: NULLABLE
      fields:
      - name: tls_version
        type: STRING
        mode: NULLABLE
      - name: tls_cipher_hex
        type: STRING
        mode: NULLABLE
    description: Headers included in the client's HTTP request
  - name: isp
    type: RECORD
    mode: NULLABLE
    fields:
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo ISP database version used for this lookup
    - name: name
      type: STRING
      mode: NULLABLE
      description: The name of the ISP associated with the client's IP address
    - name: organization
      type: STRING
      mode: NULLABLE
      description: The name of a specific business entity associated with the client's
        IP address when available; otherwise the ISP name
    description: Results of ISP lookup based on the client's IP address
  - name: user_agent
    type: RECORD
    mode: NULLABLE
    fields:
    - name: browser
      type: STRING
      mode: NULLABLE
    - name: os
      type: STRING
      mode: NULLABLE
    - name: version
      type: STRING
      mode: NULLABLE
    description: Parsed components of the client's user agent string
- name: metrics
  type: JSON
  mode: NULLABLE
  description: Metrics recorded along with the event, grouped by type and stored as
    a JSON object.
- name: normalized_app_name
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized app name
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized channel name
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized OS name
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
- name: ping_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: seq
    type: INTEGER
    mode: NULLABLE
  - name: start_time
    type: STRING
    mode: NULLABLE
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: end_time
    type: STRING
    mode: NULLABLE
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: ping_type
    type: STRING
    mode: NULLABLE
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: Hashed version of client_id (if present) useful for partitioning; ranges
    from 0 to 99
- name: submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Time when the ingestion edge server accepted this message
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
- name: app_version_patch
  type: NUMERIC
  mode: NULLABLE
- name: is_bot_generated
  type: BOOLEAN
  mode: NULLABLE
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the client.
- name: reason
  type: STRING
  mode: NULLABLE
- name: experiments
  type: JSON
  mode: NULLABLE
  description: Any active experiments, stored as a JSON object.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_profile_group_id` UUID metric,
    so this column will always be null.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_client_id` UUID metric, so
    this column will always be null.
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: When the event ostensibly occurred based on data reported by the client
    (so be wary that unrealistic values are possible).
- name: event_category
  type: STRING
  mode: NULLABLE
- name: event_name
  type: STRING
  mode: NULLABLE
- name: event
  type: STRING
  mode: NULLABLE
  description: Fully qualified event name prefixed with the event category separated
    by a dot.
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: Event extras, stored as a JSON object.
- name: document_event_number
  type: INTEGER
  mode: NULLABLE
  description: Which event number this was in the original document, in chronological
    order.
- name: extras
  type: RECORD
  mode: NULLABLE
  description: Event extras, grouped by type.
  fields:
  - name: boolean
    type: RECORD
    mode: NULLABLE
    description: Boolean event extras.
    fields:
    - name: agreed
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Describes whether the user accepted the summarization terms of service.

        * Whether the consent prompt was accepted.'
    - name: auto_translate
      type: BOOLEAN
      mode: NULLABLE
      description: True if triggered automatically via always-translate settings.
        False if triggered manually.
    - name: changed_to
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The value of the automatic crash reports switch.

        * The value of the technical interaction data switch.'
    - name: corrupt
      type: BOOLEAN
      mode: NULLABLE
      description: Whether or not the database was corrupted when we tried to load
        it. This field may be empty, e.g., if the database could not be loaded.
    - name: did_confirm
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the user confirmed the reset action via the confirmation
        dialog.
    - name: enabled
      type: BOOLEAN
      mode: NULLABLE
      description: Whether reader mode was opened or closed
    - name: etp_enabled
      type: BOOLEAN
      mode: NULLABLE
      description: Records the state true / false
    - name: granted
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the notification permission was granted.

        * Whether the user granted camera access in response to the system permission
        request.'
    - name: has_blocked_trackers_list
      type: BOOLEAN
      mode: NULLABLE
      description: Indicates whether or not the user submitted the list of items blocked
        by tracking protection alongside the report.
    - name: has_screenshot
      type: BOOLEAN
      mode: NULLABLE
      description: Whether a screenshot was attached to the report. Always false while
        the screenshot option is parked (FXIOS-16450).
    - name: has_share_message
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether an explicit share message (and optional subject line) was appended
        to the shared content.

        * Whether an explicit share message (and optional subject line) was appended
        to the shared content. For example, when a user shares Firefox anniversary
        text to their friends. This text will generally accompany a link.'
    - name: has_summarizer
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the tapped button was the combined reader mode with summarizer
        button, which also offers summarization on long press
    - name: is_at_bottom
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the address bar is at the bottom
    - name: is_enabled
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * If is enabled or not (true / false)

        * Is enabled when the sync is started

        * Is enabled when the restore tabs is started

        * Is enabled when the user has opted in for ads'
    - name: is_enrolled_in_sent_from_firefox
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the user is enrolled in the Sent from Firefox experiment.
    - name: is_homepage
      type: BOOLEAN
      mode: NULLABLE
      description: Indicate if is homepage when select an option.
    - name: is_impression
      type: BOOLEAN
      mode: NULLABLE
      description: "True for the first card recorded after the WorldCup section is\
        \ built in the current homepage session \u2014 i.e. the section's initial\
        \ impression. False for every subsequent swipe within that session."
    - name: is_new_email_mask
      type: BOOLEAN
      mode: NULLABLE
      description: True if a new email mask was generated, false if an existing mask
        was reused.
    - name: is_opted_in_sent_from_firefox
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the user is opted in to the Sent from Firefox experiment.
        Only returns true if the user is both enrolled and opted in.
    - name: is_private
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the user is in private mode or not
    - name: is_private_mode
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Set to true when you enter private browsing mode, false when you are going
        back to normal mode.

        * Whether the user is in private browsing mode.'
    - name: is_toolbar
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Wether the source view of this button is the Toolbar, otherwise the Menu.
        For Toolbar layout version1 and version2 the source is the Legacy menu meanwhile
        for baseline the Toolbar.

        * Whether the source view of this button is the Toolbar, otherwise the Menu.
        For Toolbar layout version1 and version2 the source is the Legacy menu meanwhile
        for baseline the Toolbar.'
    - name: outcome
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * True for success, false otherwise.

        * Describes the outcome of the summarization task. True if the summarization
        was successful, false otherwise.'
    - name: photo_selected
      type: BOOLEAN
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Whether the user selected a photo before the camera interface closed.

        * Whether the user selected a photo before the photo picker closed.'
    - name: sampled_in
      type: BOOLEAN
      mode: NULLABLE
      description: Whether this session is sampled in (true) or sampled out (false).
        Events from sampled-out sessions are suppressed; this field lets analysts
        validate that the observed sampling rate matches the configured rate.
    - name: succeeded
      type: BOOLEAN
      mode: NULLABLE
      description: Whether the Google Lens results page loaded successfully.
  - name: quantity
    type: RECORD
    mode: NULLABLE
    description: Quantity event extras.
    fields:
    - name: api_query_count
      type: INTEGER
      mode: NULLABLE
      description: Number of times the API has been queried for this user
    - name: average_tabs_in_all_groups
      type: INTEGER
      mode: NULLABLE
      description: Average number of tabs in all groups
    - name: consecutive_crash
      type: INTEGER
      mode: NULLABLE
      description: The number of consecutive times the webview has crashed.
    - name: count
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The number of recent search suggestions displayed.

        * The number of trending search suggestions displayed.'
    - name: figures
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The digit-count band the user''s lifetime blocked total fell in when the
        dashboard opened, from 4 to 8 (1,000 / 10,000 / 100,000 / 1,000,000 / 10,000,000
        and above). Absent when the total is below 1,000.

        * The digit-count boundary that was crossed, from 4 to 8.'
    - name: from_version
      type: INTEGER
      mode: NULLABLE
      description: The original version of the database. A value of 0 indicates that
        the db_version was not set in the meta store.
    - name: groups_two_tabs_only
      type: INTEGER
      mode: NULLABLE
      description: Total number of groups with only 2 tabs
    - name: groups_with_more_than_two_tab
      type: INTEGER
      mode: NULLABLE
      description: Total number of groups with more than 2 tabs
    - name: http_status
      type: INTEGER
      mode: NULLABLE
      description: The HTTP status code of the Google Lens upload response, when available.
    - name: index
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The index of the story, in normal format (ie. index 1 = story 1)

        * The index of the site in the list of domains that have a user-configured
        page zoom level. Index 0 is the top of the list.'
    - name: initial_version
      type: INTEGER
      mode: NULLABLE
      description: The version of the database on disk at load time. This field may
        be empty, e.g., if we cannot create a database.
    - name: length_chars
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The length of the text to be summarized, in characters.

        * The length of the summarized text, in characters.'
    - name: length_words
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The length of the text to be summarized, in words.

        * The length of the summarized text, in words.'
    - name: level
      type: INTEGER
      mode: NULLABLE
      description: The new zoom level shown on the zoom bar.
    - name: migrated_version
      type: INTEGER
      mode: NULLABLE
      description: The version of the database that was migrated to. This field will
        be empty if no migration(s) occurred.
    - name: n_chars
      type: INTEGER
      mode: NULLABLE
      description: Number of typed characters
    - name: n_results
      type: INTEGER
      mode: NULLABLE
      description: Number of results, if this is high the results list below may be
        incomplete due to size limits
    - name: n_words
      type: INTEGER
      mode: NULLABLE
      description: "Number of typed words (doesn\u2019t support CJK languages)"
    - name: position
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The tile placement (1-based)

        * The position of the clicked recent search suggestion. The first suggestion
        has index of 1.

        * The position of the clicked trending search suggestion. The first suggestion
        has index of 1.'
    - name: selected_tab_index
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The index of the selectd tab (indicies start at 0).

        * The index of the selected tab (indices start at 0).'
    - name: session_seq
      type: INTEGER
      mode: NULLABLE
      description: The session sequence number (monotonically increasing across restarts).
    - name: size
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Total CPU time consumed in the scope of the exception

        * Total time the main thread was blocked

        * The size of the file that was written'
    - name: tab_count
      type: INTEGER
      mode: NULLABLE
      description: The total number of open tabs at the time of the memory warning.
    - name: to_version
      type: INTEGER
      mode: NULLABLE
      description: The target version of the migration that was performed.
    - name: total_num_of_groups
      type: INTEGER
      mode: NULLABLE
      description: Total number of groups in tab tray
    - name: total_tabs_in_all_groups
      type: INTEGER
      mode: NULLABLE
      description: Total number of tabs in all groups
    - name: webview_count
      type: INTEGER
      mode: NULLABLE
      description: The number of living WKWebViews at the time of the memory warning.
  - name: string
    type: RECORD
    mode: NULLABLE
    description: String event extras.
    fields:
    - name: action
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Records the action: "close-tab/close-all-tabs/enter-tab/new-tab/select-tab/previous-tab/etc"

        * Records the action: close_all_tabs / add / done

        * Records how the surface was closed: "close-button/click-outside/interaction-with-a-link/swiping-the-surface-handle/opting-out-of-the-feature"'
    - name: action_type
      type: STRING
      mode: NULLABLE
      description: A key describing the action that will be taken when the user taps
        this button. Either `will_translate` (if the user is about to send a translation
        request for the current webpage) or `will_restore` (if the user is about to
        restore the webpage's original content).
    - name: action_uuid
      type: STRING
      mode: NULLABLE
      description: The UUID of the action
    - name: activity_identifier
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The activity identifier indicating to where the user shared content.

        * The activity identifier of the app to which the user has shared content.'
    - name: age
      type: STRING
      mode: NULLABLE
      description: The age of pulled data in seconds (ie. difference between publication
        time and fetch time).
    - name: alert_setting
      type: STRING
      mode: NULLABLE
      description: The users alert setting.
    - name: bookmark_count
      type: STRING
      mode: NULLABLE
      description: The number of bookmarked items in the Recently Saved section.
    - name: branch
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The branch slug/identifier that was randomly chosen

        * The branch slug/identifier that was randomly chosen (if the client is enrolled)

        * If reason == "invalid-branch", this is the invalid branch.'
    - name: button_action
      type: STRING
      mode: NULLABLE
      description: The action that the button would lead to.
    - name: card_type
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Presented onboarding card (welcome / wallpapers / sign to sync)

        * The name of the presented card.

        * The card presented when the onboarding was closed

        * Presented onboarding card'
    - name: changed_from
      type: STRING
      mode: NULLABLE
      description: The previous value of the setting.
    - name: changed_to
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The value the preference was changed to.

        * The new value of the setting.'
    - name: conflict_slug
      type: STRING
      mode: NULLABLE
      description: If the enrollment hit a feature conflict, the slug of the conflicting
        experiment/rollout
    - name: connection_type
      type: STRING
      mode: NULLABLE
      description: Describes the type of connection used during summarization. Options
        are listed in the `DeviceInfo.ConnectionType` enum.
    - name: dashboard_state
      type: STRING
      mode: NULLABLE
      description: 'What the dashboard showed when it opened: `empty` (nothing has
        ever been blocked), `weekly_reset` (a lifetime total exists, but nothing was
        blocked this week), or `populated` (trackers were blocked this week).'
    - name: device_language
      type: STRING
      mode: NULLABLE
      description: The system language code of the user's device.
    - name: disabled_engines
      type: STRING
      mode: NULLABLE
      description: A comma-delimited list of engines that were disabled by the user.
    - name: duration
      type: STRING
      mode: NULLABLE
      description: The duration of the synchronization process in milliseconds.
    - name: enabled_engines
      type: STRING
      mode: NULLABLE
      description: A comma-delimited list of engines that were enabled by the user.
    - name: engagement_type
      type: STRING
      mode: NULLABLE
      description: which action was executed on the result, which can be tap, enter,
        drop_go, paste_go, dismiss, help
    - name: error
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The error that occurred.

        * If an error occured during the initial load of the database this field will
        contain the relevant error code.

        * If an error occurred during the migration, the relevant error code.'
    - name: error_code
      type: STRING
      mode: NULLABLE
      description: The error code number
    - name: error_description
      type: STRING
      mode: NULLABLE
      description: The localized description of the error
    - name: error_message
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The error encountered retrieving the credit cards encryption key

        * The error encountered retrieving the logins encryption key'
    - name: error_string
      type: STRING
      mode: NULLABLE
      description: If the enrollment resulted in an error, the associated error string
    - name: error_type
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Optional. The error message if present.

        * Describes the error type when summarization fails. Options are listed in
        the `SummarizerError.telemetryDescription`.

        * A key describing the type of error.

        * The reason for the failure, represented as a key (not a raw message).'
    - name: errorName
      type: STRING
      mode: NULLABLE
      description: An optional string with the error name attribute in case of failure.
    - name: etp_setting
      type: STRING
      mode: NULLABLE
      description: 'Records the protection level: standard / strict'
    - name: experiment
      type: STRING
      mode: NULLABLE
      description: The slug/unique identifier of the experiment
    - name: experiment_type
      type: STRING
      mode: NULLABLE
      description: Indicates whether this is an experiment or rollout
    - name: extension_source
      type: STRING
      mode: NULLABLE
      description: The source of the extension event. Always "share-extension" for
        the legacy Share Extension.
    - name: feature_id
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The identifier of the feature that is recording an exposure

        * The identifier of the feature that is has a malformed configuration

        * The feature id of the configuration that was requested'
    - name: fifa_code
      type: STRING
      mode: NULLABLE
      description: The FIFA code of the country selected by the user.
    - name: flow_type
      type: STRING
      mode: NULLABLE
      description: Whether it's a fresh install or an upgrade flow
    - name: from_language
      type: STRING
      mode: NULLABLE
      description: The language being translated from.
    - name: groups
      type: STRING
      mode: NULLABLE
      description: Comma separated list of result groups in order, groups may be repeated,
        since the list will match 1:1 the results list, so we Can link each result
        to a group, like heuristic, adaptive_history, search_history, search_suggest,
        top_pick, top_site, remote_tab, addon, general, suggest
    - name: hint_type
      type: STRING
      mode: NULLABLE
      description: The type of CFR being interacted with.
    - name: identified_language
      type: STRING
      mode: NULLABLE
      description: The language tag that was identified via the nlp model.
    - name: interaction
      type: STRING
      mode: NULLABLE
      description: How the user started the search, by typing or pasting text
    - name: is_accessibility_size_enabled
      type: STRING
      mode: NULLABLE
      description: If larger accessibility sizes is enabled or not (true / false).
    - name: is_enabled
      type: STRING
      mode: NULLABLE
      description: If is enabled or not (true / false)
    - name: is_private
      type: STRING
      mode: NULLABLE
      description: If the button is tapped or not (true / false)
    - name: is_running
      type: STRING
      mode: NULLABLE
      description: If is running or not (true / false)
    - name: last_provided_date
      type: STRING
      mode: NULLABLE
      description: The date when the status was last provided (ISO 8601 format)
    - name: location
      type: STRING
      mode: NULLABLE
      description: The location of awesomebar (top or bottom)
    - name: match
      type: STRING
      mode: NULLABLE
      description: The identifier of the match that was clicked i.e USA/MEX.
    - name: media_type
      type: STRING
      mode: NULLABLE
      description: We either send "allowAudioAndVideo", "blockAudio" or "blockAudioAndVideo".
        Default is "allowAudioAndVideo".
    - name: message_key
      type: STRING
      mode: NULLABLE
      description: The Id of the message
    - name: message_surface
      type: STRING
      mode: NULLABLE
      description: The surface of the message
    - name: method
      type: STRING
      mode: NULLABLE
      description: 'How onboarding was exited: "skipped" or "completed".'
    - name: migration_error
      type: STRING
      mode: NULLABLE
      description: If an error occurred during the initial load of the database this
        field will contain the relevant error code.
    - name: mode
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The current tabs panel mode (normal or private or sync).

        * The current tabs panel mode (normal or private).

        * The newly selected tabs panel mode (normal or private or sync).

        * The tab mode you are in when you press the new tab button (normal or private).

        * The tab mode the user is switching to (normal, private, or sync).'
    - name: model
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The model backing the Quick Answers request. See the `QuickAnswersModel`
        enum for the valid values.

        * Describes the LLM used to summarize the text. Options are listed in the
        `SummarizerModel` enum.'
    - name: new_name
      type: STRING
      mode: NULLABLE
      description: The name of the new app icon the user has selected. Options are
        listed in the AppIcon enumeration.
    - name: old_name
      type: STRING
      mode: NULLABLE
      description: The name of the app icon the user had previously selected. Returns
        "unknown" if the previous icon had an invalid name.
    - name: onboarding_reason
      type: STRING
      mode: NULLABLE
      description: Whether this is a new_user (first install) or show_tour (returning
        user via Settings).
    - name: onboarding_variant
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The onboarding variant (modern or legacy).

        * The onboarding variant (modern, legacy, or japan).'
    - name: option
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The option type selected on the main menu.

        * The type of option selected. Options are listed in the ContextMenuTelemetry.OptionExtra
        enumeration.

        * The option type selected on the save sub menu.

        * The option type selected on the tools sub menu.

        * The option type selected from the settings main menu.

        * A unique key describing the item selected from the settings menu and its
        submenus. This unique key should describe the screen being shown next to the
        user. Keep in mind that experiments and redesigns sometimes move options to
        different depths of the settings screens. However, this unique key should
        always remain the same. As a result, it is useful to devise a unique key irrespective
        of the option''s current placement in the settings hierarchy.

        * The selected option. For example: - open_in_firefox for "Open in Firefox"
        - load_in_background for "Load in Background" - bookmark_this_page for "Bookmark
        This Page" - add_to_reading_list for "Add to Reading List" - send_to_device
        for ...'
    - name: origin
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The type of context menu the option was selected from. Options are listed
        in the ContextMenuTelemetry.OriginExtra enumeration.

        * The type of context menu the option was selected from.'
    - name: outcome
      type: STRING
      mode: NULLABLE
      description: The outcome of the pan gesture. Options are listed in the ToolbarTelemetry.PanGestureOutcomes
        enumeration.
    - name: page_language
      type: STRING
      mode: NULLABLE
      description: The detected language of the page being summarized, as a locale
        identifier (e.g. `en`, `de`). Differs from `summary_language` when the user
        picked a specific summary language in settings. Absent when no language could
        be resolved.
    - name: part_id
      type: STRING
      mode: NULLABLE
      description: The identifier of the feature-specific part that is malformed.
        e.g. the card or message id.
    - name: period
      type: STRING
      mode: NULLABLE
      description: The period of time chosen by the user to delete their older tabs.
        Either `oneDay`, `oneWeek` or `oneMonth`.
    - name: permission
      type: STRING
      mode: NULLABLE
      description: The permission the user denied. See the `QuickAnswersPermission`
        enum for the valid values.
    - name: position
      type: STRING
      mode: NULLABLE
      description: Position of top site.
    - name: preference
      type: STRING
      mode: NULLABLE
      description: The preference that was changed.
    - name: preferred_size
      type: STRING
      mode: NULLABLE
      description: The preferred content size category selected.
    - name: provider
      type: STRING
      mode: NULLABLE
      description: name of the UrlbarProvider that returned the selected result
    - name: reading_list_count
      type: STRING
      mode: NULLABLE
      description: The number of reading list items in the Recently Saved section.
    - name: reason
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Reason for the impression. pause - recorded when the results were shown
        for at least 1s. Only one pause is recorded for each search session.

        * The reason associated with the system camera interaction. Options are listed
        in the CameraReason enumeration.

        * The reason the client is in the noted status

        * The reason associated with the system photo picker interaction. Options
        are listed in the PhotoPickerReason enumeration.

        * The reason for the enrollment failure

        * The reason for the unenrollment failure

        * The selected issue category. Options are listed in the WebCompatIssueCategory
        enumeration.

        * Why the session ended. When in MANUAL mode, the reason can optionally be
        set by the application. Possible values set by Glean in AUTO or LIFECYCLE
        session management modes include: - "inactive": client went to background
        (LIFECYCLE mode) - "replaced": a new session was started while one was already
        active - "timeout": AUTO mode inactivity timeout expired - "abnormal": session
        ended du...'
    - name: received_url
      type: STRING
      mode: NULLABLE
      description: The deeplink url
    - name: results
      type: STRING
      mode: NULLABLE
      description: 'Comma separated list of result types in order. Possible values
        are: unknown, bookmark, history, search_engine, search_suggest, search_history,
        tab, remote_tab, suggest_sponsor, suggest_non_sponsor'
    - name: retry_date
      type: STRING
      mode: NULLABLE
      description: The date when the API can be retried (ISO 8601 format)
    - name: sap
      type: STRING
      mode: NULLABLE
      description: Where the user action started, like urlbar or urlbar_newtab
    - name: search_mode
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * If the urlbar is in search mode, thus restricting results to a specific
        search engine or local source, this is set to the search mode source. For
        iOS the search starts from tabs

        * If the urlbar is in search mode, thus restricting results to a specific
        search engine or local source, this is set to the search mode source.'
    - name: section
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The section that the item belongs to on the homepage. This section name
        is found in `HomepageTelemetry.ItemType` under `sectionName`.

        * The section that the item belongs to on the homepage. This section name
        is found in `HomepageTelemetry.TappedItemType` under `sectionName`.'
    - name: selected_result
      type: STRING
      mode: NULLABLE
      description: Type of the selected result, which can have a value like bookmarks,
        history, tab, search_history, search_engine, suggest_sponsor, suggest_non_sponsor
    - name: selected_result_subtype
      type: STRING
      mode: NULLABLE
      description: set when a result provides multiple choices, like quick actions
    - name: sequence_id
      type: STRING
      mode: NULLABLE
      description: The sequence of the cards in the current branch.
    - name: sequence_position
      type: STRING
      mode: NULLABLE
      description: The position of the card in the current branch.
    - name: session_id
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The unique UUID of the ended session.

        * The unique UUID of the started session.'
    - name: session_start_time
      type: STRING
      mode: NULLABLE
      description: Wall-clock timestamp at session start (RFC 3339). Auxiliary only;
        per-event timestamps remain authoritative for time-based analysis.
    - name: setting
      type: STRING
      mode: NULLABLE
      description: A unique key describing the setting that was changed.
    - name: share_type
      type: STRING
      mode: NULLABLE
      description: The type of content shared. Either a file, website, or tab.
    - name: size
      type: STRING
      mode: NULLABLE
      description: 'Records the state of the bottom sheet: "half-view / full-view"'
    - name: slug
      type: STRING
      mode: NULLABLE
      description: The slug/unique identifier of the experiment
    - name: source
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The source of the event, example "newtab", "urlbar"

        * A label to distinguish what is being pulled or updated in the component
        (eg. settings collection name, ...).

        * The entry point the reporter was opened from. Options are listed in the
        WebCompatReporterTelemetry.Source enumeration.

        * Where the Google Lens search was initiated from. Options are listed in the
        GoogleLensTelemetry.Source enumeration.

        * Source that initiated the pinned shortcut. Options are listed in the HomepageTelemetry.TopSitesShortcutPinnedSource
        enumeration.

        * Source that initiated the unpinned shortcut. Options are listed in the HomepageTelemetry.TopSitesShortcutUnpinnedSource
        enumeration.'
    - name: status
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The status of the users notification permission.

        * The status of this enrollment'
    - name: summary_language
      type: STRING
      mode: NULLABLE
      description: The language the summary is generated in, as a locale identifier
        (e.g. `en`, `de-DE`). Bounded by the `supportedLocales` allowlist of the `summarizer-language-expansion-feature`
        Nimbus feature. Absent when no language could be resolved.
    - name: surface
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The surface where ToU was shown (e.g., bottom_sheet, onboarding).

        * The surface where ToU was shown (e.g. bottom_sheet, onboarding).

        * The surface where ToU was shown (e.g. bottom_sheet, onboarding, homepage).

        * The surface where ToU was accepted (e.g., bottom_sheet, onboarding).'
    - name: survey_id
      type: STRING
      mode: NULLABLE
      description: The id of the survey.
    - name: tile_type
      type: STRING
      mode: NULLABLE
      description: 'Type of tile pressed (Ex: google, suggested, user-added or history-based)'
    - name: timeframe
      type: STRING
      mode: NULLABLE
      description: The timeframe all history was cleared from Options are listed in
        the HistoryDeletionUtilityDateOptions enum
    - name: timestamp
      type: STRING
      mode: NULLABLE
      description: The current timestamp, received during synchronization.
    - name: to_language
      type: STRING
      mode: NULLABLE
      description: The language being translated to.
    - name: toggle_type
      type: STRING
      mode: NULLABLE
      description: We either send "collapsed" or "expanded"
    - name: tou_version
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The version of the Terms of Use that was shown.

        * The version of the Terms of Use that was accepted.'
    - name: translation_flow_id
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * A UUID used to link events in a single translation session.

        * A UUID used to link together events associated with a single translations
        session. A new translation session begins whenever the user triggers a new
        webpage translation.'
    - name: trigger
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Describes the action used to trigger summarization. Options are listed in
        the `SummarizerTrigger` enum.

        * A label to distinguish what triggered the polling/fetching of remote content
        (eg. "broadcast", "timer", "forced", "manual")'
    - name: type
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Type of contextual action

        * Type: amp-suggestion, wikipedia-suggestion

        * Type: history-item, remote-tab, opened-tab, bookmark-item, search-suggestion,
        amp-suggestion, wikipedia-suggestion

        * The type of item that was tapped on the homepage. This name is found in
        `HomepageTelemetry.ItemType`.

        * The type of item that was tapped on the homepage. This name is found in
        `HomepageTelemetry.TappedItemType`.'
    - name: user_selection
      type: STRING
      mode: NULLABLE
      description: The user's selected option e.g. "satisfied".
    - name: value
      type: STRING
      mode: NULLABLE
      description: The synchronization status (success, up_to_date, sync_error, ...)
    - name: view
      type: STRING
      mode: NULLABLE
      description: String identifier of the view the user has scrolled to. For match
        cards this is the untranslated phase value (e.g. "Group Stage", "Round of
        16", "Final"); for the timer view it is "countdown" before the tournament
        starts and "follow_your_team" after. For the error view just return "error".
    - name: wallpaper_name
      type: STRING
      mode: NULLABLE
      description: The name of the wallpaper set.
    - name: wallpaper_type
      type: STRING
      mode: NULLABLE
      description: The name of the wallpaper set.
