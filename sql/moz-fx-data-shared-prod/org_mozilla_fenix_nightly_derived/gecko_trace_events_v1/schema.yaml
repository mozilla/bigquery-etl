---
fields:
  - name: submission_date
    type: DATE
    mode: NULLABLE
    description: Date of the data in this row.
  - name: stable_event_id
    type: STRING
    mode: NULLABLE
    description: Stable UUID for this event type. Set on first insert.
  - name: event_signature
    type: STRING
    mode: NULLABLE
    description: |-
      Base64-encoded SHA256 hash of (source_file, source_line, result).
      This is the MERGE key and the cluster key.
  - name: source_file
    type: STRING
    mode: NULLABLE
    description: Source file path where the event occurred.
  - name: source_line
    type: INT64
    mode: NULLABLE
    description: Line number in the source file.
  - name: result
    type: STRING
    mode: NULLABLE
    description: Event result code or status.
  - name: hit_count
    type: INT64
    mode: NULLABLE
    description: Number of times this event occurred on submission_date.
