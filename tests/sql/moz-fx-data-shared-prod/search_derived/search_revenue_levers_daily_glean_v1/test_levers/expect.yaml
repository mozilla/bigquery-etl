# Expected output of search_revenue_levers_daily_glean_v1 for 2026-09-21 (13 rows). A NULL column is omitted, which includes channel (always NULL).
# Rows are split by source (the access point): Google US on Windows has a urlbar row and a contextmenu row,
# and Bing US on Windows has a urlbar row and a searchbar row.
# Desktop: Google US urlbar sums three fixture rows; Google RU (not eligible) and the Bing Acer distribution row are left out.
# Mobile: Fennec counts only on iOS, Google RU is left out, Bing Klar is left out of Bing and DuckDuckGo has no app filter.
# Mobile rows carry the operating system (Android or iOS) and the source, for example action, actionbar and widget.
# monetizable_sap on desktop: Google US urlbar = 10 (RoW code) + 5 (US code in the US), the no_code row's 3 is not counted; Google DE Mac =
# the Mint row's 2 only, since the US code row is outside the US; Google TR has SAP but is an excluded territory, so 0;
# Bing counts MOZI (urlbar, 4 of 7) and MOZR (searchbar, 2 of 2) but not no_code.
# DuckDuckGo counts ffab and ftsa but not no_code, lm or an unlisted code (9 of 17).
# Unlisted Google codes count as not monetizable: windows-firefox-o-re is 4 SAP on contextmenu with 0 monetizable,
# and in Google DE on Linux linux-firefoxmnt-o-re (mint-001) and linux-firefox-us-x are both not monetizable (0 of 4).
