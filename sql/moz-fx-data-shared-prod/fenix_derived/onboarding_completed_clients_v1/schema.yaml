fields:
- name: client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /sql/moz-fx-data-shared-prod/fenix_derived/dataset_schema.yaml
    field: client_id
    append: >-
      Not unique in this table: a client has one row per day on which a
      completion from them arrived.
- name: completed_date
  type: DATE
  mode: NULLABLE
  description: |-
    Date the completion was reported: the ping's submission date, not the date
    the event itself occurred. A delayed ping therefore dates the completion
    later than it happened. Not the client's first completion either — one whose
    completions arrived on more than one day has a row for each.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: /sql/moz-fx-data-shared-prod/fenix_derived/dataset_schema.yaml
    field: sample_id
    append: >-
      Clustering field here; not part of the grain.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: |-
    App display version the client was running at the completion, read from the
    earliest completion event among those reported on this row's date, with ties
    going to the ping that arrived first. Distinct from the app_version on
    retention_clients, which is the version as of that row's metric date and so
    moves as the client upgrades. Null where the event carried no version.
