friendly_name: Analysis Results Monitoring
description: |-
  Daily rollup of experiment analysis metrics with success/failure status, at
  (experiment, analysis_period, window_index, analysis_basis, segment,
  metric) grain. Cells come from jetstream's output and logs for the day,
  plus the cells each experiment's metric_config (experiment_metric_configs_v1)
  says those observed windows should contain (`expected`). Status is
  succeeded, partial, failed, skipped, or missing (defined in the schema; see
  query.py). Used to measure experiment- and metric-level analysis success
  rates. Log rows broader than a single cell are spread onto the expected
  cells they cover; a NULL dimension remains only on rows that covered none
  -- see jetstream_analysis_errors/view.sql for which log sites produce which
  NULLs.
owners:
  - mwilliams@mozilla.com
labels:
  incremental: true
  schedule: daily
bigquery:
  time_partitioning:
    type: day
    field: analysis_date
    require_partition_filter: false
scheduling:
  dag_name: bqetl_experiments_daily
  arguments:
    - --date={{ds}}
    - --rebuild-previous-day
  referenced_tables:
    - ['moz-fx-data-experiments', 'monitoring', 'logs']
    - ['moz-fx-data-experiments', 'monitoring', 'experimenter_experiments_v1']
    - ['moz-fx-data-experiments', 'monitoring', 'experiment_metric_configs_v1']
  depends_on:
    - task_id: jetstream_run
      dag_name: jetstream
      execution_delta: -1h
