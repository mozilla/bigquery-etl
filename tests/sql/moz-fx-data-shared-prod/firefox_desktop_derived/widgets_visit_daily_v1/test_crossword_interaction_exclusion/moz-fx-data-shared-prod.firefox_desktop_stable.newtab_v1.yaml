---
# DENG-11596: verifies that crossword keystroke/cursor noise and context menu echo
# events are excluded, while genuine crossword actions, crossword `interaction`
# events with retained action values, events with no action_value, and identical
# `interaction` events on other widgets are all still counted.
- submission_timestamp: 2026-05-04 12:00:00 UTC
  normalized_os: Windows
  normalized_os_version: "10.0"
  normalized_channel: release
  normalized_country_code: US
  sample_id: 42
  client_info:
    client_id: client_id_1
    app_display_version: "138.0.0"
    locale: en-US
    windows_build_number: 22631
  metrics:
    uuid:
      legacy_telemetry_client_id: legacy_id_1
      legacy_telemetry_profile_group_id: profile_group_id_1
    string:
      newtab_homepage_category: enabled
      newtab_newtab_category: enabled
      newtab_locale: en-US
  events:
    - category: newtab
      name: opened
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: source
          value: about:newtab
      # impression keeps the crossword row alive even though most of its
      # user events are excluded
    - category: newtab
      name: widgets_impression
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
      # EXCLUDED: keystroke and cursor noise
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: interaction
        - key: action_value
          value: input_letter
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: interaction
        - key: action_value
          value: cell_click
      # EXCLUDED: context menu echo
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: interaction
        - key: action_value
          value: reveal_grid_completed
      # RETAINED: `interaction` with an action value that is not on the bad list
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: interaction
        - key: action_value
          value: play_started
      # RETAINED: genuine crossword action
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: puzzle_completed
        - key: action_value
          value: "0"
      # RETAINED: no action_value at all - must not be dropped by the predicate
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: learn_more
      # RETAINED: counts toward change_size_or_learn_more_count
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: crossword
        - key: widget_size
          value: large
        - key: user_action
          value: change_size
        - key: action_value
          value: large
      # RETAINED: identical bad action value on a different widget is unaffected
    - category: newtab
      name: widgets_impression
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: lists
        - key: widget_size
          value: mini
    - category: newtab
      name: widgets_user_event
      extra:
        - key: newtab_visit_id
          value: visit_id_1
        - key: widget_name
          value: lists
        - key: widget_size
          value: mini
        - key: user_action
          value: interaction
        - key: action_value
          value: input_letter
