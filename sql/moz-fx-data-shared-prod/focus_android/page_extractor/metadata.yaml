friendly_name: App-specific view for Glean ping "page-extractor"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox Focus for Android"
  (org_mozilla_focus.page_extractor, org_mozilla_focus_beta.page_extractor, org_mozilla_focus_nightly.page_extractor).

  It is used by Looker.
