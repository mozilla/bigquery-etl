---
fields:
  - name: stable_trace_id
    type: STRING
    mode: NULLABLE
    description: FK to gecko_trace_traces_v1. Stable UUID of the trace pattern.
  - name: bug_id
    type: INT64
    mode: NULLABLE
    description: Bugzilla bug number filed for this trace pattern.
  - name: filed_date
    type: DATE
    mode: NULLABLE
    description: Date when the reporter filed the bug.
  - name: last_comment_date
    type: DATE
    mode: NULLABLE
    description: Date of the last bug comment or filing made by the reporter.
  - name: last_reported_trace_signature
    type: STRING
    mode: NULLABLE
    description: Trace signature whose source locations the reporter last posted to the bug.
