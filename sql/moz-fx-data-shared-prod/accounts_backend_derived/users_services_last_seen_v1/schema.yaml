fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date for which this last-seen record applies. Each row represents the most recent 28-day
    activity window ending on this date for a given user–service combination.
- mode: NULLABLE
  name: user_id_sha256
  type: STRING
  description: SHA-256 hash of the Firefox Accounts user ID, used to identify a unique user while preserving
    privacy. Together with `service`, forms the key joining daily activity records to this last-seen table.
- mode: NULLABLE
  name: service
  type: STRING
  description: Identifier for the Mozilla service the user authenticated with (e.g. 'sync', 'vpn', 'relay',
    or an OAuth client ID hex string). Used to partition last-seen activity per user–service pair.
- mode: NULLABLE
  name: country
  type: STRING
  description: Country (ISO 3166-1 alpha-2) from the most recent day the user–service pair was active,
    taken from `users_services_daily_v1.country`, which is that day's most frequent country. Null if no geo
    data was available that day, even if an earlier day had one.
- mode: NULLABLE
  name: days_seen_bits
  type: INTEGER
  description: |
    No. of days since the user had activity event.
- mode: NULLABLE
  name: days_seen_in_tier1_country_bits
  type: INTEGER
  description: |
    No. of days since seen_in_tier1_country was last True.
- mode: NULLABLE
  name: days_registered_bits
  type: INTEGER
  description: |
    No. of days since registration event.
- name: user_agent_device_count
  type: INTEGER
  mode: NULLABLE
  description: Number of devices associated with the user, per service, per day. Estimated from the number of unique user agent strings.
