friendly_name: STMO Visualizations
description: |
  A copy of the `visualizations` table from the Redash (sql.telemetry.mozilla.org) metadata database, updated daily to match the current state of the table.
owners:
- bewu@mozilla.com
labels:
  schedule: daily
  dag: bqetl_stmo
  owner1: bewu
scheduling:
  dag_name: bqetl_stmo
  date_partition_parameter: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - EXTERNAL_QUERY('moz-fx-data-stmo-prod-33f2.us.stmo-cloudsql-prod', 'SELECT\n         id,\n         updated_at,\n         created_at,\n         type,\n         query_id,\n         name,\n         description,\n         options\n       FROM\n         visualizations\n    ')
