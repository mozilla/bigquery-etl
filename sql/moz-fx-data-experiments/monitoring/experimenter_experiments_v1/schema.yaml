fields:
- name: experimenter_slug
  type: STRING
  mode: NULLABLE
- name: normandy_slug
  type: STRING
  mode: NULLABLE
- name: type
  type: STRING
  mode: NULLABLE
- name: status
  type: STRING
  mode: NULLABLE
- name: start_date
  type: DATE
  mode: NULLABLE
- name: end_date
  type: DATE
  mode: NULLABLE
- name: enrollment_end_date
  type: DATE
  mode: NULLABLE
- name: proposed_enrollment
  type: INTEGER
  mode: NULLABLE
- name: reference_branch
  type: STRING
  mode: NULLABLE
- name: is_high_population
  type: BOOL
  mode: NULLABLE
- name: branches
  type: RECORD
  mode: REPEATED
  fields:
  - name: slug
    type: STRING
    mode: NULLABLE
  - name: ratio
    type: INTEGER
    mode: NULLABLE
  - name: features
    type: JSON
    mode: NULLABLE
- name: app_id
  type: STRING
  mode: NULLABLE
- name: app_name
  type: STRING
  mode: NULLABLE
- name: channel
  type: STRING
  mode: NULLABLE
- name: channels
  type: STRING
  mode: REPEATED
- name: targeting
  type: STRING
  mode: NULLABLE
- name: targeted_percent
  type: FLOAT
  mode: NULLABLE
- name: namespace
  type: STRING
  mode: NULLABLE
- name: feature_ids
  type: STRING
  mode: REPEATED
- name: is_rollout
  type: BOOL
  mode: NULLABLE
- name: outcomes
  type: STRING
  mode: REPEATED
- name: segments
  type: STRING
  mode: REPEATED
- name: randomization_unit
  type: STRING
  mode: NULLABLE
- name: is_firefox_labs_opt_in
  type: BOOL
  mode: NULLABLE
- name: is_enrollment_paused
  type: BOOL
  mode: NULLABLE
- name: metric_config
  type: RECORD
  mode: NULLABLE
  description: Resolved jetstream analysis configuration for the experiment. NULL
    for rollouts, which jetstream does not analyze.
  fields:
  - name: has_external_config
    type: BOOL
    mode: NULLABLE
    description: Whether an experiment-specific config exists in metric-hub/jetstream.
  - name: external_config_url
    type: STRING
    mode: NULLABLE
    description: Link to the experiment's metric-hub/jetstream config, if any.
  - name: external_config_last_modified
    type: TIMESTAMP
    mode: NULLABLE
    description: Last-modified timestamp of the experiment's metric-hub/jetstream
      config, if any.
  - name: has_external_config_overrides
    type: BOOL
    mode: NULLABLE
    description: Whether the external config overrides Experimenter-provided dates
      or reference branch.
  - name: skip
    type: BOOL
    mode: NULLABLE
    description: Whether the config marks this experiment as skipped from analysis.
  - name: is_private
    type: BOOL
    mode: NULLABLE
    description: Whether the config marks this experiment as private.
  - name: analysis_unit
    type: STRING
    mode: NULLABLE
    description: client_id or profile_group_id.
  - name: enrollments_query_type
    type: STRING
    mode: NULLABLE
    description: Enrollment query type override, if any.
  - name: sample_size
    type: INTEGER
    mode: NULLABLE
    description: Percentage of clients to sample for enrollment downsampling, if set.
  - name: overrides
    type: RECORD
    mode: NULLABLE
    description: Values the external config overrides relative to Experimenter. Subfields
      are NULL when not overridden.
    fields:
    - name: reference_branch
      type: STRING
      mode: NULLABLE
    - name: start_date
      type: DATE
      mode: NULLABLE
    - name: end_date
      type: DATE
      mode: NULLABLE
    - name: enrollment_period
      type: INTEGER
      mode: NULLABLE
  - name: segments
    type: RECORD
    mode: REPEATED
    description: Segments applied to the experiment's analysis.
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: friendly_name
      type: STRING
      mode: NULLABLE
    - name: description
      type: STRING
      mode: NULLABLE
  - name: exposure_signal
    type: RECORD
    mode: NULLABLE
    description: Exposure signal applied to the experiment's analysis, if any.
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: friendly_name
      type: STRING
      mode: NULLABLE
    - name: description
      type: STRING
      mode: NULLABLE
    - name: window_start
      type: STRING
      mode: NULLABLE
    - name: window_end
      type: STRING
      mode: NULLABLE
  - name: metrics
    type: RECORD
    mode: REPEATED
    description: Metrics resolved for the experiment, deduplicated by (metric, statistic)
      across all analysis periods.
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: friendly_name
      type: STRING
      mode: NULLABLE
    - name: description
      type: STRING
      mode: NULLABLE
    - name: bigger_is_better
      type: BOOL
      mode: NULLABLE
    - name: type
      type: STRING
      mode: NULLABLE
    - name: category
      type: STRING
      mode: NULLABLE
      description: Free-text grouping label set by the metric's author (e.g. KPI,
        search).
    - name: level
      type: STRING
      mode: NULLABLE
      description: Data-quality tier set by the metric's author (gold, silver, or
        bronze).
    - name: owner
      type: STRING
      mode: REPEATED
    - name: deprecated
      type: BOOL
      mode: NULLABLE
    - name: analysis_bases
      type: STRING
      mode: REPEATED
      description: enrollments and/or exposures.
    - name: statistics
      type: RECORD
      mode: REPEATED
      fields:
      - name: name
        type: STRING
        mode: NULLABLE
      - name: analysis_periods
        type: STRING
        mode: REPEATED
        description: Analysis periods (daily, weekly, days28, overall, preenrollment_weekly,
          preenrollment_days28) this statistic is computed for.
  - name: unresolved_metrics
    type: RECORD
    mode: REPEATED
    description: Metric references that failed to resolve, so the rest of the experiment's
      config could still be captured.
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: analysis_period
      type: STRING
      mode: NULLABLE
    - name: error
      type: STRING
      mode: NULLABLE
  - name: unresolved_outcomes
    type: STRING
    mode: REPEATED
    description: Outcome slugs referenced by the experiment that don't support its
      platform.
  - name: resolution_error
    type: STRING
    mode: NULLABLE
    description: Set only when the experiment's config could not be resolved at all
      (e.g. an invalid experiment spec). Starts with "Cannot load metric-hub as of
      the resolution timestamp" (config_as_of) or "Unexpected error resolving config"
      if the failure may not repeat, and such rows are retried on every run.
  - name: as_of
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp metric-hub was resolved as of for metric_config, matching
      jetstream (when it last touched the experiment's enrollments table). NULL means
      jetstream has not analyzed the experiment yet, so metric-hub HEAD was used,
      or that the row has no metric_config.
- name: monitoring_config
  type: RECORD
  mode: NULLABLE
  description: Resolved opmon monitoring configuration, as of monitoring_config_as_of.
    Set for rollouts, as opmon defines them (isRollout or a single branch), and for
    experiments with a metric-hub/opmon config, NULL otherwise. Rows can have both
    this and metric_config.
  fields:
  - name: has_external_config
    type: BOOL
    mode: NULLABLE
    description: Whether a slug-specific config exists in metric-hub/opmon.
  - name: external_config_url
    type: STRING
    mode: NULLABLE
    description: Link to the slug's metric-hub/opmon config, if any.
  - name: external_config_last_modified
    type: TIMESTAMP
    mode: NULLABLE
    description: Last-modified timestamp of the slug's metric-hub/opmon config, if
      any.
  - name: platform
    type: STRING
    mode: NULLABLE
    description: Platform whose opmon definitions and defaults were applied.
  - name: xaxis
    type: STRING
    mode: NULLABLE
    description: submission_date or build_id.
  - name: start_date
    type: DATE
    mode: NULLABLE
  - name: end_date
    type: DATE
    mode: NULLABLE
  - name: reference_branch
    type: STRING
    mode: NULLABLE
  - name: skip
    type: BOOL
    mode: NULLABLE
    description: Whether the config marks this project as skipped from monitoring.
  - name: skip_default_metrics
    type: BOOL
    mode: NULLABLE
    description: Whether the config opts out of the platform (and rollout) default
      metrics.
  - name: population_data_source
    type: STRING
    mode: NULLABLE
  - name: monitor_entire_population
    type: BOOL
    mode: NULLABLE
  - name: branches
    type: STRING
    mode: REPEATED
    description: Branches monitored, if restricted by the config.
  - name: group_by_dimension
    type: STRING
    mode: NULLABLE
  - name: metrics
    type: RECORD
    mode: REPEATED
    description: Metrics monitored, deduplicated by metric across statistics.
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: friendly_name
      type: STRING
      mode: NULLABLE
    - name: description
      type: STRING
      mode: NULLABLE
    - name: type
      type: STRING
      mode: NULLABLE
    - name: category
      type: STRING
      mode: NULLABLE
    - name: owner
      type: STRING
      mode: REPEATED
    - name: deprecated
      type: BOOL
      mode: NULLABLE
    - name: data_source
      type: STRING
      mode: NULLABLE
    - name: statistics
      type: STRING
      mode: REPEATED
  - name: dimensions
    type: RECORD
    mode: REPEATED
    description: Dimensions the monitored population is broken down by.
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: friendly_name
      type: STRING
      mode: NULLABLE
    - name: description
      type: STRING
      mode: NULLABLE
  - name: alerts
    type: RECORD
    mode: REPEATED
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
    - name: type
      type: STRING
      mode: NULLABLE
      description: ci_overlap or threshold.
    - name: friendly_name
      type: STRING
      mode: NULLABLE
    - name: description
      type: STRING
      mode: NULLABLE
    - name: metrics
      type: STRING
      mode: REPEATED
  - name: metric_groups
    type: STRING
    mode: REPEATED
  - name: resolution_error
    type: STRING
    mode: NULLABLE
    description: Set only when the monitoring config could not be resolved (e.g. a
      missing metric definition or an invalid platform). Starts with "Cannot load
      metric-hub as of the resolution timestamp" (monitoring_config_as_of) or "Unexpected
      error resolving config" if the failure may not repeat, and such rows are retried
      on every run.
  - name: as_of
    type: TIMESTAMP
    mode: NULLABLE
    description: 'Timestamp metric-hub was resolved as of for monitoring_config: the
      day after the experiment ended (its opmon config''s end_date, if set), the last
      day opmon monitors it. NULL means the experiment is live, so metric-hub HEAD
      was used, or that the row has no monitoring_config.'
- name: metric_config_computed_at
  type: TIMESTAMP
  mode: NULLABLE
  description: 'When this row was last resolved. Rows for experiments that ended over
    30 days ago are reused for up to 7 days, and indefinitely once over 90 days ago,
    unless config_as_of changes.

    Applies to both metric_config and monitoring_config, which are resolved together.'
