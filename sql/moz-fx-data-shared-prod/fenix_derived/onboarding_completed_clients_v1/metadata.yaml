friendly_name: Onboarding Completed Clients
description: "One row per Fenix client per day on which an `onboarding.completed`\
  \ event from\nthem arrived, dated by submission date rather than by when the event\
  \ fired. A\nclient with completions arriving on more than one day has a row for\
  \ each, so\n`client_id` is not unique here \u2014 collapse on it before joining.\n\
  `fenix.onboarding_completed_clients` exposes this table unchanged;\n`fenix.retention_clients`\
  \ takes `MIN(completed_date)` per client.\n\nCoverage will begin 2025-01-01 when\
  \ the table is backfilled; until then it\nholds only the days since it was deployed.\
  \ A client whose completions all fall\nbefore 2025-01-01 will not appear here."
owners:
- kbammarito@mozilla.com
labels:
  application: fenix
  incremental: true
  schedule: daily
  table_type: client_level
  dag: bqetl_mobile_kpi_metrics
  owner1: kbammarito
scheduling:
  dag_name: bqetl_mobile_kpi_metrics
  task_group: fenix
  date_partition_parameter: submission_date
bigquery:
  time_partitioning:
    type: day
    field: completed_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - sample_id
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.fenix.events_stream
require_column_descriptions: true
