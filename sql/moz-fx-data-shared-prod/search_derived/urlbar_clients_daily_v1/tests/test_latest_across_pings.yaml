sources:
  moz-fx-data-shared-prod.firefox_desktop_derived.urlbar_events_v2:
    # event_timestamp restarts in every events ping, so the latest values come from the
    # highest seq first. The later ping (seq 6) has the smaller timestamp.

    # Earlier ping, late in that ping: sponsored on, old profile group id.
    - submission_date: "2026-10-14"
      glean_client_id: client-d
      profile_group_id: group-old
      sample_id: 4
      seq: 5
      event_name: abandonment
      event_timestamp: 900
      event_id: e1
      pref_fx_suggestions: true
      pref_sponsored_suggestions: true
      pref_ohttp_available: false
      pref_ohttp_enabled: false
      pref_data_collection: false
      interaction: typed
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}
    # Later ping, early in that ping: sponsored off, new profile group id.
    - submission_date: "2026-10-14"
      glean_client_id: client-d
      profile_group_id: group-new
      sample_id: 4
      seq: 6
      event_name: abandonment
      event_timestamp: 50
      event_id: e2
      pref_fx_suggestions: true
      pref_sponsored_suggestions: false
      pref_ohttp_available: true
      pref_ohttp_enabled: true
      pref_data_collection: true
      interaction: typed
      event_action: abandoned
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}

parameters:
  - name: submission_date
    type: DATE
    value: "2026-10-14"

expect:
  # NULL columns are omitted: the harness drops null keys from the result row.

  # Prefs and profile group id from e2, the event in the later ping.
  - submission_date: "2026-10-14"
    client_id: client-d
    profile_group_id: group-new
    sample_id: 4
    pref_suggest_enabled: true
    pref_sponsored_enabled: false
    pref_online_suggest_available: true
    pref_online_suggest_enabled: true
    pref_data_collection: true
    sessions_total: 2
    sessions_engaged: 0
    sessions_abandoned: 2
    results:
      - window_mode: classic
        sap: urlbar
        interaction: typed
        result_type: search_engine
        product_result_type: search_engine
        result_group: heuristic
        clicks: 0
        sessions_shown: 2
        sessions_shown_abandoned: 2
        annoyances: 0
