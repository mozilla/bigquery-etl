    - name: netwerk_happy_eyeballs_https_rr_features_by_resolver
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: RECORD
        mode: REPEATED
        fields:
        - name: key
          type: STRING
        - name: value
          type: INTEGER
      description: 'Happy Eyeballs: which connection-bootstrapping features the HTTPS
        DNS records carried, combined across all HTTPS records received for a connection
        (the union of features over every record, not per record), split by the resolver
        type (DoH/TRR vs native) that produced the HTTPS response. The "total" category
        is incremented once per connection that saw at least one non-empty HTTPS record
        and serves as the denominator; each feature category is incremented once per
        connection whose combined records carried that feature. "ech" and the address
        hints can only be delivered ahead of the first connection via the DNS record,
        not via an Alt-Svc header. Used to compare how often DoH versus native resolution
        yields a usable (and h3-capable) HTTPS record. This is the resolver-split
        companion of happy_eyeballs_https_rr_features.

        '
    - name: tls_handshake_result
      type: RECORD
      mode: REPEATED
