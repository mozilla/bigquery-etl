sources:
  moz-fx-data-shared-prod.firefox_desktop_derived.urlbar_events_v2:
    # Paste-and-go and a quick action: neither input_field nor action_* is in the results
    # list, so each becomes its own element and clicks still sum to sessions_engaged.
    - submission_date: "2026-10-14"
      glean_client_id: client-a
      sample_id: 1
      event_name: engagement
      event_timestamp: 100
      event_id: e1
      interaction: pasted
      selected_result: input_field
      product_selected_result: other
      event_action: engaged
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}
    - submission_date: "2026-10-14"
      glean_client_id: client-a
      sample_id: 1
      event_name: engagement
      event_timestamp: 200
      event_id: e2
      interaction: typed
      selected_result: action_tabgroup-0
      product_selected_result: other
      event_action: engaged
      is_terminal: true
      window_mode: classic
      sap: urlbar
      results:
        - {position: 1, result_type: search_engine, product_result_type: search_engine, result_group: heuristic}

parameters:
  - name: submission_date
    type: DATE
    value: "2026-10-14"

expect:
  # NULL columns are omitted: the harness drops null keys from the result row.
  # Elements are sorted by window_mode, sap, interaction, result_type, as in the query.

  # result_group is NULL on the input_field and action_* elements: the picks weren't in
  # the results list.
  - submission_date: "2026-10-14"
    client_id: client-a
    sample_id: 1
    sessions_total: 2
    sessions_engaged: 2
    sessions_abandoned: 0
    results:
      - window_mode: classic
        sap: urlbar
        interaction: pasted
        result_type: input_field
        product_result_type: other
        clicks: 1
        sessions_shown: 0
        sessions_shown_abandoned: 0
        annoyances: 0
      - window_mode: classic
        sap: urlbar
        interaction: pasted
        result_type: search_engine
        product_result_type: search_engine
        result_group: heuristic
        clicks: 0
        sessions_shown: 1
        sessions_shown_abandoned: 0
        annoyances: 0
      - window_mode: classic
        sap: urlbar
        interaction: typed
        result_type: action_tabgroup-0
        product_result_type: other
        clicks: 1
        sessions_shown: 0
        sessions_shown_abandoned: 0
        annoyances: 0
      - window_mode: classic
        sap: urlbar
        interaction: typed
        result_type: search_engine
        product_result_type: search_engine
        result_group: heuristic
        clicks: 0
        sessions_shown: 1
        sessions_shown_abandoned: 0
        annoyances: 0
