friendly_name: Search Revenue Levers Daily
description: |-
  Daily metrics identified as search revenue levers, including eligible DOU,
  DOU_engaged_w_sap, sap, tagged_sap, tagged_follow_on, search_with_ads, and ad_clicks.
  The table is labeled as "change_controlled", which implies
  that changes require the approval of at least one owner.
owners:
- mozilla/revenue_forecasting_data_reviewers
labels:
  incremental: true
  schedule: daily
  change_controlled: true
  dag: bqetl_search_dashboard
  shredder_mitigation: true
scheduling:
  dag_name: bqetl_search_dashboard
  # Prevent inheriting the -1d partition offset from `firefox_desktop_derived.serp_events_v2`
  # for now to preserve existing behavior.
  # TODO srose to follow up with the owners about the `serp_events` metrics always being null
  # because this reads the `serp_events` partition for @submission_date before it's populated.
  # Inheriting the -1d partition offset would fix that, but would delay all metrics by a day.
  partition_offset: 0d
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  range_partitioning: null
  clustering: null
