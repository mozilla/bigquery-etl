friendly_name: Jira SREIN Ticket Events
description: |-
  Change events on Jira tickets in the SREIN (MozCloud Intake) project, pulled
  from Jira API v3. One row per event: issue creation, status changes, other
  field changes, and comments.

  Comment bodies are deliberately not stored. The "Last Comment" and "Rank"
  changelog fields are excluded — "Last Comment" duplicates the comment events
  and embeds comment text, and "Rank" is backlog-reordering noise.

  Partitions are keyed on event date. The daily task can only maintain recent
  partitions: JQL `updated` reflects only an issue's most recent update, so
  re-running an old date fetches only the subset of that day's issues that have
  not been touched since, and would replace the partition with that subset.
  Dates more than 3 days old are therefore refused unless `--allow-stale-date`
  is passed, so clearing an old run in Airflow fails loudly rather than
  silently truncating a good partition.

  Repair is a full manual rebuild, run from a checkout of bigquery-etl with
  JIRA_USERNAME and JIRA_TOKEN in the environment (note that `bqetl query run`
  does not work here — it only matches `*.sql` files, and a bare
  `python query.py` imports a stale installed copy of `bigquery_etl`):

    PYTHONPATH=<repo root> python \
      sql/moz-fx-data-shared-prod/jira_events_derived/srein_events_v1/query.py \
      --seed
owners:
- wstuckey@mozilla.com
labels:
  schedule: daily
  incremental: true
  owner1: wstuckey@mozilla.com
bigquery:
  time_partitioning:
    type: day
    field: event_ts
    require_partition_filter: false
  clustering:
    fields:
    - project_key
    - issue_key
scheduling:
  dag_name: bqetl_jira_tickets
  arguments:
  - --date={{ds}}
  secrets:
  - deploy_target: JIRA_USERNAME
    key: bqetl_jira_service_desk__jira_username
  - deploy_target: JIRA_TOKEN
    key: bqetl_jira_service_desk__jira_token
