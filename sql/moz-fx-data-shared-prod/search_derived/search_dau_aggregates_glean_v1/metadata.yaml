friendly_name: Search DAU Aggregates Glean
description: |-
  Daily desktop DAU by search behavior, per partner: `dau_w_engine_as_default` and
  `dau_engaged_w_sap`. The Glean desktop counterpart of the desktop arm of
  `search_dau_aggregates_v1`.

  Desktop only. The mobile arm of `search_dau_aggregates_v1` already reads Glean, so it is not
  copied here, and `device` is always `desktop`. Read mobile rows from the legacy table with
  `device = 'mobile'`. Reading that table without the filter counts desktop twice.

  DAU comes from `firefox_desktop.baseline_active_users`, keyed on the Glean `client_id`. Copied
  profiles give several Glean ids for one legacy id, so this DAU runs higher than the legacy
  table's, and per-DAU measures will not tie to their legacy counterparts. That is expected.

  `dau_w_engine_as_default` counts every DAU client whose default engine is the partner's,
  whether or not they searched, as `search_dau_aggregates_v1` does. `search_clients_daily_glean_v1`
  only has rows for clients with search activity, so the default engine and `distribution_id`
  come from the nearest metrics ping from 7 days before to 1 day after the date (`provider_id`,
  then `engine_id` for builds without it), then the client table. The window covers clients that send no
  metrics ping on a given day. A small share of DAU still has no engine from any of these.

  Searches come from `search_clients_daily_glean_v1`, joined on `client_id` only. `country` is
  the DAU side's one value per client-day.

  `sap_category` flags whether the client had a search access point event. `ad_click_category`
  flags tagged ad clicks from the browser.search.adclicks counters, the series that reconciles
  to `search_clients_daily_v8`, and `ad_click_category_serp` flags them from SERP events, which run about 17% lower.
  Both are grain keys, so a client can land on a different row depending on which is used.

  The Google eligible-country lists are ported verbatim from `search_dau_aggregates_v1`.

  Open decision: the Bing arm applies that table's `distribution_id` Acer check, but not its
  exclusion of clients on the `search.acer_cohort` list, which is keyed on the legacy
  `client_id`. Bing DAU therefore includes Acer clients the legacy table excluded. This is
  accepted for now and is to be finalized before the table feeds revenue reporting.

owners:
- lmcfall@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: aggregate
scheduling:
  dag_name: bqetl_search_dashboard
  date_partition_offset: -1
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  clustering: null
