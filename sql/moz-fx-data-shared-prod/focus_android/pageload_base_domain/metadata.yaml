friendly_name: App-specific view for Glean ping "pageload-base-domain"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox Focus for Android"
  (org_mozilla_focus.pageload_base_domain, org_mozilla_focus_beta.pageload_base_domain, org_mozilla_focus_nightly.pageload_base_domain).

  It is used by Looker.
owners: []
labels:
  sql_generator: glean_usage
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  view.sql:
  - moz-fx-data-shared-prod.org_mozilla_focus.pageload_base_domain
  - moz-fx-data-shared-prod.org_mozilla_focus_beta.pageload_base_domain
  - moz-fx-data-shared-prod.org_mozilla_focus_nightly.pageload_base_domain
