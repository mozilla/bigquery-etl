- name: is_desktop_argument_profile_automation
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the profile matches the automated segment tracked in DENG-11590,
    per udf.is_desktop_argument_profile_automation. FALSE when an input is unknown.
