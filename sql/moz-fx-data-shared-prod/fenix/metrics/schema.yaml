    - name: networking_http_3_slow_start_exit_accuracy
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: RECORD
        fields:
        - name: count
          type: INTEGER
        - name: sum
          type: INTEGER
        - name: values
          type: RECORD
          mode: REPEATED
          fields:
          - name: key
            type: STRING
          - name: value
            type: INTEGER
      description: 'HTTP3: Absolute congestion window size difference between exiting
        slow start and closing the connection, as a percentage of the window size
        when closing the connection. Only recorded for connections that exited slow
        start and saw congestion window growth. Is used to approximate accuracy of
        slow start exit per connection. The labels separate slow start exit reasons,
        because congestion event and heuristic based exits are fundamentally different
        cases that would obscure each other if mixed.

        '
    - name: networking_http_3_hystart_css_entries
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: RECORD
        fields:
        - name: count
          type: INTEGER
        - name: sum
          type: INTEGER
        - name: values
          type: RECORD
          mode: REPEATED
          fields:
          - name: key
            type: STRING
          - name: value
            type: INTEGER
      description: 'Measures how often CSS (Conservative Slow Start) was entered when
        using HyStart++. Only records for connections that saw congestion window growth.
        A jitter-free connection should only see 1 CSS entry. A high value points
        at spurious CSS entries mid-round, i.e. CSS is entered and exited within 1
        RTT, which results time spent throttling congestion window growth rate during
        those extra ACKs where CSS was active.

        '
    - name: networking_http_3_hystart_css_rounds_finished
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: RECORD
        fields:
        - name: count
          type: INTEGER
        - name: sum
          type: INTEGER
        - name: values
          type: RECORD
          mode: REPEATED
          fields:
          - name: key
            type: STRING
          - name: value
            type: INTEGER
      description: 'Measures how many CSS (Conservative Slow Start) rounds were finished
        when using HyStart++. Only records for connections that saw congestion window
        growth. A count that is higher than the RFC threshold value of 5 rounds that
        are completed by design points at spurious CSS entries and time spent throttling
        congestion window growth rate during those extra CSS rounds. Values below
        5 mean that slow start was not exited (heuristically) on that connection.

        '
    - name: networking_http_3_slow_start_exit_accuracy_w_max
      type: RECORD
      mode: REPEATED
      fields:
      - name: key
        type: STRING
      - name: value
        type: RECORD
        fields:
        - name: count
          type: INTEGER
        - name: sum
          type: INTEGER
        - name: values
          type: RECORD
          mode: REPEATED
          fields:
          - name: key
            type: STRING
          - name: value
            type: INTEGER
      description: 'HTTP3: Absolute congestion window size difference between exiting
        slow start and Cubic''s w_max parameter value when closing the connection,
        as a percentage of the w_max parameter value. Only recorded for connections
        that exited slow start and saw congestion window growth. Is used to approximate
        accuracy of slow start exit per connection. The labels separate slow start
        exit reasons, because congestion event and heuristic based exits are fundamentally
        different cases that would obscure each other if mixed. Acts as an alternative
        measure to http_3_slow_start_exit_accuracy, which uses the final congestion
        window instead of w_max.

        '
