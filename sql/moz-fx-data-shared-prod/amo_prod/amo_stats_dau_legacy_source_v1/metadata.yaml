friendly_name: AMO Stats DAU (Deprecated)
description: |-
  Deprecated - please use tables or views inside addons_derived or addons instead.
  For more info see: DENG-9505.

  Daily user statistics to power addons.mozilla.org stats pages.
  See bug 1572873.

  Each row in this table represents a particular addon on a particular day
  and provides all the information needed to populate the various
  "Daily Users" plots for the AMO stats dashboard.

  NOTE: Includes only clients that reported major app_version older than 148.
owners:
- kik@mozilla.com
labels:
  application: amo
  incremental: true
  schedule: daily
  table_type: aggregate
  owner1: kik
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - addon_id
workgroup_access: []
deprecated: true
