friendly_name: Copy of Native Desktop Ads Metrics
description: |-
  This is a table created to test moving ads models to the public repository.
owners:
- cbeck@mozilla.com
labels:
  incremental: true
  owner1: cbeck
scheduling:
  partition_offset: -1h
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  clustering:
    fields:
    - advertiser
    - country
workgroup_access: []
references:
