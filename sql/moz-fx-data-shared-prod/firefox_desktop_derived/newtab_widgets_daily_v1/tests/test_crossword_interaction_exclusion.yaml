sources:
  moz-fx-data-shared-prod.firefox_desktop_stable.newtab_v1:
    # DENG-11596: verifies that crossword keystroke/cursor noise and context menu echo
    # events are excluded, while genuine crossword actions, crossword `interaction`
    # events with retained action values, events with no action_value, and identical
    # `interaction` events on other widgets are all still counted.
    - submission_timestamp: 2026-05-04 12:00:00 UTC
      client_info:
        client_id: client_id_1
      events:
        - category: newtab
          name: widgets_impression
          extra:
            - key: widget_name
              value: crossword
        # EXCLUDED: keystroke and cursor noise
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: crossword
            - key: user_action
              value: interaction
            - key: action_value
              value: input_letter
        # EXCLUDED: context menu echo
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: crossword
            - key: user_action
              value: interaction
            - key: action_value
              value: all_clues_opened
        # RETAINED: `interaction` with an action value that is not on the bad list
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: crossword
            - key: user_action
              value: interaction
            - key: action_value
              value: hint_revealed
        # RETAINED: crossword `interaction` with no action_value key at all. Guards
        # against NULL propagation - the predicate must treat this as a genuine event
        # rather than evaluating to NULL and silently dropping it.
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: crossword
            - key: user_action
              value: interaction
        # RETAINED: genuine action with no action_value. Also counts toward
        # widget_link_click_count.
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: crossword
            - key: user_action
              value: learn_more
        # RETAINED: genuine crossword action
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: crossword
            - key: user_action
              value: puzzle_completed
            - key: action_value
              value: "0"
        # RETAINED: identical bad action value on a different widget is unaffected
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: lists
            - key: user_action
              value: interaction
            - key: action_value
              value: input_letter
        # RETAINED: counts toward widget_utility_action_count
        - category: newtab
          name: widgets_user_event
          extra:
            - key: widget_name
              value: lists
            - key: user_action
              value: list_create

parameters:
  - name: submission_date
    type: DATE
    value: 2026-05-04

expect:
  # crossword: 2 of the 6 user events are excluded (input_letter, all_clues_opened).
  # The 4 retained events are the `interaction` with hint_revealed, the `interaction`
  # with no action_value, learn_more and puzzle_completed.
  - submission_date: 2026-05-04
    widget_name: crossword
    widget_engaged_clients: 1
    widget_enabled_count: 0
    widget_disabled_count: 0
    widget_impression_count: 1
    widget_user_event_count: 4
    widget_link_click_count: 1
    widget_setting_change_count: 0
    widget_utility_action_count: 0
    widget_optin_accept_count: 0
    widget_user_action_counts:
      - action: interaction
        count: 2
      - action: learn_more
        count: 1
      - action: puzzle_completed
        count: 1
  # lists: the same `interaction` / input_letter event is retained because the
  # exclusion is scoped to the crossword widget
  - submission_date: 2026-05-04
    widget_name: lists
    widget_engaged_clients: 1
    widget_enabled_count: 0
    widget_disabled_count: 0
    widget_impression_count: 0
    widget_user_event_count: 2
    widget_link_click_count: 0
    widget_setting_change_count: 0
    widget_utility_action_count: 1
    widget_optin_accept_count: 0
    widget_user_action_counts:
      - action: interaction
        count: 1
      - action: list_create
        count: 1
