fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- name: segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium; similar or the same as UTM medium.
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source; similar or the same as UTM source.
- name: attributed
  type: BOOLEAN
  mode: NULLABLE
  description: True if at least one of attribution medium and source are available.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source for the browser distribution installed on the client. Only
    populated for Fenix; NULL for desktop and all other apps. For Fenix it comes from
    fenix.firefox_android_clients, which collapses values to 'com.android.vending',
    'Other' or 'Unknown'. It reads the metrics ping metric metrics.install_source, which
    stopped being populated for most new profiles around Sept 2024 (replaced by
    first_session.install_source, bug 1908383), so recent clients mostly show 'Unknown'.
    Use fenix.attribution_clients or fenix.new_profile_clients for install source
    analysis.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation. '??' when unknown. There is no 'ALL' summary row; sum across
    countries for a global total.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: The year when the first ping was received from the client.
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
    All channels are included (release, beta, nightly, esr, ...); filter channel = 'release'
    explicitly for most analyses.
- name: os
  type: STRING
  mode: NULLABLE
  description: The normalized name of the operating system running at the client.
    Raw values, e.g. 'Windows_NT', 'Darwin', 'Linux' for desktop. Use os_grouped for
    'Windows' / 'Mac' / 'Linux'.
- name: os_version
  type: STRING
  mode: NULLABLE
  description: Version of the operating system running at the client. For desktop
    Windows this is a readable name from mozfun.norm.windows_version_info, e.g. 'Windows 7',
    'Windows 10', 'Windows 11', or 'Windows 10 or 11' when the build number is missing.
    For other desktop OSes and for mobile it is the raw version string.
    Mapped from os_version_build in firefox_desktop.active_users_aggregates.
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
    Truncated to the language part, e.g. 'en-US' is stored as 'en'.
- name: dau
  type: INTEGER
  mode: NULLABLE
  description: The number of daily active users, corresponding to the count of clients
    that reported at least one ping on the submission_date and qualify as active. Desktop
    active means active_hours_sum > 0 and URI count > 0; mobile active means baseline ping
    duration > 0. This is the column used for the DAU KPI. Always dau <= daily_users.
- name: wau
  type: INTEGER
  mode: NULLABLE
  description: The number of weekly active users, corresponding to the count of clients
    that reported at least one ping on the previous 7 days from the submission_date
    and qualify as active.
- name: mau
  type: INTEGER
  mode: NULLABLE
  description: The number of monthly active users, corresponding to the count of clients
    that reported at least one ping on the previous 28 days from the submission_date
    and qualify as active.
- name: daily_users
  type: INTEGER
  mode: NULLABLE
  description: Count of clients that send a main or baseline ping at least once in the submission_date.
    No activity requirement, so it is always >= dau. Do not use it as DAU.
- name: weekly_users
  type: INTEGER
  mode: NULLABLE
  description: Count of clients that send a main or baseline ping at least once in the previous 7 days.
- name: monthly_users
  type: INTEGER
  mode: NULLABLE
  description: Count of clients that send a main or baseline ping at least once in the previous 28 days.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the browser. One of 'Firefox Desktop', 'Fenix', 'Firefox iOS',
    'Focus Android', 'Focus iOS', 'Klar Android', 'Klar iOS'. BrowserStack and MozillaOnline
    clients get a suffixed value (e.g. 'Firefox Desktop BrowserStack', 'Firefox Desktop
    MozillaOnline'), so filtering app_name = 'Firefox Desktop' excludes them, matching the
    desktop KPI.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: Patch revision of the browser version.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: True if the browser version corresponds to a major release.
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: Operating systems grouped into major categories.
- name: partnership
  type: STRING
  mode: NULLABLE
  description: partnership
