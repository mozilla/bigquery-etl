friendly_name: GCP Monitoring Metrics Hourly
description: |-
  Hourly values of selected Cloud Monitoring metrics from data ingestion
  projects, such as Pub/Sub topic and subscription byte cost, Dataflow user counters, and ingestion
  edge load balancer bytes. Each row is the increase of a metric over one hour for one
  combination of labels. The metric definitions are in query.py.

  Cloud Monitoring only keeps a few weeks to months of data, so partitions
  older than that cannot be rebuilt.
owners:
- benwu@mozilla.com
labels:
  incremental: true
  schedule: hourly
  owner1: benwu
  dag: bqetl_monitoring_hourly
scheduling:
  dag_name: bqetl_monitoring_hourly
  arguments:
  - --date
  - '{{ (logical_date - macros.timedelta(hours=2)).strftime(''%Y-%m-%d'') }}'
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - metric
    - project_id
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
