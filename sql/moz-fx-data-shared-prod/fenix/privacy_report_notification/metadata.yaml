friendly_name: App-specific view for Glean ping "privacy-report-notification"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox for Android"
  (org_mozilla_firefox.privacy_report_notification, org_mozilla_firefox_beta.privacy_report_notification, org_mozilla_fenix.privacy_report_notification, org_mozilla_fenix_nightly.privacy_report_notification, org_mozilla_fennec_aurora.privacy_report_notification).

  It is used by Looker.
owners: []
labels:
  sql_generator: glean_usage
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  view.sql:
  - moz-fx-data-shared-prod.org_mozilla_fenix.privacy_report_notification
  - moz-fx-data-shared-prod.org_mozilla_fenix_nightly.privacy_report_notification
  - moz-fx-data-shared-prod.org_mozilla_fennec_aurora.privacy_report_notification
  - moz-fx-data-shared-prod.org_mozilla_firefox.privacy_report_notification
  - moz-fx-data-shared-prod.org_mozilla_firefox_beta.privacy_report_notification
