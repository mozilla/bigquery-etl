friendly_name: WWW Site Downloads V2
description: |-
  Aggregated download counts for www.mozilla.org from Google Analytics 4 (GA4)
owners:
- kik@mozilla.com
- data-marketing-wg@mozilla.com
labels:
  incremental: true
  owner1: kik
  owner2: data-marketing-wg
bigquery:
  time_partitioning:
    type: day
    field: date
    require_partition_filter: true
    expiration_days: null
  clustering:
    fields:
    - country
    - device_category
    - operating_system
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
- role: roles/bigquery.metadataViewer
  members:
  - workgroup:google-managed/external-ads-dataproc
references:
  query.sql:
  - moz-fx-data-marketing-prod.analytics_313696158.events_*
