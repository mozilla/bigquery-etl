name: Cleanup Private Diff Branch
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Delete diff branch in private-bigquery-etl
    runs-on: ubuntu-latest
    # Fork PRs don't have access to secrets and never create diff branches
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Dependabot-triggered closures only see Dependabot secrets, so the key must
      # be set there too. If it's missing anywhere, skip instead of failing the run
      HAS_CI_BOT_KEY: ${{ secrets.BQETL_CI_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Generate bigquery-etl-ci-bot token
        id: app-token
        if: env.HAS_CI_BOT_KEY == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ secrets.BQETL_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BQETL_CI_BOT_PRIVATE_KEY }}
          owner: mozilla
          repositories: private-bigquery-etl
          permission-contents: write
      - name: Delete bqetl-diff branch
        if: steps.app-token.outputs.token != ''
        env:
          TRIGGER_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRIVATE_REPO: mozilla/private-bigquery-etl
        run: |
          BRANCH="bqetl-diff/pr-${PR_NUMBER}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -X DELETE \
            "https://api.github.com/repos/${PRIVATE_REPO}/git/refs/heads/${BRANCH}")

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Deleted branch ${BRANCH} in private-bigquery-etl"
          elif [ "$HTTP_STATUS" = "422" ]; then
            echo "Branch ${BRANCH} does not exist in private-bigquery-etl (already cleaned up)"
          else
            echo "::warning::Unexpected status ${HTTP_STATUS} when deleting branch ${BRANCH}"
          fi
      - name: Report missing key
        if: steps.app-token.outputs.token == ''
        run: echo "::warning::BQETL_CI_BOT_PRIVATE_KEY not available to this run, skipping diff branch cleanup"
