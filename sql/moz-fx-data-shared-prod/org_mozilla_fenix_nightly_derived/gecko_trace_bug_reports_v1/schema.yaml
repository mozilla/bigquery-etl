---
fields:
  - name: submission_date
    type: DATE
    mode: NULLABLE
    description: Date this row was inserted.
  - name: stable_trace_id
    type: STRING
    mode: NULLABLE
    description: Stable UUID of the trace pattern. Foreign key to gecko_trace_traces_v1.
  - name: app_id
    type: STRING
    mode: NULLABLE
    description: Application ID, for example firefox_desktop.
  - name: bug_id
    type: INT64
    mode: NULLABLE
    description: Bugzilla bug number filed for this trace pattern.
  - name: filed_date
    type: DATE
    mode: NULLABLE
    description: Date the Bugzilla bug was filed.
