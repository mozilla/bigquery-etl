friendly_name: Gecko Trace Traces Daily
description: |-
  Daily counts of trace patterns from Gecko traces.

  Each row has one trace signature, its count and its average duration for one day.
  Join gecko_trace_traces_v1 on trace_signature to get the stable_trace_id.
  A re-run of the same day replaces the partition.
owners:
- jjalkanen@mozilla.com
labels:
  incremental: true
  schedule: daily
  dag: bqetl_gecko_trace
  owner1: jjalkanen
scheduling:
  dag_name: bqetl_gecko_trace
  task_group: firefox_desktop
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - trace_signature
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.firefox_desktop_stable.gecko_trace_v1
