fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: newtab_addon_version
  type: STRING
  mode: NULLABLE
  description: Version of the newtab@mozilla.org addon reported by the client (`$.version`
    in metrics.object.addons_active_addons).
- name: is_system
  type: BOOLEAN
  mode: NULLABLE
  description: The client's own built-in (TRUE) vs. trainhop (FALSE) marker (`$.isSystem`),
    from the first ping of the day reporting this version.
- name: install_date
  type: DATE
  mode: NULLABLE
  description: Addon update date reported by the client (`$.updateDay`, days since
    1970-01-01), from the first ping of the day reporting this version. The date comes
    from the client's clock. In practice it's the date the version was installed,
    which can be days before it is first reported. A wrong client clock could give
    a wrong date, including dates in the future. NULL for built-in copies, which report
    0, and rarely for a trainhop that reports 0 or an out-of-range value. A client
    going back to an earlier trainhop reports the original date, so use first_seen_timestamp
    to find when a version was first reported.
- name: first_seen_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: submission_timestamp of the first ping of the day reporting this version.
    Orders versions within a day.
- name: last_seen_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: submission_timestamp of the last ping of the day reporting this version.
    With first_seen_timestamp, overlapping time ranges show a client going back and
    forth within the day.
- name: startup_ping_count
  type: INTEGER
  mode: NULLABLE
  description: Number of addons pings with reason `startup` reporting this version.
    Shows whether this version comes from restarts.
- name: daily_ping_count
  type: INTEGER
  mode: NULLABLE
  description: Number of addons pings with reason `daily` reporting this version.
    This is the reason type where addon version drops to built-in will show up.
- name: updated_ping_count
  type: INTEGER
  mode: NULLABLE
  description: Number of addons pings with reason `updated` reporting this version,
    i.e. reported when an addon changed mid-session.
- name: is_last_reported_version
  type: BOOLEAN
  mode: NULLABLE
  description: TRUE for the version on the client's last-received addons ping of the
    day that reported the newtab addon (latest submission_timestamp, tiebreak document_id).
    Filter to TRUE to get one row per client per day for their most recent addon version.
