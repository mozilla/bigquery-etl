fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The cohort date, equal to cohort_date.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis.
- name: cohort_date
  type: DATE
  mode: NULLABLE
  description: Cohort Date - First Seen Date
- name: days_data_available
  type: INTEGER
  mode: NULLABLE
  description: Number of days of data for the cohort, from first_seen_date through
    the latest date the query read, counting both ends.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the browser.
- name: app_display_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142.
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1.
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: Application Version Patch Revision number
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: Is app_version a major release or not
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: distribution_id_source
  type: STRING
  mode: NULLABLE
  description: Distribution Id - Legacy or Glean
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: The normalized name of the operating system running at the client.
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
  description: The operating system version normalized to a consistent format at ingestion
    (e.g. "10.0" for Windows, "16" for Android, "26.3.1" for iOS, "25.3.0" for macOS,
    "6.8" for Linux). Windows 10 and Windows 11 both show "10.0". Use `windows_build_number
    >= 22000` to identify Windows 11.
- name: os_version_build
  type: STRING
  mode: NULLABLE
  description: OS Version Build
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: Year of first seen date
- name: first_seen_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign at first seen (e.g. 'mozilla-org').
- name: first_seen_attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content at first seen (e.g. 'firefoxview').
- name: first_seen_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium at first seen (e.g. 'organic' for a search engine).
- name: first_seen_attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source at first seen (e.g. 'google-play').
- name: first_seen_attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term at first seen (e.g. 'browser with developer tools
    for android').
- name: first_seen_distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name at first seen (e.g. 'MozillaOnline').
- name: is_desktop
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates if the client is included in the desktop KPI.
- name: policies_is_enterprise
  type: BOOLEAN
  mode: NULLABLE
  description: Attempt to determine if the user is an enterprise user based on various
    signals.
- name: churn_risk_after_5_days
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the client was inactive on days 1 to 4 after its first seen
    date (day 0), marking it at high risk of churning. NULL until day 4 has data.
    E.g. once day 4 has data, a client active on day 0 and no other day reads TRUE,
    and a client active on days 0 and 3 reads FALSE.
- name: churn_risk_after_7_days
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the client was inactive on days 2 to 6 after its first seen
    date (day 0), marking it at high risk of churning. NULL until day 6 has data.
    E.g. once day 6 has data, a client active on days 0 and 1 and no other day reads
    TRUE, and a client active on days 0, 1 and 4 reads FALSE.
- name: churned_after_1_day
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the client was active on its first seen date (day 0), then
    inactive on days 1 to 28. NULL until day 28 has data. E.g. once day 28 has data,
    a client active on day 0 and no other day reads TRUE, and a client active on days
    0 and 1 reads FALSE.
- name: churned_after_2_days
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the client was active on day 1 after its first seen date (day
    0), then inactive on days 2 to 29. NULL until day 29 has data. E.g. once day 29
    has data, a client active on days 0 and 1 and no other day reads TRUE, and a client
    active on day 0 and no other day reads FALSE.
- name: immediately_churned
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the client was inactive on days 0 to 27, starting from its
    first seen date (day 0). NULL until day 27 has data. E.g. once day 27 has data,
    a client active on none of those days reads TRUE, and a client active on day 0
    reads FALSE.
- name: day_0
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the client qualified as DAU on their first seen date (Day 0).
- name: day_1
  type: BOOLEAN
  mode: NULLABLE
  description: Active on day 1 since first seen
- name: day_2
  type: BOOLEAN
  mode: NULLABLE
  description: Active on day 2 since first seen
- name: day_3
  type: BOOLEAN
  mode: NULLABLE
  description: Active on day 3 since first seen
- name: day_4
  type: BOOLEAN
  mode: NULLABLE
  description: Active on day 4 since first seen
- name: day_5
  type: BOOLEAN
  mode: NULLABLE
  description: Active on day 5 since first seen
- name: day_6
  type: BOOLEAN
  mode: NULLABLE
  description: Active on day 6 since first seen
- name: day_7
