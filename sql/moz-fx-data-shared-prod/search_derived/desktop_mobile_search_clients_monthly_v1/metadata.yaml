friendly_name: Desktop and Mobile Search Monthly Data
description: |-
  Daily search clients aggregated monthly, across unique sets of dimensions.
  This table will be populated on 2nd of every month for the previous month
owners:
- akommasani@mozilla.com
labels:
  incremental: true
  schedule: monthly
  table_type: client_level
scheduling:
  dag_name: bqetl_desktop_mobile_search_monthly
  # Adjust the execution deltas for task dependencies in daily DAGs to try to depend on the runs
  # targeting the 29th day of the month as a best effort, since execution deltas can't specify months.
  # However, in non-leap years bqetl_desktop_mobile_search_monthly DAG runs on Mar 2 will actually
  # depend on the daily DAG runs targeting Mar 1.
  depends_on:
  # Dependencies in the bqetl_mobile_search DAG, which runs daily at 02:00.
  - dag_name: bqetl_mobile_search
    task_id: search_derived__mobile_search_clients_daily__v2
    execution_delta: -26d21h
  # Dependencies in the bqetl_search DAG, which runs daily at 03:00.
  - dag_name: bqetl_search
    task_id: search_derived__search_clients_daily__v8
    execution_delta: -26d22h
bigquery:
  time_partitioning:
    type: month
    field: submission_month
    require_partition_filter: true
    expiration_days: 775
  clustering: null
