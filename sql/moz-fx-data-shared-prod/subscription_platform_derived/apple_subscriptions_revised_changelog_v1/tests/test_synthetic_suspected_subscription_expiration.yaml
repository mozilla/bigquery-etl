sources:
  moz-fx-data-shared-prod.subscription_platform_derived.apple_subscriptions_changelog_v1:
    # Subscription 4: no synthetic record because latest change too recent
    - timestamp: 2999-04-03 00:00:00Z
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s4
        status: 1
        last_transaction:
          expires_date: 2000-04-01 00:00:00Z
        renewal_info:
          auto_renew_status: 0
  moz-fx-data-shared-prod.subscription_platform_derived.apple_subscriptions_revised_changelog_v1:
    # Subscription 1: no synthetic record because subscription not active
    - id: s1-2000-01-01T00:00:00.000000-UPDATE
      timestamp: 2000-01-01 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s1
        status: 2
        last_transaction:
          expires_date: 2000-01-01 00:00:00Z
        renewal_info:
          auto_renew_status: 0

    # Subscription 2: no synthetic record because auto-renewal on
    - id: s2-2000-02-01T00:00:00.000000-UPDATE
      timestamp: 2000-02-01 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s2
        status: 1
        last_transaction:
          expires_date: 2000-03-01 00:00:00Z
        renewal_info:
          # In reality `auto_renew_status` would be set to `1` in this case, but doing that would result
          # in a `synthetic_suspected_billing_retry_period_start` record, which we shouldn't test for here.
          auto_renew_status: 2

    # Subscription 3: no synthetic record because expires date too recent
    - id: s3-2000-03-01T00:00:00.000000-UPDATE
      timestamp: 2000-03-01 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s3
        status: 1
        last_transaction:
          expires_date: 2999-03-01 00:00:00Z
        renewal_info:
          auto_renew_status: 0

    # Subscription 5: synthetic record for future expiration
    - id: s5-2000-04-01T00:00:00.000000-UPDATE
      timestamp: 2000-04-01 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s5
        status: 1
        last_transaction:
          expires_date: 2000-05-01 00:00:00Z
        renewal_info:
          auto_renew_status: 0

    # Subscription 6: synthetic record for past expiration
    - id: s6-2000-06-02T00:00:00.000000-UPDATE
      timestamp: 2000-06-02 00:00:00Z
      type: original
      firestore_export_operation: UPDATE
      subscription:
        original_transaction_id: s6
        status: 1
        last_transaction:
          expires_date: 2000-06-01 00:00:00Z
        renewal_info:
          auto_renew_status: 0

parameters: []

is_init: false

expect:
  # Subscription 4: no synthetic record because latest change too recent
  - id: s4-2999-04-03T00:00:00.000000-UPDATE
    timestamp: 2999-04-03 00:00:00Z
    type: original
    firestore_export_operation: UPDATE
    subscription:
      original_transaction_id: s4
      status: 1
      last_transaction:
        expires_date: 2000-04-01 00:00:00Z
      renewal_info:
        auto_renew_status: 0

  # Subscription 5: synthetic record for future expiration
  - id: s5-2000-05-01T00:00:00.000000-UPDATE
    timestamp: 2000-05-01 00:00:00Z
    type: synthetic_suspected_subscription_expiration
    firestore_export_operation: UPDATE
    subscription:
      original_transaction_id: s5
      status: 2
      last_transaction:
        expires_date: 2000-05-01 00:00:00Z
      renewal_info:
        auto_renew_status: 0

  # Subscription 6: synthetic record for past expiration
  - id: s6-2000-06-02T00:00:00.000001-UPDATE
    timestamp: 2000-06-02 00:00:00.000001Z
    type: synthetic_suspected_subscription_expiration
    firestore_export_operation: UPDATE
    subscription:
      original_transaction_id: s6
      status: 2
      last_transaction:
        expires_date: 2000-06-01 00:00:00Z
      renewal_info:
        auto_renew_status: 0
