friendly_name: Jetstream Analysis Errors
description: |-
  Classifies each row of `monitoring.logs` (source = "jetstream") into an
  `error_category` describing what kind of problem it represents: an expected
  skip, a benign fallback, a configuration error, a data-quality guard, a
  BigQuery resource limit, or a genuine jetstream failure. Used to measure
  experiment analysis success rates without conflating "jetstream broke" with
  "nothing is wrong" or "the config is wrong".
owners:
  - mwilliams@mozilla.com
labels:
  incremental: false
