friendly_name: Market Research Browser Releases Retrieval Index
description: "AI-enriched retrieval table derived from the scraped browser release-note\
  \ corpus,\ncontaining embeddings and semantic features to support grounded question\
  \ answering\nand VECTOR_SEARCH over Mozilla's market-intel corpus.\n\nGrain: one\
  \ row per (browser, version, source_type). `scraped_date` is the partition\ncolumn\
  \ and records the scrape on which the release was first observed and indexed \u2014\
  \nit is NOT part of the grain.\n\nLLM generated fields:\n- release_summary_llm\n\
  - release_category_llm\n- release_topics_llm\n- release_entities_llm\n- embedding\
  \ based on [browser, version, raw_text]\n\nIncremental strategy\n- The upstream\
  \ loader (`external_derived.market_research_releases_v1`) incrementally\n  appends\
  \ newly-scraped GCS blobs into a cumulative table -- it is not a clean\n  single-day\
  \ arrivals feed, and a `scraped_date` batch can include any release that\n  happened\
  \ to be scraped that week. The query therefore anti-joins the current\n  scrape\
  \ against every identity already present in this table, and only enriches\n  identities\
  \ it has never seen. This keeps the standard `@submission_date` contract\n  while\
  \ avoiding paying AI.GENERATE / AI.EMBED costs again for releases that have\n  not\
  \ changed.\n\nMetadata\n- Additional data to support technical processes, such as\
  \ backfills or investigations.\n- The prompt version is a self-managed version for\
  \ changes in the prompt given to the LLM."
owners:
- lmcfall@mozilla.com
labels:
  incremental: true
  owner1: lmcfall
  dag: bqetl_market_research
scheduling:
  dag_name: bqetl_market_research
bigquery:
  time_partitioning:
    type: day
    field: scraped_date
    require_partition_filter: true
    expiration_days: null
  clustering:
    fields:
    - browser
    - source_type
schema:
  allow_field_addition: true
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.external.market_research_releases
require_column_descriptions: true
