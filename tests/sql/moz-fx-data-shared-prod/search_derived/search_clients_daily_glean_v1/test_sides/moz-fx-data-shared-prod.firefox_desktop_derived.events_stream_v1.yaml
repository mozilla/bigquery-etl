# NOT KEPT. Identical to the row above except for the event, which is the point:
# sap_base_cte filters on event = 'sap.counts', so this impression event is excluded.
# Its extras name a different engine and access point, so if the filter ever stopped
# applying this would surface as an extra output row rather than as a changed value.
- <<: *sap_only
  event: serp.impression
  event_id: evt-sap-2
  event_timestamp: "2026-08-13 08:31:00"
  event_extra:
    provider_id: engine2
    partner_code: sapcode
    source: urlbar
