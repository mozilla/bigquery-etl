friendly_name: Firefox-CI Task Runs (legacy history)
description: |-
  Firefox-CI task runs before fxci_derived.task_runs_v1 starts (2024-07-24),
  rebuilt from the legacy taskclusteretl.pulse_task table. One row per resolved
  run (completed, failed or exception).

  submission_date is the date of the run's event time (its start, or its
  scheduled time when it never started), not the ingestion date used by
  task_runs_v1. Loaded once by backfill, so it does not change over time.
owners:
- ahalberstadt@mozilla.com
- jlorenzo@mozilla.com
labels:
  incremental: true
  owner1: ahalberstadt
  owner2: jlorenzo
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  range_partitioning: null
  clustering:
    fields:
    - task_id
    - run_id
