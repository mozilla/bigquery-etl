sources:
  moz-fx-data-shared-prod.subscription_platform_derived.stripe_customers_history_v1:
    # Overlaps with the first two subscription changelog records.
    - id: cus_1-2000-01-01T00:00:00.000000
      valid_from: 2000-01-01 00:00:00Z
      valid_to: 2000-02-07 00:00:00Z
      stripe_customers_revised_changelog_id: cus_1-2000-01-01T00:00:00.000000
      customer:
        id: cus_1
    # Doesn't overlap with a subscription changelog record (entirely between subscription changes).
    - id: cus_1-2000-02-07T00:00:00.000000
      valid_from: 2000-02-07 00:00:00Z
      valid_to: 2000-02-15 00:00:00Z
      stripe_customers_revised_changelog_id: cus_1-2000-02-07T00:00:00.000000
      customer:
        id: cus_1
    # Overlaps with the final subscription changelog record.
    - id: cus_1-2000-02-15T00:00:00.000000
      valid_from: 2000-02-15 00:00:00Z
      valid_to: 2000-03-11 00:00:00Z
      stripe_customers_revised_changelog_id: cus_1-2000-02-15T00:00:00.000000
      customer:
        id: cus_1
    # After the subscription has ended (should be ignored).
    - id: cus_1-2000-03-11T00:00:00.000000
      valid_from: 2000-03-11 00:00:00Z
      valid_to: 9999-12-31 23:59:59.999999Z
      stripe_customers_revised_changelog_id: cus_1-2000-03-11T00:00:00.000000
      customer:
        id: cus_1
  moz-fx-data-shared-prod.subscription_platform_derived.stripe_subscriptions_revised_changelog_v1:
    - id: sub_1-2000-01-01T00:00:00.000000
      timestamp: 2000-01-01 00:00:00Z
      subscription:
        id: sub_1
        customer_id: cus_1
        start_date: 2000-01-01 00:00:00Z
        status: active
    - id: sub_1-2000-02-01T00:00:00.000000
      timestamp: 2000-02-01 00:00:00Z
      subscription:
        id: sub_1
        customer_id: cus_1
        start_date: 2000-01-01 00:00:00Z
        status: active
    - id: sub_1-2000-03-01T00:00:00.000000
      timestamp: 2000-03-01 00:00:00Z
      subscription:
        id: sub_1
        customer_id: cus_1
        ended_at: 2000-03-01 00:00:00Z
        start_date: 2000-01-01 00:00:00Z
        status: canceled

