friendly_name: Firefox Referral Derived
description: |-
  Derived tables supporting the Firefox Referral Program (DENG-11237).

  Firefox users can invite friends with a personal invite link. These tables
  count how many people installed Firefox from each invite code, so a referrer
  can see their own total on the referral hub page on firefox.com.

  Each new install that came from an invite link reports its code once, on first
  run. We count those reports per code, per day, and keep a running all-time
  total that is exported to the Websites team as a CSV.
dataset_base_acl: derived
user_facing: false
labels: {}
