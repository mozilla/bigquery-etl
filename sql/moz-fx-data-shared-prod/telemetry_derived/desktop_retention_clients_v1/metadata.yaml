friendly_name: Desktop Retention - Client Level
description: |-
  Desktop Retention data at the client level, including attribution information

  Confirmed automated (bot) profiles are excluded: every client in
  telemetry.desktop_automated_clients (DENG-11925), which includes the DENG-11590 segment from
  first_seen_date 2026-08-27. Counts here are therefore not comparable to unfiltered sources such
  as telemetry.clients_first_seen, which is deliberately left unchanged. The same profiles are
  flagged rather than removed on telemetry.desktop_new_profiles_clients, via
  is_desktop_argument_profile_automation.

  Partitions written before DENG-11979 exclude only the DENG-11590 segment. They were not
  backfilled, so the other fleets (from 2026-09-27) are still in those partitions.
owners:
- mhirose@mozilla.com
labels:
  incremental: true
  owner1: mhirose
  table_type: client_level
  dag: bqetl_desktop_retention_model
scheduling:
  dag_name: bqetl_desktop_retention_model
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: 775.0
  range_partitioning: null
  clustering:
    fields:
    - country
    - normalized_os
require_column_descriptions: false
