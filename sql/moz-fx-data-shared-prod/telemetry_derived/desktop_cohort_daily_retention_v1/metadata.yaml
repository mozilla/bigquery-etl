friendly_name: Desktop Cohort Daily Retention V1
description: |-
  Desktop Cohort Daily Retention consists of one row per first_seen_date
  per activity date (up to 112 days after the first seen date - 112 is
  4 period of 28 days)
  It's a summary of a cohort's activity in that day.

  Note that the values for client attributes are based on the
  attributes at the time the cohort started (rather than the
  values at activity time or submission_date)

  Note that data is pulled from clients_last_seen_v1 and more
  importantly clients_first_seen_v2

  Confirmed automated (bot) profiles are excluded: every client in
  telemetry.desktop_automated_clients (DENG-11925), which includes the DENG-11590 segment from
  first_seen_date 2026-08-27. Counts here are therefore not comparable to unfiltered sources such
  as telemetry.clients_first_seen, which is deliberately left unchanged.
  Only the DENG-11590 subset is flagged (not removed) on telemetry.desktop_new_profiles_clients,
  via is_desktop_argument_profile_automation.

  Each partition excludes only clients flagged on or before its run date, so reruns and backfills
  give the same result as the daily run. A client flagged after that date (58 of 56.9M flagged
  new profiles from 2026-08-27 to 2026-11-15) stays in the partitions computed before its flag.
owners:
- mhirose@mozilla.com
labels:
  incremental: true
  table_type: aggregate
  dag: bqetl_analytics_aggregations
  owner1: mhirose
  legacy: true
scheduling:
  dag_name: bqetl_analytics_aggregations
  partition_parameter: submission_date
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: true
    expiration_days: null
  range_partitioning: null
  clustering:
    fields:
    - attribution_medium
    - normalized_channel
    - country
    - normalized_app_name
require_column_descriptions: false
