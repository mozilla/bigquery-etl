fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date for which this record was computed, corresponding to the partition date of the underlying
    Firefox Accounts events.
- name: user_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the Firefox Accounts user ID, used as a privacy-preserving identifier for
    the account holder.
- name: service
  type: STRING
  mode: NULLABLE
  description: The relying-party service the user interacted with on this day, represented as either an
    OAuth client ID (hex string) or a human-readable service name such as "sync", "vpn", or "relay" when
    no OAuth client ID is present.
- name: country
  type: STRING
  mode: NULLABLE
  description: The most frequently observed non-null country (ties go to the latest value) for the
    user–service pair on this day, as an ISO 3166-1 alpha-2 code derived from request geo-IP metadata. Null
    when only `access_token_checked` events (which lack client geo data) were recorded.
- name: seen_in_tier1_country
  type: BOOLEAN
  mode: NULLABLE
  description: True if at least one event for this user–service pair on this day was attributed to a
    Tier-1 country (`country` is one of 'US', 'FR', 'DE', 'GB', or 'CA'). Partitions processed before the
    fix in mozilla/bigquery-etl#9974 are always false, because the query compared ISO 3166-1 alpha-2 codes
    against full country names; those partitions are only correct if they have since been backfilled.
- name: registered
  type: BOOLEAN
  mode: NULLABLE
  description: True if a `reg_complete` event was observed for this user–service pair on this day, indicating
    the user completed a new Firefox Accounts registration; false otherwise.
- name: user_agent_device_count
  type: INTEGER
  mode: NULLABLE
  description: Number of devices associated with the user, per service, per day. Estimated from the number of unique user agent strings.
