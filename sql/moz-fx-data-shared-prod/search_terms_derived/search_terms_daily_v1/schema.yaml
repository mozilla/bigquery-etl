fields:
  - mode: NULLABLE
    name: submission_date
    type: DATE
  - mode: NULLABLE
    name: query
    type: STRING
  - mode: NULLABLE
    name: search_sessions
    type: INTEGER
  description: The number of distinct search sessions that ended with this query on the given submission
    date. Only queries exceeding a rolling 7-day session count threshold (greater than 1) are included,
    to protect user privacy.
