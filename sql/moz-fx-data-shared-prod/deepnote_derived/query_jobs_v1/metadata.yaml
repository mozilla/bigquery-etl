friendly_name: Deepnote BigQuery Query Jobs
description: |-
  BigQuery query jobs that originate from Deepnote, from mozdata's
  INFORMATION_SCHEMA.JOBS_BY_PROJECT. Query text is not stored.
owners:
- ascholtz@mozilla.com
labels:
  incremental: true
  schedule: daily
  table_type: client_level
  dag: bqetl_deepnote
  owner1: ascholtz
scheduling:
  dag_name: bqetl_deepnote
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: null
  clustering:
    fields:
    - query_source
    - deepnote_project_id
workgroup_access:
- role: roles/bigquery.dataEditor
  members:
  - workgroup:dataplatform/developers
references:
  query.sql:
  - mozdata.region-us.INFORMATION_SCHEMA.JOBS_BY_PROJECT
