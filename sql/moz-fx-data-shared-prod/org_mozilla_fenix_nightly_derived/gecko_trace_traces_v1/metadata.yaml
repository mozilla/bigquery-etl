friendly_name: Gecko Trace Traces
description: |-
  Trace patterns from Gecko traces, one row per trace signature.

  The trace signature is a hash of the event signatures in root-to-leaf order.
  It is stable within a Firefox release and changes when any event moves.
  The trace_key is a hash of the stable_event_ids in the same order.
  A new signature with a known trace_key gets the existing stable_trace_id.
  Otherwise it gets a new UUID.

  This table has no counts. Daily counts are in gecko_trace_traces_daily_v1.
owners:
- jjalkanen@mozilla.com
labels:
  incremental: true
  schedule: daily
  dag: bqetl_gecko_trace
  owner1: jjalkanen
scheduling:
  dag_name: bqetl_gecko_trace
  task_group: org_mozilla_fenix_nightly
  date_partition_parameter: null
  parameters:
  - submission_date:DATE:{{ds}}
bigquery:
  clustering:
    fields:
    - trace_signature
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  script.sql:
  - moz-fx-data-shared-prod.org_mozilla_fenix_nightly_derived.gecko_trace_events_v1
  - moz-fx-data-shared-prod.org_mozilla_fenix_nightly_derived.gecko_trace_traces_v1
  - moz-fx-data-shared-prod.org_mozilla_fenix_nightly_stable.gecko_trace_v1
