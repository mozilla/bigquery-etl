        with a different value in a field it stores: the copy is complete but not
        faithful. Fields it derives on read, or has no column for, are not compared
        -- neither was carried by the copy, so neither says anything about it. Which
        fields disagreed is in migrate_record_divergence. Does not fail the migration.
        0 if the migration threw before verifying.'
