fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: Logical date used by the orchestrator. Also, used for partitioning.

- name: app_name
  type: STRING
  mode: NULLABLE
  description: App name as defined inside Google Play Store.

- name: version_code
  type: STRING
  mode: NULLABLE
  description: Version of the app that was running on the user's device.

- name: anon_rss_and_swap_memory_usage_p50
  type: FLOAT
  mode: NULLABLE
  description: |-
    50th percentile of anon RSS and swap memory usage.

- name: anon_rss_and_swap_memory_usage_p75
  type: FLOAT
  mode: NULLABLE
  description: |-
    75th percentile of anon RSS and swap memory usage.

- name: anon_rss_and_swap_memory_usage_p90
  type: FLOAT
  mode: NULLABLE
  description: |-
    90th percentile of anon RSS and swap memory usage.

- name: anon_rss_and_swap_memory_usage_p95
  type: FLOAT
  mode: NULLABLE
  description: |-
    95th percentile of anon RSS and swap memory usage.

- name: anon_rss_and_swap_memory_usage_p99
  type: FLOAT
  mode: NULLABLE
  description: |-
    99th percentile of anon RSS and swap memory usage.

- name: distinct_users
  type: FLOAT
  mode: NULLABLE
  description: |-
    Count of distinct users for which memory metrics were reported during the aggregation period.x
