sources:
  moz-fx-data-shared-prod.monitoring_derived.event_monitoring_aggregates_v1:
    - &base
      submission_date: 2025-01-01
      window_start: 2025-01-01 00:00:00 UTC
      window_end: 2025-01-01 00:00:00 UTC
      event_category: action
      event_name: opened
      event_extra_key: null
      country: US
      normalized_app_name: Firefox for Desktop
      channel: release
      version: 130.0.0
      experiment: '*'
      experiment_branch: '*'
      total_events: 10
    # highest count non-null event extra
    - <<: *base
      event_extra_key: abc
      total_events: 5
    # lower count non-null event extra, should be ignored
    - <<: *base
      event_extra_key: def
      total_events: 4
    # specific experiment, should be ignored
    - <<: *base
      experiment: exp
      experiment_branch: a
      total_events: 10
    # different channel, non-null extra
    - <<: *base
      channel: beta
      event_extra_key: abc
      total_events: 8
    # different channel, null extra
    - <<: *base
      channel: beta
      event_extra_key: abc
      total_events: 6
    # different event
    - <<: *base
      event_name: closed
      total_events: 2
    # different app
    - <<: *base
      normalized_app_name: Firefox for Android
      total_events: 12

parameters:
  - name: submission_date
    type: DATE
    value: 2025-01-01

expect:
  # release desktop, opened event
  - submission_date: 2025-01-01
    event_category: action
    event_name: opened
    country: US
    normalized_app_name: Firefox for Desktop
    channel: release
    version: 130.0.0
    total_events: 15
  # beta desktop, opened event
  - submission_date: 2025-01-01
    event_category: action
    event_name: opened
    country: US
    normalized_app_name: Firefox for Desktop
    channel: beta
    version: 130.0.0
    total_events: 14
  # release desktop, closed event
  - submission_date: 2025-01-01
    event_category: action
    event_name: closed
    country: US
    normalized_app_name: Firefox for Desktop
    channel: release
    version: 130.0.0
    total_events: 2
  # release android, opened event
  - submission_date: 2025-01-01
    event_category: action
    event_name: opened
    country: US
    normalized_app_name: Firefox for Android
    channel: release
    version: 130.0.0
    total_events: 12
