# Expected output of search_revenue_levers_daily_glean_v1 for 2026-09-21 (9 rows). A NULL column is omitted.
# Desktop: Google US sums four rows; Google RU (not eligible) and the Bing Acer distribution row are left out.
# Desktop DAU is the Glean DAU: f2 is not DAU and f3 is MozillaOnline, so Linux in FR has 1.
# Mobile: Fennec counts only on iOS, Google RU is left out, Bing Klar is left out of Bing and DuckDuckGo has no app filter.
# The legacy search_dau_aggregates desktop row (99, 99) must not be counted: only its mobile rows are read.
# monetizable_sap on desktop: Google US = 10 (RoW code) + 5 (US code in the US), the no_code row's 3 is not counted; Google DE =
# the Mint row's 2 only, since the US code row is outside the US; Google TR has SAP but is an excluded territory, so 0;
# Bing and DuckDuckGo count all their SAP. Google TR has no DAU rows, so its DAU columns are NULL and omitted.
# New Google codes count as not monetizable until their rule is settled: windows-firefox-o-re adds 4 to Google US sap (22) but not to
# monetizable_sap (15), and in Google DE on Linux linux-firefoxmnt-o-re (mint-001) and an unlisted code are both not monetizable (0 of 4).
- submission_date: '2026-09-21'
  partner: Google
  device: desktop
  normalized_os: Windows
  country: US
  dau: 3
  dau_w_engine_as_default: 3
  dau_engaged_w_sap: 1
  sap: 22
  tagged_sap: 9
  tagged_follow_on: 3
  search_with_ads: 5
  ad_click: 4
  organic: 6
  ad_click_organic: 2
  search_with_ads_organic: 3
  search_with_ads_serp: 4
  ad_click_serp: 3
  monetizable_sap: 15
