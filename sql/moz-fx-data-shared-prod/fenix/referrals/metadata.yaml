friendly_name: App-specific view for Glean ping "referrals"
description: |-
  This a view that UNIONs the stable ping tables
  across all channels of the Glean application "Firefox for Android"
  (org_mozilla_firefox.referrals, org_mozilla_firefox_beta.referrals, org_mozilla_fenix.referrals, org_mozilla_fenix_nightly.referrals, org_mozilla_fennec_aurora.referrals).

  It is used by Looker.
owners: []
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  view.sql:
  - moz-fx-data-shared-prod.org_mozilla_fenix.referrals
  - moz-fx-data-shared-prod.org_mozilla_fenix_nightly.referrals
  - moz-fx-data-shared-prod.org_mozilla_fennec_aurora.referrals
  - moz-fx-data-shared-prod.org_mozilla_firefox.referrals
  - moz-fx-data-shared-prod.org_mozilla_firefox_beta.referrals
