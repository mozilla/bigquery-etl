friendly_name: Desktop Retention V2 - Client Level
description: |-
  Desktop Retention data at the client level.
  Includes attribution information, profile_group_id.

  From first_seen_date 2026-08-27 onward, profiles created by the automated segment tracked in
  DENG-11590 are excluded (see udf.is_desktop_argument_profile_automation). Counts here are
  therefore not comparable to unfiltered sources such as telemetry.clients_first_seen, where
  the same profiles are flagged via is_desktop_argument_profile_automation rather than removed.
owners:
- mhirose@mozilla.com
labels:
  incremental: true
  owner1: mhirose
  table_type: client_level
  dag: bqetl_desktop_retention_model
scheduling:
  dag_name: bqetl_desktop_retention_model
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: 775.0
  range_partitioning: null
  clustering:
    fields:
    - country
    - normalized_os
require_column_descriptions: false
