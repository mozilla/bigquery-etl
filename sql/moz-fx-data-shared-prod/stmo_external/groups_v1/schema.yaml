fields:
- name: id
  type: INTEGER
  mode: NULLABLE
  description: Primary key.
- name: org_id
  type: INTEGER
  mode: NULLABLE
  description: Redash organization ID. There is only one organization.
- name: type
  type: STRING
  mode: NULLABLE
  description: Group type, `builtin` or `regular`.
- name: name
  type: STRING
  mode: NULLABLE
  description: Group name.
- name: permissions
  type: STRING
  mode: REPEATED
  description: Permissions granted to group members.
- name: created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Time the row was created.
