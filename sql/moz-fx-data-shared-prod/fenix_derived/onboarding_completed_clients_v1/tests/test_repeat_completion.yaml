sources:
  moz-fx-data-shared-prod.fenix.events_stream:
    # The same client completing on two different days, run for 2026-09-03. Each
    # entry is marked with whether it reaches the output.
    #
    # DROPPED by the submission_date filter: this event belongs to 2026-09-02's own
    # partition, written by that day's run. This run neither reads it nor carries it
    # forward, so neither its date nor its 140.0 appears.
    - submission_timestamp: 2026-09-02 09:00:00
      client_id: client-f
      sample_id: 42
      event_category: onboarding
      event_name: completed
      event_timestamp: 2026-09-02 08:59:20
      client_info:
        app_display_version: '140.0'
    # KEPT - the run's own day, supplying both the date and the 141.0.
    - submission_timestamp: 2026-09-03 09:00:00
      client_id: client-f
      sample_id: 42
      event_category: onboarding
      event_name: completed
      event_timestamp: 2026-09-03 08:59:20
      client_info:
        app_display_version: '141.0'

parameters:
  - name: submission_date
    type: DATE
    value: 2026-09-03

expect:
  # One row, dated this run's partition. The client's earlier completion is absent
  # rather than collapsed: taking the earliest across days is the consumer's job,
  # done by MIN(completed_date) in retention_clients. app_version is this day's
  # 141.0, not the earlier day's 140.0, for the same reason.
  - client_id: client-f
    completed_date: 2026-09-03
    sample_id: 42
    app_version: '141.0'
