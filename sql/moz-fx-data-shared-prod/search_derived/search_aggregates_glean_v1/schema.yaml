- !include-field
  table: moz-fx-data-shared-prod.search_derived.search_clients_daily_glean_v1
  field: legacy_searches_tagged_non_follow_on_sum
  new_name: counter_searches_tagged_non_follow_on_sum
  new_description: "Tagged searches from the browser.search.content Glean labeled counter, excluding follow-on searches, which the
      counter labels as a separate tag type and counter_searches_tagged_follow_on_sum carries. The two ads families
      do not make that split and include follow-on. Zero, not null, where the metrics ping carried nothing for this
      key. It is the counterpart of v8's tagged_sap; serp_searches_tagged_count measures the same searches from
      SERP impressions and includes follow-on. Summed over the client table rows in this row's dimensions."
- !include-field
  table: moz-fx-data-shared-prod.search_derived.search_clients_daily_glean_v1
  field: legacy_searches_tagged_follow_on_sum
