        * For scheduled runs, how long after the scheduled time the run started. A
        timer that fired on time reports close to zero. A run that was already overdue
        when its timer was armed, such as at browser start, reports the missed time
        plus about one second, because overdue timers are armed one second out. Larger
        values mostly measure time the browser was closed or asleep. Absent for manual
        runs.

        * How long after the scheduled time the run started. A timer that fir...'
    - name: deleted
      type: INTEGER
      mode: NULLABLE
      description: Number of deleted comments.
    - name: diverged
      type: INTEGER
      mode: NULLABLE
      description: 'Number of records the store copied into accepted and then held
        with a different value in a field it stores: the copy is complete but not
        faithful. Fields it derives on read, or has no column for, are not compared
        -- neither was carried by the copy, so neither says anything about it. Which
        fields disagreed is in migrate_record_divergence. Does not fail the migration.
        0 if the migration threw before verifying.'
    - name: download
      type: INTEGER
      mode: NULLABLE
      description: Milliseconds to finish download
    - name: download_time
      type: INTEGER
      mode: NULLABLE
      description: The number of ms needed to complete the download.
    - name: dropped_frames
      type: INTEGER
      mode: NULLABLE
      description: The amount of video frames don't get rendered but dropped
    - name: duplicate_tabs
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of tabs found to be duplicates of another open tab.

        * Number of duplicate tabs that were closed.'
    - name: duration
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Time in ms to process the request

        * Milliseconds the card stayed open

        * Engine creation time in milliseconds

        * how long it took to reach the step from start

        * Total time of the run from start to its terminal event, including page extraction
        and the model call.

        * Total session duration in milliseconds.

        * How long the migration took (in milliseconds).

        * Total time of the run from start to completion, including page extraction
        and the model call.

        * Milliseconds elapsed to reach the step from its start. For end_file_download_*
        this is the time to download a single file; for end_download_* this is the
        total time to download the whole model.

        * Wall-clock milliseconds from reaching [[started]] to teardown.'
    - name: duration_ms
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The amount of time in Ms since the user opened the SmartWindow

        * Duration of the migration in milliseconds.

        * Duration of the restore in milliseconds, measured with a monotonic clock.

        * Wall-clock duration of the migration, in milliseconds.

        * Duration of the call as seen by the caller, measured in LoginManager around
        the delegation to the active backend.

        * How long the mini window was open, in milliseconds.

        * How long the panel was open, in milliseconds, measured from the moment it
        was shown.'
    - name: edited
      type: INTEGER
      mode: NULLABLE
      description: Number of edited comments.
    - name: editor_opens
      type: INTEGER
      mode: NULLABLE
      description: How many times the user opened the source editor before this fill
        started.
    - name: error_action
      type: INTEGER
      mode: NULLABLE
      description: 'The nsIBits ERROR_ACTION_* value: what the update code was doing.'
    - name: error_code
      type: INTEGER
      mode: NULLABLE
      description: Code of the XML Error (See `XML_Error` enum in expat.h for the
        list of errors where XML_ERROR_NONE is 0).
    - name: error_stage
      type: INTEGER
      mode: NULLABLE
      description: 'The nsIBits ERROR_STAGE_* value: where the failure happened.'
    - name: error_type
      type: INTEGER
      mode: NULLABLE
      description: The nsIBits ERROR_TYPE_* value of the failure.
    - name: execution_seq
      type: INTEGER
      mode: NULLABLE
      description: 'Lifetime run number of the monitor, 1 for its first run and 0
        on the notification shown at creation, before any run. Counts runs since the
        counter was introduced; monitors created before that start from their visible
        history length. Best effort: a store failure can leave the persisted count
        behind.'
    - name: extracted_code_units
      type: INTEGER
      mode: NULLABLE
      description: The length of the page text sample that was used for detection.
    - name: extraction_time
      type: INTEGER
      mode: NULLABLE
      description: The time it took to extract a sample of page text, in ms.
    - name: failed
      type: INTEGER
      mode: NULLABLE
      description: Number of records the import rejected. Why is summarized in error_message.
    - name: failed_deletions
      type: INTEGER
      mode: NULLABLE
      description: 'Number of deletions the copy could not apply, whether removing
        a record the source no longer has or importing a tombstone for one it had
        already deleted. `result` tells the two apart: a record that would not delete
        is still in the store copied into, so the run fails on it, while a tombstone
        that would not import leaves that store correct and costs a deletion coming
        back at the next sync.'
    - name: field_seq
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Index of the field, to join with its decision event.

        * Index of the field within the form, to join with its outcome event (not
        a name or content).'
    - name: fields_filled
      type: INTEGER
      mode: NULLABLE
      description: Number of fields ultimately filled.
    - name: fields_total
      type: INTEGER
      mode: NULLABLE
      description: Number of fillable fields detected in the form.
    - name: fields_typed
      type: INTEGER
      mode: NULLABLE
      description: Number of the fields sent that came back with a valid field type,
        so neither missing nor other/unknown. Absent when the request failed.
    - name: fields_unknown
      type: INTEGER
      mode: NULLABLE
      description: Number of the fields sent that the model explicitly declined to
        name, so came back as other or unknown. A field with no type at all counts
        in neither this nor fields_typed, so fields_total minus both is how many the
        response left out. Absent when the request failed.
    - name: filled_length
      type: INTEGER
      mode: NULLABLE
      description: Character count of the value the fill wrote into the field. This
        is the value as approved in the review dialog, which is not necessarily the
        value the model generated. Sent alongside final_length to give that count
        something to be read against, so only sent when the outcome is edited.
    - name: final_length
      type: INTEGER
      mode: NULLABLE
      description: Character count of the value the field was left with. Read against
        filled_length it says whether the user cut the filled value down or added
        to it, so a value that was consistently too long or too short can be told
        from one that was simply the wrong value. Only sent when the outcome is edited,
        as above.
    - name: first_frame_loaded_time
      type: INTEGER
      mode: NULLABLE
      description: How long (in milliseconds) does the our media pipeline take to
        load the first video frame from "the creation of MDSM" to "the first frame
        loaded".
    - name: gate_wait_ms
      type: INTEGER
      mode: NULLABLE
      description: Milliseconds the activation was held by the gate before this outcome
        (0 if it was not held)
    - name: generated_length
      type: INTEGER
      mode: NULLABLE
      description: Character count of the value the model generated. Only sent when
        the outcome is edited.
    - name: grouped_id
      type: INTEGER
      mode: NULLABLE
      description: Identifies one suggested group so the events about it can be joined
        together. A counter that starts over every session; it says nothing about
        the user, the tabs, or the group's name.
    - name: grouped_tabs
      type: INTEGER
      mode: NULLABLE
      description: Number of tabs in the group, or across the groups, this event describes.
    - name: groups
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of groups listed under "Just created", which the user can still ungroup.

        * Number of groups suggested.'
    - name: has_alt_text
      type: INTEGER
      mode: NULLABLE
      description: Counts how many used signatures have an alt-text.
    - name: has_no_alt_text
      type: INTEGER
      mode: NULLABLE
      description: Counts how many used signatures haven't an alt-text.
    - name: height
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The height that the window was created at

        * The height that the window was resize to'
    - name: http_status
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * HTTP status from the inference back-end, or 0 if no response

        * HTTP status from the search back-end, or 0 if no response arrived.'
    - name: httpStatus
      type: INTEGER
      mode: NULLABLE
      description: HTTP status returned by the Guardian enrollment endpoint, or 0
        when no response was received (network error, or no GPI token was obtained).
    - name: identification_time
      type: INTEGER
      mode: NULLABLE
      description: The time it took to identify a language from the extracted text,
        in ms.
    - name: iframe_count
      type: INTEGER
      mode: NULLABLE
      description: Number of iframe is detected in the form
    - name: in_use
      type: INTEGER
      mode: NULLABLE
      description: Number of memories still applied to the assistant message after
        the removal. Null when the trigger is "settings"
    - name: inference_time
      type: INTEGER
      mode: NULLABLE
      description: Time taken for inference in milliseconds
    - name: init_rust_components_ms
      type: INTEGER
      mode: NULLABLE
      description: Duration of initializing the shared Rust components.
    - name: input_classified_size
      type: INTEGER
      mode: NULLABLE
      description: The total number of input elements classified with at least one
        conclusive interest.
    - name: input_inconclusive_size
      type: INTEGER
      mode: NULLABLE
      description: The total number of input elements classified with the inconclusive
        interest.
    - name: input_size
      type: INTEGER
      mode: NULLABLE
      description: The total number of input elements used for classification.
    - name: input_tokens
      type: INTEGER
      mode: NULLABLE
      description: Number of tokens in the input prompt
    - name: interest_top_1_hits
      type: INTEGER
      mode: NULLABLE
      description: The total number of input elements for the interest with the most
        hits. Defaults to 0. This, along with `input_size` and `input_classified_size`,
        can be used to calculate the top-N classification percentages and top-N hit
        percentages.
    - name: interest_top_2_hits
      type: INTEGER
      mode: NULLABLE
      description: The total number of input elements for the interest with the 2nd
        most hits. Defaults to 0. This, along with `input_size` and `input_classified_size`,
        can be used to calculate the top-N classification percentages and top-N hit
        percentages.
    - name: interest_top_3_hits
      type: INTEGER
      mode: NULLABLE
      description: The total number of input elements for the interest with the 3rd
        most hits. Defaults to 0. This, along with `input_size` and `input_classified_size`,
        can be used to calculate the top-N classification percentages and top-N hit
        percentages.
    - name: items_count
      type: INTEGER
      mode: NULLABLE
      description: Number of items in sync storage.
    - name: items_over_quota
      type: INTEGER
      mode: NULLABLE
      description: Count of items larger than QUOTA_BYTES_PER_ITEM.
    - name: last_install
      type: INTEGER
      mode: NULLABLE
      description: hourse since the model was installed
    - name: last_line_len
      type: INTEGER
      mode: NULLABLE
      description: The length of the last line that led to the error.
    - name: last_platform_error
      type: INTEGER
      mode: NULLABLE
      description: The last platform specific error code seen during the session,
        eg. HResult on Windows
    - name: last_used
      type: INTEGER
      mode: NULLABLE
      description: hourse since the model was used
    - name: latency
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Time in ms to start processing the request

        * Milliseconds to output first sentence

        * Time spent in the model call only, excluding page extraction and the account
        token fetch. Only present when the model call completed.'
    - name: latency_ms
      type: INTEGER
      mode: NULLABLE
      description: Time in ms from request to response.
    - name: length
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of characters in the monitor prompt.

        * Number of characters submitted

        * Number of characters read from the page

        * Length of the article

        * Number of characters in the mention

        * Page content length.

        * Number of characters for the search terms

        * number of characters of generated text.'
    - name: levenshtein_distance
      type: INTEGER
      mode: NULLABLE
      description: Levenshtein distance between label suggested by model and saved
        by user
    - name: lineno
      type: INTEGER
      mode: NULLABLE
      description: Line number in the source file the error originated from, or 0
        if unknown
    - name: linenumber
      type: INTEGER
      mode: NULLABLE
      description: The same as SecurityPolicyViolationEvent's lineNumber.
    - name: mean_tabs
      type: INTEGER
      mode: NULLABLE
      description: Mean number of tabs across the groups in this event, rounded.
    - name: median_tabs
      type: INTEGER
      mode: NULLABLE
      description: Median number of tabs across the groups in this event, rounded.
    - name: memories
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of memories included in the response

        * Total number of memories still present after the removal

        * Total number of memories available

        * Number of memories included as context.

        * Number of memories available

        * Number of memories included'
    - name: memories_similarity_avg
      type: INTEGER
      mode: NULLABLE
      description: Mean similarity score of those memories, in the same units as memories_similarity_min.
        Absent when no memory was included.
    - name: memories_similarity_max
      type: INTEGER
      mode: NULLABLE
      description: Highest similarity score of those memories, in the same units as
        memories_similarity_min. Absent when no memory was included.
    - name: memories_similarity_min
      type: INTEGER
      mode: NULLABLE
      description: Lowest similarity score of memories included as context, as a percentage
        rounded to the nearest whole one. The score is what memory retrieval ranked
        the memory as. Absent when no memory was included.
    - name: memories_used
      type: INTEGER
      mode: NULLABLE
      description: Number of memories the model reports having used. Absent when the
        generation failed, since no answer came back to report it.
    - name: memories_used_similarity_avg
      type: INTEGER
      mode: NULLABLE
      description: Mean similarity score among those memories, in the same units as
        memories_used_similarity_min. Absent for the same reasons.
    - name: memories_used_similarity_max
      type: INTEGER
      mode: NULLABLE
      description: Highest similarity score among those memories, in the same units
        as memories_used_similarity_min. Absent for the same reasons.
    - name: memories_used_similarity_min
      type: INTEGER
      mode: NULLABLE
      description: Lowest similarity score among the memories the model reports having
        used, as a percentage rounded to the nearest whole one. Absent when the model
        used no memory, and when none of the memories it named could be matched back
        to one that was sent.
    - name: memory_after
      type: INTEGER
      mode: NULLABLE
      description: Memory usage after unloading tabs (in bytes)
    - name: memory_before
      type: INTEGER
      mode: NULLABLE
      description: Memory usage before unloading tabs (in bytes)
    - name: memory_bytes
      type: INTEGER
      mode: NULLABLE
      description: The number of RSS bytes for the inference process.
    - name: mentions
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of mentions in the request

        * Number of tab mentions in the request.

        * Number of inline mentions still included in the input'
    - name: mentions_available
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of mention suggestions available

        * Number of mention suggestions shown'
    - name: message_seq
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of messages in that chat

        * Number of messages in the conversation at the time the sidebar was opened
        or closed'
    - name: metadata_loaded_time
      type: INTEGER
      mode: NULLABLE
      description: How long (in milliseconds) does the our media pipeline take to
        load the metadata, which happens before finishing loading the first frame.
    - name: migrated
      type: INTEGER
      mode: NULLABLE
      description: Number of records the import reported as written. A record the
        store copied into already held under the same timeLastModified is left alone,
        so source_total minus migrated minus failed is the number that needed nothing
        doing.
    - name: ml_label_length
      type: INTEGER
      mode: NULLABLE
      description: length of label suggested by model
    - name: mode
      type: INTEGER
      mode: NULLABLE
      description: Current TRR mode
    - name: models
      type: INTEGER
      mode: NULLABLE
      description: Number of models in the list
    - name: monitors
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of monitors currently stored.

        * Number of monitors stored when the event was recorded, or 0 when the store
        could not be loaded.'
    - name: n_chars
      type: INTEGER
      mode: NULLABLE
      description: The length of string used for the search. It includes whitespaces.
    - name: n_results
      type: INTEGER
      mode: NULLABLE
      description: The number of results shown to the user. If this is high the results
        list below may be truncated due to technical limitations. Also note in that
        case not all the results may be physically visible due to the screen size
        limitation.
    - name: n_tab_deselect
      type: INTEGER
      mode: NULLABLE
      description: How many times the user switched away from a tab affected by this
        hang.
    - name: n_words
      type: INTEGER
      mode: NULLABLE
      description: "The length of words used for the search. The words are made by\
        \ splitting the search string by whitespaces, thus this doesn\u2019t support\
        \ CJK languages. For performance reasons a maximum of 255 characters are considered\
        \ when splitting."
    - name: negotiation_count
      type: INTEGER
      mode: NULLABLE
      description: The number of completed Offer/Answer negotiations for the associated
        RTCPeerConnection.
    - name: note_age_hours
      type: INTEGER
      mode: NULLABLE
      description: Number of hours that elapsed since the tab note was first created,
        expressed as an integer (rounded to the nearest full hour).
    - name: note_length
      type: INTEGER
      mode: NULLABLE
      description: "JavaScript string length (number of Unicode code units) of the\
        \ note text. Note that this value can be higher than the number of characters\
        \ (Unicode code points) or the number of graphemes (what a human perceives\
        \ as a single visual character). For example, \U0001F468\u200D\U0001F469\u200D\
        \U0001F467\u200D\U0001F467 would count as 11 string length, 7 characters,\
        \ and 1 grapheme."
    - name: num_messages
      type: INTEGER
      mode: NULLABLE
      description: Number of messages in that chat.
    - name: num_msections_audio_recvonly
      type: INTEGER
      mode: NULLABLE
      description: The number of audio recvonly m-sections in the SDP.
    - name: num_msections_audio_sendonly
      type: INTEGER
      mode: NULLABLE
      description: The number of audio sendonly m-sections in the SDP.
    - name: num_msections_audio_sendrecv
      type: INTEGER
      mode: NULLABLE
      description: The number of audio sendrecv m-sections in the SDP.
    - name: num_msections_data
      type: INTEGER
      mode: NULLABLE
      description: The number of data-channel m-sections in the SDP.
    - name: num_msections_video_recvonly
      type: INTEGER
      mode: NULLABLE
      description: The number of video recvonly m-sections in the SDP.
    - name: num_msections_video_sendonly
      type: INTEGER
      mode: NULLABLE
      description: The number of video sendonly m-sections in the SDP.
    - name: num_msections_video_sendrecv
      type: INTEGER
      mode: NULLABLE
      description: The number of video sendrecv m-sections in the SDP.
    - name: num_send_simulcast_layers
      type: INTEGER
      mode: NULLABLE
      description: The number of simulcast layers negotiated. 1 for singlecast. Only
        set for m-sections negotiated to send.
    - name: num_strings
      type: INTEGER
      mode: NULLABLE
      description: The number of permission description strings in the extension permission
        doorhanger.
    - name: num_tabs_approved
      type: INTEGER
      mode: NULLABLE
      description: number of tabs the user saved from the suggestions
    - name: num_tabs_in_group
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * number of tabs in the current group

        * number of tabs in the group for which model is generating a label'
    - name: num_tabs_in_window
      type: INTEGER
      mode: NULLABLE
      description: number of tabs in current window
    - name: num_tabs_removed
      type: INTEGER
      mode: NULLABLE
      description: number of tabs the user removed from the suggestions
    - name: num_tabs_suggested
      type: INTEGER
      mode: NULLABLE
      description: number of tabs suggested by the ml model
    - name: num_transports
      type: INTEGER
      mode: NULLABLE
      description: The number of transports used for all transceivers of the peer
        connection. Affected by BUNDLE.
    - name: number_of_logins
      type: INTEGER
      mode: NULLABLE
      description: Number of logins in the active store after initialization, from
        a wildcard count, which does not decrypt.
    - name: number_of_logins_added
      type: INTEGER
      mode: NULLABLE
      description: Number of logins that did not exist in the JSON store and were
        added.
    - name: number_of_logins_failed
      type: INTEGER
      mode: NULLABLE
      description: Number of logins that could not be restored. The Rust store is
        kept instead of wiped when this is non-zero, so the next startup retries.
    - name: number_of_logins_migrated
      type: INTEGER
      mode: NULLABLE
      description: Number of logins migrated during this run.
    - name: number_of_logins_quarantined
      type: INTEGER
      mode: NULLABLE
      description: Number of logins quarantined during this run.
    - name: number_of_logins_skipped
      type: INTEGER
      mode: NULLABLE
      description: Number of logins left untouched because the JSON store already
        held the same or newer credentials.
    - name: number_of_logins_to_delete
      type: INTEGER
      mode: NULLABLE
      description: Number of logins the JSON store holds that the Rust store no longer
        has, which is what carrying the deletions made under the Rust backend over
        to the JSON store would delete. The restore deletes nothing, and the number
        still includes any login the migration failed to copy; telling those two apart
        is what it is collected for. Absent from records written before bug 2072278.
    - name: number_of_logins_to_migrate
      type: INTEGER
      mode: NULLABLE
      description: Total number of logins to be migrated during this run.
    - name: number_of_logins_to_restore
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of logins found in the Rust store. Reported for every run, including
        the ones that give up before reading the store, so "TooManyLogins" says how
        many logins it left behind.

        * Number of logins found in the Rust store. Reported for every run, including
        the ones that give up before reading the store, so "TooManyLogins" and "SyncSkipped"
        say how many logins they left behind.'
    - name: number_of_logins_updated
      type: INTEGER
      mode: NULLABLE
      description: Number of logins whose credentials were newer in the Rust store
        and were written back to the JSON store.
    - name: number_of_vulnerable_passwords
      type: INTEGER
      mode: NULLABLE
      description: Number of potentially vulnerable passwords migrated during this
        run.
    - name: opened_tabs
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of tabs the user had opened when they switched to Smart window if
        the switch was used

        * Number of tabs the user had opened when they switched to Classic window

        * Number of tabs the user had opened when they closed the window'
    - name: other
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * A count of the number of other resource types that were migrated.

        * A count of the number of other resource types that are being migrated.

        * A count of the number of other resource types that were selected.'
    - name: output_interest_size
      type: INTEGER
      mode: NULLABLE
      description: The total number of output interests for classification.
    - name: output_tokens
      type: INTEGER
      mode: NULLABLE
      description: Number of tokens generated
    - name: pc_negotiation_count
      type: INTEGER
      mode: NULLABLE
      description: The number of completed Offer/Answer negotiations for the associated
        RTCPeerConnection.
    - name: percentage
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The bandwidth usage threshold that was crossed (50, 75, or 90).

        * Percentage of window width at time of resize (0-100).'
    - name: platform_error
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The platform specific error code, eg. HResult on Windows

        * The protected-activation error HResult, or 0 on success

        * The platform specific error code that triggered the reset, eg. HResult on
        Windows'
    - name: platform_error_code
      type: INTEGER
      mode: NULLABLE
      description: The platform specific error code, eg. HResult on Windows
    - name: played_time
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The amount of time (in seconds) the EME content has been played (in seconds)

        * How many second the EME content has been played since last record'
    - name: position
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Position of the entry that was clicked

        * The position of the tab in the recently closed tab list (starting at 1)

        * The position (0-index) of the Top Sites tile. For example: 2 means the third
        tile in the row.'
    - name: pre_llm_confidence
      type: INTEGER
      mode: NULLABLE
      description: How confident that heuristic was, as a percentage rounded to the
        nearest whole one. Only fathom reports one, so this is absent for every other
        pre_llm_source.
    - name: preselected
      type: INTEGER
      mode: NULLABLE
      description: Number of tabs preselected
    - name: previous
      type: INTEGER
      mode: NULLABLE
      description: Previous width in pixels.
    - name: processing_duration
      type: INTEGER
      mode: NULLABLE
      description: Time in ms to filter, cap, sanitize and truncate the retrieved
        results and register them for citation. 0 when retrieval failed.
    - name: profile_count
      type: INTEGER
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Number of profiles the user has when the event is recorded. This is 0 for
        a user who has not created a profile group yet, which is distinct from a user
        who has a single profile.

        * The number of profiles in the database at the time.'
    - name: prompts
      type: INTEGER
      mode: NULLABLE
      description: Number of prompts displayed
    - name: recovery_count
      type: INTEGER
      mode: NULLABLE
      description: The number of bounded protected-activation recoveries consumed
        this session at the time of this event
    - name: rendered_frames
      type: INTEGER
      mode: NULLABLE
      description: The amount of video frames has been rendered
    - name: restore_version
      type: INTEGER
      mode: NULLABLE
      description: The restore pass this record belongs to, from signon.storage.rust.restoreTargetVersion.
        The attempt budget is counted per version.
    - name: results_retrieved
      type: INTEGER
      mode: NULLABLE
      description: Number of usable results the search provider returned, after results
        with no URL were discarded. 0 when retrieval failed.
    - name: results_returned
      type: INTEGER
      mode: NULLABLE
      description: 'Number of results handed to the assistant, never more than results_retrieved.
        0 on any failure. Two independent causes can make this lower than results_retrieved,
        so the difference between them is not a drop rate: results with an unusable
        URL or too short a snippet are discarded, and whatever survives is then capped
        at a limit below the number retrieval requests. When retrieval returns no
        more than that cap and nothing is discarded, the two counts are equal.'
    - name: resume_prompts
      type: INTEGER
      mode: NULLABLE
      description: Number of displayed prompts that were resume pills
    - name: retrieval_duration
      type: INTEGER
      mode: NULLABLE
      description: Time in ms for the search provider to return results, including
        acquiring the auth token the request needs. 0 when the flow failed before
        the request was made.
    - name: reviewed_length
      type: INTEGER
      mode: NULLABLE
      description: Character count of the value the user submitted. Read against generated_length
        it says whether the user cut the generated value down or added to it. Only
        sent when the outcome is edited, as above.
    - name: saved_count
      type: INTEGER
      mode: NULLABLE
      description: Number of saved signatures.
    - name: screenX
      type: INTEGER
      mode: NULLABLE
