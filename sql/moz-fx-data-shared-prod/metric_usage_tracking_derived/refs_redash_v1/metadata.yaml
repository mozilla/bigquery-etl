friendly_name: Metric Refs Redash
description: |-
  Metrics named by saved Redash queries and, through them, dashboards.
  Replaced on each run by the docker-etl metric-usage job,
  metric_usage/redash.py. The job creates the table, and this schema has to
  match the one the job writes.
owners:
- bewu@mozilla.com
bigquery:
  clustering:
    fields:
    - app
    - metric
require_column_descriptions: true
