sources:
  moz-fx-data-shared-prod.org_mozilla_fenix_derived.baseline_clients_first_seen_v1:
    - &first_seen
      client_id: client-1
      submission_date: 2021-03-01
      first_seen_date: 2021-03-01
      sample_id: 0
    - <<: *first_seen
      client_id: client-2
    - <<: *first_seen
      client_id: client-3
      first_seen_date: 2021-04-02
      submission_date: 2021-04-02
  moz-fx-data-shared-prod.org_mozilla_fenix_stable.baseline_v1:
    # simple case
    - &ping
      submission_timestamp: 2021-04-01T00:00:00
      sample_id: 0
      client_info: &client_info
        client_id: client-1
        first_run_date: 2021-03-01T00:00:00
        # note, we can leave most of the metadata fields out, so we'll include the
        # channel for testing the window function.
        app_channel: release
      ping_info:
        end_time: 2021-04-01T01:00:00
      metrics:
        timespan:
          glean_baseline_duration:
            time_unit: second
            value: 60
    # multiple pings
    - <<: *ping
      client_info:
        <<: *client_info
        client_id: client-2
    # the channel changes
    - <<: *ping
      client_info:
        <<: *client_info
        client_id: client-2
        app_channel: not-release
    # on another date, to test init
    - <<: *ping
      submission_timestamp: 2021-04-02T00:00:00
      client_info:
        <<: *client_info
        client_id: client-3
        first_run_date: 2021-04-02T00:00:00

parameters:
  - name: submission_date
    type: DATE
    value: 2021-04-01

is_init: true

expect:
  - submission_date: 2021-04-01
    client_id: client-1
    sample_id: 0
    first_run_date: 2021-03-01
    durations: 60
    experiments: []
    app_channel: release
    first_seen_date: 2021-03-01
    is_new_profile: false
    browser_engagement_active_ticks: 0
    browser_engagement_uri_count: 0
    active_hours_sum: 0
  - submission_date: 2021-04-01
    client_id: client-2
    sample_id: 0
    first_run_date: 2021-03-01
    durations: 120
    experiments: []
    app_channel: not-release
    first_seen_date: 2021-03-01
    is_new_profile: false
    browser_engagement_active_ticks: 0
    browser_engagement_uri_count: 0
    active_hours_sum: 0
  - submission_date: 2021-04-02
    client_id: client-3
    sample_id: 0
    first_run_date: 2021-04-02
    durations: 60
    experiments: []
    app_channel: release
    first_seen_date: 2021-04-02
    is_new_profile: true
    browser_engagement_active_ticks: 0
    browser_engagement_uri_count: 0
    active_hours_sum: 0
