friendly_name: |-
  Firefox Public Data Report User Activity
description: |-
  Data used to populate https://data.firefox.com/dashboard/user-activity.
  A row for every country in static.country_names_v1 is created, including duplicates if
  a country code has multiple associated names.

  Add-ons come from each client's latest Glean metrics ping of the week that has
  them (firefox_desktop.metrics), and from its legacy add-on list
  (telemetry.clients_last_seen) when it has no Glean list. An empty Glean list
  counts as no add-ons.

  Code to parse and format this data as well as the country allowlist is in the
  [firefox-public-data-report-etl repository](https://github.com/mozilla/firefox-public-data-report-etl/tree/main/public_data_report/user_activity).
owners:
- bewu@mozilla.com
bigquery:
  time_partitioning:
    type: day
    field: submission_date
    require_partition_filter: false
    expiration_days: null
