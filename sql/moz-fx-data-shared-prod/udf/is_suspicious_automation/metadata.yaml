friendly_name: Is Suspicious Automation
description: |-
  Identifies Firefox Desktop profiles created by the automated segment tracked in DENG-11590
  (Linux containers running a pinned Firefox 151.0 launched with `-profile`).

  Used two ways, per the decision recorded in DENG-11590: dashboard-feeding tables filter these
  profiles out entirely, while other tables expose the result as an `is_suspicious_automation`
  flag so the volume stays countable.

  Returns FALSE rather than NULL for unknown inputs, so `NOT udf.is_suspicious_automation(...)`
  is safe to use directly as a filter.
