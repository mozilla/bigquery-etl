friendly_name: FxA Delete Events
description: |-
  Deletion events extracted from FxA auth server logs used as signal for Mozilla to delete analysis data associated with the user
owners:
- kik@mozilla.com
labels:
  application: fxa
  incremental: true
  schedule: daily
  dag: bqetl_fxa_events
  owner1: kik
  table_type: client_level
# descheduled: the source has had no new data since 2023-09-11.
# scheduling:
#   dag_name: bqetl_fxa_events
bigquery:
  time_partitioning:
    type: day
    field: submission_timestamp
    require_partition_filter: false
    expiration_days: null
  clustering: null
