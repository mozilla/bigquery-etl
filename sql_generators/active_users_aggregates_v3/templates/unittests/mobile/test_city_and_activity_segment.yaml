sources:
  {{ project }}.{{ dataset }}.active_users:
    # city NULL should result in ??. activity_segment calculation remains stable.
    - submission_date: 2020-01-05
      app_name: {{ app_name }}
      client_id: client-3
      sample_id: 3
      city: ??
      activity_segment: segment-3
      is_dau: False
      is_wau: True
      is_mau: True
    # city not NULL and activity_segment calculation remain stable.
    - submission_date: 2020-01-05
      app_name: {{ app_name }}
      client_id: client-4
      sample_id: 3
      city: city-4
      activity_segment: segment-4
      is_monthly_user: True
      is_dau: False
      is_wau: False
      is_mau: True
  {{ project }}.{{ dataset }}.metrics_clients_last_seen:
    # additional combinations for active users
    - submission_date: 2020-01-05
      client_id: client-1
    - submission_date: 2020-01-05
      client_id: client-2
{% if dataset == "fenix" %}
  {{ project }}.{{ dataset }}.firefox_android_clients:
    # additional combinations for active users
    - first_seen_date: 2010-01-05
      client_id: client-1
    - first_seen_date: 2010-01-05
      client_id: client-2
{% endif %}
{% if dataset == "firefox_ios" %}
  {{ project }}.{{ dataset }}.firefox_ios_clients:
    # additional combinations for active users
    - first_seen_date: 2010-01-05
      client_id: client-1
    - first_seen_date: 2010-01-05
      client_id: client-2
{% endif %}
{% if dataset == "focus_android" %}
  {{ project }}.telemetry.core_clients_last_seen:
    []
{% endif %}

parameters:
  - name: submission_date
    type: DATE
    value: 2020-01-05

expect:
  - submission_date: 2020-01-05
    app_name: {{ app_name }}
    attributed: False
    segment: segment-3
    city: ??
    country: ??
    os_version_major: 0
    os_version_minor: 0
    daily_users: 0
    weekly_users: 0
    monthly_users: 0
    dau: 0
    wau: 1
    mau: 1
  - submission_date: 2020-01-05
    app_name: {{ app_name }}
    attributed: False
    city: city-4
    country: ??
    segment: segment-4
    os_version_major: 0
    os_version_minor: 0
    daily_users: 0
    weekly_users: 0
    monthly_users: 1
    dau: 0
    wau: 0
    mau: 1
