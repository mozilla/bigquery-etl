sources:
  moz-fx-data-shared-prod.search_terms_derived.suggest_impression_sanitized_v3:
    # Row 1: kept — highest sequence_no for (sess1, amazon)
    - submission_timestamp: "2024-01-15T10:00:00+00:00"
      session_id: "sess1"
      advertiser: "amazon"
      sequence_no: 2
      query: "fire fox"
      country: US
      form_factor: desktop
      is_clicked: false
    # Row 2: deduped out — lower sequence_no for same (sess1, amazon)
    - submission_timestamp: "2024-01-15T09:00:00+00:00"
      session_id: "sess1"
      advertiser: "amazon"
      sequence_no: 1
      query: "fire"
      country: US
      form_factor: desktop
      is_clicked: false
    # Row 3: kept — different session; query normalizes to same partial "fire fox"
    - submission_timestamp: "2024-01-15T11:00:00+00:00"
      session_id: "sess2"
      advertiser: "amazon"
      sequence_no: 1
      query: "  FIRE FOX  "
      country: US
      form_factor: desktop
      is_clicked: true
    # Row 4: excluded — null session_id
    - submission_timestamp: "2024-01-15T10:00:00+00:00"
      session_id: null
      advertiser: "amazon"
      sequence_no: 1
      query: "fire fox"
      country: US
      form_factor: desktop
      is_clicked: false
    # Row 5: excluded — null query
    - submission_timestamp: "2024-01-15T10:00:00+00:00"
      session_id: "sess3"
      advertiser: "amazon"
      sequence_no: 1
      query: null
      country: US
      form_factor: desktop
      is_clicked: false
    # Row 6: excluded — whitespace-only query
    - submission_timestamp: "2024-01-15T10:00:00+00:00"
      session_id: "sess4"
      advertiser: "amazon"
      sequence_no: 1
      query: "   "
      country: US
      form_factor: desktop
      is_clicked: false
    # Row 7: excluded — wrong submission_date, filtered by WHERE DATE(submission_timestamp) = @submission_date
    - submission_timestamp: "2024-01-14T10:00:00+00:00"
      session_id: "sess5"
      advertiser: "amazon"
      sequence_no: 1
      query: "fire fox"
      country: US
      form_factor: desktop
      is_clicked: false
    # Row 8: kept — different advertiser in same session as row 1; not deduped against amazon
    - submission_timestamp: "2024-01-15T10:00:00+00:00"
      session_id: "sess1"
      advertiser: "yelp"
      sequence_no: 1
      query: "pizza"
      country: US
      form_factor: desktop
      is_clicked: true

parameters:
  - name: submission_date
    type: DATE
    value: "2024-01-15"

expect:
  # rows 1 and 3: sess1/amazon (seq=2) + sess2/amazon → same partial "fire fox", 1 click (row 3)
  - submission_date: "2024-01-15"
    country: US
    form_factor: desktop
    advertiser: amazon
    partial: fire fox
    impression_count: 2
    click_count: 1
  # row 7: sess1/yelp → separate advertiser, not deduped against amazon
  - submission_date: "2024-01-15"
    country: US
    form_factor: desktop
    advertiser: yelp
    partial: pizza
    impression_count: 1
    click_count: 1
