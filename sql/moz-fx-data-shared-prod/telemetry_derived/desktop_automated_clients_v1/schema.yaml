fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date the client sent the pings that matched a fleet rule.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: The legacy telemetry client ID.
- name: glean_client_ids
  type: STRING
  mode: REPEATED
  description: Glean client IDs that sent a baseline ping with this legacy client ID on the same day.
- name: fleet
  type: STRING
  mode: NULLABLE
  description: The confirmed fleet the client matched. See the fleet list in this table's metadata.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: The highest Firefox version reported on the day (legacy pings, else Glean, else the first-seen version in clients_first_seen_v3).
- name: os_version
  type: STRING
  mode: NULLABLE
  description: The OS version. Legacy pings give the full Linux kernel release; Glean and clients_first_seen_v3 give the normalized version (for example 6.8).
- name: isp_name
  type: STRING
  mode: NULLABLE
  description: The ISP name from IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: The country code from IP geolocation.
