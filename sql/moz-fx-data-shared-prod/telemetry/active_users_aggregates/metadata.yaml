friendly_name: Aggregation for Active Users
description: |-
  This aggregates contains the metrics of daily, weekly and montly
  active users, as well as new profile and search counts
  aggregated by Mozilla product and business dimensions:
  attribution parameters, channel, country, city, date, device model,
  distribution_id, os details and segment.

  It currently uses Glean tables as a source for Mobile,
  and Legacy Telemetry tables as the source for desktop.

  Notes for analysis:
  - Use the `dau` column for the DAU KPI. `daily_users` has no activity
    requirement and is always >= `dau`.
  - All channels are included. Filter `channel = 'release'` explicitly.
  - Desktop KPI: filter `app_name = 'Firefox Desktop'` (excludes BrowserStack
    and MozillaOnline, which get suffixed app_name values).
  - There is no 'ALL' country row; sum across countries for a global total.
  - `install_source` is only populated for Fenix and is unreliable after
    Sept 2024; see the column description.

  Proposal:
  https://docs.google.com/document/d/1qvWO49Lr_Z_WErh3I3058A3B1YuiuURx19K3aTdmejM/edit?usp=sharing
owners:
