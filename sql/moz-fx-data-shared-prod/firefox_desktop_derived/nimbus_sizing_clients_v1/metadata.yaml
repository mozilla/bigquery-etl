friendly_name: Nimbus Population Sizing Client Pool (Desktop)
description: |-
  Pre-materialized 7-day rolling window of deduplicated, 10%-sampled Desktop
  clients for Nimbus pre-launch population sizing.

  Consumed by experiment_population_estimates_v1 to run per-experiment
  COUNTIF queries without inline deduplication or date arithmetic.
owners:
- ykhurana@mozilla.com
labels:
  owner1: ykhurana
  dag: bqetl_experiments_daily
scheduling:
  dag_name: bqetl_experiments_daily
  referenced_tables:
  - - moz-fx-data-shared-prod
    - firefox_desktop
    - nimbus_targeting_context
bigquery:
  time_partitioning:
    type: day
    field: null
    require_partition_filter: false
    expiration_days: 14.0
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.firefox_desktop.nimbus_targeting_context
