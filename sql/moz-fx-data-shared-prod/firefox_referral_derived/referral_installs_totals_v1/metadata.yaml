friendly_name: Referral Installs Totals
description: |-
  Cumulative all-time Firefox first_run installs per referral (invite) code for
  the Firefox Referral Program (DENG-11237).

  Full-refresh rollup of referral_installs_daily_v1. Zero-install codes are
  omitted. This will be the source table for a fast-follow CSV export to the
  Website team's GCS bucket (pending the bucket + IAM). Column order
  (invite_code, total_installs) matches the required CSV format.
owners:
- phlee@mozilla.com
labels:
  owner1: phlee
  table_type: aggregate
  dag: bqetl_firefox_referral
scheduling:
  dag_name: bqetl_firefox_referral
  date_partition_parameter: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - moz-fx-data-shared-prod.firefox_referral_derived.referral_installs_daily_v1
require_column_descriptions: true
