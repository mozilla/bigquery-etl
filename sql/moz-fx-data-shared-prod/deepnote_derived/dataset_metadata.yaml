friendly_name: Deepnote Derived
description: |-
  Usage monitoring for Mozilla's Deepnote workspaces: the workspace audit logs,
  snapshots from the Deepnote API, Deepnote-originated BigQuery jobs, and
  aggregates built on top of them.

  All tables are restricted to data platform (workgroup:dataplatform/developers);
  the raw tables (audit_log_v1, members_v1, workspace_snapshot_v1,
  notebook_runs_v1, query_jobs_v1) contain user emails.
dataset_base_acl: restricted
user_facing: false
labels: {}
workgroup_access:
- role: roles/bigquery.dataEditor
  members:
  - workgroup:dataplatform/developers
