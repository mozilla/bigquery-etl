      client_id: b
      windows_build_number: 22635
      os: 'Windows_NT'
      os_version: '10.0'
      search_counts:
        - source: searchbar
          engine: engine1
          count: 1
        - source: 'in-content:sap:code'
          engine: engine2
          count: 2
        - source: 'in-content:sap-follow-on:code'
          engine: engine2
          count: 3
        - source: 'in-content:organic:none'
          engine: engine2
          count: 4
      ad_clicks:
        - key: engine1
          value: 2
        - key: 'engine1:organic.none'
          value: 3
      search_with_ads:
        - key: 'engine1:sap.code'
          value: 3
    - <<: *clients_daily_base
      client_id: c
      active_addons:
        - addon_id: random@mozilla.com
          version: '0.1'
          user_disabled: false
          app_disabled: false
          blocklisted: false
        - addon_id: followonsearch@mozilla.com
          version: 0.9.6
          user_disabled: false
          app_disabled: false
          blocklisted: false
      search_counts:
        - source: contextmenu
          engine: engine2
          count: 2
  moz-fx-data-shared-prod.telemetry_derived.clients_daily_v6:
    - client_id: a
      submission_date: '2017-01-01'
      profile_group_id: prfl_a
    - client_id: b
