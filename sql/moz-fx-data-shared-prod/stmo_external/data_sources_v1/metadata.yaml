friendly_name: STMO Data Sources
description: |
  A copy of the `data_sources` table from the Redash (sql.telemetry.mozilla.org) metadata database, excluding `encrypted_options`, which holds data source credentials, updated daily to match the current state of the table.
owners:
- bewu@mozilla.com
labels:
  schedule: daily
  dag: bqetl_stmo
  owner1: bewu
scheduling:
  dag_name: bqetl_stmo
  date_partition_parameter: null
workgroup_access:
- role: roles/bigquery.dataViewer
  members:
  - workgroup:mozilla-confidential/data-viewers
references:
  query.sql:
  - EXTERNAL_QUERY('moz-fx-data-stmo-prod-33f2.us.stmo-cloudsql-prod', 'SELECT\n         id,\n         org_id,\n         name,\n         type,\n         queue_name,\n         scheduled_queue_name,\n         created_at,\n         description\n       FROM\n         data_sources\n    ')
