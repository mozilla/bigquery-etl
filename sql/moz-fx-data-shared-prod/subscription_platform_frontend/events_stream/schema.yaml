fields:
- name: event_id
  type: STRING
  mode: NULLABLE
  description: Unique event ID (typically a concatenation of `document_id` and `document_event_number`).
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: A JSON string containing any payload properties not present in the
    schema
- name: client_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: The build identifier generated by the CI system (e.g. "1234/A").
      For language bindings that provide automatic detection for this value, (e.g.
      Android/Kotlin), in the unlikely event that the build identifier can not be
      retrieved from the OS, it is set to "inaccessible". For other language bindings,
      if the value was not provided through configuration, this metric gets set to
      `Unknown`.
  - name: app_channel
    type: STRING
    mode: NULLABLE
    description: The channel the application is being distributed on.
  - name: app_display_version
    type: STRING
    mode: NULLABLE
    description: The user visible version string (e.g. "1.0.3").  In the unlikely
      event that the display version can not be retrieved, it is set to "inaccessible".
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: The architecture of the device, (e.g. "arm", "x86").
  - name: attribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: campaign
      type: STRING
      mode: NULLABLE
      description: The attribution campaign (e.g. 'mozilla-org').
    - name: content
      type: STRING
      mode: NULLABLE
      description: The attribution content (e.g. 'firefoxview').
    - name: medium
      type: STRING
      mode: NULLABLE
      description: The attribution medium (e.g. 'organic' for a search engine).
    - name: source
      type: STRING
      mode: NULLABLE
      description: The attribution source (e.g. 'google-play').
    - name: term
      type: STRING
      mode: NULLABLE
      description: The attribution term (e.g. 'browser with developer tools for android').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: device_manufacturer
    type: STRING
    mode: NULLABLE
    description: The manufacturer of the device the application is running on. Not
      set if the device manufacturer can't be determined (e.g. on Desktop).
  - name: device_model
    type: STRING
    mode: NULLABLE
    description: The model of the device the application is running on. On Android,
      this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL". Not
      set if the device model can't be determined (e.g. on Desktop).
  - name: distribution
    type: RECORD
    mode: NULLABLE
    fields:
    - name: name
      type: STRING
      mode: NULLABLE
      description: The distribution name (e.g. 'MozillaOnline').
    - name: ext
      type: JSON
      mode: NULLABLE
  - name: first_run_date
    type: STRING
    mode: NULLABLE
    description: The date of the first run of the application.
  - name: locale
    type: STRING
    mode: NULLABLE
    description: The locale of the application during initialization (e.g. "es-ES").
      If the locale can't be determined on the system, the value is ["und"](https://unicode.org/reports/tr35/#Unknown_or_Invalid_Identifiers),
      to indicate "undetermined".
  - name: os
    type: STRING
    mode: NULLABLE
    description: 'The name of the operating system. Possible values: Android, iOS,
      Linux, Darwin, Windows, FreeBSD, NetBSD, OpenBSD, Solaris, unknown'
  - name: os_version
    type: STRING
    mode: NULLABLE
    description: The user-visible version of the operating system (e.g. "1.2.3").
      If the version detection fails, this metric gets set to `Unknown`.
  - name: telemetry_sdk_build
    type: STRING
    mode: NULLABLE
    description: The version of the Glean SDK
  - name: build_date
    type: STRING
    mode: NULLABLE
    description: The date & time the application was built
  - name: session_id
    type: STRING
    mode: NULLABLE
    description: An optional UUID uniquely identifying the client's current session.
  - name: session_count
    type: INTEGER
    mode: NULLABLE
    description: An optional running counter of the number of sessions for a client.
  - name: windows_build_number
    type: INTEGER
    mode: NULLABLE
    description: The optional Windows build number, reported by Windows (e.g. 22000)
      and not set for other platforms
- name: document_id
  type: STRING
  mode: NULLABLE
  description: The document ID specified in the URI when the client sent this message
- name: metadata
  type: RECORD
  mode: NULLABLE
  fields:
  - name: geo
    type: RECORD
    mode: NULLABLE
    fields:
    - name: city
      type: STRING
      mode: NULLABLE
    - name: country
      type: STRING
      mode: NULLABLE
      description: An ISO 3166-1 alpha-2 country code
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo database version used for this lookup
    - name: subdivision1
      type: STRING
      mode: NULLABLE
      description: First major country subdivision, typically a state, province, or
        county
    - name: subdivision2
      type: STRING
      mode: NULLABLE
      description: Second major country subdivision; not applicable for most countries
    description: Results of a geographic lookup based on the client's IP address
  - name: header
    type: RECORD
    mode: NULLABLE
    fields:
    - name: date
      type: STRING
      mode: NULLABLE
      description: Date HTTP header
    - name: dnt
      type: STRING
      mode: NULLABLE
      description: DNT (Do Not Track) HTTP header
    - name: x_debug_id
      type: STRING
      mode: NULLABLE
      description: X-Debug-Id HTTP header
    - name: x_foxsec_ip_reputation
      type: STRING
      mode: NULLABLE
      description: X-Foxsec-IP-Reputation header (deprecated, https://mozilla-hub.atlassian.net/browse/DENG-10434)
    - name: x_lb_tags
      type: STRING
      mode: NULLABLE
      description: X-LB-Tags HTTP header
    - name: x_pingsender_version
      type: STRING
      mode: NULLABLE
      description: X-PingSender-Version HTTP header
    - name: x_source_tags
      type: STRING
      mode: NULLABLE
      description: X-Source-Tags HTTP header
    - name: x_telemetry_agent
      type: STRING
      mode: NULLABLE
      description: X-Telemetry-Agent HTTP header
    - name: parsed_date
      type: TIMESTAMP
      mode: NULLABLE
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
    - name: parsed_x_lb_tags
      type: RECORD
      mode: NULLABLE
      fields:
      - name: tls_version
        type: STRING
        mode: NULLABLE
      - name: tls_cipher_hex
        type: STRING
        mode: NULLABLE
    description: Headers included in the client's HTTP request
  - name: isp
    type: RECORD
    mode: NULLABLE
    fields:
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The specific geo ISP database version used for this lookup
    - name: name
      type: STRING
      mode: NULLABLE
      description: The name of the ISP associated with the client's IP address
    - name: organization
      type: STRING
      mode: NULLABLE
      description: The name of a specific business entity associated with the client's
        IP address when available; otherwise the ISP name
    description: Results of ISP lookup based on the client's IP address
  - name: user_agent
    type: RECORD
    mode: NULLABLE
    fields:
    - name: browser
      type: STRING
      mode: NULLABLE
    - name: os
      type: STRING
      mode: NULLABLE
    - name: version
      type: STRING
      mode: NULLABLE
    description: Parsed components of the client's user agent string
- name: metrics
  type: JSON
  mode: NULLABLE
  description: Metrics recorded along with the event, grouped by type and stored as
    a JSON object.
- name: normalized_app_name
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized app name
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized channel name
- name: normalized_country_code
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: Set to "Other" if this message contained an unrecognized OS name
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
- name: ping_info
  type: RECORD
  mode: NULLABLE
  fields:
  - name: seq
    type: INTEGER
    mode: NULLABLE
  - name: start_time
    type: STRING
    mode: NULLABLE
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: end_time
    type: STRING
    mode: NULLABLE
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
  - name: ping_type
    type: STRING
    mode: NULLABLE
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: Hashed version of client_id (if present) useful for partitioning; ranges
    from 0 to 99
- name: submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Time when the ingestion edge server accepted this message
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
- name: app_version_patch
  type: NUMERIC
  mode: NULLABLE
- name: is_bot_generated
  type: BOOLEAN
  mode: NULLABLE
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the client.
- name: reason
  type: STRING
  mode: NULLABLE
- name: experiments
  type: JSON
  mode: NULLABLE
  description: Any active experiments, stored as a JSON object.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_profile_group_id` UUID metric,
    so this column will always be null.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: This app doesn't have a `legacy_telemetry_client_id` UUID metric, so
    this column will always be null.
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: When the event ostensibly occurred based on data reported by the client
    (so be wary that unrealistic values are possible).
- name: event_category
  type: STRING
  mode: NULLABLE
- name: event_name
  type: STRING
  mode: NULLABLE
- name: event
  type: STRING
  mode: NULLABLE
  description: Fully qualified event name prefixed with the event category separated
    by a dot.
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: Event extras, stored as a JSON object.
- name: document_event_number
  type: INTEGER
  mode: NULLABLE
  description: Which event number this was in the original document, in chronological
    order.
- name: extras
  type: RECORD
  mode: NULLABLE
  description: Event extras, grouped by type.
  fields:
  - name: string
    type: RECORD
    mode: NULLABLE
    description: String event extras.
    fields:
    - name: action
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The user action taken. Present when step is view (to distinguish upgrade
        checkout view), engage, submit, or result. Allowed values: offer, upgrade,
        keep_subscription, cancel_subscription.

        * The user action taken. Only present when step is engage, submit, or result.
        Allowed values: redeem_coupon, cancel_subscription, stay_subscribed, remain_canceled.'
    - name: eligibility_status
      type: STRING
      mode: NULLABLE
      description: 'Outcome of the retention eligibility evaluation for the current
        flow intent. Indicates which intervention bucket the user qualified for and
        is expected to align with the rendered screen. Allowed values: stay, cancel,
        offer, not_eligible.'
    - name: entrypoint
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Where the flow was entered from. Allowed values: internal_nav, subscription-management.
        Empty string when the source is unidentified.

        * Where the page was reached from. Allowed values: email, internal_nav, subscription-management.
        Empty string when the source is unidentified.

        * Where the flow was entered from. Allowed values: email, internal_nav, subscription-management.
        Empty string when the source is unidentified.'
    - name: error_reason
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Specific reason for failure. Only present when step=result and outcome=error.
        Unexpected_exception means there may have been a network failure, validation
        error, server crash, etc. Allowed values: - subscription_not_found - customer_mismatch
        - subscription_not_active - stripe_price_id_not_found - already_canceling_at_period_end
        - current_interval_not_found - offering_id_not_found - no_cancel_interstitial_offer_found
        - no_upgrade_plan_found - not_eligible_for_upgrade_interval - general_error
        - operation_denied - unexpected_exception

        * Specific reason for failure. Unexpected_exception means there may have been
        a network failure, validation error, server crash, etc. Allowed values: -
        customer_mismatch - discount_already_applied - general_error - no_churn_intervention_found
        - redemption_limit_exceeded - subscription_not_active - subscription_not_found
        - subscription_still_active - operation_denied - unexpected_exception'
    - name: flow_type
      type: STRING
      mode: NULLABLE
      description: 'Type of retention flow. Allowed values: cancel, stay.'
    - name: id
      type: STRING
      mode: NULLABLE
      description: An identifier of the element clicked. For automatic collection,
        its value is the element's `data-glean-id` data attribute value.
    - name: interval
      type: STRING
      mode: NULLABLE
      description: Billing interval for the subscription (daily | weekly | monthly
        | halfyearly | yearly)
    - name: label
      type: STRING
      mode: NULLABLE
      description: The label of the element clicked. For automatic collection, its
        value is the element's `data-glean-label` data attribute value.
    - name: nimbus_user_id
      type: STRING
      mode: NULLABLE
      description: Nimbus user ID
    - name: offering_id
      type: STRING
      mode: NULLABLE
      description: The API id of the specific subscription offering.
    - name: outcome
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The result of the flow. Only present when step=result. Allowed values: upgrade_success,
        customer_canceled, error.

        * The category of the result. Allowed values: redeem_success, customer_canceled,
        stay_subscribed_success, error.'
    - name: page_name
      type: STRING
      mode: NULLABLE
      description: 'The page reached by the user. Allowed values: - management - payment_method'
    - name: referrer
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The referrer of the page where the element was clicked.

        * The page referrer.'
    - name: step
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * Stage in the user journey lifecycle. Allowed values: - view - engage - submit
        - result (final state; includes outcome and optional error_reason)

        * Stage in the user journey lifecycle. Allowed values: view, engage, submit,
        result.'
    - name: title
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The title of the page where the element was clicked.

        * The page title.'
    - name: type
      type: STRING
      mode: NULLABLE
      description: The type of the element clicked. For automatic collection, its
        value is the element's `data-glean-type` data attribute value.
    - name: url
      type: STRING
      mode: NULLABLE
      description: 'Depending on the type of event:

        * The URL of the page where the element was clicked.

        * The page URL.'
    - name: utm_campaign
      type: STRING
      mode: NULLABLE
      description: UTM campaign (if present).
    - name: utm_medium
      type: STRING
      mode: NULLABLE
      description: UTM medium (if present).
    - name: utm_source
      type: STRING
      mode: NULLABLE
      description: UTM source (if present).
