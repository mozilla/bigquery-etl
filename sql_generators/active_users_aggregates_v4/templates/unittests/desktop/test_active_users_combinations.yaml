sources:
  {{ project }}.telemetry.desktop_active_users:
    # combinations for active users status should return the correct dau, wau, mau.
    - submission_date: 2020-01-05
      client_id: client-1
      app_name: {{ app_name }}
      is_daily_user: True
      is_weekly_user: True
      is_monthly_user: False
      is_dau: True
      is_wau: False
      is_mau: False
    - submission_date: 2020-01-05
      client_id: client-2
      app_name: {{ app_name }}
      is_daily_user: True
      is_weekly_user: True
      is_monthly_user: False
      is_dau: True
      is_wau: False
      is_mau: False
    - submission_date: 2020-01-05
      client_id: client-3
      app_name: {{ app_name }}
      is_daily_user: True
      is_weekly_user: True
      is_monthly_user: False
      is_dau: True
      is_wau: True
      is_mau: False

parameters:
  - name: submission_date
    type: DATE
    value: 2020-01-05

expect:
  - submission_date: 2020-01-05
    app_name: {{ app_name }}
    city: ??
    country: ??
    os_version_major: 0
    os_version_minor: 0
    daily_users: 3
    weekly_users: 3
    monthly_users: 0
    dau: 3
    wau: 1
    mau: 0
